name: BS BSP RSS read-only diagnostic

on:
  push:
    branches:
      - feature/post-br-pressure-audit-bs

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BR baseline and BSP governed scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          test "$(git merge-base HEAD origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('1.91',249)
          assert (m['version'],len(m['adapters']))==('0.16',14)
          src=next(x for x in s['sources'] if x['source_id']=='WSSRC-REGJ-003')
          rows=sorted([x for x in c['records'] if x.get('source_id')=='WSSRC-REGJ-003'],key=lambda x:(str(x.get('start_local')),x['occurrence_id']))
          assert len(rows)==2,len(rows)
          assert all(x.get('region')=='Southeast Asia' for x in rows)
          assert src.get('institution')=='Bangko Sentral ng Pilipinas'
          assert src.get('jurisdiction')=='Philippines'
          assert src.get('authoritative_url')=='https://www.bsp.gov.ph/Pages/PriceStability/ScheduleOfMeetingsOfTheAdvisoryCommitteeAndMonetaryBoardOnMonetaryPolicy.aspx'
          assert not any(x.get('source_id')=='WSSRC-REGJ-003' for x in m['adapters'])
          assert not any(x.get('source_id')=='WSSRC-REGJ-006' for x in s['sources'])
          governance={k:src.get(k) for k in ('canonical_dependency_count','canonical_provenance_use','automated_monitoring_use','automated_retrieval_permission','verification_mode','monitoring_readiness_status','monitoring_activation_status','runtime_health_state','machine_readable_available','parser_type')}
          print(json.dumps({'source':src,'legacy_governance_projection':governance,'missing_governance_fields':[k for k,v in governance.items() if v is None],'proposed_machine_source_id':'WSSRC-REGJ-006','occurrences':[{k:r.get(k) for k in ('occurrence_id','series_id','canonical_name','start_local','end_local','source_timezone','time_precision','timing_type','lifecycle_status','certainty_status','notes')} for r in rows]},indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Verify official RSS documentation and deterministically resolve Media Releases feed link
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,html,json,re,urllib.parse,urllib.request
          UA='WORLD-SIGNALS-read-only-diagnostic/0.1'
          url='https://www.bsp.gov.ph/SitePages/RSS.aspx'
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(); assert r.status==200
              meta={'status':r.status,'content_type':r.headers.get('Content-Type',''),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          text=body.decode('utf-8','replace')
          plain=re.sub(r'(?s)<[^>]+>',' ',text); plain=html.unescape(re.sub(r'\s+',' ',plain))
          low=plain.casefold()
          assert 'rss feeds' in low
          assert 'fetch the updates automatically' in low
          assert 'structured information that can be used by applications' in low
          links=re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S)
          media=[]
          for href,label in links:
              label_plain=html.unescape(re.sub(r'(?s)<[^>]+>',' ',label)); label_plain=re.sub(r'\s+',' ',label_plain).strip()
              if 'Media Releases' in label_plain:
                  media.append((html.unescape(href),label_plain))
          assert len(media)==1,media
          href=media[0][0]
          m=re.fullmatch(r"\{\{GetWebAbsoluteURL\(\)\+'([^']+)'\}\}",href)
          if m:
              feed_url='https://www.bsp.gov.ph'+m.group(1)
          else:
              feed_url=urllib.parse.urljoin(url,href)
          assert feed_url.startswith('https://www.bsp.gov.ph/_layouts/15/listfeed.aspx?')
          assert 'List=' in feed_url and 'View=' in feed_url
          open('/tmp/bsp-feed-url','w').write(feed_url)
          print(json.dumps({'rss_docs':meta,'media_href_raw':href,'media_feed_url':feed_url,'explicit_automatic_fetch_language':True,'explicit_application_use_language':True},indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Execute exactly one official BSP Media Releases RSS request and inspect monetary-policy items
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          UA='WORLD-SIGNALS-read-only-diagnostic/0.1'
          url=Path('/tmp/bsp-feed-url').read_text().strip()
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(); meta={'status':r.status,'content_type':r.headers.get('Content-Type',''),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          assert meta['status']==200
          root=ET.fromstring(body)
          items=[]
          for node in root.findall('.//item'):
              def tx(tag):
                  n=node.find(tag); return ' '.join((n.text or '').split()) if n is not None else ''
              row={'title':tx('title'),'link':tx('link'),'guid':tx('guid'),'pubDate':tx('pubDate'),'description':tx('description')}
              items.append(row)
          assert items
          mp=[]
          for x in items:
              t=(x['title']+' '+x['description']).casefold()
              if any(k in t for k in ('monetary board','monetary policy','rrp rate','policy rate')):
                  mp.append(x)
          print(json.dumps({'feed_url':url,'http':meta,'rss_item_count':len(items),'monetary_policy_related_count':len(mp),'monetary_policy_items':mp[:30],'request_count':1,'feed_role':'PUBLICATION_SENTINEL_NOT_FORWARD_SCHEDULE_AUTHORITY'},indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Prove diagnostic is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
