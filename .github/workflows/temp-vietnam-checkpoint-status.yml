name: TEMP Vietnam checkpoint status update

on:
  push:
    branches:
      - vietnam-source-scope-repair-a-checkpoint
    paths:
      - .github/workflows/temp-vietnam-checkpoint-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch bounded project checkpoint
        run: |
          python scripts/temp_update_vietnam_checkpoint.py
          changed="$(git diff --name-only)"
          test "$changed" = "PROJECT_STATUS.md"
      - name: Commit bounded status update
        run: |
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add PROJECT_STATUS.md
          git commit -m 'Update Vietnam repair recovery checkpoint'
          git push
