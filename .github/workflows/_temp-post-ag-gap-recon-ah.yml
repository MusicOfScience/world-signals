name: TEMP AH UNFCCC SB64 transaction

on:
  push:
    branches:
      - feature/post-ag-gap-recon-ah

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-62 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "0d55a9dcd877736886dd9ee3e8fcaa8a93a869d1"
      - name: Fail-closed AH check-only transform
        run: python scripts/apply_unfccc_sb64_historical_anchor_ah.py
      - name: AH tests before write
        run: python -m unittest tests.test_unfccc_sb64_historical_anchor_ah -v
      - name: Apply reviewed AH transaction
        env:
          WORLD_SIGNALS_APPLY_UNFCCC_SB64_ANCHOR_AH: REVIEWED_APPLY
        run: python scripts/apply_unfccc_sb64_historical_anchor_ah.py --apply
      - name: Validate canonical post-state
        run: python scripts/validate_registry.py
      - name: Validate Analysis remains sound
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_unfccc_sb64_historical_anchor_ah.py \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_analysis.py \
            src/world_signals/analysis.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Exact AH production mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'data/canonical/registry.json',
              'data/sources/registry.json',
              'data/changes/ledger.json',
              'data/coverage/biosecurity_overlay.json',
              'data/coverage/UNFCCC_SB64_HISTORICAL_ANCHOR_AH_TRANSACTION_AUDIT_v0.1.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'AH mutation boundary drift: expected {sorted(expected)}, got {sorted(paths)}')
          print('AH_MUTATION_BOUNDARY_OK')
          PY
      - name: Commit reviewed transaction and self-remove temporary research files
        run: |
          rm .github/workflows/_temp-post-ag-gap-recon-ah.yml
          rm scripts/probe_post_ag_gap_candidates_ah.py
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add \
            data/canonical/registry.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/coverage/UNFCCC_SB64_HISTORICAL_ANCHOR_AH_TRANSACTION_AUDIT_v0.1.md \
            .github/workflows/_temp-post-ag-gap-recon-ah.yml \
            scripts/probe_post_ag_gap_candidates_ah.py
          git commit -m "Apply UNFCCC SB64 historical anchor AH"
          git push origin HEAD:feature/post-ag-gap-recon-ah
