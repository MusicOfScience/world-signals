name: TEMP AH UNFCCC SB64 check-only gate

on:
  push:
    branches:
      - feature/post-ag-gap-recon-ah

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-62 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "0d55a9dcd877736886dd9ee3e8fcaa8a93a869d1"
      - name: Fail-closed AH check-only transform
        run: python scripts/apply_unfccc_sb64_historical_anchor_ah.py
      - name: AH contract tests
        run: python -m unittest tests.test_unfccc_sb64_historical_anchor_ah -v
      - name: Canonical validator pre-state
        run: python scripts/validate_registry.py
      - name: Analysis validator pre-state
        run: python scripts/validate_analysis.py
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_unfccc_sb64_historical_anchor_ah.py \
            tests/test_unfccc_sb64_historical_anchor_ah.py
