name: BP Federal Reserve monetary RSS controlled transaction

on:
  push:
    branches:
      - feature/post-bo-fed-monetary-rss-monitor-bp

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact post-BO ancestry and BP pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          test "$(git merge-base HEAD origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          python scripts/apply_fed_monetary_rss_monitor_bp.py
          python -m unittest tests.test_fed_monetary_rss_monitor_bp -v

      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bp-protected.before

      - name: Apply bounded BP transaction
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BP=1 python scripts/apply_fed_monetary_rss_monitor_bp.py --apply

      - name: Audit exact mutation boundary and source-role split
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          tracked=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          changed=tracked|untracked
          expected={
              'data/sources/registry.json',
              'data/monitor/expectations.json',
              'scripts/run_live_monitor.py',
              'scripts/run_adapter_smoke.py',
              'src/world_signals/adapters/__init__.py',
          }
          assert changed==expected,(changed,expected)

          pre_sources=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'], text=True))
          post_sources=json.loads(Path('data/sources/registry.json').read_text())
          pre_monitor=json.loads(subprocess.check_output(['git','show','HEAD:data/monitor/expectations.json'], text=True))
          post_monitor=json.loads(Path('data/monitor/expectations.json').read_text())

          assert (pre_sources['version'],len(pre_sources['sources']))==('1.88',247)
          assert (post_sources['version'],len(post_sources['sources']))==('1.89',248)
          pre_by={r['source_id']:r for r in pre_sources['sources']}
          post_by={r['source_id']:r for r in post_sources['sources']}
          assert set(post_by)==set(pre_by)|{'WSSRC-CB-015'}
          for sid,row in pre_by.items():
              assert post_by[sid]==row,sid
          assert post_by['WSSRC-CB-001']==pre_by['WSSRC-CB-001']
          machine=post_by['WSSRC-CB-015']
          assert machine['canonical_dependency_count']==0
          assert machine['automated_monitoring_use']=='CLEARED'
          assert machine['canonical_provenance_use']=='MONITOR_ONLY_PUBLICATION_SENTINEL_NO_CANONICAL_SCHEDULE_AUTHORITY'
          assert machine['automated_retrieval_permission']=='OFFICIAL_RSS_SUBSCRIPTION_INTERFACE_EXPLICIT_SOFTWARE_USE'
          assert machine['live_adapter_id']=='FED_MONETARY_POLICY_RSS'

          assert (pre_monitor['version'],len(pre_monitor['adapters']))==('0.13',11)
          assert (post_monitor['version'],len(post_monitor['adapters']))==('0.14',12)
          assert post_monitor['adapters'][:11]==pre_monitor['adapters']
          route=post_monitor['adapters'][11]
          assert route['adapter_id']=='FED_MONETARY_POLICY_RSS'
          assert route['source_id']=='WSSRC-CB-015'
          assert len(route['canonical_occurrence_ids'])==22
          assert len(set(route['canonical_occurrence_ids']))==22
          assert route['request_budget_per_run']==1
          assert route['schedule_authority'] is False
          assert route['lifecycle_authority'] is False
          assert route['certainty_authority'] is False
          assert route['meeting_window_monitoring'] is False
          assert route['press_conference_monitoring'] is False
          assert route['automatic_commit_allowed'] is False
          assert post_monitor['automatic_canonical_commit'] is False
          assert post_monitor['google_calendar_write'] is False
          PY

      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            src/world_signals/adapters/fed_monetary_rss.py \
            src/world_signals/fed_monetary_monitor.py \
            scripts/apply_fed_monetary_rss_monitor_bp.py \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs

      - name: Re-audit protected layers and transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bp-protected.after
          diff -u /tmp/bp-protected.before /tmp/bp-protected.after
          python - <<'PY'
          import subprocess
          tracked=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          changed=tracked|untracked
          expected={
              'data/sources/registry.json',
              'data/monitor/expectations.json',
              'scripts/run_live_monitor.py',
              'scripts/run_adapter_smoke.py',
              'src/world_signals/adapters/__init__.py',
          }
          assert changed==expected,(changed,expected)
          PY

      - name: Commit exact BP transaction and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          test "$(git merge-base HEAD origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"

          git add \
            data/sources/registry.json \
            data/monitor/expectations.json \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py \
            src/world_signals/adapters/__init__.py
          git rm .github/workflows/bp-fed-monetary-rss-controlled-transaction.yml

          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected={
              '.github/workflows/bp-fed-monetary-rss-controlled-transaction.yml',
              'data/sources/registry.json',
              'data/monitor/expectations.json',
              'scripts/run_live_monitor.py',
              'scripts/run_adapter_smoke.py',
              'src/world_signals/adapters/__init__.py',
          }
          assert staged==expected,(staged,expected)
          assert not subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          PY

          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git commit -m "BP: activate Federal Reserve monetary RSS publication sentinel"
          git push origin HEAD:feature/post-bo-fed-monetary-rss-monitor-bp
