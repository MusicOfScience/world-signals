name: CE post-CD pressure audit

on:
  push:
    branches:
      - feature/post-cd-pressure-audit-ce
    paths:
      - '.github/workflows/ce-post-cd-pressure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect exact OPEC provenance state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          canonical = load('data/canonical/registry.json')
          sources = load('data/sources/registry.json')
          ledger = load('data/changes/ledger.json')
          target_id = 'WSO-COM-A-0001'
          source_ids = {'WSSRC-COM-001','WSSRC-COM-015','WSSRC-COM-016'}

          print('HEAD', subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          print('BASE_MAIN', subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip())
          print('CANONICAL_VERSION_COUNT', canonical['version'], len(canonical['records']))
          print('SOURCE_VERSION_COUNT', sources['version'], len(sources['sources']))
          print('LEDGER_VERSION_COUNT', ledger['version'], len(ledger['changes']))

          target = next(r for r in canonical['records'] if r['occurrence_id'] == target_id)
          print('TARGET_CANONICAL_JSON')
          print(json.dumps(target, indent=2, ensure_ascii=False, sort_keys=True))

          print('RELATED_SOURCE_JSON')
          for row in sources['sources']:
              if row.get('source_id') in source_ids:
                  print(json.dumps(row, indent=2, ensure_ascii=False, sort_keys=True))

          print('RELATED_LEDGER_JSON')
          for row in ledger['changes']:
              if row.get('occurrence_id') == target_id or row.get('source_id') in source_ids or row.get('trigger_source_id') in source_ids:
                  print(json.dumps(row, indent=2, ensure_ascii=False, sort_keys=True))

          print('OTHER_OPEC_SOURCE_ROWS')
          for row in sources['sources']:
              blob = json.dumps(row, ensure_ascii=False).lower()
              if 'opec' in blob or 'petroleum exporting' in blob:
                  print(json.dumps(row, indent=2, ensure_ascii=False, sort_keys=True))

          print('OPEC_CANONICAL_OCCURRENCES')
          for row in canonical['records']:
              if row.get('source_id') == 'WSSRC-COM-001' or 'opec' in str(row.get('institution','')).lower() or 'opec' in str(row.get('canonical_name','')).lower():
                  print(json.dumps({
                      k: row.get(k) for k in [
                          'occurrence_id','series_id','canonical_name','lifecycle_status','certainty_status','source_id',
                          'primary_source_assertion_id','last_successful_assertion_id','trigger_assertion_id','trigger_source_id',
                          'last_verified_at','next_verification_due','related_documents','status_history','notes','start_local','start_utc'
                      ]
                  }, indent=2, ensure_ascii=False, sort_keys=True))
          PY
