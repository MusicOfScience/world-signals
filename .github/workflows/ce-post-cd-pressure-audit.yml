name: CE post-CD pressure audit

on:
  push:
    branches:
      - feature/post-cd-pressure-audit-ce
    paths:
      - '.github/workflows/ce-post-cd-pressure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read-only architecture pressure snapshot
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          paths = {
              'canonical': 'data/canonical/registry.json',
              'sources': 'data/sources/registry.json',
              'monitor': 'data/monitor/expectations.json',
              'changes': 'data/changes/ledger.json',
              'live_obs': 'data/live_intelligence/observations.json',
              'live_ev': 'data/live_intelligence/evidence_registry.json',
              'analysis_schema': 'data/analysis/schema.json',
              'analysis_reviews': 'data/analysis/event_reviews.json',
              'analysis_ev': 'data/analysis/evidence_registry.json',
          }
          docs = {k: load(v) for k, v in paths.items()}
          print('HEAD', __import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True).strip())
          print('TOP_LEVEL_KEYS')
          for k, d in docs.items():
              print(k, sorted(d.keys()))
          print('VERSIONS')
          for k, d in docs.items():
              print(k, d.get('version'))

          list_candidates = {
              'canonical': ['occurrences','records','events'],
              'sources': ['sources','records'],
              'monitor': ['adapters'],
              'changes': ['changes','entries','ledger'],
              'live_obs': ['observations'],
              'live_ev': ['evidence'],
              'analysis_reviews': ['reviews'],
              'analysis_ev': ['evidence'],
          }
          lists = {}
          print('COUNTS')
          for k, candidates in list_candidates.items():
              d = docs[k]
              name = next((x for x in candidates if isinstance(d.get(x), list)), None)
              arr = d.get(name, []) if name else []
              lists[k] = arr
              print(k, name, len(arr))

          for k in ['canonical','sources','monitor','live_obs','analysis_reviews']:
              arr = lists.get(k, [])
              print('SAMPLE_KEYS', k, sorted(arr[0].keys()) if arr else [])

          canon = lists.get('canonical', [])
          by_id = {}
          for r in canon:
              cid = r.get('occurrence_id') or r.get('canonical_occurrence_id') or r.get('id')
              if cid:
                  by_id[cid] = r
          print('CANONICAL_ID_COUNT', len(by_id))

          def show_counter(label, field, n=30):
              c = Counter(str(r.get(field)) for r in canon)
              print(label, c.most_common(n))

          for f in ['region','region_code','category','event_type','certainty_status','activation_mode','lifecycle_status','status','importance','intrinsic_importance','expected_market_sensitivity']:
              if any(f in r for r in canon):
                  show_counter('CANON_'+f.upper(), f)

          adapters = lists.get('monitor', [])
          monitored = set()
          for a in adapters:
              monitored.update(a.get('canonical_occurrence_ids', []))
          print('MONITORED_CANONICAL_IDS', len(monitored))

          live_ids = set()
          for r in lists.get('live_obs', []):
              for f in ['canonical_occurrence_id','occurrence_id']:
                  if r.get(f): live_ids.add(r[f])
          print('LIVE_CANONICAL_IDS', len(live_ids))

          analysis_ids = set()
          for r in lists.get('analysis_reviews', []):
              if r.get('canonical_occurrence_id'): analysis_ids.add(r['canonical_occurrence_id'])
          print('ANALYSIS_CANONICAL_IDS', len(analysis_ids))

          def coverage(label, ids, field):
              all_vals = Counter(str(r.get(field)) for r in canon)
              covered_vals = Counter(str(by_id[i].get(field)) for i in ids if i in by_id)
              print(label, field, 'covered', covered_vals.most_common(50))
              missing = [(v, c, covered_vals.get(v,0)) for v,c in all_vals.items() if covered_vals.get(v,0)==0]
              print(label, field, 'zero_coverage', sorted(missing, key=lambda x:(-x[1],x[0])))

          for field in ['region','region_code','category','event_type']:
              if any(field in r for r in canon):
                  for label, ids in [('MONITOR',monitored),('LIVE',live_ids),('ANALYSIS',analysis_ids)]:
                      coverage(label, ids, field)

          reviews = lists.get('analysis_reviews', [])
          revision_children = [r for r in reviews if r.get('revision_of_analysis_id')]
          print('ANALYSIS_REVISION_CHILDREN', len(revision_children), [r.get('analysis_id') for r in revision_children])
          live_input_reviews = [r for r in reviews if r.get('live_input_observation_ids') or r.get('live_observation_ids')]
          print('ANALYSIS_REVIEWS_WITH_LIVE_INPUT_FIELDS', len(live_input_reviews), [r.get('analysis_id') for r in live_input_reviews])

          print('UNANALYSED_MONITORED_SAMPLE')
          x = sorted(monitored - analysis_ids)
          for cid in x[:80]:
              r = by_id.get(cid, {})
              print(cid, r.get('region') or r.get('region_code'), r.get('category'), r.get('event_type'), r.get('institution'), r.get('title') or r.get('event_name'), r.get('start_local') or r.get('start_utc') or r.get('release_utc'))
          PY
