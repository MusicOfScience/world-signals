name: CE post-CD pressure audit

on:
  push:
    branches:
      - feature/post-cd-pressure-audit-ce
    paths:
      - '.github/workflows/ce-post-cd-pressure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read-only corrected architecture pressure snapshot
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import subprocess

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          canonical = load('data/canonical/registry.json')
          sources = load('data/sources/registry.json')
          monitor = load('data/monitor/expectations.json')
          live_schema = load('data/live_intelligence/schema.json')
          live_obs = load('data/live_intelligence/observations.json')
          live_ev = load('data/live_intelligence/evidence_registry.json')
          analysis_schema = load('data/analysis/schema.json')
          reviews = load('data/analysis/event_reviews.json')
          analysis_ev = load('data/analysis/evidence_registry.json')

          records = canonical['records']
          by_id = {r['occurrence_id']: r for r in records}
          monitored = {cid for a in monitor['adapters'] for cid in a.get('canonical_occurrence_ids', [])}
          live_ids = {
              link['occurrence_id']
              for obs in live_obs['observations']
              for link in obs.get('canonical_links', [])
              if link.get('occurrence_id')
          }
          analysed = {r['canonical_occurrence_id'] for r in reviews['reviews']}

          print('HEAD', subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          print('BASE_MAIN', subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip())
          print('STATE', {
              'canonical': (canonical['version'], len(records)),
              'sources': (sources['version'], len(sources['sources'])),
              'monitor': (monitor['version'], len(monitor['adapters']), len(monitored)),
              'live': (live_schema['version'], live_obs['version'], len(live_obs['observations']), len(live_ev['evidence']), len(live_ids)),
              'analysis': (analysis_schema['version'], reviews['version'], len(reviews['reviews']), len(analysis_ev['evidence']), len(analysed)),
          })
          print('LIVE_POLICY', live_schema['population_policy'])
          print('ANALYSIS_LIVE_INPUT_POLICY', analysis_schema['live_input_policy'])
          print('ANALYSIS_REVISION_POLICY', analysis_schema['analysis_revision_policy'])

          print('LIVE_CANONICAL_LINKS', sorted(live_ids))
          print('LIVE_OBSERVATION_TYPES', Counter(o['observation_type'] for o in live_obs['observations']))
          print('LIVE_REGIONS', Counter(x for o in live_obs['observations'] for x in o.get('regions', [])))
          print('LIVE_DOMAINS', Counter(x for o in live_obs['observations'] for x in o.get('domain_tags', [])))
          print('LIVE_EVIDENCE_CLASSES', Counter(e['evidence_class'] for e in live_ev['evidence']))

          def covered_counter(ids, field):
              return Counter(by_id[i].get(field) for i in ids if i in by_id)
          for field in ['region','category','event_type']:
              allc = Counter(r.get(field) for r in records)
              print('MONITOR_'+field.upper(), covered_counter(monitored, field))
              print('LIVE_'+field.upper(), covered_counter(live_ids, field))
              print('ANALYSIS_'+field.upper(), covered_counter(analysed, field))
              print('MONITOR_ZERO_'+field.upper(), sorted((k,v) for k,v in allc.items() if covered_counter(monitored, field).get(k,0)==0))
              print('LIVE_ZERO_'+field.upper(), sorted((k,v) for k,v in allc.items() if covered_counter(live_ids, field).get(k,0)==0))
              print('ANALYSIS_ZERO_'+field.upper(), sorted((k,v) for k,v in allc.items() if covered_counter(analysed, field).get(k,0)==0))

          def when(r):
              return r.get('start_utc') or r.get('start_local') or r.get('publication_datetime') or r.get('date_earliest') or ''

          completed = [r for r in records if r.get('lifecycle_status') == 'COMPLETED']
          active = [r for r in records if r.get('lifecycle_status') == 'ACTIVE']
          print('COMPLETED_COUNT', len(completed))
          print('COMPLETED_RECORDS')
          for r in sorted(completed, key=when):
              cid = r['occurrence_id']
              print({
                  'id': cid,
                  'when': when(r),
                  'region': r.get('region'),
                  'category': r.get('category'),
                  'event_type': r.get('event_type'),
                  'institution': r.get('institution'),
                  'name': r.get('canonical_name'),
                  'source_id': r.get('source_id'),
                  'importance': r.get('intrinsic_importance'),
                  'market_sensitivity': r.get('expected_market_sensitivity'),
                  'monitored': cid in monitored,
                  'live_linked': cid in live_ids,
                  'analysed': cid in analysed,
              })
          print('ACTIVE_RECORDS')
          for r in sorted(active, key=when):
              cid = r['occurrence_id']
              print({
                  'id': cid, 'when': when(r), 'region': r.get('region'), 'category': r.get('category'),
                  'event_type': r.get('event_type'), 'institution': r.get('institution'), 'name': r.get('canonical_name'),
                  'monitored': cid in monitored, 'live_linked': cid in live_ids, 'analysed': cid in analysed,
              })

          print('COMPLETED_MONITORED_UNLIVE')
          for r in sorted((r for r in completed if r['occurrence_id'] in monitored and r['occurrence_id'] not in live_ids), key=when):
              print(r['occurrence_id'], when(r), r.get('region'), r.get('category'), r.get('event_type'), r.get('institution'), r.get('canonical_name'), 'analysed='+str(r['occurrence_id'] in analysed))

          print('COMPLETED_UNANALYSED_MARKET_STRUCTURE')
          for r in sorted((r for r in completed if r.get('category') == 'CORPORATE_FINANCIAL_MARKET_STRUCTURE' and r['occurrence_id'] not in analysed), key=when):
              print(r['occurrence_id'], when(r), r.get('region'), r.get('event_type'), r.get('institution'), r.get('canonical_name'), 'monitored='+str(r['occurrence_id'] in monitored), 'live='+str(r['occurrence_id'] in live_ids))
          PY
