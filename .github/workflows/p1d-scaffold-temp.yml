name: TEMP P1-D scaffold

on:
  push:
    branches: [source-governance-p1d-research]

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Derive P1-D guarded migration from P1-C lifecycle-safe implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('scripts/apply_source_governance_p1c.py').read_text(encoding='utf-8')
          out=src.replace('P1C','P1D').replace('P1-C','P1-D').replace('p1c','p1d')
          Path('scripts/apply_source_governance_p1d.py').write_text(out,encoding='utf-8')
          PY
      - name: Verify only migration script created
        run: |
          test -f scripts/apply_source_governance_p1d.py
          test "$(git status --porcelain --untracked-files=all | sed 's/^?? //' | sed 's/^...//' | sort)" = "scripts/apply_source_governance_p1d.py"
      - name: Compile new migration
        run: python -m py_compile scripts/apply_source_governance_p1d.py
      - name: Commit migration scaffold
        run: |
          git config user.name "world-signals-governance"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/apply_source_governance_p1d.py
          git commit -m "Add guarded P1-D governance migration"
          git push origin HEAD:source-governance-p1d-research
