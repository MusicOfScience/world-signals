name: TEMP controlled Analysis T reviewed apply

on:
  push:
    branches:
      - feature/controlled-analysis-expansion-t
    paths:
      - .github/workflows/_temp-analysis-t-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact reviewed pre-state
        shell: bash
        run: |
          set -euo pipefail
          BASE=33826d046cc7b966cf8e77fe4fbb7debb6a50278
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
      - name: Re-run fail-closed check-only transaction
        run: python scripts/apply_controlled_analysis_expansion_t.py
      - name: Apply reviewed Analysis T transaction
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_T: YES
        run: python scripts/apply_controlled_analysis_expansion_t.py --apply
      - name: Validate exact reviewed post-state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_controlled_analysis_expansion_t tests.test_priority_region_analysis_s tests.test_analysis_layer -v
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          e=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert (c['version'],len(c['records']))==('0.29',678)
          assert (r['version'],len(r['reviews']))==('0.4',8)
          assert r['canonical_checkpoint']=={'registry_version':'0.29','record_count':678}
          assert (e['version'],len(e['evidence']))==('0.4',21)
          PY
      - name: Assert write boundary and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            data/analysis/CONTROLLED_ANALYSIS_EXPANSION_T_TRANSACTION_AUDIT_v0.1.md
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code HEAD -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json
          git rm .github/workflows/_temp-analysis-t-probe.yml
          git add \
            data/analysis/CONTROLLED_ANALYSIS_EXPANSION_T_TRANSACTION_AUDIT_v0.1.md \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_staged=(
            .github/workflows/_temp-analysis-t-probe.yml
            data/analysis/CONTROLLED_ANALYSIS_EXPANSION_T_TRANSACTION_AUDIT_v0.1.md
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
          )
          printf '%s\n' "${expected_staged[@]}" | sort > /tmp/expected_staged
          printf '%s\n' "${staged[@]}" | sort > /tmp/actual_staged
          diff -u /tmp/expected_staged /tmp/actual_staged
      - name: Commit reviewed feature-branch transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git commit -m "Apply controlled Analysis expansion T transaction"
          git push origin HEAD:feature/controlled-analysis-expansion-t
