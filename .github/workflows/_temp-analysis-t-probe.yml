name: TEMP controlled Analysis T registry probe

on:
  push:
    branches:
      - feature/controlled-analysis-expansion-t
    paths:
      - .github/workflows/_temp-analysis-t-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact merged base and inspect unreviewed completed anchors
        shell: bash
        run: |
          set -euo pipefail
          BASE=33826d046cc7b966cf8e77fe4fbb7debb6a50278
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          l=json.loads(Path('data/changes/ledger.json').read_text())
          reviewed={x['canonical_occurrence_id'] for x in r['reviews'] if x.get('review_state') in {'REVIEWED_SAMPLE','REVIEWED'} and x.get('review_phase')=='POST_EVENT'}
          completed=[x for x in c['records'] if x.get('lifecycle_status')=='COMPLETED']
          assert len(completed)==9, len(completed)
          unreviewed=[x for x in completed if x['occurrence_id'] not in reviewed]
          assert len(unreviewed)==3, len(unreviewed)
          print('=== UNREVIEWED FULL RECORDS ===')
          for x in unreviewed:
              print(json.dumps(x, sort_keys=True))
          print('=== LEDGER FOR UNREVIEWED ===')
          ids={x['occurrence_id'] for x in unreviewed}
          for change in l.get('changes', l.get('records', [])):
              if change.get('occurrence_id') in ids:
                  print(json.dumps(change, sort_keys=True))
          tech=next(x for x in unreviewed if x['occurrence_id']=='WSO-TECH-A-0002')
          assert tech['start_local']=='2026-09-20'
          assert tech['lifecycle_status']=='COMPLETED'
          PY
