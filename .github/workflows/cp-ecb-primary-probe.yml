name: CP read-only ECB primary probe

on:
  push:
    branches:
      - 'feature/post-co-ecb-monetary-outcome-cp'
    paths:
      - '.github/workflows/cp-ecb-primary-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch ECB primary evidence and exact repository prestate read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          import datetime, json, re, xml.etree.ElementTree as ET

          ROOT=Path('.')
          OUT=Path('artifacts/cp-ecb-primary-probe'); OUT.mkdir(parents=True, exist_ok=True)
          OCC='WSO-ad4d0618a65059f2'; SCHEDULE='WSSRC-CB-003'; OUTCOME='WSSRC-CB-004'

          def load(p): return json.loads((ROOT/p).read_text(encoding='utf-8'))
          def fetch(url):
              req=Request(url,headers={'User-Agent':'WORLD-SIGNALS-CP-read-only-research/1.0'})
              with urlopen(req,timeout=30) as r: return r.read(), {'status':getattr(r,'status',None),'content_type':r.headers.get('Content-Type'),'bytes':int(r.headers.get('Content-Length') or 0)}
          class T(HTMLParser):
              def __init__(self): super().__init__(); self.p=[]
              def handle_data(self,d):
                  if d.strip(): self.p.append(d.strip())
          def text(raw):
              x=T(); x.feed(raw.decode('utf-8',errors='replace')); return re.sub(r'\s+',' ',' '.join(x.p)).strip()

          registry=load(Path('data/canonical/registry.json'))
          sources=load(Path('data/sources/registry.json'))
          ledger=load(Path('data/changes/ledger.json'))
          live=load(Path('data/live_intelligence/observations.json'))
          liveev=load(Path('data/live_intelligence/evidence_registry.json'))
          target=next(x for x in registry['records'] if x.get('occurrence_id')==OCC)
          bysrc={x['source_id']:x for x in sources['sources']}

          rss_url='https://www.ecb.europa.eu/rss/press.html'
          rss_raw,rss_meta=fetch(rss_url); root=ET.fromstring(rss_raw)
          items=[]; docs={}
          for item in root.findall('.//item'):
              row={k:(item.findtext(k) or '').strip() for k in ('title','link','pubDate','description')}
              if 'ecb.mp260910' in row['link'] or 'ecb.is260910' in row['link']: items.append(row)
          for row in items:
              link=row['link'].replace('https://www.ecb.europa.eu//','https://www.ecb.europa.eu/')
              key='decision' if 'ecb.mp260910' in link else 'statement'
              raw,meta=fetch(link); tx=text(raw)
              docs[key]={'url':link,**meta,'contains_25bp':('25 basis points' in tx),'contains_rates':all(v in tx for v in ('2.50%','2.65%','2.90%')),'contains_effective_date':('16 September 2026' in tx),'title':row['title'],'pubDate':row['pubDate']}

          report={
            'run_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'read_only':True,
            'primary_evidence':{'rss_url':rss_url,'rss_meta':rss_meta,'items':items,'documents':docs},
            'repository_prestate':{
              'canonical':{'version':str(registry.get('version')),'record_count':registry.get('record_count'),'target':target},
              'sources':{'version':str(sources.get('version')),'count':len(sources.get('sources',[])),'schedule_source':bysrc[SCHEDULE],'outcome_source':bysrc[OUTCOME]},
              'ledger':{'version':str(ledger.get('version')),'count':len(ledger.get('changes',[])),'tail':ledger.get('changes',[])[-5:]},
              'live':{'version':str(live.get('version')),'count':len(live.get('observations',[])),'evidence_version':str(liveev.get('version')),'evidence_count':len(liveev.get('evidence',[]))}
            }
          }
          (OUT/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-ecb-primary-probe
          path: artifacts/cp-ecb-primary-probe/
          if-no-files-found: error
