name: CP read-only ECB primary probe

on:
  push:
    branches:
      - 'feature/post-co-ecb-monetary-outcome-cp'
    paths:
      - '.github/workflows/cp-ecb-primary-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch ECB primary surfaces read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          import datetime
          import json
          import re
          import xml.etree.ElementTree as ET

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  if data.strip():
                      self.parts.append(data.strip())

          def fetch(url):
              req = Request(url, headers={'User-Agent': 'WORLD-SIGNALS-CP-read-only-research/1.0'})
              with urlopen(req, timeout=30) as r:
                  raw = r.read()
                  meta = {
                      'status': getattr(r, 'status', None),
                      'content_type': r.headers.get('Content-Type'),
                      'bytes': len(raw),
                      'last_modified': r.headers.get('Last-Modified'),
                  }
              return raw, meta

          def html_text(raw):
              parser = TextExtractor()
              parser.feed(raw.decode('utf-8', errors='replace'))
              return re.sub(r'\s+', ' ', ' '.join(parser.parts)).strip()

          out = Path('artifacts/cp-ecb-primary-probe')
          out.mkdir(parents=True, exist_ok=True)
          report = {
              'run_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'read_only': True,
              'source_authority': 'European Central Bank',
              'rss_url': 'https://www.ecb.europa.eu/rss/press.html',
              'rss_items': [],
              'documents': {},
          }

          rss_raw, rss_meta = fetch(report['rss_url'])
          (out / 'press_rss.xml').write_bytes(rss_raw)
          report['rss_meta'] = rss_meta
          root = ET.fromstring(rss_raw)
          for item in root.findall('.//item'):
              row = {
                  'title': (item.findtext('title') or '').strip(),
                  'link': (item.findtext('link') or '').strip(),
                  'pubDate': (item.findtext('pubDate') or '').strip(),
                  'description': (item.findtext('description') or '').strip(),
              }
              if 'ecb.mp260910' in row['link'] or 'ecb.is260910' in row['link']:
                  report['rss_items'].append(row)

          for row in report['rss_items']:
              link = row['link'].replace('https://www.ecb.europa.eu//', 'https://www.ecb.europa.eu/')
              key = 'decision' if 'ecb.mp260910' in link else 'statement'
              raw, meta = fetch(link)
              text = html_text(raw)
              (out / f'{key}.html').write_bytes(raw)
              (out / f'{key}.txt').write_text(text + '\n', encoding='utf-8')
              snippets = {}
              for needle in (
                  'The Governing Council today decided',
                  'Key ECB interest rates',
                  'With effect from',
                  'deposit facility',
                  'main refinancing operations',
                  'marginal lending facility',
              ):
                  i = text.find(needle)
                  if i >= 0:
                      snippets[needle] = text[max(0, i-400):i+2200]
              report['documents'][key] = {
                  'url': link,
                  **meta,
                  'text_length': len(text),
                  'snippets': snippets,
              }

          (out / 'report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-ecb-primary-probe
          path: artifacts/cp-ecb-primary-probe/
          if-no-files-found: error
