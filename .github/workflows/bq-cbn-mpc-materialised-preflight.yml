name: BQ CBN MPC materialised preflight

on:
  push:
    branches:
      - feature/post-bp-cbn-mpc-monitor-bq

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BP ancestry and BQ check-only state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          test "$(git merge-base HEAD origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          python scripts/apply_cbn_mpc_monitor_bq.py
          python -m unittest tests.test_cbn_mpc_monitor_bq tests.test_mixed_signal_correction_m -v
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bq-protected.before
      - name: Materialise bounded BQ post-state
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BQ=1 python scripts/apply_cbn_mpc_monitor_bq.py --apply
      - name: Audit exact five-file governed/runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          }
          assert changed==expected,(changed,expected)
          pre_sources=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'],text=True))
          post_sources=json.loads(Path('data/sources/registry.json').read_text())
          pre_monitor=json.loads(subprocess.check_output(['git','show','HEAD:data/monitor/expectations.json'],text=True))
          post_monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (pre_sources['version'],len(pre_sources['sources']))==('1.89',248)
          assert (post_sources['version'],len(post_sources['sources']))==('1.90',248)
          assert (pre_monitor['version'],len(pre_monitor['adapters']))==('0.14',12)
          assert (post_monitor['version'],len(post_monitor['adapters']))==('0.15',13)
          before={r['source_id']:r for r in pre_sources['sources']}
          after={r['source_id']:r for r in post_sources['sources']}
          assert [sid for sid in before if before[sid]!=after[sid]]==['WSSRC-CB-014']
          cbn=after['WSSRC-CB-014']
          assert cbn['canonical_dependency_count']==2
          assert cbn['canonical_provenance_use']=='CLEARED_CURATED_FACTUAL_METADATA'
          assert cbn['automated_monitoring_use']=='CLEARED'
          assert cbn['automated_retrieval_permission']=='CLEARED_BOUNDED_ROBOTS_CONFORMANT_LOW_RATE_MPC_CALENDAR_PATH'
          assert post_monitor['adapters'][:12]==pre_monitor['adapters']
          route=post_monitor['adapters'][12]
          assert route['adapter_id']=='CBN_MPC_CALENDAR'
          assert set(route['canonical_occurrence_ids'])=={'WSO-CBN-MPC-307','WSO-CBN-MPC-308'}
          assert route['request_budget_per_run']==2
          assert route['robots_policy']=='FETCH_FIRST_FAIL_CLOSED_IF_CALENDAR_PATH_DISALLOWED'
          assert route['decision_publication_time_authority'] is False
          assert route['lifecycle_authority'] is False
          assert route['certainty_authority'] is False
          assert route['automatic_commit_allowed'] is False
          assert post_monitor['automatic_canonical_commit'] is False
          assert post_monitor['google_calendar_write'] is False
          PY
      - name: Validate full descendant repository and static build offline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/cbn_mpc.py src/world_signals/cbn_mpc_monitor.py scripts/apply_cbn_mpc_monitor_bq.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore materialisation byte-clean
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bq-protected.after
          diff -u /tmp/bq-protected.before /tmp/bq-protected.after
          git restore -- data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
