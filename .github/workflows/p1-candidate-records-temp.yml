name: TEMP P1 candidate records

on:
  push:
    branches:
      - source-governance-p1-selection-diagnostic

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print candidate source records and dependencies
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sources=json.loads(Path('data/sources/registry.json').read_text())
          registry=json.loads(Path('data/canonical/registry.json').read_text())
          ids=[
            'WSSRC-INT-010','WSSRC-INT-017','WSSRC-INT-026',
            'WSSRC-REG-011','WSSRC-REG2-002','WSSRC-REG5-001',
            'WSSRC-REG6-001','WSSRC-REG6-002'
          ]
          by={s.get('source_id'):s for s in sources.get('sources',[])}
          for sid in ids:
            print('SOURCE', sid)
            print(json.dumps(by.get(sid), indent=2, ensure_ascii=False, sort_keys=True))
            print('DEPENDENCIES')
            for r in registry.get('records',[]):
              if r.get('source_id')==sid:
                keep={k:r.get(k) for k in ['occurrence_id','series_id','title','start_local','timing_type','certainty','lifecycle','status','event_type','jurisdiction'] if k in r}
                print(json.dumps(keep, ensure_ascii=False, sort_keys=True))
          PY
