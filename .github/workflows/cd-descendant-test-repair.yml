name: CD descendant-safety test repair

on:
  push:
    branches:
      - feature/post-cc-pressure-audit-cd
    paths:
      - '.github/workflows/cd-descendant-test-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact governed pre-materialisation state
        run: |
          git merge-base --is-ancestor c186835d9d6b36620177badfff604f309ceb35d4 HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/analysis/schema.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          e=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert a['version']=='0.7'
          assert (r['version'],len(r['reviews']))==('0.17',21)
          assert (e['version'],len(e['evidence']))==('0.17',95)
          print('CD_REPAIR_PRESTATE_PASS')
          PY
      - name: Apply narrow descendant-safety repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              assert count==1,(path,count,old)
              p.write_text(text.replace(old,new,1))

          replace_once(
              'tests/test_bwc_wg8_first_analysis_revision_cd.py',
              '''        cls.plan = load(apply_cd.PLAN_PATH)\n        cls.target = apply_cd.simulate()\n        apply_cd.assert_target(cls.plan, cls.target)\n        cls.canonical = load(apply_cd.CANONICAL_PATH)\n''',
              '''        cls.plan = load(apply_cd.PLAN_PATH)\n        schema = load(apply_cd.ANALYSIS_SCHEMA_PATH)\n        reviews = load(apply_cd.REVIEWS_PATH)\n        evidence = load(apply_cd.ANALYSIS_EVIDENCE_PATH)\n        post = cls.plan["target_state"]\n        materialized = (\n            schema.get("version") == post["analysis_schema_version"]\n            and reviews.get("version") == post["analysis_reviews_version"]\n            and len(reviews.get("reviews", [])) == post["analysis_review_count"]\n            and evidence.get("version") == post["analysis_evidence_version"]\n            and len(evidence.get("evidence", [])) == post["analysis_evidence_count"]\n        )\n        if materialized:\n            cls.target = {\n                "analysis_schema": schema,\n                "reviews": reviews,\n                "evidence": evidence,\n            }\n        else:\n            cls.target = apply_cd.simulate()\n        apply_cd.assert_target(cls.plan, cls.target)\n        cls.canonical = load(apply_cd.CANONICAL_PATH)\n'''
          )

          replace_once(
              'tests/test_eurostat_monitor_bk.py',
              '''        self.assertEqual(analysis["version"], "0.17")\n        self.assertEqual(len(analysis["reviews"]), 21)\n''',
              '''        analysis_version = tuple(int(part) for part in analysis["version"].split("."))\n        self.assertGreaterEqual(analysis_version, (0, 17))\n        self.assertGreaterEqual(len(analysis["reviews"]), 21)\n'''
          )

          replace_once(
              'tests/test_fomc_monitor_readiness_bm.py',
              '''        self.assertEqual((analysis["version"], len(analysis["reviews"])), ("0.17", 21))\n        self.assertEqual(len(analysis_evidence["evidence"]), 95)\n''',
              '''        analysis_version = tuple(int(part) for part in analysis["version"].split("."))\n        evidence_version = tuple(int(part) for part in analysis_evidence["version"].split("."))\n        self.assertGreaterEqual(analysis_version, (0, 17))\n        self.assertGreaterEqual(len(analysis["reviews"]), 21)\n        self.assertGreaterEqual(evidence_version, (0, 17))\n        self.assertGreaterEqual(len(analysis_evidence["evidence"]), 95)\n'''
          )

          replace_once(
              'tests/test_japan_fies_live_analysis_az.py',
              '''        self.assertEqual(self.target["reviews"]["version"], "0.17")\n        self.assertGreaterEqual(len(self.target["reviews"]["reviews"]), 21)\n''',
              '''        reviews_version = tuple(\n            int(part) for part in self.target["reviews"]["version"].split(".")\n        )\n        self.assertGreaterEqual(reviews_version, (0, 17))\n        self.assertGreaterEqual(len(self.target["reviews"]["reviews"]), 21)\n'''
          )

          replace_once(
              'tests/test_japan_household_spending_monitor_bl.py',
              '''        self.assertEqual((analysis["version"], len(analysis["reviews"])), ("0.17", 21))\n''',
              '''        analysis_version = tuple(int(part) for part in analysis["version"].split("."))\n        self.assertGreaterEqual(analysis_version, (0, 17))\n        self.assertGreaterEqual(len(analysis["reviews"]), 21)\n'''
          )

          replace_once(
              'tests/test_opec_official_confirmation_bg.py',
              '''        self.assertEqual(len(self.target["analysis_reviews"]["reviews"]), 21)\n        self.assertEqual(len(self.target["analysis_evidence"]["evidence"]), 95)\n        self.assertEqual(bg.production_live_input_count(self.target["analysis_reviews"]), 1)\n        self.assertEqual(bg.revision_count(self.target["analysis_reviews"]), 0)\n''',
              '''        self.assertGreaterEqual(len(self.target["analysis_reviews"]["reviews"]), 21)\n        self.assertGreaterEqual(len(self.target["analysis_evidence"]["evidence"]), 95)\n        self.assertEqual(bg.production_live_input_count(self.target["analysis_reviews"]), 1)\n        self.assertEqual(\n            bg.revision_count(self.target["analysis_reviews"]),\n            bg.revision_count(self.state["analysis_reviews"]),\n        )\n'''
          )
          PY
      - name: Run affected contract modules on pre-state
        run: |
          python -m py_compile \
            tests/test_bwc_wg8_first_analysis_revision_cd.py \
            tests/test_eurostat_monitor_bk.py \
            tests/test_fomc_monitor_readiness_bm.py \
            tests/test_japan_fies_live_analysis_az.py \
            tests/test_japan_household_spending_monitor_bl.py \
            tests/test_opec_official_confirmation_bg.py
          python -m unittest -v \
            tests.test_bwc_wg8_first_analysis_revision_cd \
            tests.test_eurostat_monitor_bk \
            tests.test_fomc_monitor_readiness_bm \
            tests.test_japan_fies_live_analysis_az \
            tests.test_japan_household_spending_monitor_bl \
            tests.test_opec_official_confirmation_bg
      - name: Prove governed data untouched
        run: |
          git diff --exit-code c186835d9d6b36620177badfff604f309ceb35d4..HEAD -- data/canonical data/sources data/monitor data/changes data/live_intelligence data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
          git diff --exit-code -- data/canonical data/sources data/monitor data/changes data/live_intelligence data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
          git diff --check -- tests
      - name: Commit descendant-safety repairs
        run: |
          git config user.name 'WORLD SIGNALS automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            tests/test_bwc_wg8_first_analysis_revision_cd.py \
            tests/test_eurostat_monitor_bk.py \
            tests/test_fomc_monitor_readiness_bm.py \
            tests/test_japan_fies_live_analysis_az.py \
            tests/test_japan_household_spending_monitor_bl.py \
            tests/test_opec_official_confirmation_bg.py
          git diff --cached --check
          git commit -m 'CD: make historical Analysis tests descendant-safe'
          git push origin HEAD:feature/post-cc-pressure-audit-cd
