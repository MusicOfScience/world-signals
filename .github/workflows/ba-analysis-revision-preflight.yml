name: BA AZ descendant repair

on:
  push:
    branches: [feature/post-az-analysis-revision-contract-ba]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AZ ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=802ca5b94b6e80a055ac363f48a6c8392f038048
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
      - name: Apply exact narrow AZ descendant repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_japan_fies_live_analysis_az.py')
          text=p.read_text()
          old='''    if current.get("version") == "0.6":\n        return deepcopy(current)\n    require(current.get("version") == "0.5", "AZ Analysis schema requires v0.5 prestate")\n'''
          new='''    raw_version = current.get("version")\n    if raw_version != "0.5":\n        try:\n            parsed = tuple(int(part) for part in str(raw_version).split("."))\n        except (TypeError, ValueError):\n            parsed = ()\n        require(\n            parsed >= (0, 6),\n            "AZ Analysis schema requires v0.5 prestate or v0.6+ reviewed descendant",\n        )\n        return deepcopy(current)\n'''
          assert text.count(old)==1, text.count(old)
          patched=text.replace(old,new,1)
          assert patched.count(new)==1
          p.write_text(patched)
          PY
          test "$(git diff --name-only)" = "scripts/apply_japan_fies_live_analysis_az.py"
          python -m py_compile scripts/apply_japan_fies_live_analysis_az.py
          python -m unittest tests.test_japan_fies_live_analysis_az -v
      - name: Prove historical v0.5 transform and descendant pass-through
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from copy import deepcopy
          from pathlib import Path
          ROOT=Path('.')
          sys.path.insert(0,str(ROOT/'scripts'))
          import apply_japan_fies_live_analysis_az as az
          plan=json.loads((ROOT/'data/analysis/JAPAN_FIES_LIVE_ANALYSIS_AZ_PLAN_v0.1.json').read_text())
          live=json.loads((ROOT/'data/analysis/schema.json').read_text())
          # Current post-AZ schema is v0.6 and must remain byte-semantically unchanged through AZ helper.
          assert live['version']=='0.6'
          assert az.target_analysis_schema(deepcopy(live),plan)==live
          # Synthetic v0.7 descendant must also pass through unchanged.
          descendant=deepcopy(live); descendant['version']='0.7'; descendant['analysis_revision_policy']={'synthetic':'descendant-check'}
          assert az.target_analysis_schema(deepcopy(descendant),plan)==descendant
          # Malformed/older non-v0.5 descendants remain fail-closed.
          for bad in ('0.4','nonsense',None):
              candidate=deepcopy(live); candidate['version']=bad
              try:
                  az.target_analysis_schema(candidate,plan)
              except SystemExit:
                  pass
              else:
                  raise AssertionError(f'AZ helper accepted invalid descendant {bad!r}')
          PY
      - name: Commit repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_japan_fies_live_analysis_az.py
          test "$(git diff --cached --name-only)" = "scripts/apply_japan_fies_live_analysis_az.py"
          git commit -m 'BA: relax stale AZ descendant schema ceiling'
          git rm .github/workflows/ba-analysis-revision-preflight.yml
          git commit -m 'BA: remove temporary AZ descendant repair workflow'
          git push origin HEAD:feature/post-az-analysis-revision-contract-ba
