name: BA AZ status descendant repair

on:
  push:
    branches: [feature/post-az-analysis-revision-contract-ba]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AZ ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=802ca5b94b6e80a055ac363f48a6c8392f038048
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
      - name: Apply exact narrow AZ status descendant repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_japan_fies_live_analysis_az.py')
          text=p.read_text()
          old='''def target_status(current: str) -> str:\n    if "# CURRENT RECOVERY OVERRIDE — POST-AY / AZ FIRST PRODUCTION LIVE→ANALYSIS LINK" in current:\n        return current\n    require("# CURRENT RECOVERY OVERRIDE — POST-AX / AY LIVE→ANALYSIS BRIDGE FOUNDATION" in current, "AZ PROJECT_STATUS title drift")\n'''
          new='''def target_status(current: str) -> str:\n    if "# CURRENT RECOVERY OVERRIDE — POST-AY / AZ FIRST PRODUCTION LIVE→ANALYSIS LINK" in current:\n        return current\n    ba_title = "# CURRENT RECOVERY OVERRIDE — POST-AZ / BA ANALYSIS REVISION FOUNDATION"\n    if ba_title in current:\n        require(\n            "- Live Intelligence: **v0.4 / 4 reviewed internal observations / 6 primary-official evidence rows / public observation projection CLOSED**" in current,\n            "AZ PROJECT_STATUS BA descendant lost Live v0.4 checkpoint",\n        )\n        require(\n            "- Analysis: **v0.17 / 21 reviews / 95 evidence / 18 reviewed event types**" in current,\n            "AZ PROJECT_STATUS BA descendant lost Analysis v0.17 population",\n        )\n        require(\n            "- production `live_inputs`: **1 / reviewed maximum 1 / public projection CLOSED**" in current,\n            "AZ PROJECT_STATUS BA descendant lost first production Live input",\n        )\n        return current\n    require("# CURRENT RECOVERY OVERRIDE — POST-AX / AY LIVE→ANALYSIS BRIDGE FOUNDATION" in current, "AZ PROJECT_STATUS title drift")\n'''
          assert text.count(old)==1, text.count(old)
          patched=text.replace(old,new,1)
          assert patched.count(new)==1
          p.write_text(patched)
          PY
          test "$(git diff --name-only)" = "scripts/apply_japan_fies_live_analysis_az.py"
          python -m py_compile scripts/apply_japan_fies_live_analysis_az.py
          python -m unittest tests.test_japan_fies_live_analysis_az -v
      - name: Prove exact AZ status transform and BA descendant pass-through
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          ROOT=Path('.')
          sys.path.insert(0,str(ROOT/'scripts'))
          import apply_japan_fies_live_analysis_az as az
          current=(ROOT/'PROJECT_STATUS.md').read_text()
          assert '# CURRENT RECOVERY OVERRIDE — POST-AY / AZ FIRST PRODUCTION LIVE→ANALYSIS LINK' in current
          assert az.target_status(current)==current
          ba=current.replace(
              '# CURRENT RECOVERY OVERRIDE — POST-AY / AZ FIRST PRODUCTION LIVE→ANALYSIS LINK',
              '# CURRENT RECOVERY OVERRIDE — POST-AZ / BA ANALYSIS REVISION FOUNDATION',
              1,
          )
          ba=ba.replace('- Analysis schema: **v0.6**','- Analysis schema: **v0.7**',1)
          live_line='- production `live_inputs`: **1 / reviewed maximum 1 / public projection CLOSED**\n'
          ba=ba.replace(live_line,live_line+'- production Analysis revisions: **0 / gate CLOSED / public revision metadata projection CLOSED**\n',1)
          assert az.target_status(ba)==ba
          broken=ba.replace('4 reviewed internal observations','999 reviewed internal observations',1)
          try:
              az.target_status(broken)
          except SystemExit:
              pass
          else:
              raise AssertionError('AZ helper accepted BA descendant without inherited Live checkpoint')
          PY
      - name: Commit repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_japan_fies_live_analysis_az.py
          test "$(git diff --cached --name-only)" = "scripts/apply_japan_fies_live_analysis_az.py"
          git commit -m 'BA: relax stale AZ status descendant ceiling'
          git rm .github/workflows/ba-analysis-revision-preflight.yml
          git commit -m 'BA: remove temporary AZ status repair workflow'
          git push origin HEAD:feature/post-az-analysis-revision-contract-ba
