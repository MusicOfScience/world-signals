name: BA AZ target-version descendant repair

on:
  push:
    branches: [feature/post-az-analysis-revision-contract-ba]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AZ ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=802ca5b94b6e80a055ac363f48a6c8392f038048
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
      - name: Apply narrow AZ target-version descendant repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_japan_fies_live_analysis_az.py')
          text=p.read_text()
          old='''    require(analysis_schema.get("version") == post["analysis_schema_version"], "AZ target Analysis schema mismatch")\n'''
          new='''    raw_analysis_version = analysis_schema.get("version")\n    raw_az_version = post["analysis_schema_version"]\n    try:\n        analysis_version = tuple(int(part) for part in str(raw_analysis_version).split("."))\n        az_version = tuple(int(part) for part in str(raw_az_version).split("."))\n    except (TypeError, ValueError):\n        analysis_version = ()\n        az_version = (0, 6)\n    require(\n        analysis_version >= az_version,\n        "AZ target Analysis schema must preserve v0.6 or a reviewed descendant",\n    )\n'''
          assert text.count(old)==1, text.count(old)
          p.write_text(text.replace(old,new,1))
          PY
          test "$(git diff --name-only)" = "scripts/apply_japan_fies_live_analysis_az.py"
          python -m py_compile scripts/apply_japan_fies_live_analysis_az.py
          python -m unittest tests.test_japan_fies_live_analysis_az -v
      - name: Prove exact AZ target and BA descendant semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from copy import deepcopy
          from pathlib import Path
          ROOT=Path('.')
          sys.path.insert(0,str(ROOT/'scripts'))
          import apply_japan_fies_live_analysis_az as az
          plan=json.loads((ROOT/'data/analysis/JAPAN_FIES_LIVE_ANALYSIS_AZ_PLAN_v0.1.json').read_text())
          payload=json.loads((ROOT/'data/analysis/JAPAN_FIES_LIVE_ANALYSIS_AZ_PAYLOAD_v0.1.json').read_text())
          # Exact post-AZ target remains accepted unchanged.
          target=az.simulate(plan,payload)
          az.assert_target(plan,target)
          assert target['analysis_schema']['version']=='0.6'
          # Materialise only BA's prospective schema in-memory; AZ-owned bridge policy must survive exactly.
          sys.path.insert(0,str(ROOT/'src'))
          sys.path.insert(0,str(ROOT/'scripts'))
          import apply_analysis_revision_contract_ba as ba
          descendant=deepcopy(target)
          descendant['analysis_schema']=ba.target_analysis_schema(deepcopy(target['analysis_schema']))
          assert descendant['analysis_schema']['version']=='0.7'
          assert descendant['analysis_schema']['live_input_policy']==target['analysis_schema']['live_input_policy']
          az.assert_target(plan,descendant)
          # An older or malformed version remains rejected.
          for bad in ('0.5','nonsense',None):
              candidate=deepcopy(target)
              candidate['analysis_schema']['version']=bad
              try:
                  az.assert_target(plan,candidate)
              except SystemExit:
                  pass
              else:
                  raise AssertionError(f'AZ target validator accepted invalid Analysis version {bad!r}')
          # A descendant that tampers with AZ's bridge contract still fails.
          broken=deepcopy(descendant)
          broken['analysis_schema']['live_input_policy']['maximum_production_live_inputs']=2
          try:
              az.assert_target(plan,broken)
          except SystemExit:
              pass
          else:
              raise AssertionError('AZ target validator accepted bridge-policy drift')
          PY
      - name: Commit repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_japan_fies_live_analysis_az.py
          test "$(git diff --cached --name-only)" = "scripts/apply_japan_fies_live_analysis_az.py"
          git commit -m 'BA: relax stale AZ target-version ceiling'
          git rm .github/workflows/ba-analysis-revision-preflight.yml
          git commit -m 'BA: remove temporary AZ target-version repair workflow'
          git push origin HEAD:feature/post-az-analysis-revision-contract-ba
