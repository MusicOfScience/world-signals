name: BA AZ test descendant repair

on:
  push:
    branches: [feature/post-az-analysis-revision-contract-ba]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AZ ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=802ca5b94b6e80a055ac363f48a6c8392f038048
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
      - name: Repair only the stale live-descendant ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_japan_fies_live_analysis_az.py')
          text=p.read_text()
          old='''        self.assertEqual(self.target["analysis_schema"]["version"], "0.6")\n'''
          new='''        # AZ introduced Analysis schema v0.6; descendants may advance the schema\n        # while preserving AZ-owned Live→Analysis population and bridge invariants.\n        analysis_version = tuple(\n            int(part) for part in self.target["analysis_schema"]["version"].split(".")\n        )\n        self.assertGreaterEqual(analysis_version, (0, 6))\n'''
          assert text.count(old)==1, text.count(old)
          p.write_text(text.replace(old,new,1))
          PY
          test "$(git diff --name-only)" = "tests/test_japan_fies_live_analysis_az.py"
          python -m py_compile tests/test_japan_fies_live_analysis_az.py
          python -m unittest tests.test_japan_fies_live_analysis_az -v
      - name: Prove AZ checkpoint remains frozen and BA descendant remains bounded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT=Path('.')
          sys.path.insert(0,str(ROOT/'scripts'))
          sys.path.insert(0,str(ROOT/'src'))
          import apply_japan_fies_live_analysis_az as az
          import apply_analysis_revision_contract_ba as ba
          from world_signals.live_analysis_bridge import production_live_input_count
          plan=json.loads((ROOT/'data/analysis/JAPAN_FIES_LIVE_ANALYSIS_AZ_PLAN_v0.1.json').read_text())
          payload=json.loads((ROOT/'data/analysis/JAPAN_FIES_LIVE_ANALYSIS_AZ_PAYLOAD_v0.1.json').read_text())
          exact=az.simulate(plan,payload)
          assert exact['analysis_schema']['version']=='0.6'
          assert len(exact['reviews']['reviews'])==21
          assert len(exact['analysis_evidence']['evidence'])==95
          assert production_live_input_count(exact['reviews'])==1
          descendant=dict(exact)
          descendant['analysis_schema']=ba.target_analysis_schema(exact['analysis_schema'])
          assert descendant['analysis_schema']['version']=='0.7'
          assert descendant['analysis_schema']['live_input_policy']==exact['analysis_schema']['live_input_policy']
          assert len(descendant['reviews']['reviews'])==21
          assert len(descendant['analysis_evidence']['evidence'])==95
          assert production_live_input_count(descendant['reviews'])==1
          PY
      - name: Commit repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_japan_fies_live_analysis_az.py
          test "$(git diff --cached --name-only)" = "tests/test_japan_fies_live_analysis_az.py"
          git commit -m 'BA: relax stale AZ test schema ceiling'
          git rm .github/workflows/ba-analysis-revision-preflight.yml
          git commit -m 'BA: remove temporary AZ test repair workflow'
          git push origin HEAD:feature/post-az-analysis-revision-contract-ba
