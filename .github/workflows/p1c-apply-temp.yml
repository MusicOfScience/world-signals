name: TEMP P1-C governance apply

on:
  push:
    branches: [source-governance-p1c-transaction]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read-only preflight
        run: python scripts/apply_source_governance_p1c.py
      - name: Apply reviewed six-source transaction
        env:
          WORLD_SIGNALS_ALLOW_P1C_GOVERNANCE_APPLY: 'YES'
        run: python scripts/apply_source_governance_p1c.py --apply
      - name: Enforce source-registry-only working diff
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
          git diff --exit-code -- data/canonical/registry.json
          git diff --exit-code -- data/monitor/expectations.json
          git diff --exit-code -- scripts/run_live_monitor.py
      - name: Validate post-state
        run: |
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py src/world_signals/*.py
          for file in web/*.js; do node --check "$file"; done
          python scripts/build_site.py
      - name: Commit reviewed source-registry transaction
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
          git config user.name "world-signals-governance"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources/registry.json
          git commit -m "Apply P1-C source governance backfill"
          git push origin HEAD:source-governance-p1c-transaction
