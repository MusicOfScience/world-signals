name: BM FOMC materialised readiness preflight

on:
  push:
    branches:
      - feature/post-bl-pressure-audit-bm

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BL ancestry and governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1edd6ac0b540db60519fdccab5c404d42d8fc442"
          test "$(git merge-base HEAD origin/main)" = "1edd6ac0b540db60519fdccab5c404d42d8fc442"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records'])) == ('0.41',689)
          assert (s['version'],len(s['sources'])) == ('1.85',247)
          assert (m['version'],len(m['adapters'])) == ('0.12',10)
          src=next(x for x in s['sources'] if x['source_id']=='WSSRC-CB-001')
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['automated_retrieval_permission']=='PENDING_ENDPOINT_OPERATIONAL_REVIEW'
          assert src['verification_mode']=='AUTOMATED_PILOT'
          assert src['parser_version']=='fomc-calendar-rule-0.1'
          assert not any(x.get('source_id')=='WSSRC-CB-001' for x in m['adapters'])
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          PY
      - name: Run check-only readiness and descendant-repair transforms
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_fomc_monitor_readiness_bm.py
          python scripts/repair_bl_source_ceiling_bm.py
      - name: Exercise current first-party FOMC schedule surfaces
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from world_signals.adapters.fomc import (
              fetch_fomc_meeting_calendar,
              fetch_fomc_operational_calendar,
              validate_fomc_schedule_alignment,
          )
          meetings,meeting_snap=fetch_fomc_meeting_calendar(timeout=30,years=(2026,2027))
          operational=[]; snaps=[]
          for year,month in ((2026,9),(2026,10),(2026,12)):
              calendar,snap=fetch_fomc_operational_calendar(year,month,timeout=30)
              operational.append(calendar); snaps.append(snap)
          validate_fomc_schedule_alignment(meetings,operational)
          by_month={(x.year,x.month):{e.event_kind:e for e in x.events} for x in operational}
          assert by_month[(2026,9)]['DECISION'].start_local=='2026-09-16T14:00:00'
          assert by_month[(2026,9)]['PRESS_CONFERENCE'].start_local=='2026-09-16T14:30:00'
          assert by_month[(2026,10)]['MINUTES'].start_local=='2026-10-07T14:00:00'
          assert by_month[(2026,10)]['DECISION'].start_local=='2026-10-28T14:00:00'
          assert by_month[(2026,10)]['PRESS_CONFERENCE'].start_local=='2026-10-28T14:30:00'
          assert by_month[(2026,12)]['DECISION'].start_local=='2026-12-09T14:00:00'
          assert by_month[(2026,12)]['PRESS_CONFERENCE'].start_local=='2026-12-09T14:30:00'
          assert len([x for x in meetings.windows if x.year==2027])==8
          print({'meeting_status':meeting_snap.status,'meeting_windows':len(meetings.windows),'operational_statuses':[s.status for s in snaps]})
          PY
      - name: Materialise exact BM post-state in working tree
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BM=1 python scripts/apply_fomc_monitor_readiness_bm.py --apply
          WORLD_SIGNALS_APPLY_MONITOR_BM=1 python scripts/repair_bl_source_ceiling_bm.py --apply
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          c=json.loads(Path('data/canonical/registry.json').read_text())
          assert (s['version'],len(s['sources'])) == ('1.86',247)
          assert (m['version'],len(m['adapters'])) == ('0.12',10)
          assert (c['version'],len(c['records'])) == ('0.41',689)
          src=next(x for x in s['sources'] if x['source_id']=='WSSRC-CB-001')
          assert src['parser_version']=='fomc-schedule-readiness-0.2'
          assert src['monitoring_activation_status']=='ENDPOINT_PERMISSION_HOLD_NO_PRODUCTION_ROUTE'
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['automated_retrieval_permission']=='PENDING_ENDPOINT_OPERATIONAL_REVIEW'
          assert not any(x.get('source_id')=='WSSRC-CB-001' for x in m['adapters'])
          PY
      - name: Audit simulated mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from subprocess import check_output
          allowed={'data/sources/registry.json','tests/test_japan_household_spending_monitor_bl.py'}
          tracked=set(check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked=set(check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          changed=tracked|untracked
          assert changed == allowed, (changed, allowed)
          PY
      - name: Validate materialised post-state and full repository
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_fomc_adapter_bm tests.test_fomc_monitor_readiness_bm -v
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/fomc.py scripts/apply_fomc_monitor_readiness_bm.py scripts/repair_bl_source_ceiling_bm.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Restore governed files and prove read-only rehearsal
        shell: bash
        run: |
          set -euo pipefail
          git restore -- data/sources/registry.json tests/test_japan_household_spending_monitor_bl.py
          rm -rf docs
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
