name: BQ CBN MPC read-only diagnostic

on:
  push:
    branches:
      - feature/post-bp-cbn-mpc-monitor-bq

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BP baseline and inspect governed Africa monitor pressure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          test "$(git merge-base HEAD origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          python - <<'PY'
          import json
          from pathlib import Path

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert (sources['version'],len(sources['sources']))==('1.89',248)
          assert (monitor['version'],len(monitor['adapters']))==('0.14',12)
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False

          src=next(r for r in sources['sources'] if r['source_id']=='WSSRC-CB-014')
          rows=[r for r in canonical['records'] if r.get('source_id')=='WSSRC-CB-014']
          assert {r['occurrence_id'] for r in rows}=={'WSO-CBN-MPC-307','WSO-CBN-MPC-308'}
          assert all(r['series_id']=='WSER-CB-NG-CBN-MPC' for r in rows)
          assert all(r['region']=='Africa' for r in rows)
          assert all(r['source_timezone']=='Africa/Lagos' for r in rows)
          assert all(r['time_precision']=='DAY_RANGE' for r in rows)
          assert all(r['lifecycle_status']=='PLANNED' for r in rows)

          by_occ={r['occurrence_id']:r for r in canonical['records']}
          route_regions={}
          for route in monitor['adapters']:
              regions=sorted({by_occ[oid]['region'] for oid in route.get('canonical_occurrence_ids',[]) if oid in by_occ})
              route_regions[route['adapter_id']]=regions
          africa_routes=[rid for rid,regions in route_regions.items() if 'Africa' in regions]
          assert africa_routes==[],africa_routes

          print(json.dumps({
              'canonical':[canonical['version'],len(canonical['records'])],
              'sources':[sources['version'],len(sources['sources'])],
              'monitor':[monitor['version'],len(monitor['adapters'])],
              'cbn_source':src,
              'cbn_occurrences':rows,
              'production_route_regions':route_regions,
              'africa_production_routes':africa_routes,
          },indent=2,sort_keys=True))
          PY
      - name: Live-review CBN robots, legal notice and bounded 2026 MPC calendar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from urllib.robotparser import RobotFileParser

          UA='WORLD-SIGNALS-read-only-diagnostic/0.1'
          urls={
            'robots':'https://www.cbn.gov.ng/robots.txt',
            'legal':'https://www.cbn.gov.ng/Legal.html',
            'calendar':'https://www.cbn.gov.ng/MonetaryPolicy/calendar.html',
          }
          bodies={}
          meta={}
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,text/plain;q=0.9,*/*;q=0.5'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  body=resp.read()
                  assert resp.status==200,(key,resp.status)
                  bodies[key]=body.decode('utf-8','replace')
                  meta[key]={'status':resp.status,'content_type':resp.headers.get('Content-Type',''),'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body)}

          rp=RobotFileParser()
          rp.set_url(urls['robots'])
          rp.parse(bodies['robots'].splitlines())
          assert rp.can_fetch(UA,urls['calendar'])

          def textify(raw):
              raw=re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',raw)
              raw=re.sub(r'(?s)<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          legal=textify(bodies['legal']).lower()
          assert 'permitted to copy material from this internet address' in legal
          assert 'cbn is stated expressly as the source' in legal
          assert 'not permitted to amend or distort' in legal

          cal=textify(bodies['calendar'])
          expected={
            '304':('Feb. 23, 2026','Feb. 24, 2026'),
            '305':('May 19, 2026','May 20, 2026'),
            '306':('Jul. 20, 2026','Jul. 21, 2026'),
            '307':('Sep. 21, 2026','Sep. 22, 2026'),
            '308':('Nov. 23, 2026','Nov. 24, 2026'),
          }
          for no,(d1,d2) in expected.items():
              assert no in cal and d1 in cal and d2 in cal,(no,d1,d2)

          print(json.dumps({
              'requests':3,
              'robots_allows_calendar':True,
              'legal_copy_with_attribution_no_distortion':True,
              'calendar_expected_meetings':expected,
              'http':meta,
          },indent=2,sort_keys=True))
          PY
      - name: Prove diagnostic is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
