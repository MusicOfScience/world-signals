name: BC final clean-head audit

on:
  push:
    branches:
      - feature/post-bb-checkpoint-contract-bc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact post-BB ancestry and permanent manifest
        run: |
          set -euo pipefail
          git fetch origin main
          base=c853f0ca40ff8974a070c31b70fb5fa5f0f01431
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"
          git diff --name-only origin/main...HEAD | grep -v '^\.github/workflows/bc-final-audit\.yml$' | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          PROJECT_STATUS.md
          ROADMAP.md
          data/coverage/POST_BB_CHECKPOINT_PRESSURE_AUDIT_BC_v0.1.md
          scripts/apply_analysis_revision_contract_ba.py
          scripts/apply_japan_fies_live_analysis_az.py
          scripts/validate_checkpoint_contracts.py
          src/world_signals/checkpoint_contract.py
          tests/test_analysis_revision_contract_ba.py
          tests/test_checkpoint_contract_bc.py
          tests/test_japan_fies_live_analysis_az.py
          EOF
          sed -i 's/^          //' /tmp/expected
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Prove governed state is byte-identical to post-BB main
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- data/canonical/registry.json data/canonical/schema.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/monitor/expectations.json data/monitor/operations_policy.json data/live_intelligence/schema.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
      - name: Validate checkpoint contracts and current governed counts
        run: |
          set -euo pipefail
          python scripts/validate_checkpoint_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          canonical = load('data/canonical/registry.json')
          sources = load('data/sources/registry.json')
          ledger = load('data/changes/ledger.json')
          live_obs = load('data/live_intelligence/observations.json')
          live_ev = load('data/live_intelligence/evidence_registry.json')
          analysis_schema = load('data/analysis/schema.json')
          reviews = load('data/analysis/event_reviews.json')
          evidence = load('data/analysis/evidence_registry.json')
          assert canonical['version'] == '0.39' and len(canonical['records']) == 689
          assert sources['version'] == '1.81' and len(sources['sources']) == 244
          assert ledger['version'] == '0.25' and len(ledger['changes']) == 60
          assert len(live_obs['observations']) == 4 and len(live_ev['evidence']) == 6
          assert analysis_schema['version'] == '0.7'
          assert len(reviews['reviews']) == 21 and len(evidence['evidence']) == 95
          assert sum(len(r.get('live_inputs') or []) for r in reviews['reviews']) == 1
          assert sum(1 for r in reviews['reviews'] if r.get('revision_of_analysis_id')) == 0
          PY
      - name: Validate repository completely
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Self-remove final audit workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/bc-final-audit.yml
          git commit -m "BC: remove final clean-head audit workflow"
          git push origin HEAD:feature/post-bb-checkpoint-contract-bc
