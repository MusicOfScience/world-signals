name: TEMP P1-D guarded transaction

on:
  push:
    branches: [source-governance-p1d-transaction]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read-only P1-D preflight
        run: |
          python scripts/apply_source_governance_p1d.py
          git diff --exit-code
      - name: Apply reviewed P1-D backfill
        env:
          WORLD_SIGNALS_ALLOW_P1D_GOVERNANCE_APPLY: YES
        run: python scripts/apply_source_governance_p1d.py --apply
      - name: Enforce exact one-file transaction
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
          test -z "$(git ls-files --others --exclude-standard)"
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/sources/registry.json').read_text())
          assert str(reg.get('version')) == '1.56', reg.get('version')
          assert len(reg.get('sources', [])) == 223, len(reg.get('sources', []))
          print('source registry v1.56 / 223 confirmed')
          PY
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit source transaction
        run: |
          git config user.name "world-signals-governance"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources/registry.json
          git commit -m "Apply P1-D source governance backfill"
          git push origin HEAD:source-governance-p1d-transaction
