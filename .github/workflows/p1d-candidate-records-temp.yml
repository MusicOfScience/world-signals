name: TEMP P1-D candidate records

on:
  push:
    branches: [source-governance-p1d-research]

permissions:
  contents: read

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print candidate source records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids={
            'WSSRC-CB-013','WSSRC-MAC-003','WSSRC-MAC-024','WSSRC-MAC-025',
            'WSSRC-REG-004','WSSRC-REG2-006','WSSRC-CLIM-003','WSSRC-EL-KE-001',
            'WSSRC-COM-001','WSSRC-MKT-011','WSSRC-CB-005','WSSRC-CB-004'
          }
          reg=json.loads(Path('data/sources/registry.json').read_text())
          rows={r['source_id']:r for r in reg['sources'] if r.get('source_id') in ids}
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
      - name: Confirm repository remains clean
        run: git diff --exit-code
