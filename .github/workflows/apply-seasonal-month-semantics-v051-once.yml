name: Apply WORLD SIGNALS seasonal month semantics v0.51 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-seasonal-month-semantics-v051-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-signals-seasonal-month-semantics-v051-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Re-run fail-closed in-memory preflight
        run: PYTHONPATH=. python scripts/apply_seasonal_month_semantics_v051.py
      - name: Protect canonical registry and monitor configuration
        shell: bash
        run: |
          sha256sum data/canonical/registry.json data/monitor/expectations.json data/monitor/operations_policy.json > /tmp/protected.sha256
      - name: Apply schema v0.51 locally
        run: PYTHONPATH=. python scripts/apply_seasonal_month_semantics_v051.py --apply
      - name: Run temporal tests
        run: python -m unittest tests.test_temporal_windows -v
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Parse browser JavaScript
        run: node --check web/app.js
      - name: Build static site
        run: python scripts/build_site.py
      - name: Assert exact schema postconditions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema=json.loads(Path('data/canonical/schema.json').read_text())
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          assert schema['version']=='0.51'
          assert schema['reference_date']=='2026-09-04'
          assert reg['version']=='0.19'
          assert reg['record_count']==668
          values=schema['controlled_vocabularies']['publication_time_semantics']
          assert values.count('SEASONAL_MONTH_RANGE')==1
          assert 'SEASONAL_DATE_RANGE' in values
          print('Schema v0.51 exact-state assertions: PASS')
          PY
      - name: Prove protected state unchanged
        run: sha256sum -c /tmp/protected.sha256
      - name: Reject unintended file changes
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "data/canonical/schema.json" || { echo 'Unexpected changed files:'; printf '%s\n' "$changed"; exit 1; }
      - name: Commit reviewed schema transaction
        shell: bash
        run: |
          git config user.name 'WORLD SIGNALS reviewed migration'
          git config user.email '58031940+MusicOfScience@users.noreply.github.com'
          git add data/canonical/schema.json
          git commit -m 'Apply seasonal month semantics schema v0.51'
          git push
