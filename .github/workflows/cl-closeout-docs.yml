name: CL closeout docs

on:
  push:
    branches:
      - feature/post-ck-pif-live-outcome-cl
    paths:
      - scripts/closeout_cl_docs_tmp.py
      - .github/workflows/cl-closeout-docs.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact main boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "aef4642863438e2170ae9a49160b7368c850b819"
          test "$(git merge-base HEAD origin/main)" = "aef4642863438e2170ae9a49160b7368c850b819"
      - name: Reconcile CL recovery narrative
        run: python scripts/closeout_cl_docs_tmp.py
      - name: Check derived state remains consistent
        run: python scripts/project_state_snapshot.py --check
      - name: Enforce docs-only generated mutation and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' PROJECT_STATUS.md ROADMAP.md | sort)"
          test "$actual" = "$expected"
          git config user.name "world-signals-cl-closeout"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATUS.md ROADMAP.md
          git rm .github/workflows/cl-closeout-docs.yml scripts/closeout_cl_docs_tmp.py
          git commit -m "CL: reconcile closeout roadmap and select CM"
          git push origin HEAD:feature/post-ck-pif-live-outcome-cl
