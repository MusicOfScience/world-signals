name: BY NZ election read-only offline tests

on:
  push:
    branches:
      - feature/post-bx-pressure-audit-by
    paths:
      - .github/workflows/by-nz-election-offline-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BX ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "a3bca03f36eb5af9036017aad926f75f6762267f"
          test "$(git merge-base HEAD origin/main)" = "a3bca03f36eb5af9036017aad926f75f6762267f"
      - name: Run focused BY tests and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_nz_election_rss_by -v
          python -m py_compile src/world_signals/adapters/nz_election_rss.py src/world_signals/nz_election_monitor.py
      - name: Prove repository remains read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __pycache__ src/world_signals/__pycache__ src/world_signals/adapters/__pycache__ tests/__pycache__
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
