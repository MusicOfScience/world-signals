name: TEMP ONS RSS structure probe

on:
  push:
    branches:
      - feature/core-monitor-expansion-o
    paths:
      - data/monitor/ONS_RSS_PROBE.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Probe official ONS RSS structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://www.ons.gov.uk/releasecalendar?highlight=true&keywords=GDP&limit=10&page=1&release-type=type-upcoming&rss=&sort=date-newest"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "WORLD-SIGNALS/0.2 (+https://github.com/MusicOfScience/world-signals)",
                  "Accept": "application/rss+xml, application/xml;q=0.9, */*;q=0.8",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read()
              print("status", response.status)
              print("content_type", response.headers.get("Content-Type"))
              print("resolved_url", response.geturl())
              print("body_bytes", len(body))

          root = ET.fromstring(body)
          channel = root.find("channel")
          print("root_tag", root.tag)
          print("channel_children", [child.tag for child in list(channel)[:12]] if channel is not None else None)
          items = root.findall("./channel/item")
          print("item_count", len(items))
          for i, item in enumerate(items[:3], start=1):
              row = {}
              for child in list(item):
                  text = " ".join((child.text or "").split())
                  if len(text) > 500:
                      text = text[:500] + "…"
                  row[child.tag] = text
              print(f"item_{i}", json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
