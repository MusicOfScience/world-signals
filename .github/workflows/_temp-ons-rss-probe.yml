name: TEMP ONS RSS structure probe

on:
  push:
    branches:
      - feature/core-monitor-expansion-o
    paths:
      - data/monitor/ONS_RSS_PROBE.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Probe official ONS RSS and canonical scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          registry = json.loads(Path('data/canonical/registry.json').read_text(encoding='utf-8'))
          ons = [r for r in registry['records'] if r.get('source_id') == 'WSSRC-MAC-006']
          print('canonical_ons_count', len(ons))
          for r in ons:
              print('canonical', json.dumps({
                  'occurrence_id': r.get('occurrence_id'),
                  'series_id': r.get('series_id'),
                  'canonical_name': r.get('canonical_name'),
                  'short_calendar_title': r.get('short_calendar_title'),
                  'start_local': r.get('start_local'),
                  'start_utc': r.get('start_utc'),
                  'certainty_status': r.get('certainty_status'),
                  'lifecycle_status': r.get('lifecycle_status'),
              }, ensure_ascii=False, sort_keys=True))

          titles = sorted({(r.get('canonical_name') or '').split(' — ')[0] for r in ons if r.get('canonical_name')})
          print('canonical_name_prefixes', json.dumps(titles, ensure_ascii=False))

          base = 'https://www.ons.gov.uk/releasecalendar'
          params = {
              'highlight': 'true',
              'limit': '100',
              'page': '1',
              'release-type': 'type-upcoming',
              'rss': '',
              'sort': 'date-newest',
          }
          url = base + '?' + urllib.parse.urlencode(params)
          req = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'WORLD-SIGNALS/0.2 (+https://github.com/MusicOfScience/world-signals)',
                  'Accept': 'application/rss+xml, application/xml;q=0.9, */*;q=0.8',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read()
              print('status', response.status)
              print('content_type', response.headers.get('Content-Type'))
              print('resolved_url', response.geturl())
              print('body_bytes', len(body))

          root = ET.fromstring(body)
          items = root.findall('./channel/item')
          print('item_count', len(items))
          for i, item in enumerate(items[:12], start=1):
              row = {child.tag: ' '.join((child.text or '').split()) for child in list(item)}
              print(f'feed_{i}', json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
