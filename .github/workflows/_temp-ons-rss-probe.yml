name: TEMP ONS RSS structure probe

on:
  push:
    branches:
      - feature/core-monitor-expansion-o
    paths:
      - data/monitor/ONS_RSS_PROBE.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ONS feed identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          EXPECTED = {
              'WSO-MAC-A-0037': 'Consumer price inflation, UK: August 2026',
              'WSO-MAC-A-0038': 'Consumer price inflation, UK: September 2026',
              'WSO-MAC-A-0039': 'Consumer price inflation, UK: October 2026',
              'WSO-MAC-A-0040': 'Consumer price inflation, UK: November 2026',
              'WSO-MAC-A-0041': 'Consumer price inflation, UK: December 2026',
              'WSO-MAC-A-0042': 'UK Labour Market: September 2026',
              'WSO-MAC-A-0043': 'UK Labour Market: October 2026',
              'WSO-MAC-A-0044': 'UK Labour Market: November 2026',
              'WSO-MAC-A-0045': 'UK Labour Market: December 2026',
              'WSO-MAC-A-0046': 'UK Labour Market: January 2027',
              'WSO-MAC-A-0047': 'GDP quarterly national accounts, UK: April to June 2026',
              'WSO-MAC-A-0048': 'GDP first quarterly estimate, UK: July to September 2026',
              'WSO-MAC-A-0049': 'GDP quarterly national accounts, UK: July to September 2026',
              'WSO-MAC-B-0035': 'GDP monthly estimate, UK: July 2026',
              'WSO-MAC-B-0036': 'Index of Production, UK: July 2026',
              'WSO-MAC-B-0037': 'UK Trade: July 2026',
              'WSO-MAC-B-0038': 'GDP monthly estimate, UK: August 2026',
              'WSO-MAC-B-0039': 'Index of Production, UK: August 2026',
              'WSO-MAC-B-0040': 'UK Trade: August 2026',
          }

          registry = json.loads(Path('data/canonical/registry.json').read_text(encoding='utf-8'))
          ons = {r['occurrence_id']: r for r in registry['records'] if r.get('source_id') == 'WSSRC-MAC-006'}
          assert set(ons) == set(EXPECTED), (sorted(ons), sorted(EXPECTED))

          all_items = []
          snapshots = []
          for page in range(1, 11):
              params = {
                  'highlight': 'true',
                  'limit': '100',
                  'page': str(page),
                  'release-type': 'type-upcoming',
                  'rss': '',
                  'sort': 'date-newest',
              }
              url = 'https://www.ons.gov.uk/releasecalendar?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'WORLD-SIGNALS/0.2 (+https://github.com/MusicOfScience/world-signals)',
                  'Accept': 'application/rss+xml, application/xml;q=0.9, */*;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  snapshots.append((page, response.status, response.headers.get('Content-Type'), len(body)))
              root = ET.fromstring(body)
              items = []
              for item in root.findall('./channel/item'):
                  row = {child.tag: ' '.join((child.text or '').split()) for child in list(item)}
                  items.append(row)
              all_items.extend(items)
              if len(items) < 100:
                  break
          print('snapshots', snapshots)
          print('total_items', len(all_items))
          by_title = {}
          for row in all_items:
              by_title.setdefault(row.get('title'), []).append(row)

          failures = []
          for occurrence_id, title in EXPECTED.items():
              matches = by_title.get(title, [])
              record = ons[occurrence_id]
              status = {
                  'occurrence_id': occurrence_id,
                  'feed_title': title,
                  'match_count': len(matches),
                  'canonical_start_utc': record.get('start_utc'),
                  'feed_pubDate': matches[0].get('pubDate') if len(matches) == 1 else None,
                  'feed_link': matches[0].get('link') if len(matches) == 1 else None,
              }
              print('match', json.dumps(status, ensure_ascii=False, sort_keys=True))
              if len(matches) != 1:
                  failures.append(status)
          if failures:
              raise SystemExit('exact ONS feed identity failures: ' + json.dumps(failures, ensure_ascii=False))
          print('EXACT_IDENTITY_MATCH_PASS', len(EXPECTED))
          PY
