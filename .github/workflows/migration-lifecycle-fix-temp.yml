name: TEMP migration lifecycle test fix

on:
  push:
    branches: [source-governance-migration-lifecycle-fix]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch P1-A and P1-B lifecycle tests
        run: |
          python - <<'PY'
          from pathlib import Path

          paths=[
              Path('tests/test_source_governance_p1a.py'),
              Path('tests/test_source_governance_p1b.py'),
          ]
          for p in paths:
              s=p.read_text(encoding='utf-8')
              old='''    def _assert_completed_source_state(self, source_registry: dict) -> None:\n        self.assertEqual(str(source_registry.get("version")), self.post_version)\n'''
              new='''    @staticmethod\n    def _version_tuple(value: str) -> tuple[int, ...]:\n        return tuple(int(part) for part in str(value).split("."))\n\n    def _assert_completed_source_state(self, source_registry: dict) -> None:\n        self.assertGreaterEqual(\n            self._version_tuple(str(source_registry.get("version"))),\n            self._version_tuple(self.post_version),\n        )\n'''
              if old not in s:
                  raise SystemExit(f'missing completed-state assertion in {p}')
              s=s.replace(old,new,1)
              old2='''        self.assertIn(self.source_version, {self.pre_version, self.post_version})\n        if self.source_version == self.pre_version:\n'''
              new2='''        self.assertGreaterEqual(\n            self._version_tuple(self.source_version),\n            self._version_tuple(self.pre_version),\n        )\n        if self.source_version == self.pre_version:\n'''
              if old2 not in s:
                  raise SystemExit(f'missing repository-state assertion in {p}')
              s=s.replace(old2,new2,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify test-only diff
        run: |
          test "$(git diff --name-only)" = $'tests/test_source_governance_p1a.py\ntests/test_source_governance_p1b.py'
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit lifecycle fix
        run: |
          git config user.name "world-signals-test-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_source_governance_p1a.py tests/test_source_governance_p1b.py
          git commit -m "Make governance migration tests forward-compatible"
          git push origin HEAD:source-governance-migration-lifecycle-fix
