name: BE focused authoring check
on:
  push:
    branches: [feature/post-bd-opec-outcome-be]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run BE read-only simulation and focused tests
        run: |
          set -euo pipefail
          python scripts/apply_opec_fallback_completion_be.py --check-only
          python -m unittest tests.test_opec_fallback_completion_be -v
          python -m py_compile scripts/apply_opec_fallback_completion_be.py tests/test_opec_fallback_completion_be.py
      - name: Self-remove focused authoring check
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/be-focused-authoring-check.yml
          git commit -m "BE: remove temporary focused authoring check"
          git push origin HEAD:feature/post-bd-opec-outcome-be
