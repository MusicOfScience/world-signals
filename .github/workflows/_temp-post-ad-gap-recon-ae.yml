name: TEMP AE sanctions anchor preflight

on:
  push:
    branches:
      - feature/post-ad-gap-recon-ae

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-59 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "7933a9880649ec6a98872fa557566a6b62d55c9d"
      - name: AE check-only transform
        run: python scripts/apply_eu_russia_sanctions_renewal_anchor_ae.py
      - name: AE contract tests
        run: python -m unittest tests.test_eu_russia_sanctions_renewal_anchor_ae -v
      - name: Canonical baseline validator
        run: python scripts/validate_registry.py
      - name: Analysis baseline validator
        run: python scripts/validate_analysis.py
      - name: Python compile
        run: python -m py_compile scripts/apply_eu_russia_sanctions_renewal_anchor_ae.py
