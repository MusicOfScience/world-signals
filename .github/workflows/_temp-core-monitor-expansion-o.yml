name: TEMP core monitor expansion O transaction

on:
  push:
    branches:
      - feature/core-monitor-expansion-o
    paths:
      - data/monitor/CORE_MONITOR_EXPANSION_O_STAGE.trigger

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(tr -d '\r\n ' < data/monitor/CORE_MONITOR_EXPANSION_O_STAGE.trigger)"
          if [[ "$STAGE" != "SIMULATE" && "$STAGE" != "APPLY" ]]; then
            echo "invalid stage: $STAGE" >&2
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
      - name: Fail-closed pre-state and transaction simulation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_core_monitor_expansion_o.py
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/apply_core_monitor_expansion_o.py \
            src/world_signals/adapters/ons_release_calendar.py \
            src/world_signals/ons_monitor.py \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          python scripts/build_site.py
      - name: Build ephemeral exact post-state
        env:
          WORLD_SIGNALS_APPLY_MONITOR_O: YES
        run: python scripts/apply_core_monitor_expansion_o.py --apply
      - name: Validate exact post-state and live ONS route
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/apply_core_monitor_expansion_o.py \
            src/world_signals/adapters/ons_release_calendar.py \
            src/world_signals/ons_monitor.py \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          from datetime import datetime, timezone
          sys.path.insert(0, str(Path.cwd() / 'src'))
          from world_signals.adapters import fetch_ons_upcoming_releases
          from world_signals.ons_monitor import ons_release_calendar_review_candidates

          registry=json.loads(Path('data/canonical/registry.json').read_text(encoding='utf-8'))
          expectations=json.loads(Path('data/monitor/expectations.json').read_text(encoding='utf-8'))
          config=next(x for x in expectations['adapters'] if x['adapter_id']=='ONS_RELEASE_CALENDAR_RSS')
          items,snapshots=fetch_ons_upcoming_releases(
              limit=config['feed']['page_limit'],
              max_pages=config['feed']['max_pages'],
          )
          candidates,observations=ons_release_calendar_review_candidates(
              registry['records'], items, config,
              now_utc=datetime(2026,9,5,0,0,tzinfo=timezone.utc),
          )
          no_change=[x for x in observations if x.get('type')=='ONS_RELEASE_DATETIME_NO_CHANGE']
          print(json.dumps({
              'page_count':len(snapshots),
              'feed_item_count':len(items),
              'review_candidate_count':len(candidates),
              'no_change_count':len(no_change),
          },indent=2))
          assert len(candidates)==0, candidates
          assert len(no_change)==19, len(no_change)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          sources=json.loads(Path('data/sources/registry.json').read_text(encoding='utf-8'))
          expectations=json.loads(Path('data/monitor/expectations.json').read_text(encoding='utf-8'))
          canonical=json.loads(Path('data/canonical/registry.json').read_text(encoding='utf-8'))
          assert canonical['version']=='0.28' and len(canonical['records'])==674
          assert sources['version']=='1.70' and len(sources['sources'])==233
          assert expectations['version']=='0.8' and len(expectations['adapters'])==7
          assert expectations['automatic_canonical_commit'] is False
          assert expectations['google_calendar_write'] is False
          ons=next(x for x in sources['sources'] if x['source_id']=='WSSRC-MAC-006')
          euro=next(x for x in sources['sources'] if x['source_id']=='WSSRC-MAC-005')
          assert ons['live_adapter_id']=='ONS_RELEASE_CALENDAR_RSS'
          assert ons['live_validation_evidence']['canonical_identity_matches']==19
          assert euro['automated_monitoring_use']=='CLEARED'
          assert euro['monitoring_readiness_status']=='HOLD_GENERATED_ICS_ENDPOINT_REDISCOVERY_REQUIRED'
          assert not any('EUROSTAT' in x['adapter_id'] for x in expectations['adapters'])
          PY
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf 'generated transaction diff:\n%s\n' "${changed[*]}"
          expected=(
            data/monitor/CORE_MONITOR_EXPANSION_O_TRANSACTION_AUDIT_v0.1.md
            data/monitor/expectations.json
            data/sources/registry.json
            scripts/run_adapter_smoke.py
            scripts/run_live_monitor.py
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo 'unexpected generated transaction boundary' >&2
            exit 1
          fi
      - name: Discard simulated post-state
        if: steps.stage.outputs.stage == 'SIMULATE'
        run: |
          git reset --hard HEAD
          git clean -fd
      - name: Commit reviewed post-state and remove temporary machinery
        if: steps.stage.outputs.stage == 'APPLY'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_temp-core-monitor-expansion-o.yml \
            data/monitor/CORE_MONITOR_EXPANSION_O_STAGE.trigger \
            .github/workflows/_temp-ons-rss-probe.yml \
            data/monitor/ONS_RSS_PROBE.trigger \
            .github/workflows/_temp-monitor-o-patch.yml \
            data/monitor/MONITOR_O_PATCH.trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply core monitor expansion O'
          git push origin HEAD:feature/core-monitor-expansion-o
