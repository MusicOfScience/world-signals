name: BC checkpoint contract authoring v2

on:
  push:
    branches:
      - feature/post-bb-checkpoint-contract-bc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify post-BB ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "c853f0ca40ff8974a070c31b70fb5fa5f0f01431"
          test "$(git merge-base HEAD origin/main)" = "c853f0ca40ff8974a070c31b70fb5fa5f0f01431"
      - name: Apply BC authoring patch
        run: python scripts/bc_authoring_patch.py
      - name: Run focused BC contracts
        run: |
          set -euo pipefail
          python -m py_compile src/world_signals/checkpoint_contract.py scripts/validate_checkpoint_contracts.py scripts/apply_analysis_revision_contract_ba.py scripts/apply_japan_fies_live_analysis_az.py tests/test_checkpoint_contract_bc.py tests/test_analysis_revision_contract_ba.py tests/test_japan_fies_live_analysis_az.py
          python scripts/validate_checkpoint_contracts.py
          python -m unittest tests.test_checkpoint_contract_bc tests.test_analysis_revision_contract_ba tests.test_japan_fies_live_analysis_az -v
      - name: Prove no governed data mutation
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- data/canonical/registry.json data/canonical/schema.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/monitor/expectations.json data/monitor/operations_policy.json data/live_intelligence/schema.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
      - name: Validate repository completely
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Commit permanent BC files and remove authoring files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_STATUS.md ROADMAP.md data/coverage/POST_BB_CHECKPOINT_PRESSURE_AUDIT_BC_v0.1.md src/world_signals/checkpoint_contract.py scripts/validate_checkpoint_contracts.py scripts/apply_analysis_revision_contract_ba.py scripts/apply_japan_fies_live_analysis_az.py tests/test_checkpoint_contract_bc.py tests/test_analysis_revision_contract_ba.py tests/test_japan_fies_live_analysis_az.py
          git commit -m "BC: formalize historical checkpoint descendant validation"
          git rm scripts/bc_authoring_patch.py .github/workflows/bc-authoring-v2.yml
          git commit -m "BC: remove temporary authoring files"
          git push origin HEAD:feature/post-bb-checkpoint-contract-bc
