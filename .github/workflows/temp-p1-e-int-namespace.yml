name: TEMP P1 E international namespace
on:
  push:
    paths:
      - '.github/workflows/temp-p1-e-int-namespace.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect international source namespace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('data/sources/registry.json').read_text())
          rows=[r for r in src.get('sources',[]) if str(r.get('source_id','')).startswith('WSSRC-INT-')]
          ids=sorted(r['source_id'] for r in rows)
          print('IDS', ids)
          for r in rows:
              sid=r['source_id']
              try: n=int(sid.rsplit('-',1)[1])
              except: continue
              if 25 <= n <= 40:
                  print('ROW', json.dumps(r,ensure_ascii=False,sort_keys=True))
          nums={int(x.rsplit('-',1)[1]) for x in ids if x.rsplit('-',1)[1].isdigit()}
          for n in range(1,100):
              if n not in nums:
                  print('FIRST_UNUSED',f'WSSRC-INT-{n:03d}')
                  break
          PY
