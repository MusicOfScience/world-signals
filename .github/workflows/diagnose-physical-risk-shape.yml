name: Diagnose WORLD SIGNALS physical-risk canonical shape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-physical-risk-shape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print physical-risk records and source contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          schema=json.loads(Path('data/canonical/schema.json').read_text())
          print('CHECKPOINT',reg['version'],reg['record_count'],'SCHEMA',schema['version'],'SOURCE',src['version'])
          keys=(
            'occurrence_id','series_id','canonical_name','category','region','institution','source_id',
            'timing_type','start_local','end_local','start_utc','end_utc','date_earliest','date_latest',
            'time_precision','time_status','time_basis','activation_mode','certainty_status','lifecycle_status',
            'signal_object_class','publication_time_semantics','population_horizon_policy','notes'
          )
          risk=[r for r in reg['records'] if r.get('category')=='PHYSICAL_CLIMATE_RISK']
          print('RISK_COUNT',len(risk))
          for r in risk:
              print('\nEVENT')
              for k in keys: print(k,'=',r.get(k))
          print('\nRISK SOURCES')
          used={r.get('source_id') for r in risk}
          for s in src['sources']:
              if s.get('source_id') in used:
                  print('\nSOURCE')
                  for k in ('source_id','institution','jurisdiction','endpoint_role','authoritative_url','future_schedule_horizon','source_type','information_supplied','known_limitations','notes','licence_constraints','ingestion_permission','licence_review_status','automated_retrieval_permission','redistribution_permission','rights_evidence_url','rights_summary','automation_summary','monitoring_readiness_status'):
                      print(k,'=',s.get(k))
          com=[]
          for r in reg['records']:
              oid=str(r.get('occurrence_id') or '')
              if oid.startswith('WSO-COM-A-'):
                  try: com.append(int(oid.rsplit('-',1)[1]))
                  except ValueError: pass
          riskns=[]
          for r in reg['records']:
              oid=str(r.get('occurrence_id') or '')
              if oid.startswith('WSO-RISK-'):
                  riskns.append(oid)
          print('\nIDENTITY')
          print('MAX_COM_A',max(com) if com else None)
          print('WSO_RISK_IDS',riskns)
          print('RISK_SERIES',sorted({r.get('series_id') for r in risk}))
          print('RISK_SOURCE_IDS',sorted(used))
          PY
