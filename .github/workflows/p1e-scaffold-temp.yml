name: TEMP P1-E scaffold

on:
  push:
    branches: [source-governance-p1e-research]

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Derive P1-E guarded migration from P1-D lifecycle-safe implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('scripts/apply_source_governance_p1d.py').read_text(encoding='utf-8')
          out=src.replace('P1D','P1E').replace('P1-D','P1-E').replace('p1d','p1e')
          Path('scripts/apply_source_governance_p1e.py').write_text(out, encoding='utf-8')
          PY
      - name: Verify only migration script created
        run: |
          test -f scripts/apply_source_governance_p1e.py
          test "$(git status --porcelain --untracked-files=all)" = "?? scripts/apply_source_governance_p1e.py"
      - name: Compile migration
        run: python -m py_compile scripts/apply_source_governance_p1e.py
      - name: Commit migration scaffold
        run: |
          git config user.name "world-signals-governance"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/apply_source_governance_p1e.py
          git commit -m "Add guarded P1-E governance migration"
          git push origin HEAD:source-governance-p1e-research
