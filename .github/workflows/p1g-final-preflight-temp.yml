name: TEMP P1-G final preflight

on:
  push:
    branches: [source-governance-p1g-research]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run read-only P1-G governance simulation
        run: python scripts/apply_source_governance_p1g.py
      - name: Confirm preflight did not mutate repository
        run: git diff --exit-code
      - name: Validate current registry
        run: python scripts/validate_registry.py
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile monitor helpers
        run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Build site
        run: python scripts/build_site.py
      - name: Confirm validation/build left no tracked diff
        run: git diff --exit-code
