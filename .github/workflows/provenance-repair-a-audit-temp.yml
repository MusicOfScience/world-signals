name: TEMP provenance repair A independent audit

on:
  push:
    branches: [provenance-scope-repair-a-transaction]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Independent structural post-state audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          c=json.loads((root/'data/canonical/registry.json').read_text())
          s=json.loads((root/'data/sources/registry.json').read_text())
          l=json.loads((root/'data/changes/ledger.json').read_text())
          o=json.loads((root/'data/coverage/biosecurity_overlay.json').read_text())
          e=json.loads((root/'data/monitor/expectations.json').read_text())
          assert c['version']=='0.21' and c['record_count']==669 and len(c['records'])==669
          assert s['version']=='1.61' and len(s['sources'])==224
          assert l['version']=='0.10'
          assert o['canonical_checkpoint']=={'registry_version':'0.21','record_count':669}
          assert e['automatic_canonical_commit'] is False
          assert e['google_calendar_write'] is False
          ids=[r['occurrence_id'] for r in c['records']]
          assert len(ids)==len(set(ids))==669
          byocc={r['occurrence_id']:r for r in c['records']}
          br=byocc['WSO-EL-A-0004']
          assert br['start_local']=='2027-01-05'
          assert br['source_id']=='WSSRC-EL-BR-002'
          assert br['election_date_basis']=='CONSTITUTIONAL_RULE_DERIVED'
          bysrc={r['source_id']:r for r in s['sources']}
          assert 'WSSRC-EL-BR-002' in bysrc
          assert bysrc['WSSRC-CB-009']['authoritative_url']=='https://www.snb.ch/en/services-events/digital-services/event-schedule'
          deps={sid:sum(1 for r in c['records'] if r.get('source_id')==sid) for sid in ['WSSRC-EL-BR-001','WSSRC-EL-BR-002','WSSRC-CB-009']}
          assert deps=={'WSSRC-EL-BR-001':3,'WSSRC-EL-BR-002':1,'WSSRC-CB-009':18}
          changes=[x for x in l['changes'] if x.get('change_id')=='WSCHANGE-cd76320ef1531227e2']
          assert len(changes)==1 and changes[0].get('committed_at')
          print('INDEPENDENT_POSTSTATE_AUDIT PASS', {'canonical':f"{c['version']}/{c['record_count']}",'source':f"{s['version']}/{len(s['sources'])}",'ledger':l['version'],'overlay':o['canonical_checkpoint'],'deps':deps,'brazil_date':br['start_local'],'auto_commit':e['automatic_canonical_commit'],'calendar_write':e['google_calendar_write'],'committed_at':changes[0]['committed_at']})
          PY
      - name: Generic source-governance audit
        run: python scripts/run_source_governance_audit.py
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Full suite
        run: python -m unittest discover -s tests -v
