name: CD final poststate-test repair

on:
  push:
    branches:
      - feature/post-cc-pressure-audit-cd
    paths:
      - '.github/workflows/cd-final-test-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact governed pre-materialisation state
        run: |
          git merge-base --is-ancestor c186835d9d6b36620177badfff604f309ceb35d4 HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/analysis/schema.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          e=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert a['version']=='0.7'
          assert (r['version'],len(r['reviews']))==('0.17',21)
          assert (e['version'],len(e['evidence']))==('0.17',95)
          print('CD_FINAL_REPAIR_PRESTATE_PASS')
          PY
      - name: Repair post-materialisation test path without replaying transaction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_bwc_wg8_first_analysis_revision_cd.py')
          text=p.read_text()
          old='''    def test_simulation_is_read_only_for_protected_upstream_layers(self):\n        before = {p: stable_hash(ROOT / p) for p in self.plan["protected_paths"]}\n        again = apply_cd.simulate()\n        apply_cd.assert_target(self.plan, again)\n        after = {p: stable_hash(ROOT / p) for p in self.plan["protected_paths"]}\n        self.assertEqual(before, after)\n        self.assertEqual(len(self.live_observations["observations"]), 6)\n'''
          new='''    def test_simulation_is_read_only_for_protected_upstream_layers(self):\n        before = {p: stable_hash(ROOT / p) for p in self.plan["protected_paths"]}\n        current_schema = load(apply_cd.ANALYSIS_SCHEMA_PATH)\n        if current_schema["version"] == self.plan["pre_state"]["analysis_schema_version"]:\n            again = apply_cd.simulate()\n            apply_cd.assert_target(self.plan, again)\n            after = {p: stable_hash(ROOT / p) for p in self.plan["protected_paths"]}\n            self.assertEqual(before, after)\n        else:\n            self.assertEqual(\n                current_schema["version"],\n                self.plan["target_state"]["analysis_schema_version"],\n            )\n            base = self.plan["exact_base_main_sha"]\n            for path in self.plan["protected_paths"]:\n                base_bytes = subprocess.check_output(["git", "show", f"{base}:{path}"])\n                current_bytes = (ROOT / path).read_bytes()\n                self.assertEqual(\n                    hashlib.sha256(current_bytes).hexdigest(),\n                    hashlib.sha256(base_bytes).hexdigest(),\n                    path,\n                )\n        self.assertEqual(len(self.live_observations["observations"]), 6)\n'''
          assert text.count(old)==1, text.count(old)
          p.write_text(text.replace(old,new,1))
          PY
      - name: Run CD revision tests on untouched pre-state
        run: |
          python -m py_compile tests/test_bwc_wg8_first_analysis_revision_cd.py
          python -m unittest -v tests.test_bwc_wg8_first_analysis_revision_cd
      - name: Prove governed data remains untouched
        run: |
          git diff --exit-code c186835d9d6b36620177badfff604f309ceb35d4..HEAD -- data/canonical data/sources data/monitor data/changes data/live_intelligence data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
          git diff --exit-code -- data/canonical data/sources data/monitor data/changes data/live_intelligence data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
          git diff --check -- tests/test_bwc_wg8_first_analysis_revision_cd.py
          echo CD_FINAL_REPAIR_GOVERNED_BYTE_CLEAN
      - name: Commit final test repair
        run: |
          git config user.name 'WORLD SIGNALS automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_bwc_wg8_first_analysis_revision_cd.py
          git diff --cached --check
          git commit -m 'CD: make first revision test poststate-safe'
          git push origin HEAD:feature/post-cc-pressure-audit-cd
