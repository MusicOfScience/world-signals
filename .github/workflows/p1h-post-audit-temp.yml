name: TEMP P1-H post-transaction audit

on:
  push:
    branches:
      - source-governance-p1h-transaction

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run generic source-governance audit
        run: python scripts/run_source_governance_audit.py
      - name: Independent P1-H assertions
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'src'))
          from world_signals.source_governance_audit import build_source_governance_audit
          from world_signals.validation import validate_registry

          canonical = json.loads((ROOT/'data/canonical/registry.json').read_text())
          sources = json.loads((ROOT/'data/sources/registry.json').read_text())
          expectations = json.loads((ROOT/'data/monitor/expectations.json').read_text())
          by_id = {s['source_id']: s for s in sources['sources']}

          assert canonical['version'] == '0.20'
          assert canonical['record_count'] == 669
          assert len(canonical['records']) == 669
          assert sources['version'] == '1.60'
          assert len(sources['sources']) == 223
          assert expectations['version'] == '0.7'
          assert expectations['automatic_canonical_commit'] is False
          assert expectations['google_calendar_write'] is False

          expected = {
            'WSSRC-COM-001': ('MANUAL_INFORMATIONAL_REFERENCE_ONLY','PROHIBITED_OR_RIGHTS_HOLD','RIGHTS_HELD_MANUAL_ONLY'),
            'WSSRC-MAC-016': ('CLEARED_CURATED_FACTUAL_METADATA','ENDPOINT_REVIEW_REQUIRED','AUTOMATED_PILOT'),
            'WSSRC-CB-011': ('MANUAL_INFORMATIONAL_REFERENCE_ONLY','PROHIBITED_OR_RIGHTS_HOLD','RIGHTS_HELD_MANUAL_ONLY'),
            'WSSRC-REG-006': ('MANUAL_INFORMATIONAL_REFERENCE_ONLY','PROHIBITED_OR_RIGHTS_HOLD','RIGHTS_HELD_MANUAL_ONLY'),
            'WSSRC-REG-010': ('CLEARED_CURATED_FACTUAL_METADATA','ENDPOINT_REVIEW_REQUIRED','MANUAL_AUTHORITATIVE_RECHECK'),
            'WSSRC-INT-001': ('MANUAL_INFORMATIONAL_REFERENCE_ONLY','PROHIBITED_OR_RIGHTS_HOLD','RIGHTS_HELD_MANUAL_ONLY'),
          }
          for sid, values in expected.items():
              row = by_id[sid]
              actual = (row.get('canonical_provenance_use'), row.get('automated_monitoring_use'), row.get('verification_mode'))
              assert actual == values, (sid, actual, values)
              assert row.get('governance_backfill_reviewed_at') == '2026-09-04'

          for held in ('WSSRC-CB-009','WSSRC-EL-BR-001'):
              row = by_id[held]
              for field in ('canonical_provenance_use','automated_monitoring_use','verification_mode'):
                  assert row.get(field) in (None, ''), (held, field, row.get(field))

          inauguration = [r for r in canonical['records'] if r.get('source_id') == 'WSSRC-EL-BR-001' and r.get('election_milestone_type') == 'INAUGURATION_OR_ASSUMPTION']
          assert len(inauguration) == 1
          assert inauguration[0].get('start_local') == '2027-01-05'

          audit = build_source_governance_audit(canonical, sources, expectations)
          totals = audit['totals']
          assert totals['source_count'] == 223
          assert totals['fully_explicit_governance_source_count'] == 55, totals
          assert totals['source_records_with_one_or_more_missing_governance_fields'] == 168, totals
          assert totals['backfill_research_priority_counts'].get('P1_CANONICAL_DEPENDENCY') == 97, totals
          assert totals['backfill_research_priority_counts'].get('P2_REGISTRY_ONLY') == 71, totals
          assert totals['missing_field_counts']['canonical_provenance_use'] == 158, totals
          assert totals['missing_field_counts']['automated_monitoring_use'] == 158, totals
          assert totals['missing_field_counts']['verification_mode'] == 168, totals

          validation = validate_registry(canonical, sources)
          assert not validation.errors, validation.errors
          print(json.dumps({
              'status':'PASS',
              'canonical_version':canonical['version'],
              'canonical_count':canonical['record_count'],
              'source_version':sources['version'],
              'source_count':len(sources['sources']),
              'fully_explicit':totals['fully_explicit_governance_source_count'],
              'missing_any':totals['source_records_with_one_or_more_missing_governance_fields'],
              'p1_queue':totals['backfill_research_priority_counts'].get('P1_CANONICAL_DEPENDENCY'),
              'p2_queue':totals['backfill_research_priority_counts'].get('P2_REGISTRY_ONLY'),
              'brazil_inauguration':'2027-01-05',
              'held_sources_unchanged':True,
              'automatic_canonical_commit':expectations['automatic_canonical_commit'],
              'google_calendar_write':expectations['google_calendar_write'],
          }, indent=2))
          PY
      - name: Validate registry independently
        run: python scripts/validate_registry.py
      - name: Confirm audit is read-only for tracked files
        run: git diff --exit-code
