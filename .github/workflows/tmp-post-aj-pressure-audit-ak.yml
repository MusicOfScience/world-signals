name: WORLD SIGNALS AK post-AJ pressure preflight

on:
  push:
    branches:
      - feature/post-aj-pressure-audit-ak

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AJ ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=53e98457b70aa0dda4da490d5fe3210ce333ecae
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" -ge 1
      - name: Run fail-closed post-AJ pressure audit
        run: python scripts/tmp_post_aj_pressure_audit_ak.py
      - name: Simulate exact-market contract without writes
        run: python scripts/apply_exact_market_measurement_contract_ak.py --check
      - name: Exercise candidate validator against synthetic exact-series fixtures
        run: python -m unittest tests.test_exact_market_measurement_contract_ak -v
      - name: Validate current canonical registry
        run: python scripts/validate_registry.py
      - name: Validate current Analysis layer
        run: python scripts/validate_analysis.py
      - name: Run full repository suite on unchanged production state
        run: python -m unittest discover -s tests -v
      - name: Compile relevant Python
        run: python -m py_compile scripts/tmp_post_aj_pressure_audit_ak.py scripts/audit_analysis_sample_y.py scripts/apply_exact_market_measurement_contract_ak.py src/world_signals/analysis.py tests/test_exact_market_measurement_contract_ak.py
      - name: Check browser JavaScript
        shell: bash
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Build static site from unchanged production state
        run: python scripts/build_site.py
