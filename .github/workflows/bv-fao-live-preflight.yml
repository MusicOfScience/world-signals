name: BV FAO one-shot live preflight

on:
  push:
    branches:
      - feature/post-bu-pressure-audit-bv
    paths:
      - '.github/workflows/bv-fao-live-preflight.yml'

permissions:
  contents: read

jobs:
  live-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and freeze protected layers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test "$(git merge-base HEAD origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test -z "$(git status --porcelain)"
          cat > /tmp/bv-protected-files <<'EOF'
          data/canonical/registry.json
          data/canonical/schema.json
          data/changes/ledger.json
          data/coverage/biosecurity_overlay.json
          data/monitor/operations_policy.json
          data/live_intelligence/schema.json
          data/live_intelligence/observations.json
          data/live_intelligence/evidence_registry.json
          data/analysis/schema.json
          data/analysis/event_reviews.json
          data/analysis/evidence_registry.json
          EOF
          xargs sha256sum < /tmp/bv-protected-files > /tmp/bv-live-protected.before
      - name: Materialise guarded BV post-state in runner only
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BV: '1'
        run: |
          set -euo pipefail
          python scripts/apply_fao_release_calendar_monitor_bv.py
          python scripts/apply_fao_release_calendar_monitor_bv.py --apply
      - name: Execute exactly one robots request and one FAO calendar request
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters.fao_release_calendar import fetch_fao_robots_policy, fetch_fao_release_calendar
          from world_signals.fao_release_monitor import fao_release_calendar_review_candidates

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          expectations=json.loads(Path('data/monitor/expectations.json').read_text())
          routes=[x for x in expectations['adapters'] if x.get('adapter_id')=='FAO_RELEASE_CALENDAR']
          assert len(routes)==1
          config=routes[0]
          assert config['request_budget_per_run']==2
          assert config['robots_requests_per_run']==1
          assert config['calendar_requests_per_run']==1
          assert config['followup_requests_per_run']==0

          allowed,robots_snap=fetch_fao_robots_policy()
          assert allowed is True
          months=sorted({x['slot_month'] for x in config['identity_by_occurrence_id'].values()}, key=lambda x:['October 2026','November 2026','December 2026'].index(x))
          assert months==['October 2026','November 2026','December 2026']
          releases,calendar_snap=fetch_fao_release_calendar(months)
          assert len(releases)==6
          candidates,observations=fao_release_calendar_review_candidates(canonical['records'],releases,config)
          assert candidates==[],candidates
          matches=[x for x in observations if x.get('type')=='FAO_RELEASE_DATE_MATCH_OBSERVATION']
          assert len(matches)==6
          assert all(x.get('event_state_inference')=='NONE' for x in observations)
          assert all(x.get('automatic_commit_allowed') is False for x in observations)
          for key in ('schedule_authority','lifecycle_authority','certainty_authority','canonical_clock_mutation_allowed','automatic_amis_followup_allowed','automatic_faostat_followup_allowed','automatic_pdf_fetch_allowed','automatic_news_followup_allowed','automatic_search_route_discovery_allowed','automatic_commit_allowed'):
              assert config[key] is False,(key,config[key])
          print('ROBOTS_SNAPSHOT',json.dumps(robots_snap.as_dict(),sort_keys=True))
          print('CALENDAR_SNAPSHOT',json.dumps(calendar_snap.as_dict(),sort_keys=True))
          print('LIVE_RELEASES',json.dumps([x.as_dict() for x in releases],sort_keys=True))
          print('LIVE_REVIEW_CANDIDATE_COUNT',len(candidates))
          print('LIVE_EXACT_MATCH_COUNT',len(matches))
          print('REQUEST_COUNT',2)
          print('FOLLOWUP_REQUEST_COUNT',0)
          print('AUTOMATIC_CANONICAL_MUTATION',False)
          PY
      - name: Validate governed post-state and protected freeze
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_fao_release_calendar_bv tests.test_fao_release_calendar_activation_bv -v
          python -m py_compile src/world_signals/adapters/fao_release_calendar.py src/world_signals/fao_release_monitor.py scripts/apply_fao_release_calendar_monitor_bv.py
          xargs sha256sum < /tmp/bv-protected-files > /tmp/bv-live-protected.after
          diff -u /tmp/bv-live-protected.before /tmp/bv-live-protected.after
      - name: Restore and prove byte-clean checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
