name: BD BB descendant population repair

on:
  push:
    branches:
      - feature/post-bc-vietnam-live-bd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply and test BB descendant repair
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "667d0fbcc92f937b0cb609d619b664a2a97e8165"
          test "$(git merge-base HEAD origin/main)" = "667d0fbcc92f937b0cb609d619b664a2a97e8165"
          python scripts/bd_bb_descendant_patch.py
          python -m py_compile scripts/apply_barmm_parliamentary_election_bb.py tests/test_barmm_parliamentary_election_bb.py
          python -m unittest tests.test_barmm_parliamentary_election_bb tests.test_checkpoint_contract_bc tests.test_vietnam_myanmar_live_bd -v
          git diff --exit-code HEAD -- data PROJECT_STATUS.md ROADMAP.md

          python scripts/apply_vietnam_myanmar_live_bd.py --apply
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/validate_checkpoint_contracts.py
          python -m unittest tests.test_barmm_parliamentary_election_bb tests.test_checkpoint_contract_bc tests.test_vietnam_myanmar_live_bd -v

          git reset --hard HEAD
          git clean -fd
          python scripts/bd_bb_descendant_patch.py
          python -m py_compile scripts/apply_barmm_parliamentary_election_bb.py tests/test_barmm_parliamentary_election_bb.py
          python -m unittest tests.test_barmm_parliamentary_election_bb -v

      - name: Commit permanent BB repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/apply_barmm_parliamentary_election_bb.py tests/test_barmm_parliamentary_election_bb.py
          git commit -m "BD: make BB downstream population descendant-safe"

      - name: Cleanup temporary repair tooling
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f scripts/bd_bb_descendant_patch.py .github/workflows/bd-bb-descendant-repair.yml
          git commit -m "BD: remove temporary BB descendant repair tooling"
          git push origin HEAD:feature/post-bc-vietnam-live-bd
