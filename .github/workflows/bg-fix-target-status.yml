name: BG helper target-status repair
on:
  push:
    branches: [feature/post-bf-pressure-audit-bg]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6dee1e5adc6e32aea9bdf9b1aab451d92541a3fd"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "363c5ff249ca8833744f15d74750d9377e8a9002"
          test "$(git merge-base HEAD origin/main)" = "363c5ff249ca8833744f15d74750d9377e8a9002"
      - name: Repair one target-status line and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply_opec_official_confirmation_bg.py')
          text=path.read_text(encoding='utf-8')
          old='return head + historical.split("# WORLD SIGNALS — project status / branch-recovery checkpoint", 1)[1]'
          new='return head + historical'
          assert text.count(old)==1, text.count(old)
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          rm .github/workflows/bg-fix-target-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_opec_official_confirmation_bg.py .github/workflows/bg-fix-target-status.yml
          git commit -m 'BG: repair target-status historical rendering'
          git push origin HEAD:feature/post-bf-pressure-audit-bg
