name: BQ CBN MPC one-shot live preflight

on:
  push:
    branches:
      - feature/post-bp-cbn-mpc-monitor-bq

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and check-only BQ pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          test "$(git merge-base HEAD origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          python scripts/apply_cbn_mpc_monitor_bq.py
          python -m unittest tests.test_cbn_mpc_monitor_bq -v
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bq-live-protected.before
      - name: Materialise BQ post-state in workspace
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BQ=1 python scripts/apply_cbn_mpc_monitor_bq.py --apply
      - name: Audit exact five-file mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py'
          },changed
          PY
      - name: Execute exactly robots plus one CBN MPC calendar request
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters import fetch_cbn_mpc_calendar
          from world_signals.cbn_mpc_monitor import fetch_cbn_robots_policy, cbn_mpc_schedule_review_candidates

          allowed,robots_snap=fetch_cbn_robots_policy(timeout=30)
          assert robots_snap.status==200
          assert allowed
          calendar,calendar_snap=fetch_cbn_mpc_calendar(timeout=30)
          assert calendar_snap.status==200
          assert [row.meeting_number for row in calendar.meetings]==[304,305,306,307,308]
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(row for row in monitor['adapters'] if row['adapter_id']=='CBN_MPC_CALENDAR')
          candidates,observations=cbn_mpc_schedule_review_candidates(canonical['records'],calendar,config)
          assert candidates==[],candidates
          no_change=[row for row in observations if row['type']=='CBN_MPC_MEETING_WINDOW_NO_CHANGE']
          assert {row['meeting_number'] for row in no_change}=={307,308},observations
          assert all(row['event_state_inference']=='NONE' for row in observations)
          assert all(row.get('automatic_commit_allowed') is False for row in observations)
          print({
            'robots_status':robots_snap.status,
            'calendar_status':calendar_snap.status,
            'calendar_content_type':calendar_snap.content_type,
            'calendar_sha256':calendar_snap.body_sha256,
            'meeting_numbers':[row.meeting_number for row in calendar.meetings],
            'review_candidates':len(candidates),
            'observations':len(observations),
            'request_count':2,
            'decision_publication_time_authority':False,
            'lifecycle_authority':False,
            'automatic_commit_allowed':False,
          })
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/cbn_mpc.py src/world_signals/cbn_mpc_monitor.py scripts/apply_cbn_mpc_monitor_bq.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore materialisation byte-clean
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bq-live-protected.after
          diff -u /tmp/bq-live-protected.before /tmp/bq-live-protected.after
          git restore -- data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
