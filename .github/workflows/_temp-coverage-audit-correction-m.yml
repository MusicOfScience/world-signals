name: TEMP Correction M coverage audit

on:
  push:
    branches: [feature/mixed-signal-correction-m]
    paths:
      - data/coverage/MIXED_SIGNAL_CORRECTION_M_COVERAGE.trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Coverage regression tests
        run: python -m unittest tests.test_coverage -v
      - name: Build read-only coverage audit
        run: python scripts/run_coverage_audit.py
      - name: Upload coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: correction-m-coverage-audit-${{ github.run_id }}
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 30
