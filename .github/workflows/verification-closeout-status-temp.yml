name: TEMP verification closeout status updater

on:
  push:
    branches:
      - source-governance-p1-selection-diagnostic

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Update project status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATUS.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Exact next work\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one Exact next work marker, found {text.count(marker)}')
          section = '''## Fresh P1 selection diagnostic — COMPLETE / transaction NOT YET APPLIED

A fresh diagnostic of the **95 remaining P1 canonical-dependent sources** was run after Provenance Scope Repair A rather than mechanically continuing the P1-A…H tranche sequence. Active-horizon ranking alone was rejected because the near-term queue is heavily concentrated in United States, Australian and European macro/fiscal sources and would reproduce geographic bias.

A complete verification-only sweep found exactly **8 P1 sources** for which `verification_mode` is the sole missing modern governance field; all eight have future canonical dependencies. Source-scope review then held out **Vietnam `WSSRC-REG5-001`** because a direct National Assembly source is now materially better scoped than the registered government-news source.

**Verification Closeout A is therefore frozen for seven sources only:** APEC, AIIB, Royal Thai Government, Morocco MEF/legal portal, Parliament of South Africa, Philippines PCO and Kenya Law/National Treasury. Four remain rights-held/manual-only; Philippines and Kenya use manual authoritative recheck while endpoint review remains separate. No monitor route is activated.

The diagnostic also found exactly one present-but-wrong denormalised `canonical_dependency_count`: APEC stores 0 while canonical truth is 1. Eight legacy source records omit the helper field. Architecture decision: canonical-derived count is authoritative; absent legacy helpers are not bulk-filled; if the helper is present it must match canonical truth. APEC 0→1 is included only because APEC is already in this reviewed closeout.

Durable research/plan:

- `data/coverage/SOURCE_GOVERNANCE_VERIFICATION_CLOSEOUT_A_RESEARCH_v0.1.md`
- `data/coverage/SOURCE_GOVERNANCE_VERIFICATION_CLOSEOUT_A_PLAN_v0.1.json`

Ephemeral post-state simulation run **`33907264111`** passed guarded preflight/apply, exact source-registry-only enforcement, registry validation, **244 tests** (1 skipped), Python compilation, browser JavaScript checks and full site build. Simulated target state is source **v1.62 / 224** with canonical still **v0.21 / 669**, ledger **v0.10**, expectations **v0.7**, automatic canonical commit false and Calendar write false. Simulated generic governance audit: **65 fully explicit / 159 missing-any / 88 P1 / 71 P2**, with missing provenance **156**, automation **156**, verification **159**.

**This is preparation only.** Current merged production truth remains source **v1.61 / 224** until a separately reviewed guarded transaction is merged.

'''
          text = text.replace(marker, section + marker)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' PROJECT_STATUS.md > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Commit status checkpoint
        shell: bash
        run: |
          git config user.name world-signals-checkpoint
          git config user.email actions@users.noreply.github.com
          git add PROJECT_STATUS.md
          git diff --cached --name-only | sort > /tmp/staged
          printf '%s\n' PROJECT_STATUS.md > /tmp/expected
          diff -u /tmp/expected /tmp/staged
          git commit -m 'Record fresh P1 selection diagnostic checkpoint'
          git push origin HEAD:source-governance-p1-selection-diagnostic
