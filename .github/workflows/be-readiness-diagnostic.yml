name: BE readiness diagnostic
on:
  push:
    branches: [feature/post-bd-opec-outcome-be]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate OPEC lifecycle completion in readiness only
        run: |
          python - <<'PY'
          import copy,json,sys
          from pathlib import Path
          sys.path.insert(0,'.')
          from src.world_signals.analysis import analysis_population_readiness
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/analysis/schema.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          before=analysis_population_readiness(s,r,c)
          c2=copy.deepcopy(c)
          target=next(x for x in c2['records'] if x['occurrence_id']=='WSO-COM-A-0001')
          target['lifecycle_status']='COMPLETED'
          after=analysis_population_readiness(s,r,c2)
          keys=['eligible_completed_occurrence_count','reviewed_occurrence_count','completed_unreviewed_occurrence_count']
          print('BEFORE',json.dumps({k:before.get(k) for k in keys},sort_keys=True))
          print('AFTER',json.dumps({k:after.get(k) for k in keys},sort_keys=True))
          print('TARGET_IN_ELIGIBLE', 'WSO-COM-A-0001' in set(after.get('eligible_completed_occurrence_ids') or []))
          print('TARGET_IN_UNREVIEWED', 'WSO-COM-A-0001' in set(after.get('completed_unreviewed_occurrence_ids') or []))
          print('TARGET',json.dumps(target,sort_keys=True))
          PY
      - name: Self-remove diagnostic
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/be-readiness-diagnostic.yml
          git commit -m "BE: remove temporary readiness diagnostic"
          git push origin HEAD:feature/post-bd-opec-outcome-be
