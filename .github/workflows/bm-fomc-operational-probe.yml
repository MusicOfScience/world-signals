name: BM FOMC operational probe

on:
  push:
    branches:
      - feature/post-bl-pressure-audit-bm

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and inspect first-party endpoints/history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1edd6ac0b540db60519fdccab5c404d42d8fc442"
          test "$(git merge-base HEAD origin/main)" = "1edd6ac0b540db60519fdccab5c404d42d8fc442"
          python - <<'PY'
          import json,re,urllib.request,urllib.error
          from html.parser import HTMLParser

          UA='WORLD-SIGNALS-research/0.1 (+bounded endpoint review; contact via repository owner)'
          urls={
            'robots':'https://www.federalreserve.gov/robots.txt',
            'fomc_calendar':'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm',
            'sep_calendar':'https://www.federalreserve.gov/newsevents/2026-september.htm',
            'oct_calendar':'https://www.federalreserve.gov/newsevents/2026-october.htm',
            'dec_calendar':'https://www.federalreserve.gov/newsevents/2026-december.htm',
            'monetary_rss':'https://www.federalreserve.gov/feeds/press_monetary.xml',
          }
          out={}
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/rss+xml,application/xml,text/xml,text/plain;q=0.9,*/*;q=0.1'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(1500000)
                      text=body.decode('utf-8','replace')
                      out[key]={
                        'status':r.status,
                        'content_type':r.headers.get('Content-Type'),
                        'bytes_read':len(body),
                        'final_url':r.geturl(),
                        'markers':{
                          'fomc':bool(re.search(r'FOMC|Federal Open Market Committee',text,re.I)),
                          'sep_15_16':bool(re.search(r'September\s+15\s*[-–&]\s*16|September\s+15-16|15-16',text,re.I)),
                          'two_pm':bool(re.search(r'2:00\s*p\.m\.',text,re.I)),
                          'two_thirty':bool(re.search(r'2:30\s*p\.m\.',text,re.I)),
                          'rss':('<rss' in text.lower() or '<feed' in text.lower()),
                          'robots_user_agent':('User-agent:' in text),
                        },
                        'sample':re.sub(r'\s+',' ',text[:800])
                      }
              except urllib.error.HTTPError as e:
                  out[key]={'status':e.code,'error':'HTTPError','content_type':e.headers.get('Content-Type') if e.headers else None}
              except Exception as e:
                  out[key]={'status':None,'error':type(e).__name__,'detail':str(e)[:300]}
          print('BM_FOMC_ENDPOINTS_BEGIN')
          print(json.dumps(out,sort_keys=True))
          print('BM_FOMC_ENDPOINTS_END')
          PY
          echo 'BM_FOMC_HISTORY_BEGIN'
          git log --all --oneline -S'fomc-calendar-rule-0.1' -- . || true
          git log --all --oneline -G'FOMC.*parser|parser.*FOMC|fomccalendars' -- '*.py' || true
          for commit in $(git log --all --format='%H' -S'fomccalendars.htm' -- '*.py' | head -n 10); do
            echo "COMMIT $commit"
            git grep -n -i 'fomc\|fomccalendars' "$commit" -- '*.py' || true
          done
          echo 'BM_FOMC_HISTORY_END'
          git diff --exit-code
