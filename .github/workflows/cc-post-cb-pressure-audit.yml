name: CC post-CB pressure audit

on:
  push:
    branches:
      - feature/post-cb-pressure-audit-cc
    paths:
      - '.github/workflows/cc-post-cb-pressure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact post-CB baseline and governed state
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected='67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed'
          subprocess.run(['git','merge-base','--is-ancestor',expected,'HEAD'], check=True)
          can=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          mon=json.loads(Path('data/monitor/expectations.json').read_text())
          assert can['version']=='0.41' and len(can['records'])==689
          assert src['version']=='2.01' and len(src['sources'])==256
          assert mon['version']=='0.26' and len(mon['adapters'])==24
          assert mon['automatic_canonical_commit'] is False
          assert mon['google_calendar_write'] is False
          print({'base': expected, 'canonical': [can['version'],len(can['records'])], 'sources':[src['version'],len(src['sources'])], 'monitor':[mon['version'],len(mon['adapters'])]})
          PY
      - name: Build read-only monitor coverage audit
        run: python scripts/run_monitor_coverage_audit.py
      - name: Print pressure diagnostics
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          a=json.loads(Path('artifacts/monitor/monitor-coverage-audit.json').read_text())
          can=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          sm={r['source_id']:r for r in src['sources']}
          print('TOTALS', json.dumps(a['totals'], sort_keys=True))
          print('READINESS', json.dumps(a['configured_source_readiness'], sort_keys=True))
          print('PROMPTS', json.dumps(a['diagnostic_prompts'], sort_keys=True))
          print('REGIONS')
          for r in a['by_region']:
              print(json.dumps(r, sort_keys=True))
          print('CATEGORIES')
          for r in a['by_category']:
              print(json.dumps(r, sort_keys=True))
          print('CANDIDATES_WITH_CANONICAL')
          for r in a['candidate_sources_with_canonical_dependencies']:
              print(json.dumps(r, sort_keys=True))
          print('UNBOUND_CANDIDATES')
          for r in a['candidate_sources_without_canonical_dependencies']:
              print(json.dumps(r, sort_keys=True))
          missing=set(a['diagnostic_prompts']['canonical_categories_without_configured_monitor_scope'])
          grouped=defaultdict(lambda: {'count':0,'occurrence_ids':[],'series_ids':set(),'institutions':set(),'regions':set()})
          print('MISSING_DOMAIN_SOURCE_DETAIL')
          for r in can['records']:
              if r.get('category') not in missing: continue
              key=(r.get('category'),r.get('source_id'))
              g=grouped[key]; g['count']+=1; g['occurrence_ids'].append(r.get('occurrence_id'))
              if r.get('series_id'): g['series_ids'].add(r['series_id'])
              if r.get('institution'): g['institutions'].add(r['institution'])
              if r.get('region'): g['regions'].add(r['region'])
          for (category, source_id),g in sorted(grouped.items()):
              s=sm.get(source_id,{})
              row={
                'category':category,'source_id':source_id,'canonical_occurrence_count':g['count'],
                'series_ids':sorted(g['series_ids']),'institutions':sorted(g['institutions']),'regions':sorted(g['regions']),
                'source_institution':s.get('institution'),'jurisdiction':s.get('jurisdiction'),'source_type':s.get('source_type'),
                'endpoint_role':s.get('endpoint_role'),'authoritative_url':s.get('authoritative_url'),
                'machine_readable_available':s.get('machine_readable_available'),
                'monitoring_readiness_status':s.get('monitoring_readiness_status'),
                'automated_monitoring_use':s.get('automated_monitoring_use'),'verification_mode':s.get('verification_mode'),
                'rights_basis':s.get('rights_basis'),'known_limitations':s.get('known_limitations'),
              }
              print(json.dumps(row, sort_keys=True, ensure_ascii=False))
          PY
      - name: Prove governed files unchanged
        run: |
          git diff --exit-code 67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed..HEAD -- data/canonical/registry.json data/sources/registry.json data/monitor/expectations.json data/changes/ledger.json data/live_intelligence data/analysis
      - name: Upload pressure audit
        uses: actions/upload-artifact@v4
        with:
          name: cc-post-cb-pressure-audit-${{ github.run_id }}
          path: artifacts/monitor
          if-no-files-found: error
          retention-days: 90
