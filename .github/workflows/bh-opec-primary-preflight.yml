name: BH OPEC competent-primary preflight
on:
  push:
    branches: [feature/post-bg-pressure-audit-bh]
permissions:
  contents: write
jobs:
  preflight:
    if: "github.event.head_commit.message == 'BH: activate competent-primary preflight'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BG base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "eb0845c791133bb8262692c8ebe38ab362dfeff1"
          test "$(git merge-base HEAD origin/main)" = "eb0845c791133bb8262692c8ebe38ab362dfeff1"
      - name: Snapshot protected governed layers
        shell: bash
        run: |
          sha256sum \
            data/canonical/schema.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/monitor/review_candidate_state_contract.json \
            data/monitor/review_decisions.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json > /tmp/bh-protected.sha
      - name: Read-only BH simulation
        run: python scripts/apply_opec_primary_provenance_bh.py --check-only
      - name: Targeted BH and historical OPEC regressions
        run: python -m unittest tests.test_opec_primary_provenance_bh tests.test_opec_official_confirmation_bg tests.test_opec_fallback_completion_be -v
      - name: Full suite on untouched post-BG descendant
        run: python -m unittest discover -s tests -v
      - name: Materialise ephemeral BH target
        env:
          WORLD_SIGNALS_APPLY_OPEC_PRIMARY_PROVENANCE_BH: YES
        run: python scripts/apply_opec_primary_provenance_bh.py --apply
      - name: Validate ephemeral BH target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_opec_primary_provenance_bh.py --check-only
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/apply_opec_primary_provenance_bh.py tests/test_opec_primary_provenance_bh.py tests/test_opec_official_confirmation_bg.py tests/test_opec_fallback_completion_be.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Prove governed mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/bh-protected.sha
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          ledger=json.loads(Path('data/changes/ledger.json').read_text())
          overlay=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          assert canonical['version']=='0.42' and len(canonical['records'])==689
          assert sources['version']=='1.84' and len(sources['sources'])==246
          assert ledger['version']=='0.28' and len(ledger['changes'])==63
          assert overlay['version']=='0.17' and overlay['canonical_checkpoint']=={'registry_version':'0.42','record_count':689}
          row=[x for x in canonical['records'] if x['occurrence_id']=='WSO-COM-A-0001'][0]
          assert row['lifecycle_status']=='COMPLETED' and row['start_local']=='2026-09-06' and row['start_utc'] is None and row['source_timezone'] is None
          docs=row.get('related_documents',[])
          assert any(x.get('source_id')=='WSSRC-COM-015' for x in docs)
          assert any(x.get('source_id')=='WSSRC-COM-016' and x.get('primary_opec_provenance_state')=='REQUIRED_WHEN_RETRIEVABLE' for x in docs)
          assert any(x.get('source_id')=='WSSRC-COM-001' and x.get('role')=='COMPETENT_OPEC_PRIMARY_OUTCOME_PROVENANCE_RECOVERED' and x.get('primary_opec_provenance_state')=='SATISFIED_COMPETENT_ISSUING_AUTHORITY' for x in docs)
          source={x['source_id']:x for x in sources['sources']}
          assert source['WSSRC-COM-001']['authoritative_url']=='https://www.opec.org/press-releases.html'
          assert source['WSSRC-COM-001']['automated_monitoring_use']=='PROHIBITED_OR_RIGHTS_HOLD'
          assert source['WSSRC-COM-016']['automated_monitoring_use']=='PROHIBITED_OR_RIGHTS_HOLD'
          change=[x for x in ledger['changes'] if x.get('change_id')=='WSCHANGE-b83d9656a008e51a']
          assert len(change)==1 and change[0]['new_values']['primary_opec_provenance_state']=='SATISFIED_COMPETENT_ISSUING_AUTHORITY'
          expected={
            'PROJECT_STATUS.md','ROADMAP.md','data/canonical/registry.json','data/sources/registry.json',
            'data/changes/ledger.json','data/coverage/biosecurity_overlay.json',
            'data/coverage/OPEC_PRIMARY_PROVENANCE_BH_TRANSACTION_AUDIT_v0.1.md'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          print('BH governed mutation boundary: PASS')
          PY
      - name: Restore ephemeral writes and self-remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          rm -f .github/workflows/bh-opec-primary-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/bh-opec-primary-preflight.yml
          if ! git diff --cached --quiet; then
            git commit -m 'BH: remove temporary competent-primary preflight'
            git push origin HEAD:feature/post-bg-pressure-audit-bh
          fi
