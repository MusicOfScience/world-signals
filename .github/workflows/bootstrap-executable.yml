name: Bootstrap WORLD SIGNALS executable

on:
  push:
    branches: [main]
    paths:
      - 'WORLD_SIGNALS_EXECUTABLE_THIN_SLICE_v0.1.zip'
      - '.github/workflows/bootstrap-executable.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack executable thin slice into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          mkdir -p .bootstrap
          unzip -q WORLD_SIGNALS_EXECUTABLE_THIN_SLICE_v0.1.zip -d .bootstrap
          rsync -a --exclude='.github/workflows/' .bootstrap/world-signals-executable-v0.1/ ./
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf .bootstrap
          rm -f WORLD_SIGNALS_EXECUTABLE_THIN_SLICE_v0.1.zip

      - name: Validate before committing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          python scripts/build_site.py
          python scripts/run_monitor_dry.py

      - name: Commit executable repository files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'Bootstrap WORLD SIGNALS executable thin slice v0.1'
          git push origin HEAD:main
