name: WORLD SIGNALS AK exact-market contract transaction

on:
  push:
    branches:
      - feature/post-aj-pressure-audit-ak
    paths:
      - .github/workflows/tmp-exact-market-measurement-contract-ak.yml

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove exact post-AJ base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=53e98457b70aa0dda4da490d5fe3210ce333ecae
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -z "$(git status --porcelain=v1)"

      - name: Prove temporary read-only probes are gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/tmp-exact-market-contract-ak-preflight.yml
          test ! -e .github/workflows/tmp-post-aj-pressure-audit-ak.yml
          test ! -e scripts/tmp_post_aj_pressure_audit_ak.py

      - name: Read-only fail-closed simulation
        run: python scripts/apply_exact_market_measurement_contract_ak.py --check

      - name: Exercise exact-series and rights-provenance fixtures before write
        run: python -m unittest tests.test_exact_market_measurement_contract_ak -v

      - name: Controlled Analysis methodology write
        env:
          WORLD_SIGNALS_APPLY_EXACT_MARKET_CONTRACT_AK: '1'
        run: python scripts/apply_exact_market_measurement_contract_ak.py --write

      - name: Validate canonical registry after write
        run: python scripts/validate_registry.py

      - name: Validate Analysis layer after write
        run: python scripts/validate_analysis.py

      - name: Re-run exact-series contract fixtures against written state
        run: python -m unittest tests.test_exact_market_measurement_contract_ak -v

      - name: Verify historical checkpoints survive live schema evolution
        run: >-
          python -m unittest
          tests.test_formal_standards_analysis_x
          tests.test_nonmarket_institutional_analysis_w
          tests.test_source_native_fiscal_analysis_v
          tests.test_japan_sovereign_financing_analysis_aa
          -v

      - name: Run full repository suite
        run: python -m unittest discover -s tests -v

      - name: Compile repository Python
        run: python -m compileall -q scripts src tests

      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Build static site and verify generated Analysis projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path

          projection = json.loads(Path('docs/data/analysis.json').read_text(encoding='utf-8'))
          assert projection.get('schema_version') == '0.4', projection.get('schema_version')
          assert len(projection.get('reviews', [])) == 14, len(projection.get('reviews', []))
          print('AK_GENERATED_PROJECTION_OK schema=0.4 reviews=14')
          PY

      - name: Prove production exact-series population remains zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          reviews = json.loads(Path('data/analysis/event_reviews.json').read_text(encoding='utf-8'))
          exact = [
              (review.get('analysis_id'), movement.get('movement_id'))
              for review in reviews.get('reviews', [])
              for movement in (review.get('what_moved') or [])
              if movement.get('measurement_precision') == 'EXACT_TIMESTAMP_SERIES'
          ]
          assert exact == [], exact
          print('AK_EXACT_TIMESTAMP_SERIES_ROWS=0')
          PY

      - name: Audit protected datasets and exact write boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=53e98457b70aa0dda4da490d5fe3210ce333ecae
          git diff --exit-code "$BASE" -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
          python - <<'PY'
          import subprocess

          rows = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          changed = {row[3:] for row in rows if row.strip()}
          expected = {
              'data/analysis/schema.json',
              'src/world_signals/analysis.py',
              'data/analysis/EXACT_MARKET_MEASUREMENT_CONTRACT_AK_TRANSACTION_AUDIT_v0.1.md',
          }
          assert changed == expected, {'expected': sorted(expected), 'actual': sorted(changed)}
          print('AK_WORKTREE_MUTATION_BOUNDARY_OK', sorted(changed))
          PY

      - name: Commit reviewed transaction and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WORLD SIGNALS transaction gate'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/analysis/schema.json \
            src/world_signals/analysis.py \
            data/analysis/EXACT_MARKET_MEASUREMENT_CONTRACT_AK_TRANSACTION_AUDIT_v0.1.md
          git rm .github/workflows/tmp-exact-market-measurement-contract-ak.yml
          git diff --cached --check
          git commit -m 'AK: enforce exact market measurement contract'
          git push origin HEAD:feature/post-aj-pressure-audit-ak
