name: CI NHC runtime diagnostic

on:
  push:
    branches:
      - feature/post-ch-nhc-monitor-activation-ci
    paths:
      - '.github/workflows/ci-nhc-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/post-ch-nhc-monitor-activation-ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact merged CH base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "c4f359c2c70f023c32990f20234aaf154dced152"
          test "$(git merge-base HEAD origin/main)" = "c4f359c2c70f023c32990f20234aaf154dced152"
      - name: Build ephemeral poststate
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_CI: 'YES'
          WORLD_SIGNALS_WRITE_DERIVED_STATE: 'YES'
        run: |
          set -euo pipefail
          python scripts/repair_monitor_descendants_ci_tmp.py
          python scripts/apply_nhc_atlantic_season_monitor_ci.py --apply
          python scripts/project_state_snapshot.py --write
      - name: Run full monitor without treating whole-system exit as NHC verdict
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          python scripts/run_live_monitor.py > /tmp/runtime.stdout 2> /tmp/runtime.stderr || rc=$?
          echo "$rc" > /tmp/runtime.rc
          python - <<'PY'
          import json
          from pathlib import Path
          artifact=Path('artifacts/live-monitor.json')
          if artifact.exists():
              report=json.loads(artifact.read_text())
              nhc=[row for row in report.get('source_health',[]) if row.get('adapter_id')=='NHC_ATLANTIC_SEASON']
              diagnostic={
                  'nhc_rows': nhc,
                  'source_health_summary': report.get('source_health_summary'),
                  'canonical_unchanged': report.get('canonical_unchanged'),
                  'review_candidate_count': len(report.get('review_candidates',[])),
                  'observation_count': len(report.get('observations',[])),
              }
          else:
              diagnostic={'error':'artifacts/live-monitor.json missing'}
          diagnostic['process_rc']=int(Path('/tmp/runtime.rc').read_text().strip())
          diagnostic['stderr']=Path('/tmp/runtime.stderr').read_text(errors='replace')[-8000:]
          Path('/tmp/nhc-runtime-diagnostic.json').write_text(json.dumps(diagnostic,indent=2),encoding='utf-8')
          print(json.dumps(diagnostic,indent=2))
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: nhc-runtime-diagnostic
          path: /tmp/nhc-runtime-diagnostic.json
          if-no-files-found: error
