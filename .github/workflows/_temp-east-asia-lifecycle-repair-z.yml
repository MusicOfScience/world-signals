name: Temporary East Asia lifecycle repair Z

on:
  push:
    branches: [feature/east-asia-anchor-z]

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-54 merge base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "0131220f7c919e3a76c98063bab8fda0c504b4fc"
      - name: Fail-closed Z check-only transform
        run: python scripts/apply_east_asia_lifecycle_repair_z.py
      - name: Z-specific tests before apply
        run: python -m unittest tests.test_east_asia_lifecycle_repair_z -v
      - name: Reviewed Z apply
        env:
          WORLD_SIGNALS_APPLY_EAST_ASIA_LIFECYCLE_REPAIR_Z: YES
        run: python scripts/apply_east_asia_lifecycle_repair_z.py --apply
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis against expanded completed population
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: python -m py_compile scripts/apply_east_asia_lifecycle_repair_z.py scripts/probe_east_asia_anchor_z.py scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_analysis.py src/world_signals/analysis.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Prove Z mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'data/canonical/registry.json',
            'data/sources/registry.json',
            'data/changes/ledger.json',
            'data/coverage/biosecurity_overlay.json',
            'data/coverage/EAST_ASIA_LIFECYCLE_REPAIR_Z_TRANSACTION_AUDIT_v0.1.md',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          print('changed after apply:', sorted(changed))
          unexpected=changed-allowed
          missing=allowed-changed
          if unexpected or missing:
              raise SystemExit(f'Z mutation boundary failed: unexpected={sorted(unexpected)} missing={sorted(missing)}')
          PY
      - name: Commit reviewed Z transaction and self-remove workflow
        run: |
          git config user.name world-signals-transaction-bot
          git config user.email world-signals-transaction-bot@users.noreply.github.com
          git add data/canonical/registry.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/coverage/EAST_ASIA_LIFECYCLE_REPAIR_Z_TRANSACTION_AUDIT_v0.1.md
          git rm .github/workflows/_temp-east-asia-lifecycle-repair-z.yml
          git commit -m "Apply East Asia lifecycle repair Z transaction"
          git push origin HEAD:feature/east-asia-anchor-z
