name: TEMP Vietnam source-scope transaction

on:
  push:
    branches:
      - vietnam-source-scope-repair-a-transaction
    paths:
      - .github/workflows/temp-vietnam-source-scope-transaction.yml

permissions:
  contents: write

jobs:
  transact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Guarded read-only preflight
        run: python scripts/apply_vietnam_source_scope_repair_a.py
      - name: Apply frozen reviewed transaction
        env:
          WORLD_SIGNALS_ALLOW_VIETNAM_SOURCE_SCOPE_REPAIR_A_APPLY: YES
        run: python scripts/apply_vietnam_source_scope_repair_a.py --apply
      - name: Enforce exact four-file mutation surface
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/sources/registry.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python compile checks
        run: python -m py_compile scripts/*.py src/world_signals/*.py src/world_signals/adapters/*.py
      - name: Browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/biosecurity.js
          node --check web/history.js
          node --check web/operations.js
      - name: Build site
        run: python scripts/build_site.py
      - name: Commit bounded reviewed transaction
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/sources/registry.json | sort)"
          test "$changed" = "$expected"
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/sources/registry.json
          git commit -m 'Apply Vietnam National Assembly provenance repair'
          git push
