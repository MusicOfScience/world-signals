name: Audit WORLD SIGNALS coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/world_signals/coverage.py'
      - 'src/world_signals/cross_layer_coverage.py'
      - 'scripts/run_coverage_audit.py'
      - 'scripts/run_cross_layer_coverage_audit.py'
      - 'tests/test_coverage.py'
      - 'tests/test_cross_layer_coverage_cj.py'
      - 'data/canonical/registry.json'
      - 'data/sources/registry.json'
      - 'data/monitor/expectations.json'
      - 'data/live_intelligence/observations.json'
      - 'data/analysis/event_reviews.json'
      - 'data/coverage/**'
      - '.github/workflows/coverage-audit.yml'
  pull_request:
    paths:
      - 'src/world_signals/coverage.py'
      - 'src/world_signals/cross_layer_coverage.py'
      - 'scripts/run_coverage_audit.py'
      - 'scripts/run_cross_layer_coverage_audit.py'
      - 'tests/test_coverage.py'
      - 'tests/test_cross_layer_coverage_cj.py'
      - 'data/canonical/registry.json'
      - 'data/sources/registry.json'
      - 'data/monitor/expectations.json'
      - 'data/live_intelligence/observations.json'
      - 'data/analysis/event_reviews.json'
      - 'data/coverage/**'
      - '.github/workflows/coverage-audit.yml'

permissions:
  contents: read

concurrency:
  group: world-signals-coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Coverage regression tests
        run: python -m unittest tests.test_coverage tests.test_cross_layer_coverage_cj -v
      - name: Build canonical/source coverage audit
        run: python scripts/run_coverage_audit.py
      - name: Build cross-layer coverage pressure audit
        run: python scripts/run_cross_layer_coverage_audit.py
      - name: Upload coverage audits
        uses: actions/upload-artifact@v4
        with:
          name: world-signals-coverage-audit-${{ github.run_id }}
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 90
