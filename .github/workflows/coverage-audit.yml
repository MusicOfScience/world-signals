name: Audit WORLD SIGNALS coverage

on:
  # Coverage/pressure generation is part of the ordinary validation runner.
  # Keep this independent workflow only for deliberate manual diagnostics.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-signals-coverage-audit-manual
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Coverage regression tests
        run: python -m unittest tests.test_coverage tests.test_cross_layer_coverage_cj -v
      - name: Build canonical/source coverage audit
        run: python scripts/run_coverage_audit.py
      - name: Build cross-layer coverage pressure audit
        run: python scripts/run_cross_layer_coverage_audit.py
      - name: Upload coverage audits
        uses: actions/upload-artifact@v4
        with:
          name: world-signals-coverage-audit-${{ github.run_id }}
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 30
