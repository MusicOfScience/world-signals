name: TEMP fix source-scope overlay regression
on:
  push:
    paths:
      - '.github/workflows/temp-fix-source-scope-overlay-regression.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p1-balanced-governance-c-prep
      - name: Make older post-lineage overlay assertion future-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_p1_source_scope_lifecycle_b.py')
          text=p.read_text()
          old='''            self.assertEqual(\n                self.overlay["canonical_checkpoint"],\n                {"registry_version": "0.23", "record_count": 669},\n            )'''
          new='''            self.assertEqual(\n                self.overlay["canonical_checkpoint"]["registry_version"],\n                self.canonical["version"],\n            )\n            self.assertEqual(\n                self.overlay["canonical_checkpoint"]["record_count"],\n                len(self.canonical["records"]),\n            )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one hard-coded overlay assertion, found {text.count(old)}')
          p.write_text(text.replace(old,new))
          PY
          git diff --check
      - name: Commit regression correction only
        run: |
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add tests/test_p1_source_scope_lifecycle_b.py
          test "$(git diff --cached --name-only)" = "tests/test_p1_source_scope_lifecycle_b.py"
          git commit -m 'Make source-scope overlay lineage assertion future-safe'
          git push origin HEAD:p1-balanced-governance-c-prep
