name: Preflight WORLD SIGNALS Regional Correction J

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_regional_correction_j.py'
      - 'data/coverage/REGIONAL_CORRECTION_J_PLAN_v0.1.json'
      - '.github/workflows/regional-correction-j-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run Regional Correction J transaction in memory only
        run: python scripts/apply_regional_correction_j.py
      - name: Confirm current canonical source-of-truth remains valid
        run: python scripts/validate_registry.py
