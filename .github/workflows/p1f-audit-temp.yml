name: TEMP P1-F governance audit

on:
  push:
    branches: [source-governance-p1f-research]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run source-governance audit
        run: |
          python scripts/run_source_governance_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/source-governance-audit.json').read_text())
          print('AUDIT_TOTALS')
          print(json.dumps(a['totals'], indent=2, sort_keys=True))
          print('TOP_P1')
          p1=[r for r in a['backfill_research_queue'] if r['research_priority']=='P1_CANONICAL_DEPENDENCY']
          print(json.dumps(p1[:50], indent=2, sort_keys=True))
          PY
      - name: Confirm repository remains clean
        run: git diff --exit-code
