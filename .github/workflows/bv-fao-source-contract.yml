name: BV FAO source-contract inspection

on:
  push:
    branches:
      - feature/post-bu-pressure-audit-bv
    paths:
      - '.github/workflows/bv-fao-source-contract.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect frozen FAO source and Canonical dependency contract
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test "$(git merge-base HEAD origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          python - <<'PY'
          import json
          from pathlib import Path
          sources=json.loads(Path('data/sources/registry.json').read_text())
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          src=[x for x in sources['sources'] if x.get('source_id')=='WSSRC-COM-010']
          assert len(src)==1
          deps=[x for x in canonical['records'] if x.get('source_id')=='WSSRC-COM-010']
          print('SOURCE_OBJECT',json.dumps(src[0],ensure_ascii=False,sort_keys=True))
          print('DEPENDENCY_COUNT',len(deps))
          print('DEPENDENCIES',json.dumps(deps,ensure_ascii=False,sort_keys=True))
          PY
          test -z "$(git status --porcelain)"
