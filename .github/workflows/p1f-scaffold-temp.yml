name: TEMP P1-F scaffold

on:
  push:
    branches: [source-governance-p1f-research]

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Derive P1-F guarded migration from P1-E lifecycle-safe implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('scripts/apply_source_governance_p1e.py').read_text(encoding='utf-8')
          out=src.replace('P1E','P1F').replace('P1-E','P1-F').replace('p1e','p1f')
          Path('scripts/apply_source_governance_p1f.py').write_text(out, encoding='utf-8')
          PY
      - name: Verify only migration script created
        run: |
          test -f scripts/apply_source_governance_p1f.py
          test "$(git status --porcelain --untracked-files=all)" = "?? scripts/apply_source_governance_p1f.py"
      - name: Compile migration
        run: python -m py_compile scripts/apply_source_governance_p1f.py
      - name: Commit migration scaffold
        run: |
          git config user.name "world-signals-governance"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/apply_source_governance_p1f.py
          git commit -m "Add guarded P1-F governance migration"
          git push origin HEAD:source-governance-p1f-research
