name: AZ authoring provenance-count fix

on:
  push:
    branches: [feature/post-ay-first-live-analysis-link-az]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Align deterministic helper with four-row Analysis evidence packet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_japan_fies_live_analysis_az.py')
          text=p.read_text()
          old='- Analysis: **v0.17 / 21 reviews / 94 evidence / 18 reviewed event types**'
          new='- Analysis: **v0.17 / 21 reviews / 95 evidence / 18 reviewed event types**'
          if new not in text:
              if old not in text:
                  raise SystemExit('AZ status-count helper target drift')
              p.write_text(text.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_japan_fies_live_analysis_az.py
          if ! git diff --cached --quiet; then
            git commit -m 'AZ: align status evidence count with provenance packet'
          fi
      - name: Self-remove authoring workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/az-authoring-fix.yml
          git commit -m 'AZ: remove temporary authoring workflow'
          git push origin HEAD:feature/post-ay-first-live-analysis-link-az
