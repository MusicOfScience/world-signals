name: BW Japan CPI production-shaped live preflight

on:
  push:
    branches:
      - feature/post-bv-pressure-audit-bw

permissions:
  contents: read

jobs:
  live-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BV ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git merge-base HEAD origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test -z "$(git status --porcelain)"
      - name: Freeze protected layer hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=[Path('data/canonical/registry.json'),Path('data/changes/ledger.json'),Path('data/biosecurity'),Path('data/live'),Path('data/live_intelligence'),Path('data/analysis')]
          def digest(path):
              h=hashlib.sha256()
              if path.is_file(): h.update(path.read_bytes())
              else:
                  for p in sorted(x for x in path.rglob('*') if x.is_file()):
                      h.update(str(p.relative_to(path)).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          before={str(p):digest(p) for p in paths}
          Path('/tmp/bw-live-protected-before.json').write_text(json.dumps(before,sort_keys=True))
          PY
      - name: Materialise exact governed BW post-state in runner
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BW: '1'
        run: |
          set -euo pipefail
          python scripts/apply_japan_cpi_monitor_bw.py --apply >/tmp/bw-live-apply.json
          cat > /tmp/expected <<'EOF'
          data/monitor/expectations.json
          data/sources/registry.json
          scripts/run_adapter_smoke.py
          scripts/run_live_monitor.py
          src/world_signals/adapters/__init__.py
          EOF
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
      - name: Execute exactly one robots request and one registered CPI schedule request
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters.japan_cpi_schedule import (
              JAPAN_CPI_SCHEDULE_URL,
              fetch_japan_cpi_robots_policy,
              fetch_japan_cpi_schedule,
          )
          from world_signals.japan_cpi_monitor import japan_cpi_schedule_review_candidates

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          expectations=json.loads(Path('data/monitor/expectations.json').read_text())
          configs=[r for r in expectations['adapters'] if r.get('adapter_id')=='JAPAN_CPI_RELEASE_SCHEDULE']
          assert len(configs)==1
          config=configs[0]

          allowed,robots_snapshot=fetch_japan_cpi_robots_policy()
          assert allowed is True
          items,schedule_snapshot=fetch_japan_cpi_schedule()
          candidates,observations=japan_cpi_schedule_review_candidates(canonical['records'],items,config)

          matches=[o for o in observations if o.get('type')=='JAPAN_CPI_RELEASE_DATE_MATCH_OBSERVATION']
          missing=[o for o in observations if o.get('type')=='JAPAN_CPI_RELEASE_CONFIGURED_ROW_ABSENT']
          outside=[o for o in observations if o.get('type')=='JAPAN_CPI_OUTSIDE_CONFIGURED_REFERENCE_PERIOD_OBSERVATION']
          authority=[o for o in observations if o.get('type')=='JAPAN_CPI_SCHEDULE_HAS_NO_CLOCK_LIFECYCLE_CERTAINTY_OR_DIRECT_WRITE_AUTHORITY']

          assert robots_snapshot.status==200
          assert schedule_snapshot.status==200
          assert schedule_snapshot.resolved_url==JAPAN_CPI_SCHEDULE_URL
          assert 'text/html' in schedule_snapshot.content_type.lower()
          assert len(items)>=7
          assert len(matches)==7
          assert len(missing)==0
          assert candidates==[], candidates
          assert len(outside)==1 and outside[0]['outside_configured_reference_period_count']>0
          assert len(authority)==1
          assert authority[0]['clock_rule_is_separate_from_schedule'] is True
          assert authority[0]['schedule_mutation_authority'] is False
          assert authority[0]['canonical_clock_mutation_allowed'] is False
          assert authority[0]['lifecycle_mutation_allowed'] is False
          assert authority[0]['certainty_mutation_allowed'] is False
          assert config['request_budget_per_run']==2
          assert config['robots_requests_per_run']==1
          assert config['schedule_requests_per_run']==1
          assert config['followup_requests_per_run']==0
          for key in ['schedule_mutation_authority','clock_authority','lifecycle_authority','certainty_authority','canonical_clock_mutation_allowed','automatic_tokyo_cpi_followup_allowed','automatic_estat_api_followup_allowed','automatic_data_release_followup_allowed','automatic_pdf_fetch_allowed','automatic_news_followup_allowed','automatic_search_route_discovery_allowed','automatic_commit_allowed']:
              assert config[key] is False,(key,config[key])
          assert expectations['automatic_canonical_commit'] is False
          assert expectations['google_calendar_write'] is False

          result={
              'baseline':'b277939bc6c540d0986f298a832c7d63a29a2d19',
              'request_count':2,
              'robots_request_count':1,
              'schedule_request_count':1,
              'followup_request_count':0,
              'robots_snapshot':robots_snapshot.as_dict(),
              'schedule_snapshot':schedule_snapshot.as_dict(),
              'national_schedule_row_count':len(items),
              'configured_occurrence_count':7,
              'configured_date_match_count':len(matches),
              'review_candidate_count':len(candidates),
              'missing_configured_row_count':len(missing),
              'outside_configured_reference_period_count':outside[0]['outside_configured_reference_period_count'],
              'clock_exposed_by_schedule':False,
              'schedule_mutation_authority':False,
              'clock_authority':False,
              'lifecycle_authority':False,
              'certainty_authority':False,
              'automatic_canonical_commit':False,
              'google_calendar_write':False,
              'repository_write_by_live_request_step':False,
          }
          Path('/tmp/bw-japan-cpi-live-preflight.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git diff --name-only | sort > /tmp/post-live-diff
          diff -u /tmp/expected /tmp/post-live-diff
      - name: Upload live evidence
        uses: actions/upload-artifact@v4
        with:
          name: bw-japan-cpi-live-preflight
          path: /tmp/bw-japan-cpi-live-preflight.json
          if-no-files-found: error
          retention-days: 1
      - name: Run full governed repository gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Prove protected layers unchanged by materialisation and live check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          before=json.loads(Path('/tmp/bw-live-protected-before.json').read_text())
          def digest(path):
              h=hashlib.sha256()
              if path.is_file(): h.update(path.read_bytes())
              else:
                  for p in sorted(x for x in path.rglob('*') if x.is_file()):
                      h.update(str(p.relative_to(path)).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          after={key:digest(Path(key)) for key in before}
          assert after==before,(before,after)
          PY
      - name: Restore materialised files and prove byte-clean branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          git clean -fd artifacts review_candidates site >/dev/null 2>&1 || true
          test -z "$(git status --porcelain)"
