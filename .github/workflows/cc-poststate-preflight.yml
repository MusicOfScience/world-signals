name: CC HMT T+1 poststate preflight

on:
  push:
    branches:
      - feature/post-cb-pressure-audit-cc
    paths:
      - '.github/workflows/cc-poststate-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact CC poststate and ancestry
        run: |
          git merge-base --is-ancestor 67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed HEAD
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed'
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('2.02',257)
          assert (m['version'],len(m['adapters']))==('0.27',25)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          new=[x for x in s['sources'] if x.get('source_id')=='WSSRC-MKT-014']
          assert len(new)==1
          src=new[0]
          assert src['canonical_dependency_count']==0
          assert src['canonical_provenance_use']=='MONITOR_ONLY_NOT_CANONICAL_AUTHORITY'
          assert src['automated_monitoring_use']=='CLEARED'
          assert src['live_adapter_id']=='HMT_T1_CONTENT_API'
          route=[x for x in m['adapters'] if x.get('adapter_id')=='HMT_T1_CONTENT_API']
          assert len(route)==1
          r=route[0]
          assert r['source_id']=='WSSRC-MKT-014'
          assert r['canonical_occurrence_ids']==['WSO-MKT-A-0016']
          assert r['monitor_role']=='CONDITIONAL_LEGISLATIVE_DEPENDENCY_SENTINEL'
          assert r['request_budget_per_run']==1
          for key in (
              'schedule_authority','clock_authority','lifecycle_authority','certainty_authority',
              'condition_state_authority','canonical_datetime_mutation_allowed',
              'automatic_attachment_fetch_allowed','automatic_parent_page_fetch_allowed',
              'automatic_legislation_followup_allowed','automatic_new_occurrence_creation_allowed',
              'automatic_live_or_analysis_promotion_allowed','automatic_commit_allowed'):
              assert r[key] is False, key
          occ=[x for x in c['records'] if x.get('occurrence_id')=='WSO-MKT-A-0016']
          assert len(occ)==1
          o=occ[0]
          expected={
              'source_id':'WSSRC-MKT-012','series_id':'WSER-MKT-UK-T1',
              'category':'CORPORATE_FINANCIAL_MARKET_STRUCTURE','activation_mode':'CONDITIONAL',
              'certainty_status':'PROVISIONAL','condition_state':'PENDING_DEPENDENCY',
              'start_local':'2027-10-11','time_status':'PROVISIONAL',
              'timing_type':'JURISDICTIONAL_CIVIL_DATE'}
          for k,v in expected.items(): assert o.get(k)==v,(k,o.get(k),v)
          print({'base':base,'canonical':[c['version'],len(c['records'])],'sources':[s['version'],len(s['sources'])],'monitor':[m['version'],len(m['adapters'])],'new_source_direct_canonical_dependencies':src['canonical_dependency_count']})
          PY
      - name: Prove all pre-existing source and monitor objects unchanged
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed'
          def old(path):
              return json.loads(subprocess.check_output(['git','show',f'{base}:{path}']))
          old_s=old('data/sources/registry.json'); new_s=json.loads(Path('data/sources/registry.json').read_text())
          old_m=old('data/monitor/expectations.json'); new_m=json.loads(Path('data/monitor/expectations.json').read_text())
          old_sources={x['source_id']:x for x in old_s['sources']}; new_sources={x['source_id']:x for x in new_s['sources']}
          assert set(new_sources)-set(old_sources)=={'WSSRC-MKT-014'}
          assert set(old_sources)-set(new_sources)==set()
          changed=[sid for sid,obj in old_sources.items() if new_sources[sid]!=obj]
          assert changed==[], changed
          old_routes={x['adapter_id']:x for x in old_m['adapters']}; new_routes={x['adapter_id']:x for x in new_m['adapters']}
          assert set(new_routes)-set(old_routes)=={'HMT_T1_CONTENT_API'}
          assert set(old_routes)-set(new_routes)==set()
          changed_routes=[aid for aid,obj in old_routes.items() if new_routes[aid]!=obj]
          assert changed_routes==[], changed_routes
          for k,v in old_m.items():
              if k not in {'version','adapters'}:
                  assert new_m.get(k)==v,(k,new_m.get(k),v)
          print({'unchanged_preexisting_sources':len(old_sources),'unchanged_preexisting_routes':len(old_routes),'new_sources':['WSSRC-MKT-014'],'new_routes':['HMT_T1_CONTENT_API']})
          PY
      - name: Run ordinary repository validation surface
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q scripts src tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Production-shaped one-request HMT live check
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters.hmt_t1_content_api import fetch_hmt_t1_content_api
          from world_signals.hmt_t1_monitor import hmt_t1_dependency_review_candidate
          c=json.loads(Path('data/canonical/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          cfg=next(x for x in m['adapters'] if x.get('adapter_id')=='HMT_T1_CONTENT_API')
          state,snapshot=fetch_hmt_t1_content_api(timeout=30)
          assert snapshot.status==200
          candidate,observation=hmt_t1_dependency_review_candidate(c['records'],state,cfg)
          result={
              'request_count':1,
              'followup_request_count':0,
              'human_page_request_count':0,
              'parent_publication_request_count':0,
              'attachment_request_count':0,
              'legislation_followup_request_count':0,
              'parliament_followup_request_count':0,
              'search_request_count':0,
              'http_status':snapshot.status,
              'content_type':snapshot.content_type,
              'content_id':state.content_id,
              'public_updated_at':state.public_updated_at,
              'withdrawn':state.withdrawn,
              'pending_markers':state.pending_markers,
              'candidate_count':0 if candidate is None else 1,
              'observation_type':observation['type'],
              'automatic_commit_allowed':False,
          }
          if candidate is None:
              assert observation['type']=='HMT_T1_DEPENDENCY_BASELINE_STILL_PENDING_NO_CANONICAL_ACTION'
              assert state.public_updated_at==cfg['baseline_public_updated_at']
              assert all(state.pending_markers.values()) and not state.withdrawn
          else:
              assert candidate['candidate_type']=='HMT_T1_LEGISLATIVE_DEPENDENCY_REVIEW'
              assert candidate['review_state']=='PENDING_AUTHORITATIVE_UK_LEGISLATION_VERIFICATION'
              assert candidate['event_state_inference']=='NONE'
              assert candidate['condition_state_inference']=='NONE'
              assert candidate['canonical_datetime_mutation_allowed'] is False
              assert candidate['automatic_commit_allowed'] is False
              assert observation['legal_completion_inference']=='NONE'
          print('HMT_LIVE_RESULT',json.dumps(result,sort_keys=True))
          PY
      - name: Protected-layer and generated-residue audit
        run: |
          git diff --exit-code 67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed..HEAD -- data/canonical/registry.json data/changes/ledger.json data/live_intelligence data/analysis
          git status --short
          test -z "$(git status --porcelain -- data/canonical data/changes data/live_intelligence data/analysis)"
          python - <<'PY'
          import subprocess
          base='67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed'
          changed=subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD']).decode().splitlines()
          forbidden=[p for p in changed if p.startswith(('artifacts/','site/'))]
          assert forbidden==[], forbidden
          print({'protected_layers':'UNCHANGED','generated_residue':forbidden,'changed_file_count_at_preflight':len(changed)})
          PY
