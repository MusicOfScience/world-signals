name: BF UN Correct Map Live transaction
on:
  push:
    branches: [feature/post-be-pressure-audit-bf]
    paths:
      - '.github/workflows/bf-un-correct-map-transaction.yml'

permissions:
  contents: write

jobs:
  transaction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Controlled BF transaction
        shell: bash
        env:
          BASE_SHA: 629ab595ecccaf86a92bbd8cdfdab4297496b298
          BRANCH_START_SHA: bb04298377658a2fc6fb3b5697f10941fa5be248
          BRANCH_NAME: feature/post-be-pressure-audit-bf
          WORKFLOW_PATH: .github/workflows/bf-un-correct-map-transaction.yml
          AUDIT_PATH: data/live_intelligence/UN_CORRECT_MAP_LIVE_BF_TRANSACTION_AUDIT_v0.1.md
          PYTHONPATH: src
        run: |
          set -euo pipefail

          cleanup_uncommitted_failure() {
            status=$?
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            echo "BF transaction failed before final push; restoring pre-transaction governed state and removing temporary workflow."
            git reset --hard "$GITHUB_SHA"
            git clean -fd
            rm -f "$WORKFLOW_PATH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A "$WORKFLOW_PATH"
            if ! git diff --cached --quiet; then
              git commit -m 'BF: remove failed temporary transaction workflow'
              git push origin HEAD:"$BRANCH_NAME"
            fi
            exit "$status"
          }
          trap cleanup_uncommitted_failure EXIT

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo "== Verify exact transaction boundary =="
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BRANCH_START_SHA"
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"

          for required in \
            data/live_intelligence/POST_BE_PRESSURE_AUDIT_BF_v0.1.md \
            data/live_intelligence/UN_CORRECT_MAP_LIVE_BF_PAYLOAD_v0.1.json \
            data/live_intelligence/UN_CORRECT_MAP_LIVE_BF_PLAN_v0.1.json \
            scripts/apply_un_correct_map_live_bf.py \
            tests/test_un_correct_map_live_bf.py \
            tests/test_vietnam_myanmar_live_bd.py
          do
            test -f "$required"
          done
          test ! -e .github/workflows/bf-un-correct-map-preflight.yml

          echo "== Snapshot protected paths =="
          sha256sum \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json > /tmp/bf-protected.sha

          echo "== Read-only BF check =="
          python scripts/apply_un_correct_map_live_bf.py --check-only

          echo "== Targeted BF + BD descendant regression =="
          python -m unittest tests.test_un_correct_map_live_bf tests.test_vietnam_myanmar_live_bd -v

          echo "== Materialise governed BF target =="
          WORLD_SIGNALS_APPLY_UN_CORRECT_MAP_LIVE_BF=YES \
            python scripts/apply_un_correct_map_live_bf.py --apply

          echo "== Validate committed-target candidate =="
          python scripts/validate_registry.py | tee /tmp/bf-canonical-validator.log
          python scripts/validate_live_intelligence.py | tee /tmp/bf-live-validator.log
          python scripts/validate_analysis.py | tee /tmp/bf-analysis-validator.log

          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/bf-full-suite.log

          python -m py_compile \
            scripts/apply_un_correct_map_live_bf.py \
            tests/test_un_correct_map_live_bf.py \
            tests/test_vietnam_myanmar_live_bd.py
          python -m compileall -q src scripts tests

          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

          python scripts/build_site.py | tee /tmp/bf-build.log

          echo "== Revert generated static outputs outside BF transaction boundary =="
          git checkout -- docs 2>/dev/null || true
          git clean -fd docs 2>/dev/null || true

          echo "== Prove protected paths and exact governed mutation boundary =="
          sha256sum -c /tmp/bf-protected.sha
          python scripts/apply_un_correct_map_live_bf.py --check-only

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from world_signals.live_intelligence import public_live_intelligence_projection

          schema = json.loads(Path("data/live_intelligence/schema.json").read_text())
          observations = json.loads(Path("data/live_intelligence/observations.json").read_text())
          evidence = json.loads(Path("data/live_intelligence/evidence_registry.json").read_text())
          canonical = json.loads(Path("data/canonical/registry.json").read_text())

          assert schema["version"] == "0.6"
          assert schema["population_policy"]["mode"] == "CONTROLLED_INSTITUTIONAL_SPECIMEN"
          assert schema["population_policy"]["maximum_observation_count"] == 6
          assert schema["population_policy"]["maximum_evidence_count"] == 9
          assert schema["population_policy"]["automatic_ingestion_allowed"] is False
          assert schema["population_policy"]["public_observation_projection_allowed"] is False
          assert len(observations["observations"]) == 6
          assert len(evidence["evidence"]) == 9

          row = [x for x in observations["observations"]
                 if x["observation_id"] == "WSLI-INST-UNGA-CORRECTMAP-20260904-001"]
          assert len(row) == 1
          row = row[0]
          assert row["observation_type"] == "INSTITUTIONAL_DEVELOPMENT"
          assert row["verification_state"] == "PRIMARY_CONFIRMED"
          assert row["canonical_links"] == []
          assert row["revision_of_observation_id"] is None
          assert row["event_time"] == {"precision": "CIVIL_DATE", "event_date": "2026-09-04"}

          evidence_ids = {x["evidence_id"] for x in evidence["evidence"]}
          assert {
              "WSEV-LI-UNGA-CORRECTMAP-UN-20260904",
              "WSEV-LI-UNGA-CORRECTMAP-AU-20260904",
          }.issubset(evidence_ids)

          public = public_live_intelligence_projection(schema, evidence, observations, canonical)
          assert public["observations"] == []

          expected = {
              "PROJECT_STATUS.md",
              "ROADMAP.md",
              "data/live_intelligence/schema.json",
              "data/live_intelligence/observations.json",
              "data/live_intelligence/evidence_registry.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert changed == expected, (changed, expected)
          print("BF governed mutation boundary: PASS")
          PY

          FULL_SUITE_RAN="$(grep -E '^Ran [0-9]+ tests?' /tmp/bf-full-suite.log | tail -1 || true)"
          FULL_SUITE_OK="$(grep -E '^OK' /tmp/bf-full-suite.log | tail -1 || true)"
          test -n "$FULL_SUITE_RAN"
          test -n "$FULL_SUITE_OK"
          BUILD_RESULT="$(tail -1 /tmp/bf-build.log)"
          test -n "$BUILD_RESULT"

          cat > "$AUDIT_PATH" <<EOF
          # WORLD SIGNALS — UN Correct Map Live BF transaction audit v0.1

          **Tranche:** BF  
          **Transaction run ID:** \`${GITHUB_RUN_ID}\`  
          **Exact post-BE main base SHA:** \`${BASE_SHA}\`  
          **BF branch transaction-start SHA:** \`${BRANCH_START_SHA}\`  
          **Temporary workflow activation SHA:** \`${GITHUB_SHA}\`  
          **Successful preflight run:** \`34043141267\` — SUCCESS  
          **Transaction materialisation commit:** PENDING_LOCAL_COMMIT  
          **Temporary transaction workflow removal commit:** PENDING_LOCAL_COMMIT

          ## Decision and provenance

          BF implements the reviewed decision in \`POST_BE_PRESSURE_AUDIT_BF_v0.1.md\`: add exactly one sixth controlled Live Intelligence specimen, an \`INSTITUTIONAL_DEVELOPMENT\`, without Canonical, Source Registry, Change Ledger, monitor or Analysis mutation.

          Primary provenance remains:
          - United Nations General Assembly meeting coverage: \`https://press.un.org/en/2026/ga12779.doc.htm\`;
          - African Union Commission communiqué: \`https://au.int/en/pressreleases/20260904/communique-auc-chairperson-adoption-correct-map-resolution\`.

          The institutional record is resolution \`A/RES/80/307\`, adopted on **4 September 2026** at civil-date precision, by recorded vote **164 in favour, 1 against, 6 abstentions**.

          The UN source is authoritative for the General Assembly adoption and vote. The African Union source is contextual/source-confirmation evidence for the Africa-led initiative and Togo/African Group role; it is not promoted to authority for the UN vote count.

          ## Epistemic boundary

          BF records the institutional adoption only. It does **not** claim that the resolution:
          - imposes one compulsory world map;
          - changes borders, territorial status or sovereignty;
          - establishes an economic, political or market consequence;
          - proves downstream implementation outcomes.

          No event clock time or publication clock time was invented. Event and publication timing remain at \`CIVIL_DATE\` precision for 4 September 2026.

          ## Materialised target

          - Live Intelligence schema: **v0.6**
          - population policy: **CONTROLLED_INSTITUTIONAL_SPECIMEN**
          - observations: **6**
          - evidence rows: **9**
          - maximum observations: **6**
          - maximum evidence rows: **9**
          - public Live observations: **0**
          - automatic ingestion: **CLOSED**
          - automatic Canonical commit: **CLOSED**
          - Google Calendar writes: **CLOSED**

          New observation:
          - \`WSLI-INST-UNGA-CORRECTMAP-20260904-001\`

          New evidence:
          - \`WSEV-LI-UNGA-CORRECTMAP-UN-20260904\`
          - \`WSEV-LI-UNGA-CORRECTMAP-AU-20260904\`

          ## Mutation proof

          The governed BF transaction changed exactly:
          - \`data/live_intelligence/schema.json\`
          - \`data/live_intelligence/observations.json\`
          - \`data/live_intelligence/evidence_registry.json\`
          - \`PROJECT_STATUS.md\`
          - \`ROADMAP.md\`

          The following protected paths remained byte-identical to the transaction-start state:
          - \`data/canonical/registry.json\`
          - \`data/canonical/schema.json\`
          - \`data/sources/registry.json\`
          - \`data/changes/ledger.json\`
          - \`data/coverage/biosecurity_overlay.json\`
          - \`data/monitor/expectations.json\`
          - \`data/monitor/operations_policy.json\`
          - \`data/analysis/schema.json\`
          - \`data/analysis/event_reviews.json\`
          - \`data/analysis/evidence_registry.json\`

          Generated static-site output was treated as validation output and reverted/cleaned before the mutation-boundary proof.

          ## Validation

          - Canonical validator: PASS
          - Live Intelligence validator: PASS
          - Analysis validator: PASS
          - Full suite: \`${FULL_SUITE_RAN}; ${FULL_SUITE_OK}\`
          - Python compile checks: PASS
          - JavaScript syntax checks: PASS
          - Static build: PASS — \`${BUILD_RESULT}\`
          - Protected-path SHA-256 verification: PASS
          - BF governed mutation-boundary proof: PASS
          - public Live observation projection: **0 / CLOSED**

          ## Transaction disposition

          The successful BF materialisation is permanent on this branch and is not reset after validation. The temporary transaction workflow is self-removed before the final branch head is pushed. BF remains **manual-merge only**. No auto-merge is authorised or performed.
          EOF

          git add \
            PROJECT_STATUS.md \
            ROADMAP.md \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            "$AUDIT_PATH"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "6"
          git commit -m 'BF: materialise UN Correct Map Live institutional specimen'
          TX_COMMIT="$(git rev-parse HEAD)"

          rm -f "$WORKFLOW_PATH"
          git add -A "$WORKFLOW_PATH"
          git commit -m 'BF: remove temporary controlled transaction workflow'
          WORKFLOW_REMOVAL_COMMIT="$(git rev-parse HEAD)"

          python - "$AUDIT_PATH" "$TX_COMMIT" "$WORKFLOW_REMOVAL_COMMIT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          tx = sys.argv[2]
          removal = sys.argv[3]
          text = path.read_text(encoding="utf-8")
          text = text.replace("**Transaction materialisation commit:** PENDING_LOCAL_COMMIT",
                              f"**Transaction materialisation commit:** `{tx}`")
          text = text.replace("**Temporary transaction workflow removal commit:** PENDING_LOCAL_COMMIT",
                              f"**Temporary transaction workflow removal commit:** `{removal}`")
          text = text.replace(
              "The temporary transaction workflow is self-removed before the final branch head is pushed.",
              f"The temporary transaction workflow was removed in commit `{removal}` before the final branch head was pushed."
          )
          path.write_text(text, encoding="utf-8")
          PY

          grep -q "$TX_COMMIT" "$AUDIT_PATH"
          grep -q "$WORKFLOW_REMOVAL_COMMIT" "$AUDIT_PATH"
          test ! -e "$WORKFLOW_PATH"

          git add "$AUDIT_PATH"
          git commit -m 'BF: finalise transaction audit with commit identities'
          FINAL_SHA="$(git rev-parse HEAD)"

          echo "== Final local transaction-state audit before push =="
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          test ! -e "$WORKFLOW_PATH"
          git diff --exit-code origin/main -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json

          git status --short
          test -z "$(git status --porcelain)"

          git push origin HEAD:"$BRANCH_NAME"

          trap - EXIT
          echo "BF_TRANSACTION_RUN_ID=$GITHUB_RUN_ID"
          echo "BF_TRANSACTION_COMMIT=$TX_COMMIT"
          echo "BF_WORKFLOW_REMOVAL_COMMIT=$WORKFLOW_REMOVAL_COMMIT"
          echo "BF_FINAL_AUDIT_COMMIT=$FINAL_SHA"
