name: BP Federal Reserve monetary RSS one-shot live preflight

on:
  push:
    branches:
      - feature/post-bo-fed-monetary-rss-monitor-bp

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and check-only BP pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          test "$(git merge-base HEAD origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          python scripts/apply_fed_monetary_rss_monitor_bp.py
          python -m unittest tests.test_fed_monetary_rss_monitor_bp -v
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bp-live-protected.before
      - name: Materialise BP post-state in workspace
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BP=1 python scripts/apply_fed_monetary_rss_monitor_bp.py --apply
      - name: Audit exact five-file mutation boundary and source split
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          }
          assert changed==expected,(changed,expected)
          pre_sources=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'],text=True))
          post_sources=json.loads(Path('data/sources/registry.json').read_text())
          pre_monitor=json.loads(subprocess.check_output(['git','show','HEAD:data/monitor/expectations.json'],text=True))
          post_monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (pre_sources['version'],len(pre_sources['sources']))==('1.88',247)
          assert (post_sources['version'],len(post_sources['sources']))==('1.89',248)
          assert (pre_monitor['version'],len(pre_monitor['adapters']))==('0.13',11)
          assert (post_monitor['version'],len(post_monitor['adapters']))==('0.14',12)
          pre_by={r['source_id']:r for r in pre_sources['sources']}
          post_by={r['source_id']:r for r in post_sources['sources']}
          assert post_by['WSSRC-CB-001']==pre_by['WSSRC-CB-001']
          assert post_by['WSSRC-CB-015']['canonical_dependency_count']==0
          assert post_monitor['adapters'][:11]==pre_monitor['adapters']
          route=post_monitor['adapters'][11]
          assert route['adapter_id']=='FED_MONETARY_POLICY_RSS'
          assert len(route['canonical_occurrence_ids'])==22
          assert route['request_budget_per_run']==1
          assert route['schedule_authority'] is False
          assert route['lifecycle_authority'] is False
          assert route['certainty_authority'] is False
          assert route['automatic_commit_allowed'] is False
          assert post_monitor['automatic_canonical_commit'] is False
          assert post_monitor['google_calendar_write'] is False
          PY
      - name: Execute exactly one live Monetary Policy RSS request and comparator
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters.fed_monetary_rss import fetch_fed_monetary_policy_rss
          from world_signals.fed_monetary_monitor import fed_monetary_rss_review_candidates

          items,snapshot=fetch_fed_monetary_policy_rss(timeout=30)
          assert snapshot.status==200
          assert items
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(row for row in monitor['adapters'] if row['adapter_id']=='FED_MONETARY_POLICY_RSS')
          candidates,observations=fed_monetary_rss_review_candidates(canonical['records'],items,config)
          assert observations
          assert all(item.get('event_state_inference')=='NONE' for item in observations)
          assert all(item.get('automatic_commit_allowed') is False for item in observations if 'automatic_commit_allowed' in item)
          assert all(candidate.get('candidate_type')=='FED_FOMC_PUBLICATION_EVIDENCE_AVAILABLE' for candidate in candidates)
          assert all(candidate.get('review_state')=='PENDING_AUTHORITATIVE_FOMC_PUBLICATION_REVIEW' for candidate in candidates)
          assert all(candidate.get('event_state_inference')=='NONE' for candidate in candidates)
          assert all(candidate.get('automatic_commit_allowed') is False for candidate in candidates)
          assert all(candidate.get('completion_requires_review') is True for candidate in candidates)
          print({
            'rss_status':snapshot.status,
            'rss_content_type':snapshot.content_type,
            'rss_sha256':snapshot.sha256,
            'feed_items':len(items),
            'review_candidates':len(candidates),
            'observations':len(observations),
            'request_count':1,
            'schedule_authority':False,
            'lifecycle_authority':False,
            'automatic_commit_allowed':False,
          })
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/fed_monetary_rss.py src/world_signals/fed_monetary_monitor.py scripts/apply_fed_monetary_rss_monitor_bp.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore materialisation byte-clean
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bp-live-protected.after
          diff -u /tmp/bp-live-protected.before /tmp/bp-live-protected.after
          git restore -- data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
