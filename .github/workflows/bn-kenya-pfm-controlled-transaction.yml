name: BN Kenya PFM controlled readiness transaction

on:
  push:
    branches:
      - feature/post-bm-kenya-pfm-readiness-bn

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and unchanged governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9b79c93cde36a2e261a134b1259e02ca18096210"
          test "$(git merge-base HEAD origin/main)" = "9b79c93cde36a2e261a134b1259e02ca18096210"
          python scripts/apply_kenya_pfm_readiness_bn.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records'])) == ('0.41',689)
          assert (s['version'],len(s['sources'])) == ('1.86',247)
          assert (m['version'],len(m['adapters'])) == ('0.12',10)
          src=next(x for x in s['sources'] if x['source_id']=='WSSRC-REG6-001')
          assert src['verification_mode']=='MANUAL_AUTHORITATIVE_RECHECK'
          assert src['monitoring_readiness_status']=='ENDPOINT_TEST_PRIORITY'
          assert src['monitoring_activation_status']=='MANUAL_LEGAL_RULE_RECHECK_NO_AUTO_COMMIT'
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['automated_retrieval_permission']=='ENDPOINT_OPERATIONAL_REVIEW_REQUIRED'
          assert not any(x.get('source_id')=='WSSRC-REG6-001' for x in m['adapters'])
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          PY
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/monitor/expectations.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bn-protected.before
      - name: Apply bounded Kenya source readiness transform
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BN=1 python scripts/apply_kenya_pfm_readiness_bn.py --apply
      - name: Audit semantic narrowness and post-state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          pre=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'], text=True))
          post=json.loads(Path('data/sources/registry.json').read_text())
          assert (pre['version'],len(pre['sources'])) == ('1.86',247)
          assert (post['version'],len(post['sources'])) == ('1.87',247)
          pre_by={x['source_id']:x for x in pre['sources']}
          post_by={x['source_id']:x for x in post['sources']}
          assert set(pre_by)==set(post_by)
          changed=[sid for sid in pre_by if pre_by[sid] != post_by[sid]]
          assert changed == ['WSSRC-REG6-001'], changed
          src=post_by['WSSRC-REG6-001']
          assert src['runtime_health_state']=='LIVE_GITHUB_ACTIONS_FETCH_PARSE_PASS_2026_09_08'
          assert src['monitoring_readiness_status']=='PILOT_ADAPTER_LIVE_VALIDATED_PERMISSION_HOLD'
          assert src['monitoring_activation_status']=='ENDPOINT_PERMISSION_HOLD_NO_PRODUCTION_ROUTE'
          assert src['verification_mode']=='AUTOMATED_PILOT'
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['automated_retrieval_permission']=='ENDPOINT_OPERATIONAL_REVIEW_REQUIRED'
          ev=src['live_validation_evidence']
          assert ev['historical_github_actions_current_route_status_2026_09_03']==403
          assert ev['baseline_2025_11_04_http_status']==200
          assert ev['current_unversioned_http_status']==200
          assert ev['baseline_rule_sha256']==ev['current_rule_sha256']=='3121afc21199d121650558d896055e91ab24a6ff01c62a27dfc797baeaaab50c'
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          deps=[x for x in canonical['records'] if x.get('source_id')=='WSSRC-REG6-001' or 'WSSRC-REG6-001' in (x.get('source_ids') or [])]
          assert len(deps)==1
          assert deps[0]['occurrence_id']=='WSO-REG-I-0001'
          assert deps[0]['series_id']=='WSER-REG6-KE-BPS'
          assert deps[0]['category']=='FISCAL_SOVEREIGN_FINANCE'
          assert deps[0]['region']=='Africa'
          assert deps[0]['time_precision']=='DAY'
          assert deps[0]['lifecycle_status']=='PLANNED'
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (monitor['version'],len(monitor['adapters'])) == ('0.12',10)
          assert not any(x.get('source_id')=='WSSRC-REG6-001' for x in monitor['adapters'])
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False
          PY
      - name: Exercise official current and frozen Kenya Law surfaces
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from world_signals.adapters.kenya_law import fetch_kenya_budget_policy_rule_baseline, fetch_kenya_budget_policy_rule_current
          baseline,bs=fetch_kenya_budget_policy_rule_baseline(timeout=30)
          current,cs=fetch_kenya_budget_policy_rule_current(timeout=30)
          assert bs.status == cs.status == 200
          assert baseline.section == current.section == '25(2)'
          assert (baseline.deadline_month,baseline.deadline_day)==(2,15)
          assert (current.deadline_month,current.deadline_day)==(2,15)
          assert baseline.rule_sha256 == current.rule_sha256 == '3121afc21199d121650558d896055e91ab24a6ff01c62a27dfc797baeaaab50c'
          print({'baseline_status':bs.status,'current_status':cs.status,'rule_sha256':current.rule_sha256})
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_kenya_law_adapter tests.test_kenya_pfm_readiness_bn -v
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/kenya_law.py scripts/apply_kenya_pfm_readiness_bn.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers stayed byte-identical
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/monitor/expectations.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bn-protected.after
          diff -u /tmp/bn-protected.before /tmp/bn-protected.after
      - name: Audit exact working-tree mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from subprocess import check_output
          unstaged=set(check_output(['git','diff','--name-only'], text=True).splitlines())
          staged=set(check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          untracked=set(check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          changed=unstaged|staged|untracked
          assert changed == {'data/sources/registry.json'}, (changed, unstaged, staged, untracked)
          PY
      - name: Self-remove workflow and commit only approved transaction files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git rm .github/workflows/bn-kenya-pfm-controlled-transaction.yml
          python - <<'PY'
          from subprocess import check_output
          allowed={'data/sources/registry.json','.github/workflows/bn-kenya-pfm-controlled-transaction.yml'}
          unstaged=set(check_output(['git','diff','--name-only'], text=True).splitlines())
          staged=set(check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          untracked=set(check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          changed=unstaged|staged|untracked
          assert changed == allowed, (changed, unstaged, staged, untracked)
          PY
          git add data/sources/registry.json
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/bn-kenya-pfm-controlled-transaction.yml data/sources/registry.json "
          git commit -m "BN: materialise Kenya PFM readiness truth repair"
          git push origin HEAD:feature/post-bm-kenya-pfm-readiness-bn
