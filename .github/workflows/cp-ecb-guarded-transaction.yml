name: CP guarded ECB transaction

on:
  push:
    branches:
      - 'feature/post-co-ecb-monetary-outcome-cp'
    paths:
      - '.github/workflows/cp-ecb-guarded-transaction.yml'

permissions:
  contents: write

concurrency:
  group: cp-ecb-guarded-transaction
  cancel-in-progress: false

jobs:
  guarded-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact branch and base before any write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/post-co-ecb-monetary-outcome-cp
          test "$(git rev-parse origin/main)" = "e1f5c97c183381f7d29bf6957aecd87cacaa96a0"
          test "$(git merge-base HEAD origin/main)" = "e1f5c97c183381f7d29bf6957aecd87cacaa96a0"
          test "$(git rev-parse HEAD^)" = "3633107504c6da849a39438c969a9940751d2a88"
          test "$(git rev-parse origin/feature/post-co-ecb-monetary-outcome-cp)" = "$GITHUB_SHA"

      - name: Freeze protected hashes and exact pre-CP governed rows
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            OPEC_QUARANTINE.md \
            tests/test_opec_quarantine_cf.py \
            > /tmp/cp-protected.sha256
          cp data/canonical/registry.json /tmp/cp-canonical-before.json
          cp data/changes/ledger.json /tmp/cp-ledger-before.json
          cp data/coverage/biosecurity_overlay.json /tmp/cp-overlay-before.json
          cp data/live_intelligence/observations.json /tmp/cp-observations-before.json
          cp data/live_intelligence/evidence_registry.json /tmp/cp-evidence-before.json

      - name: Pure CP simulation before write
        run: python scripts/apply_ecb_monetary_outcome_cp.py

      - name: Focused CP contracts before write
        run: |
          python -m unittest tests.test_ecb_monetary_outcome_cp tests.test_ecb_monetary_outcome_cp_readiness -v
          python -m py_compile scripts/apply_ecb_monetary_outcome_cp.py src/world_signals/ecb_monetary_outcome_cp.py

      - name: Prove simulation was read-only
        run: git diff --exit-code

      - name: Materialise reviewed CP target ephemerally
        env:
          WORLD_SIGNALS_APPLY_ECB_CP: REVIEWED_APPLY
        run: python scripts/apply_ecb_monetary_outcome_cp.py --apply

      - name: Refresh mechanically derived recovery state
        env:
          WORLD_SIGNALS_WRITE_DERIVED_STATE: 'YES'
        run: python scripts/project_state_snapshot.py --write

      - name: Verify materialised CP target
        run: python scripts/apply_ecb_monetary_outcome_cp.py --verify-materialized

      - name: Validate governed layers and derived state
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/project_state_snapshot.py --check

      - name: Complete historical unittest suite
        run: python -m unittest discover -s tests -v

      - name: Python compilation
        run: |
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/project_state_snapshot.py \
            scripts/run_cross_layer_coverage_audit.py \
            scripts/apply_analysis_revision_contract_ba.py \
            scripts/apply_ecb_monetary_outcome_cp.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/analysis_revision.py \
            src/world_signals/analysis_revision_projection.py \
            src/world_signals/live_analysis_bridge.py \
            src/world_signals/cross_layer_coverage.py \
            src/world_signals/ecb_monetary_outcome_cp.py

      - name: JavaScript syntax checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Static build
        run: python scripts/build_site.py

      - name: Prove protected layers and pre-CP rows are preserved
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/cp-protected.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          before_c = load('/tmp/cp-canonical-before.json')
          after_c = load('data/canonical/registry.json')
          before_l = load('/tmp/cp-ledger-before.json')
          after_l = load('data/changes/ledger.json')
          before_o = load('/tmp/cp-overlay-before.json')
          after_o = load('data/coverage/biosecurity_overlay.json')
          before_obs = load('/tmp/cp-observations-before.json')
          after_obs = load('data/live_intelligence/observations.json')
          before_ev = load('/tmp/cp-evidence-before.json')
          after_ev = load('data/live_intelligence/evidence_registry.json')

          target = 'WSO-ad4d0618a65059f2'
          allowed_target = {'lifecycle_status','last_successful_assertion_id','status_history','last_verified_at','related_documents','notes'}
          bmap = {r['occurrence_id']: r for r in before_c['records']}
          amap = {r['occurrence_id']: r for r in after_c['records']}
          assert bmap.keys() == amap.keys()
          for oid in bmap:
              if oid != target:
                  assert bmap[oid] == amap[oid], oid
          changed = {k for k in set(bmap[target]) | set(amap[target]) if bmap[target].get(k) != amap[target].get(k)}
          assert changed == allowed_target, changed
          assert bmap[target]['start_local'] == amap[target]['start_local'] == '2026-09-10T14:15:00'
          assert bmap[target]['source_timezone'] == amap[target]['source_timezone'] == 'Europe/Berlin'
          assert bmap[target]['start_utc'] == amap[target]['start_utc'] == '2026-09-10T12:15:00Z'
          assert amap[target]['lifecycle_status'] == 'COMPLETED'

          assert after_l['changes'][:-1] == before_l['changes']
          assert len(after_l['changes']) == len(before_l['changes']) + 1
          assert after_l['changes'][-1]['change_id'] == 'WSCHANGE-e94c7fb7c8d8bd02'
          assert isinstance(after_l['changes'][-1].get('committed_at'), str) and after_l['changes'][-1]['committed_at']

          bsem = {k:v for k,v in before_o.items() if k not in {'version','canonical_checkpoint'}}
          asem = {k:v for k,v in after_o.items() if k not in {'version','canonical_checkpoint'}}
          assert bsem == asem
          assert after_o['canonical_checkpoint'] == {'registry_version':'0.43','record_count':689}

          assert after_obs['observations'][:-1] == before_obs['observations']
          assert len(after_obs['observations']) == len(before_obs['observations']) + 1
          assert after_obs['observations'][-1]['observation_id'] == 'WSLI-MON-ECB-RATES-20260910-001'
          assert after_obs['observations'][-1]['canonical_links'] == [{'occurrence_id':target,'relationship':'OUTCOME_OF'}]

          assert after_ev['evidence'][:-1] == before_ev['evidence']
          assert len(after_ev['evidence']) == len(before_ev['evidence']) + 1
          assert after_ev['evidence'][-1]['evidence_id'] == 'WSEV-LI-ECB-MP-20260910'

          assert after_c['version'] == '0.43' and len(after_c['records']) == 689
          assert after_l['version'] == '0.29' and len(after_l['changes']) == 64
          assert after_obs['version'] == '0.12' and len(after_obs['observations']) == 11
          assert after_ev['version'] == '0.12' and len(after_ev['evidence']) == 15
          print('CP preservation and bounded population proof: PASS')
          PY

      - name: Recheck remote base and branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/post-co-ecb-monetary-outcome-cp
          test "$(git rev-parse origin/main)" = "e1f5c97c183381f7d29bf6957aecd87cacaa96a0"
          test "$(git merge-base HEAD origin/main)" = "e1f5c97c183381f7d29bf6957aecd87cacaa96a0"
          test "$(git rev-parse origin/feature/post-co-ecb-monetary-outcome-cp)" = "$GITHUB_SHA"

      - name: Remove temporary Python writer and prove bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_ecb_monetary_outcome_cp.py
          python - <<'PY'
          import subprocess
          allowed = {
              'README.md',
              'PROJECT_STATUS.md',
              'ROADMAP.md',
              'data/status/current_state.json',
              'data/canonical/registry.json',
              'data/changes/ledger.json',
              'data/coverage/biosecurity_overlay.json',
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'scripts/apply_ecb_monetary_outcome_cp.py',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          required = {
              'data/canonical/registry.json',
              'data/changes/ledger.json',
              'data/coverage/biosecurity_overlay.json',
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'scripts/apply_ecb_monetary_outcome_cp.py',
          }
          extra = changed - allowed
          missing = required - changed
          assert not extra, f'unexpected CP transaction paths: {sorted(extra)}'
          assert not missing, f'missing required CP transaction paths: {sorted(missing)}'
          print('Bounded working diff:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit and push only after every gate passed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WORLD SIGNALS guarded transaction'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'CP: materialise bounded ECB monetary-policy outcome'
          git push origin HEAD:feature/post-co-ecb-monetary-outcome-cp
          echo "CP_MATERIALISATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload transaction summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cp-ecb-guarded-transaction-summary
          path: |
            data/live_intelligence/ECB_MONETARY_OUTCOME_CP_PRODUCTION_PLAN_v0.1.json
            data/live_intelligence/ECB_MONETARY_OUTCOME_CP_PAYLOAD_v0.1.json
          if-no-files-found: error
