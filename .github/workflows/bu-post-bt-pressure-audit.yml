name: BU post-BT pressure audit

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Build current monitor coverage audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_monitor_coverage_audit.py
      - name: Print pressure frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/monitor/monitor-coverage-audit.json').read_text())
          print('TOTALS', json.dumps(a['totals'], sort_keys=True))
          print('REGIONS')
          for r in a['by_region']:
              print(json.dumps(r, sort_keys=True))
          print('ZERO_REGION_PROMPTS', json.dumps(a['diagnostic_prompts']['canonical_regions_without_configured_monitor_scope']))
          print('ZERO_CATEGORY_PROMPTS', json.dumps(a['diagnostic_prompts']['canonical_categories_without_configured_monitor_scope']))
          print('CANDIDATES_WITH_DEPENDENCIES')
          for c in a['candidate_sources_with_canonical_dependencies']:
              print(json.dumps(c, sort_keys=True))
          print('CANDIDATES_WITHOUT_DEPENDENCIES_COUNT', len(a['candidate_sources_without_canonical_dependencies']))
          PY
      - name: Prove read-only workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
