name: TEMP P1-G status refresh

on:
  push:
    branches: [source-governance-p1g-research]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh project checkpoint after P1-F
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('PROJECT_STATUS.md')
          s=p.read_text(encoding='utf-8')
          replacements={
            '**Tier-1 source registry:** v1.57 — **223 sources**.':'**Tier-1 source registry:** v1.58 — **223 sources**.',
            'stale relative to current v0.20 / v1.57.':'stale relative to current v0.20 / v1.58.',
            '**115 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.':'**109 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'status anchor not found: {old}')
              s=s.replace(old,new,1)
          pattern=re.compile(
              r'P1-F research is frozen for Statistics Bureau of Japan CPI, ABS Labour Force, CME E-mini S&P 500 expiry rules, IEA Oil Market Report schedule, ChinaMoney/NIFC LPR rules and Nigeria INEC — \*\*29 canonical dependencies\*\*\. Japan CPI and ABS retain bounded automated-pilot verification; CME, IEA OMR and ChinaMoney are explicit rights-held/manual negative controls; INEC remains manual-authoritative because its detailed revision endpoint is operationally fragile\.\n\n'
              r'Brazil TSE and Swiss National Bank remain excluded for provenance-scope repair\. SNB\'s registered decisions/history URL still does not directly support the forward assessment schedule; Brazil\'s `2027-01-05` inauguration remains constitutionally grounded rather than an electoral-calendar date\.\n\n'
              r'Durable P1-E audit: `data/coverage/SOURCE_GOVERNANCE_P1E_BACKFILL_AUDIT_v0\.1\.md`\.\n'
              r'P1-F research/plan: `data/coverage/SOURCE_GOVERNANCE_P1F_RESEARCH_v0\.1\.md` and `data/coverage/SOURCE_GOVERNANCE_P1F_BACKFILL_PLAN_v0\.1\.json`\.'
          )
          new='''### P1-F mixed-rights / cross-domain tranche — COMPLETE\n\nP1-F backfilled Statistics Bureau of Japan CPI, ABS Labour Force, CME E-mini S&P 500 expiry rules, IEA Oil Market Report schedule, ChinaMoney/NIFC LPR rules and Nigeria INEC — **29 canonical dependencies**. Source registry advanced **v1.57 → v1.58 / 223**; canonical remains **v0.20 / 669** and monitor expectations **v0.7**.\n\nGuarded transaction run `33871313942` passed preflight, exact one-file enforcement, registry validation, full unit suite, Python compilation, browser JavaScript checks and site build. PR #15 merged as `21665ddce58cf9c7c7e868727ad4c2e19e6dce62`. Independent post-P1-F audit run `33872209871` measured:\n\n- **43** fully explicit governance sources;\n- **180** sources still missing at least one governance field;\n- **0 P0** configured-monitor dependencies;\n- **109 P1** canonical dependencies;\n- **71 P2** registry-only sources;\n- missing `canonical_provenance_use`: **170**;\n- missing `automated_monitoring_use`: **170**;\n- missing `verification_mode`: **180**.\n\nP1-G research is frozen for Statistics Bureau of Japan Labour Force Survey, ASX SPI 200 expiry rules, Bank of Canada / Department of Finance Canada bond auctions, JODI Oil + Gas World Database updates, WTO reform checkpoints and State Bank of Pakistan FY27 MPC dates — **28 canonical dependencies**. Japan and Canada retain bounded automated-pilot verification; WTO remains manual-authoritative with endpoint review; ASX, JODI and SBP remain explicit rights-held/manual controls.\n\nBrazil TSE and Swiss National Bank remain excluded for provenance-scope repair. SNB's registered decisions/history URL still does not directly support the forward assessment schedule; Brazil's `2027-01-05` inauguration remains constitutionally grounded rather than an electoral-calendar date.\n\nDurable P1-F audit: `data/coverage/SOURCE_GOVERNANCE_P1F_BACKFILL_AUDIT_v0.1.md`.\nP1-G research/plan: `data/coverage/SOURCE_GOVERNANCE_P1G_RESEARCH_v0.1.md` and `data/coverage/SOURCE_GOVERNANCE_P1G_BACKFILL_PLAN_v0.1.json`.'''
          s,count=pattern.subn(new,s,count=1)
          if count != 1:
              raise SystemExit(f'P1-F block replacement count {count}')
          old_next='**Source-governance P1-F transaction gate** — review/merge the frozen P1-F infrastructure, reconcile merged source v1.57 and run the guarded read-only preflight before any registry-only v1.58 transaction; Brazil TSE and SNB remain excluded pending source-scope repair.'
          new_next='**Source-governance P1-G transaction gate** — review/merge the frozen P1-G infrastructure, reconcile merged source v1.58 and run the guarded read-only preflight before any registry-only v1.59 transaction; Brazil TSE and SNB remain excluded pending source-scope repair.'
          if old_next not in s:
              raise SystemExit('next-work P1-F anchor not found')
          s=s.replace(old_next,new_next,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify status-only diff
        run: test "$(git diff --name-only)" = "PROJECT_STATUS.md"
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit status refresh
        run: |
          git config user.name "world-signals-status"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Refresh checkpoint after P1-F"
          git push origin HEAD:source-governance-p1g-research
