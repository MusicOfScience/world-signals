name: Preflight WORLD SIGNALS Physical Risk Correction L

on:
  push:
    branches: [main]
    paths:
      - 'data/coverage/PHYSICAL_RISK_CORRECTION_L_PLAN_v0.1.json'
      - 'scripts/check_physical_risk_correction_l.py'
      - 'tests/test_physical_risk_correction_l.py'
      - '.github/workflows/preflight-physical-risk-correction-l.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and validate proposed Correction L clone in memory
        run: PYTHONPATH=. python scripts/check_physical_risk_correction_l.py
      - name: Run Correction L regression tests
        run: python -m unittest tests.test_physical_risk_correction_l -v
      - name: Run temporal-window regression tests
        run: python -m unittest tests.test_temporal_windows -v
      - name: Validate current canonical checkpoint
        run: python scripts/validate_registry.py
      - name: Prove preflight is read only
        run: git diff --exit-code
