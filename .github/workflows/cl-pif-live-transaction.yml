name: CL PIF Live guarded transaction

on:
  push:
    branches:
      - feature/post-ck-pif-live-outcome-cl
    paths:
      - data/live_intelligence/PIF_PARTNER_FRAMEWORK_LIVE_CL_PLAN_v0.1.json
      - data/live_intelligence/PIF_PARTNER_FRAMEWORK_LIVE_CL_PAYLOAD_v0.1.json
      - data/live_intelligence/PIF_PARTNER_FRAMEWORK_LIVE_CL_RESEARCH_v0.1.md
      - scripts/apply_pif_partner_framework_live_cl.py
      - scripts/repair_cl_cg_descendant_tmp.py
      - tests/test_pif_partner_framework_live_cl.py
      - .github/workflows/cl-pif-live-transaction.yml

permissions:
  contents: write

jobs:
  transact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CL branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact post-CK base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=aef4642863438e2170ae9a49160b7368c850b819
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test "$(git rev-parse --abbrev-ref HEAD)" = "feature/post-ck-pif-live-outcome-cl"

      - name: Verify CL plan boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('data/live_intelligence/PIF_PARTNER_FRAMEWORK_LIVE_CL_PLAN_v0.1.json').read_text())
          assert plan['base_main_sha'] == 'aef4642863438e2170ae9a49160b7368c850b819'
          assert plan['target']['canonical_occurrence_id'] == 'WSO-INT-A-0001'
          assert plan['target']['canonical_relationship'] == 'OUTCOME_OF'
          assert plan['evidence_decision']['excluded_after_fresh_preflight'][0]['decision'] == 'EXCLUDE_FROM_CL_LIVE_PAYLOAD'
          assert all(value is False for value in plan['authority_gates'].values())
          print('CL_PLAN_BOUNDARY_VALID')
          PY

      - name: Simulate CL transaction
        run: python scripts/apply_pif_partner_framework_live_cl.py --check --observed-at-utc 2026-09-10T04:00:00Z

      - name: Run focused CL contract tests before write
        run: python -m unittest discover -s tests -p 'test_pif_partner_framework_live_cl.py' -v

      - name: Apply historical descendant-safe repairs ephemerally
        run: python scripts/repair_cl_cg_descendant_tmp.py

      - name: Compile CL and repaired CG helpers
        run: python -m py_compile scripts/apply_pif_partner_framework_live_cl.py scripts/apply_barmm_pre_election_live_cg.py

      - name: Materialise reviewed CL Live transaction
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_PIF_PARTNER_FRAMEWORK_LIVE_CL: REVIEWED_APPLY
        run: |
          set -euo pipefail
          OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/apply_pif_partner_framework_live_cl.py --apply --observed-at-utc "$OBSERVED_AT"
          printf 'CL observed_at_utc=%s\n' "$OBSERVED_AT"

      - name: Refresh mechanically derived recovery state
        env:
          WORLD_SIGNALS_WRITE_DERIVED_STATE: YES
        run: python scripts/project_state_snapshot.py --write

      - name: Validate Canonical Registry
        run: python scripts/validate_registry.py

      - name: Validate Live Intelligence
        run: python scripts/validate_live_intelligence.py

      - name: Validate Analysis
        run: python scripts/validate_analysis.py

      - name: Verify derived-state consistency
        run: python scripts/project_state_snapshot.py --check

      - name: Run complete historical suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python transaction and validation paths
        run: |
          python -m py_compile \
            scripts/apply_pif_partner_framework_live_cl.py \
            scripts/apply_barmm_pre_election_live_cg.py \
            scripts/project_state_snapshot.py \
            scripts/validate_registry.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Build static site
        run: python scripts/build_site.py

      - name: Enforce bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          allowed=$(cat <<'EOF'
          PROJECT_STATUS.md
          README.md
          ROADMAP.md
          data/live_intelligence/evidence_registry.json
          data/live_intelligence/observations.json
          data/live_intelligence/schema.json
          data/status/current_state.json
          scripts/apply_barmm_pre_election_live_cg.py
          tests/test_barmm_pre_election_live_cg.py
          tests/test_cross_layer_coverage_cj.py
          tests/test_un_correct_map_live_bf.py
          tests/test_vietnam_myanmar_live_bd.py
          EOF
          )
          actual="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' "$allowed" | sed 's/^          //' | sed '/^$/d' | sort)"
          printf 'CL generated diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --exit-code HEAD -- \
            OPEC_QUARANTINE.md \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            tests/test_opec_quarantine_cf.py

      - name: Commit reviewed CL materialisation and descendant repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "world-signals-cl-transaction"
          git config user.email "actions@users.noreply.github.com"
          git add \
            PROJECT_STATUS.md README.md ROADMAP.md \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/status/current_state.json \
            scripts/apply_barmm_pre_election_live_cg.py \
            tests/test_barmm_pre_election_live_cg.py \
            tests/test_cross_layer_coverage_cj.py \
            tests/test_un_correct_map_live_bf.py \
            tests/test_vietnam_myanmar_live_bd.py
          git diff --cached --quiet && { echo 'Expected CL materialisation diff is empty'; exit 1; }
          git commit -m "CL: materialise PIF Live outcome and preserve lineage"
          git push origin HEAD:feature/post-ck-pif-live-outcome-cl
