name: BE source-contract diagnostic
on:
  push:
    branches: [feature/post-bd-opec-outcome-be]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect source identities and completion-source shapes
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=json.loads(Path('data/sources/registry.json').read_text())
          rows=s['sources']
          print('SOURCE_VERSION',s.get('version'),'COUNT',len(rows))
          com=sorted(x.get('source_id') for x in rows if str(x.get('source_id','')).startswith('WSSRC-COM-'))
          print('COM_IDS',json.dumps(com))
          for sid in ['WSSRC-COM-001','WSSRC-MAC-029','WSSRC-FIS-028','WSSRC-EL-PH-001']:
              row=next((x for x in rows if x.get('source_id')==sid),None)
              print('\nSOURCE',sid)
              print(json.dumps(row,indent=2,sort_keys=True))
          patterns=set()
          for x in rows:
              sid=x.get('source_id')
              if sid:
                  patterns.add(sid)
          candidates=['WSSRC-COM-REUTERS-OPEC-20260906','WSSRC-COM-014','WSSRC-COM-020','WSSRC-COM-024','WSSRC-COM-025']
          for c in candidates:
              print('CANDIDATE_ID',c,'COLLIDES',c in patterns)
          # Search repository validators/tests for hard source-id regexes.
          for p in list(Path('src').rglob('*.py'))+list(Path('scripts').rglob('*.py'))+list(Path('tests').rglob('*.py')):
              text=p.read_text(errors='ignore')
              if 'WSSRC-' in text and ('regex' in text.lower() or 're.compile' in text or 'source_id' in text):
                  for i,line in enumerate(text.splitlines(),1):
                      if ('source_id' in line or 'WSSRC-' in line) and ('re.' in line or 'match' in line.lower() or 'startswith' in line or 'pattern' in line.lower()):
                          print('POSSIBLE_ID_RULE',p,i,line.strip())
          PY
      - name: Self-remove diagnostic
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/be-source-contract-diagnostic.yml
          git commit -m "BE: remove temporary source-contract diagnostic"
          git push origin HEAD:feature/post-bd-opec-outcome-be
