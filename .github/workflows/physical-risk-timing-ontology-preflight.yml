name: Preflight WORLD SIGNALS physical-risk timing ontology

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_physical_risk_timing_ontology.py'
      - 'src/world_signals/temporal.py'
      - 'src/world_signals/validation.py'
      - 'src/world_signals/projection.py'
      - 'tests/test_temporal_windows.py'
      - '.github/workflows/physical-risk-timing-ontology-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-signals-physical-risk-timing-ontology-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run schema migration in memory only
        run: PYTHONPATH=. python scripts/apply_physical_risk_timing_ontology.py
      - name: Run seasonal timing tests
        run: python -m unittest tests.test_temporal_windows -v
      - name: Validate current canonical registry remains unchanged
        run: python scripts/validate_registry.py
      - name: Prove preflight is read only
        shell: bash
        run: |
          git diff --exit-code
          python - <<'PY'
          import json
          from pathlib import Path
          schema=json.loads(Path('data/canonical/schema.json').read_text())
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          assert schema['version']=='0.49'
          assert reg['version']=='0.19'
          assert reg['record_count']==668
          print('Physical-risk timing ontology preflight left source-of-truth untouched: PASS')
          PY
