name: BS BSP RSS controlled transaction

on:
  push:
    branches:
      - feature/post-br-pressure-audit-bs

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and clean transaction pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          test "$(git merge-base HEAD origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          python scripts/apply_bsp_monetary_rss_monitor_bs.py
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bs-protected.before
      - name: Materialise bounded BS governed post-state
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BS=1 python scripts/apply_bsp_monetary_rss_monitor_bs.py --apply
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          }
          assert changed==expected,(changed,expected)

          sources=json.loads(Path('data/sources/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          assert (sources['version'],len(sources['sources']))==('1.92',250)
          assert (monitor['version'],len(monitor['adapters']))==('0.17',15)
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False
          route=[x for x in monitor['adapters'] if x['adapter_id']=='BSP_MONETARY_POLICY_RSS']
          assert len(route)==1
          route=route[0]
          assert route['source_id']=='WSSRC-REGJ-006'
          assert set(route['canonical_occurrence_ids'])=={'WSO-REG-J-0008','WSO-REG-J-0009'}
          assert route['request_budget_per_run']==1
          assert route['schedule_authority'] is False
          assert route['lifecycle_authority'] is False
          assert route['certainty_authority'] is False
          assert route['rss_publication_time_is_event_time'] is False
          assert route['canonical_clock_mutation_allowed'] is False
          assert route['automatic_schedule_html_fetch_allowed'] is False
          assert route['automatic_commit_allowed'] is False
          machine=[x for x in sources['sources'] if x['source_id']=='WSSRC-REGJ-006']
          assert len(machine)==1
          schedule=[x for x in sources['sources'] if x['source_id']=='WSSRC-REGJ-003']
          assert len(schedule)==1
          assert schedule[0]['canonical_dependency_count']==2
          assert schedule[0]['authoritative_url'] != machine[0]['authoritative_url']
          PY
      - name: Validate repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            src/world_signals/adapters/bsp_rss.py \
            src/world_signals/bsp_monetary_monitor.py \
            scripts/apply_bsp_monetary_rss_monitor_bs.py \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bs-protected.after
          diff -u /tmp/bs-protected.before /tmp/bs-protected.after
      - name: Self-remove transaction workflow and audit staged mutation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bs-bsp-rss-transaction.yml
          git add \
            data/sources/registry.json \
            data/monitor/expectations.json \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py \
            src/world_signals/adapters/__init__.py
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            '.github/workflows/bs-bsp-rss-transaction.yml',
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          }
          assert staged==expected,(staged,expected)
          unstaged=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert not unstaged,unstaged
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          assert not untracked,untracked
          PY
      - name: Commit and push governed BS transaction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          test "$(git merge-base HEAD origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          git config user.name "world-signals-governed-transaction"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "BS: activate BSP monetary-policy RSS monitor"
          git push origin HEAD:feature/post-br-pressure-audit-bs
