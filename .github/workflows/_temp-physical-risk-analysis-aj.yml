name: TEMP AJ physical-risk analysis transaction

on:
  push:
    branches:
      - feature/physical-risk-analysis-aj

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-64 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "c85db2ec3a675a749acb8201705fb6f1f85de27d"
      - name: Reproduce post-AI pressure audit
        run: python scripts/audit_post_ai_pressure_aj.py
      - name: Fail-closed AJ check-only transform
        run: python scripts/apply_australian_tropical_cyclone_season_analysis_aj.py
      - name: AJ tests before write
        run: python -m unittest tests.test_australian_tropical_cyclone_season_analysis_aj -v
      - name: Apply reviewed AJ transaction
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_AJ: REVIEWED_APPLY
        run: python scripts/apply_australian_tropical_cyclone_season_analysis_aj.py --apply
      - name: Validate canonical remains sound
        run: python scripts/validate_registry.py
      - name: Validate Analysis post-state
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_australian_tropical_cyclone_season_analysis_aj.py \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_analysis.py \
            src/world_signals/analysis.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Exact AJ production mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'data/analysis/event_reviews.json',
              'data/analysis/evidence_registry.json',
              'data/analysis/AUSTRALIAN_TROPICAL_CYCLONE_SEASON_ANALYSIS_AJ_TRANSACTION_AUDIT_v0.1.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'AJ mutation boundary drift: expected {sorted(expected)}, got {sorted(paths)}')
          print('AJ_MUTATION_BOUNDARY_OK')
          PY
      - name: Commit reviewed transaction and self-remove temporary audit files
        run: |
          rm .github/workflows/_temp-physical-risk-analysis-aj.yml
          rm scripts/audit_post_ai_pressure_aj.py
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            data/analysis/AUSTRALIAN_TROPICAL_CYCLONE_SEASON_ANALYSIS_AJ_TRANSACTION_AUDIT_v0.1.md \
            .github/workflows/_temp-physical-risk-analysis-aj.yml \
            scripts/audit_post_ai_pressure_aj.py
          git commit -m "Apply Australian tropical cyclone season Analysis AJ"
          git push origin HEAD:feature/physical-risk-analysis-aj
