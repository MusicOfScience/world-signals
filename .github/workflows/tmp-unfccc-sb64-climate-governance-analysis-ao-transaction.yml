name: WORLD SIGNALS AO SB64 climate governance analysis transaction

on:
  push:
    branches:
      - feature/post-an-pressure-audit-ao
    paths:
      - .github/workflows/tmp-unfccc-sb64-climate-governance-analysis-ao-transaction.yml

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove exact post-69 base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=35bcb5616e99c7fce58f82cfc14bfed901929f3a
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -z "$(git status --porcelain=v1)"

      - name: Prove read-only preflight workflow is gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/tmp-unfccc-sb64-climate-governance-analysis-ao-preflight.yml

      - name: Read-only fail-closed AO simulation
        run: python scripts/apply_unfccc_sb64_climate_governance_analysis_ao.py --check

      - name: Run AO regressions before write
        run: python -m unittest tests.test_unfccc_sb64_climate_governance_analysis_ao -v

      - name: Prove repaired AN descendant checkpoint before write
        run: python -m unittest tests.test_south_korea_local_election_analysis_an -v

      - name: Controlled Analysis write
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_AO: '1'
        run: python scripts/apply_unfccc_sb64_climate_governance_analysis_ao.py --write

      - name: Validate canonical registry after write
        run: python scripts/validate_registry.py

      - name: Validate Analysis layer after write
        run: python scripts/validate_analysis.py

      - name: Re-run AO regressions against written state
        run: python -m unittest tests.test_unfccc_sb64_climate_governance_analysis_ao -v

      - name: Re-prove AN descendant checkpoint against AO state
        run: python -m unittest tests.test_south_korea_local_election_analysis_an -v

      - name: Run full repository suite
        run: python -m unittest discover -s tests -v

      - name: Compile repository Python
        run: python -m compileall -q scripts src tests

      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Build static site and verify AO Analysis projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path

          projection = json.loads(Path('docs/data/analysis.json').read_text(encoding='utf-8'))
          metadata = projection.get('metadata') or {}
          assert metadata.get('schema_version') == '0.4', metadata
          assert metadata.get('review_count') == 17, metadata
          target = next(
              (row for row in projection.get('reviews', []) if row.get('analysis_id') == 'WSAN-CLIM-UNFCCC-SB64-202606-001'),
              None,
          )
          assert target is not None
          assert target.get('what_moved') == [], target.get('what_moved')
          assert (target.get('what_surprised') or {}).get('status') == 'NOT_ESTABLISHED'
          assert (target.get('what_appears_connected') or {}).get('interaction_type') == 'LEGAL_OR_OPERATIONAL_DEPENDENCY'
          assert (target.get('what_appears_connected') or {}).get('causal_status') == 'NOT_A_CAUSAL_CLAIM'
          assert (target.get('second_order_effects') or {}).get('status') == 'OBSERVED'
          canonical = target.get('canonical') or {}
          assert canonical.get('event_type') == 'ENVIRONMENTAL_GOVERNANCE_EVENT', canonical
          assert canonical.get('start_local') == '2026-06-08', canonical
          assert canonical.get('end_local') == '2026-06-18', canonical
          assert canonical.get('source_timezone') == 'Europe/Berlin', canonical
          assert canonical.get('start_utc') is None, canonical
          assert canonical.get('end_utc') is None, canonical
          print('AO_PUBLIC_ANALYSIS_PROJECTION_OK')
          PY

      - name: Prove production exact-series population remains zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reviews = json.loads(Path('data/analysis/event_reviews.json').read_text(encoding='utf-8'))
          exact = [
              (review.get('analysis_id'), movement.get('movement_id'))
              for review in reviews.get('reviews', [])
              for movement in (review.get('what_moved') or [])
              if movement.get('measurement_precision') == 'EXACT_TIMESTAMP_SERIES'
          ]
          assert exact == [], exact
          print('AO_EXACT_TIMESTAMP_SERIES_ROWS=0')
          PY

      - name: Audit protected datasets and exact write boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=35bcb5616e99c7fce58f82cfc14bfed901929f3a
          git diff --exit-code "$BASE" -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json
          python - <<'PY'
          import subprocess
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          changed = {row[3:] for row in rows if row.strip()}
          expected = {
              'data/analysis/event_reviews.json',
              'data/analysis/evidence_registry.json',
              'data/analysis/UNFCCC_SB64_CLIMATE_GOVERNANCE_ANALYSIS_AO_TRANSACTION_AUDIT_v0.1.md',
          }
          assert changed == expected, {'expected': sorted(expected), 'actual': sorted(changed)}
          print('AO_WORKTREE_MUTATION_BOUNDARY_OK', sorted(changed))
          PY

      - name: Commit reviewed transaction and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WORLD SIGNALS transaction gate'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            data/analysis/UNFCCC_SB64_CLIMATE_GOVERNANCE_ANALYSIS_AO_TRANSACTION_AUDIT_v0.1.md
          git rm .github/workflows/tmp-unfccc-sb64-climate-governance-analysis-ao-transaction.yml
          git diff --cached --check
          git commit -m 'AO: add UNFCCC SB64 climate-governance analysis specimen'
          git push origin HEAD:feature/post-an-pressure-audit-ao
