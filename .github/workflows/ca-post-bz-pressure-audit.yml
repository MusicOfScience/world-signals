name: CA post-BZ source-aware pressure audit

on:
  push:
    branches:
      - feature/post-bz-pressure-audit-ca
    paths:
      - .github/workflows/ca-post-bz-pressure-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BZ base and measure current pressure
        shell: bash
        run: |
          set -euo pipefail
          BASE=07c558c8811795f0aed40e73bd386cc70344191e
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import json,re
          from collections import Counter,defaultdict
          from datetime import date
          from pathlib import Path

          REF=date(2026,9,9)
          C=json.loads(Path('data/canonical/registry.json').read_text())
          S=json.loads(Path('data/sources/registry.json').read_text())
          M=json.loads(Path('data/monitor/expectations.json').read_text())
          records=C['records']; sources=S['sources']; adapters=M['adapters']

          print('BASELINE',json.dumps({
              'canonical_version':C['version'],'canonical_count':len(records),
              'sources_version':S['version'],'sources_count':len(sources),
              'monitor_version':M['version'],'monitor_count':len(adapters),
              'automatic_canonical_commit':M.get('automatic_canonical_commit'),
              'google_calendar_write':M.get('google_calendar_write')},sort_keys=True))

          def gregorian_start(row):
              s=row.get('start_local')
              if isinstance(s,str) and re.match(r'^\d{4}-\d{2}-\d{2}',s):
                  try: return date.fromisoformat(s[:10])
                  except ValueError: return None
              return None

          forward=[r for r in records if r.get('lifecycle')!='COMPLETED' and (gregorian_start(r) is None or gregorian_start(r)>=REF)]
          forward_dated=[r for r in forward if gregorian_start(r) is not None]
          print('FORWARD_COUNTS',json.dumps({'all_noncompleted_or_unresolved':len(forward),'gregorian_dated':len(forward_dated)},sort_keys=True))

          def all_strings(obj):
              if isinstance(obj,str):
                  yield obj
              elif isinstance(obj,dict):
                  for v in obj.values(): yield from all_strings(v)
              elif isinstance(obj,list):
                  for v in obj: yield from all_strings(v)

          monitored_occ=set()
          for a in adapters:
              for s in all_strings(a):
                  if re.fullmatch(r'WSO-[A-Z0-9-]+',s): monitored_occ.add(s)
          forward_ids={r['occurrence_id'] for r in forward}
          monitored_forward=forward_ids & monitored_occ
          print('MONITORED_FORWARD',json.dumps({'configured_occurrence_refs_total':len(monitored_occ),'forward_monitored':len(monitored_forward),'forward_total':len(forward_ids),'share':round(len(monitored_forward)/len(forward_ids),4) if forward_ids else 0},sort_keys=True))

          def print_dim(label,key):
              total=Counter(str(r.get(key) or 'UNSET') for r in forward)
              mon=Counter(str(r.get(key) or 'UNSET') for r in forward if r['occurrence_id'] in monitored_forward)
              rows=[]
              for k,n in total.most_common():
                  rows.append({'value':k,'forward':n,'monitored':mon[k],'share':round(mon[k]/n,3) if n else 0})
              print(label,json.dumps(rows,sort_keys=True,ensure_ascii=False))
          print_dim('BY_CATEGORY','category')
          print_dim('BY_REGION','region')
          print_dim('BY_EVENT_TYPE','event_type')

          source_by_id={s['source_id']:s for s in sources}
          deps=defaultdict(list)
          for r in records:
              sid=r.get('source_id')
              if sid: deps[sid].append(r)
          route_source_ids={a.get('source_id') for a in adapters if a.get('source_id')}
          route_canonical_ids={a.get('canonical_schedule_source_id') for a in adapters if a.get('canonical_schedule_source_id')}
          route_related=route_source_ids|route_canonical_ids

          candidate_rows=[]
          for sid,rs in deps.items():
              src=source_by_id.get(sid)
              if not src or sid in route_related: continue
              f=[r for r in rs if r['occurrence_id'] in forward_ids]
              if not f: continue
              candidate_rows.append({
                  'source_id':sid,
                  'institution':src.get('institution') or src.get('publisher') or src.get('name'),
                  'jurisdiction':src.get('jurisdiction'),
                  'canonical_dependencies':len(rs),
                  'forward_dependencies':len(f),
                  'categories':sorted({str(r.get('category')) for r in f}),
                  'regions':sorted({str(r.get('region')) for r in f}),
                  'event_types':sorted({str(r.get('event_type')) for r in f}),
                  'licence_review_status':src.get('licence_review_status'),
                  'ingestion_permission':src.get('ingestion_permission'),
                  'redistribution_permission':src.get('redistribution_permission'),
                  'automated_retrieval_permission':src.get('automated_retrieval_permission'),
                  'automated_monitoring_use':src.get('automated_monitoring_use'),
                  'monitoring_readiness_status':src.get('monitoring_readiness_status'),
                  'monitoring_activation_status':src.get('monitoring_activation_status'),
                  'runtime_health_state':src.get('runtime_health_state'),
                  'verification_mode':src.get('verification_mode'),
                  'canonical_provenance_use':src.get('canonical_provenance_use'),
                  'url':src.get('url') or src.get('canonical_url') or src.get('source_url'),
              })
          candidate_rows.sort(key=lambda x:(-x['forward_dependencies'],-x['canonical_dependencies'],x['source_id']))
          print('UNMONITORED_CANONICAL_SOURCES_TOP60',json.dumps(candidate_rows[:60],sort_keys=True,ensure_ascii=False))

          # Event-level pressure: unmonitored forward occurrences with their source governance.
          event_rows=[]
          for r in forward:
              if r['occurrence_id'] in monitored_forward: continue
              src=source_by_id.get(r.get('source_id'),{})
              event_rows.append({
                  'occurrence_id':r['occurrence_id'],'series_id':r.get('series_id'),'name':r.get('name'),
                  'start_local':r.get('start_local'),'timing_type':r.get('timing_type'),'time_precision':r.get('time_precision'),
                  'lifecycle':r.get('lifecycle'),'certainty':r.get('certainty'),'category':r.get('category'),'event_type':r.get('event_type'),
                  'region':r.get('region'),'jurisdiction':r.get('jurisdiction'),'source_id':r.get('source_id'),
                  'automated_retrieval_permission':src.get('automated_retrieval_permission'),
                  'automated_monitoring_use':src.get('automated_monitoring_use'),
                  'monitoring_readiness_status':src.get('monitoring_readiness_status'),
                  'licence_review_status':src.get('licence_review_status'),
              })
          event_rows.sort(key=lambda x:(x.get('start_local') or '9999',x['occurrence_id']))
          print('NEXT_UNMONITORED_FORWARD_80',json.dumps(event_rows[:80],sort_keys=True,ensure_ascii=False))

          # Explicitly print known held/quarantined families so the audit cannot silently treat them as queue items.
          held=[]
          for s in sources:
              txt=' '.join(str(v) for v in s.values() if isinstance(v,(str,int,float)))
              if any(k in txt.lower() for k in ('opec','bank negara malaysia','central bank of egypt','mospi','bank of thailand','unfccc','world health organization','intergovernmental panel on climate change')):
                  if s.get('source_id') in deps:
                      held.append({k:s.get(k) for k in ('source_id','institution','jurisdiction','licence_review_status','automated_retrieval_permission','automated_monitoring_use','monitoring_readiness_status','monitoring_activation_status','runtime_health_state','verification_mode','canonical_provenance_use')})
          print('KNOWN_HELD_FAMILIES',json.dumps(held,sort_keys=True,ensure_ascii=False))
          PY
