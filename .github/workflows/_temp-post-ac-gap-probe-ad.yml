name: Temporary post-AC missing-domain probe AD

on:
  push:
    branches:
      - feature/health-governance-anchor-ad

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-58 merge base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "de352644445d6b5e445aba7793c0e16f5960efc4"
      - name: Run post-AC gap probe
        run: python scripts/probe_post_ac_gap_candidates_ad.py
