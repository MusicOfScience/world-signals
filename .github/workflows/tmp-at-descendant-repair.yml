name: WORLD SIGNALS AT descendant-test repair v2

on:
  push:
    branches:
      - feature/post-as-pressure-audit-at
    paths:
      - .github/workflows/tmp-at-descendant-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-74 lineage
        shell: bash
        run: |
          set -euo pipefail
          BASE=92bf6cba7506483dd861680924879b1ded0f4ddc
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
      - name: Repair only stale live-descendant ceilings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_australian_tropical_cyclone_season_analysis_aj.py'): [
                  (
                      '        self.assertEqual((self.canonical["version"], len(self.canonical["records"])), ("0.37", 687))\n',
                      '        pre = self.plan["preconditions"]\n'
                      '        self.assertEqual((pre["canonical_registry_version"], pre["canonical_record_count"]), ("0.37", 687))\n'
                      '        self.assertGreaterEqual(len(self.canonical["records"]), pre["canonical_record_count"])\n',
                  ),
                  (
                      '        self.assertEqual(readiness["eligible_completed_occurrence_count"], 20)\n',
                      '        self.assertGreaterEqual(readiness["eligible_completed_occurrence_count"], 20)\n',
                  ),
              ],
              Path('tests/test_bank_of_canada_analysis_ai.py'): [
                  (
                      '        self.assertEqual(readiness["eligible_completed_occurrence_count"], 20)\n',
                      '        self.assertGreaterEqual(readiness["eligible_completed_occurrence_count"], 20)\n',
                  ),
              ],
              Path('tests/test_unfccc_sb64_historical_anchor_ah.py'): [
                  (
                      '        self.assertEqual(self.readiness["eligible_completed_occurrence_count"], 20)\n',
                      '        self.assertGreaterEqual(self.readiness["eligible_completed_occurrence_count"], 20)\n',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one stale assertion, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Prove historical checkpoints remain frozen and descendants stay valid
        run: |
          python -m unittest \
            tests.test_australian_tropical_cyclone_season_analysis_aj \
            tests.test_bank_of_canada_analysis_ai \
            tests.test_unfccc_sb64_historical_anchor_ah \
            tests.test_imd_heatwave_outlook_at_overlay_repair -v
      - name: Commit repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-at-descendant-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_australian_tropical_cyclone_season_analysis_aj.py \
                  tests/test_bank_of_canada_analysis_ai.py \
                  tests/test_unfccc_sb64_historical_anchor_ah.py \
                  .github/workflows/tmp-at-descendant-repair.yml
          git commit -m "AT: make historical analysis tests descendant-safe"
          git push origin HEAD:feature/post-as-pressure-audit-at
