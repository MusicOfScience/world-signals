name: BR Japan MOF JGB read-only diagnostic

on:
  push:
    branches:
      - feature/post-bq-jgb-monitor-br

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BQ baseline and inspect JGB governed scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1b021a5edb6b80dfab672f38047377d39dcae497"
          test "$(git merge-base HEAD origin/main)" = "1b021a5edb6b80dfab672f38047377d39dcae497"
          python - <<'PY'
          import json
          from pathlib import Path

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert (sources['version'],len(sources['sources']))==('1.90',248)
          assert (monitor['version'],len(monitor['adapters']))==('0.15',13)
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False

          src=next(r for r in sources['sources'] if r['source_id']=='WSSRC-FIS-007')
          rows=sorted([r for r in canonical['records'] if r.get('source_id')=='WSSRC-FIS-007'],key=lambda r:r['start_local'])
          assert len(rows)==10,len(rows)
          assert all(r['series_id']=='WSER-FIS-JP-JGB' for r in rows)
          assert all(r['region']=='East Asia' for r in rows)
          assert all(r['source_timezone']=='Asia/Tokyo' for r in rows)
          assert all(r['time_precision']=='DAY' for r in rows)
          assert src['canonical_dependency_count']==10
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['verification_mode']=='AUTOMATED_PILOT'
          assert not any(r['adapter_id']=='JAPAN_MOF_JGB_AUCTION_CALENDAR' for r in monitor['adapters'])

          print(json.dumps({
            'canonical':[canonical['version'],len(canonical['records'])],
            'sources':[sources['version'],len(sources['sources'])],
            'monitor':[monitor['version'],len(monitor['adapters'])],
            'source':src,
            'occurrences':[{k:r.get(k) for k in ('occurrence_id','canonical_name','start_local','end_local','time_precision','lifecycle_status','certainty_status','notes')} for r in rows],
          },indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Live-review MOF rights, robots and exact tracked monthly surfaces
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,html,json,re,urllib.request
          from datetime import date
          from pathlib import Path
          from urllib.robotparser import RobotFileParser
          from world_signals.adapters.japan_mof_jgb import fetch_jgb_monthly_auction_calendar,jgb_monthly_calendar_url

          UA='WORLD-SIGNALS-read-only-diagnostic/0.1'
          robots_url='https://www.mof.go.jp/robots.txt'
          rights_url='https://www.mof.go.jp/english/about_mof/notice/index.html'
          index_url='https://www.mof.go.jp/english/policy/jgbs/auction/calendar/index.htm'

          def fetch(url,accept='text/html,text/plain;q=0.9,*/*;q=0.2'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  body=resp.read()
                  return body,{'status':resp.status,'content_type':resp.headers.get('Content-Type',''),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}

          robots_raw,robots_meta=fetch(robots_url,'text/plain,*/*;q=0.1')
          rights_raw,rights_meta=fetch(rights_url)
          index_raw,index_meta=fetch(index_url)
          assert robots_meta['status']==rights_meta['status']==index_meta['status']==200

          rp=RobotFileParser()
          rp.set_url(robots_url)
          rp.parse(robots_raw.decode('utf-8','replace').splitlines())
          assert rp.can_fetch(UA,index_url)

          def textify(raw):
              s=raw.decode('utf-8','replace')
              s=re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',s)
              s=re.sub(r'(?s)<[^>]+>',' ',s)
              return re.sub(r'\s+',' ',html.unescape(s)).strip()

          rights=textify(rights_raw).lower()
          assert 'public data license' in rights
          assert 'pdl 1.0' in rights or 'version 1.0' in rights

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          rows=[r for r in canonical['records'] if r.get('source_id')=='WSSRC-FIS-007']
          future=[r for r in rows if r['start_local'] >= '2026-09-08']
          months=sorted({tuple(map(int,r['start_local'][:7].split('-'))) for r in future})
          calendars=[]
          for year,month in months:
              url=jgb_monthly_calendar_url(year,month)
              assert rp.can_fetch(UA,url),(year,month)
              cal,snap=fetch_jgb_monthly_auction_calendar(year,month,timeout=30)
              assert snap.status==200
              calendars.append({
                'year':year,'month':month,'url':url,'status':snap.status,
                'content_type':snap.content_type,'sha256':snap.body_sha256,
                'schedule_sha256':cal.schedule_sha256,
                'entries':[e.as_dict() for e in cal.entries],
              })

          print(json.dumps({
            'robots':robots_meta,
            'rights':rights_meta,
            'index':index_meta,
            'robots_allows_index':True,
            'future_tracked_count':len(future),
            'future_tracked':[{k:r.get(k) for k in ('occurrence_id','canonical_name','start_local','notes')} for r in sorted(future,key=lambda r:r['start_local'])],
            'unique_future_months':months,
            'routine_candidate_request_budget':1+len(months),
            'monthly_calendars':calendars,
            'rights_reuse_evidence':'PDL_1_0_PRESENT_OPERATIONAL_AUTOMATION_STILL_SEPARATE',
          },indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Prove diagnostic is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
