name: TEMP fix P1 scope lifecycle B prep
on:
  push:
    paths:
      - '.github/workflows/temp-fix-p1-scope-lifecycle-b-prep.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-source-scope-lifecycle-b-prep
      - name: Patch established schedule-authority vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data/coverage/P1_SOURCE_SCOPE_LIFECYCLE_B_PLAN_v0.1.json')
          s=p.read_text()
          count=s.count('"schedule_authority_scope": "HOST_FORECAST_MONTH"')
          if count != 2:
              raise SystemExit(f'expected two HOST_FORECAST_MONTH values, found {count}')
          p.write_text(s.replace('"schedule_authority_scope": "HOST_FORECAST_MONTH"','"schedule_authority_scope": "EVENT_SPECIFIC"'))
          PY
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add data/coverage/P1_SOURCE_SCOPE_LIFECYCLE_B_PLAN_v0.1.json
          git diff --cached --check
          git commit -m 'Use established ASEAN schedule-authority scope'
          git push origin HEAD:p1-source-scope-lifecycle-b-prep
