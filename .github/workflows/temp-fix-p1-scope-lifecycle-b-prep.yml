name: TEMP fix P1 scope lifecycle B prep
on:
  push:
    paths:
      - '.github/workflows/temp-fix-p1-scope-lifecycle-b-prep.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-source-scope-lifecycle-b-prep
      - name: Make Vietnam overlay regression future-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_vietnam_source_scope_repair_a.py')
          s=p.read_text()
          old='self.assertEqual(self.overlay["canonical_checkpoint"], {"registry_version": "0.22", "record_count": 669})'
          new='self.assertEqual(self.overlay["canonical_checkpoint"], {"registry_version": self.canonical["version"], "record_count": 669})'
          if s.count(old) != 1:
              raise SystemExit(f'expected one future-stale overlay assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add tests/test_vietnam_source_scope_repair_a.py
          git diff --cached --check
          git commit -m 'Make Vietnam overlay regression future-safe'
          git push origin HEAD:p1-source-scope-lifecycle-b-prep
