name: CG materialize BARMM pre-election Live context

# Retry 3: preserve historical Live checkpoints while allowing reviewed descendants.
on:
  push:
    branches:
      - feature/post-cf-live-pressure-cg
    paths:
      - '.github/workflows/cg-materialize-barmm-live.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/post-cf-live-pressure-cg
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert exact main base and clean checkout
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6c96794cb553c6b34df93536141340c2af8db44a"
          test "$(git merge-base HEAD origin/main)" = "6c96794cb553c6b34df93536141340c2af8db44a"
          test -z "$(git status --porcelain)"
      - name: Apply bounded descendant-safety repairs
        run: |
          set -euo pipefail
          python -m py_compile scripts/repair_live_descendant_regressions_cg.py
          python scripts/repair_live_descendant_regressions_cg.py
      - name: Compile and simulate CG transaction
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_barmm_pre_election_live_cg.py tests/test_barmm_pre_election_live_cg.py
          python scripts/apply_barmm_pre_election_live_cg.py --check --observed-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unittest tests.test_barmm_pre_election_live_cg -v
          python -m unittest tests.test_opec_quarantine_cf -v
      - name: Capture protected hashes
        run: |
          sha256sum \
            data/canonical/registry.json data/canonical/schema.json \
            data/sources/registry.json data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json data/monitor/operations_policy.json \
            data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json \
            OPEC_QUARANTINE.md tests/test_opec_quarantine_cf.py > /tmp/cg-protected.sha256
      - name: Materialize reviewed Live transaction
        env:
          WORLD_SIGNALS_APPLY_BARMM_PRE_ELECTION_LIVE_CG: YES
        run: python scripts/apply_barmm_pre_election_live_cg.py --apply --observed-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Validate materialized repository
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py src/world_signals/*.py src/world_signals/adapters/*.py tests/*.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Audit protected layers and bounded mutation
        run: |
          set -euo pipefail
          sha256sum --check /tmp/cg-protected.sha256
          python - <<'PY'
          import subprocess
          allowed = {
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'scripts/apply_barmm_pre_election_live_cg.py',
              'tests/test_bwc_wg8_first_analysis_revision_cd.py',
              'tests/test_eurostat_monitor_bk.py',
              'tests/test_fomc_monitor_readiness_bm.py',
              'tests/test_japan_household_spending_monitor_bl.py',
              'tests/test_opec_official_confirmation_bg.py',
              'tests/test_un_correct_map_live_bf.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          generated = {p for p in changed if p.startswith('site/') or p.startswith('docs/') or p.startswith('artifacts/')}
          changed -= generated
          if changed != allowed:
              raise SystemExit(f'CG unexpected materialized paths: {sorted(changed)}')
          PY
          rm -rf site docs artifacts
          test ! -e site
          test ! -e docs
          test ! -e artifacts
      - name: Recheck main before commit
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6c96794cb553c6b34df93536141340c2af8db44a"
      - name: Commit guarded CG materialization and descendant-safety repairs
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            scripts/apply_barmm_pre_election_live_cg.py \
            tests/test_bwc_wg8_first_analysis_revision_cd.py \
            tests/test_eurostat_monitor_bk.py \
            tests/test_fomc_monitor_readiness_bm.py \
            tests/test_japan_household_spending_monitor_bl.py \
            tests/test_opec_official_confirmation_bg.py \
            tests/test_un_correct_map_live_bf.py
          git commit -m "CG: add reviewed BARMM pre-election Live context"
          git push origin HEAD:feature/post-cf-live-pressure-cg
