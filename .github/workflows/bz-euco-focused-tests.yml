name: BZ European Council focused offline gate

on:
  push:
    branches:
      - feature/post-by-pressure-audit-bz
    paths:
      - .github/workflows/bz-euco-focused-tests.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and run BZ offline contract tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ccb20539c10d0965de84efa298ba75634c19249
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python -m unittest -v tests.test_european_council_rss_bz
          python -m py_compile src/world_signals/adapters/european_council_rss.py src/world_signals/european_council_monitor.py tests/test_european_council_rss_bz.py
          test -z "$(git status --porcelain)"
