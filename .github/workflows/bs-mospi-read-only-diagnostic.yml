name: BS MoSPI read-only endpoint diagnostic

on:
  push:
    branches:
      - feature/post-br-pressure-audit-bs

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BR baseline and MoSPI governed scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          test "$(git merge-base HEAD origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          src=next(x for x in s['sources'] if x['source_id']=='WSSRC-MAC-017')
          rows=sorted([x for x in c['records'] if x.get('source_id')=='WSSRC-MAC-017'],key=lambda x:(str(x.get('start_local')),x['occurrence_id']))
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('1.91',249)
          assert (m['version'],len(m['adapters']))==('0.16',14)
          assert len(rows)==18
          assert all(x.get('region')=='South Asia' for x in rows)
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['automated_retrieval_permission']=='PENDING_ENDPOINT_OPERATIONAL_REVIEW'
          assert not any(x.get('source_id')=='WSSRC-MAC-017' for x in m['adapters'])
          print(json.dumps({'source':src,'occurrences':[{k:r.get(k) for k in ('occurrence_id','series_id','canonical_name','start_local','time_precision','lifecycle_status','certainty_status')} for r in rows]},indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Probe MoSPI robots policy before any page retrieval
        id: robots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.error,urllib.request,urllib.robotparser
          url='https://www.mospi.gov.in/robots.txt'
          req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-read-only-diagnostic/0.1','Accept':'text/plain,*/*;q=0.1'})
          result={'url':url}
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(); result.update(status=r.status,content_type=r.headers.get('Content-Type',''),bytes=len(body),body=body.decode('utf-8','replace')[:12000])
          except urllib.error.HTTPError as e:
              result.update(status=e.code,content_type=e.headers.get('Content-Type',''),bytes=0,body='')
          print(json.dumps(result,indent=2,sort_keys=True))
          open('/tmp/mospi-robots.json','w').write(json.dumps(result))
          PY
      - name: Inspect bounded official page implementation only when robots explicitly permits or is non-applicable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,urllib.parse,urllib.request,urllib.robotparser
          from pathlib import Path
          robots=json.loads(Path('/tmp/mospi-robots.json').read_text())
          UA='WORLD-SIGNALS-read-only-diagnostic/0.1'
          page='https://www.mospi.gov.in/announcements/advance-release-calendar-mospis-website-reg'
          if robots.get('status') != 200:
              print(json.dumps({'inspection':'SKIPPED','reason':'ROBOTS_NOT_EXPLICITLY_AVAILABLE','robots_status':robots.get('status'),'interpretation':'NO_PERMISSION_INFERENCE'}))
              raise SystemExit(0)
          rp=urllib.robotparser.RobotFileParser(); rp.parse(robots.get('body','').splitlines())
          if not rp.can_fetch(UA,page):
              print(json.dumps({'inspection':'SKIPPED','reason':'ROBOTS_DISALLOWS_WORKING_CALENDAR_PAGE','interpretation':'PRODUCTION_HOLD'}))
              raise SystemExit(0)
          def get(url,accept='text/html,*/*;q=0.1'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read()
                  return body,{'url':url,'status':r.status,'content_type':r.headers.get('Content-Type',''),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          body,meta=get(page)
          text=body.decode('utf-8','replace')
          script_srcs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
              u=urllib.parse.urljoin(page,src)
              if urllib.parse.urlparse(u).hostname in {'www.mospi.gov.in','mospi.gov.in'} and u not in script_srcs:
                  script_srcs.append(u)
          inline_hits=[]
          pats=[r'https?://[^"\'\s<>]+',r'/[^"\'\s<>]*(?:release|calendar|view|ajax|json|api)[^"\'\s<>]*']
          for pat in pats:
              for hit in re.findall(pat,text,re.I):
                  if hit not in inline_hits: inline_hits.append(hit)
          scripts=[]
          for u in script_srcs[-6:]:
              if not rp.can_fetch(UA,u):
                  scripts.append({'url':u,'skipped':'ROBOTS_DISALLOW'})
                  continue
              try:
                  b,m=get(u,'application/javascript,text/javascript,*/*;q=0.1')
              except Exception as e:
                  scripts.append({'url':u,'error':type(e).__name__}); continue
              st=b.decode('utf-8','replace')
              hits=[]
              for pat in pats:
                  for hit in re.findall(pat,st,re.I):
                      if hit not in hits: hits.append(hit)
              scripts.append({**m,'route_like_hits':hits[:80]})
          visible=[x for x in ('20 releases','Advance Release Calendar 2026-27','All India Consumer Price Index','Periodic Labour Force Survey') if x.casefold() in text.casefold()]
          print(json.dumps({'page':meta,'visible_markers':visible,'script_count':len(script_srcs),'script_urls':script_srcs,'inline_route_like_hits':inline_hits[:100],'scripts_inspected':scripts},indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Probe authoritative updated ARC transport only, without parsing PDF content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.robotparser
          from pathlib import Path
          robots=json.loads(Path('/tmp/mospi-robots.json').read_text())
          url='https://www.mospi.gov.in/uploads/documents/releaseCalender/1779709510470-ADVANCE%20RELEASE%20CALENDAR%202026-27%20Updated%2025.05.2026.pdf'
          UA='WORLD-SIGNALS-read-only-diagnostic/0.1'
          if robots.get('status') != 200:
              print(json.dumps({'pdf_probe':'SKIPPED','reason':'ROBOTS_NOT_EXPLICITLY_AVAILABLE','robots_status':robots.get('status')})); raise SystemExit(0)
          rp=urllib.robotparser.RobotFileParser(); rp.parse(robots.get('body','').splitlines())
          if not rp.can_fetch(UA,url):
              print(json.dumps({'pdf_probe':'SKIPPED','reason':'ROBOTS_DISALLOWS_PDF'})); raise SystemExit(0)
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/pdf,*/*;q=0.1','Range':'bytes=0-4095'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read()
              print(json.dumps({'url':url,'status':r.status,'content_type':r.headers.get('Content-Type',''),'content_range':r.headers.get('Content-Range',''),'bytes_received':len(body),'sha256_received':hashlib.sha256(body).hexdigest(),'pdf_magic':body.startswith(b'%PDF-')},indent=2,sort_keys=True))
          PY
      - name: Prove diagnostic is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
