name: Smoke WORLD SIGNALS live adapters

on:
  push:
    branches: [main]
    paths:
      - 'src/world_signals/adapters/**'
      - 'scripts/run_adapter_smoke.py'
      - 'tests/test_adapters.py'
      - '.github/workflows/adapter-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Parser regression tests
        run: python -m unittest tests.test_adapters -v
      - name: Live official adapter smoke
        run: python scripts/run_adapter_smoke.py
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-signals-adapter-smoke
          path: artifacts/adapter-smoke.json
          if-no-files-found: error
