name: TEMP provenance repair post-state tests

on:
  push:
    branches:
      - provenance-scope-repair-research

permissions:
  contents: read

jobs:
  poststate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Pre-repair read-only guard
        run: python scripts/apply_provenance_scope_repair_a.py
      - name: Materialise repaired post-state in ephemeral working tree
        env:
          WORLD_SIGNALS_ALLOW_PROVENANCE_REPAIR_A_APPLY: YES
        run: python scripts/apply_provenance_scope_repair_a.py --apply
      - name: Validate repaired registry
        run: python scripts/validate_registry.py
      - name: Full unit suite against repaired post-state
        run: python -m unittest discover -s tests -v
      - name: Compile monitor projection helpers
        run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/apply_provenance_scope_repair_a.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Build public site against repaired post-state
        run: python scripts/build_site.py
