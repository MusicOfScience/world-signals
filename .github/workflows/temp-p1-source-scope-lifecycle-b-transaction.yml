name: TEMP P1 source-scope lifecycle B transaction
on:
  push:
    paths:
      - '.github/workflows/temp-p1-source-scope-lifecycle-b-transaction.yml'
permissions:
  contents: write
jobs:
  transact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p1-source-scope-lifecycle-b-transaction
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve reviewed commit timestamp
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print('COMMITTED_AT=' + datetime.now(ZoneInfo('Australia/Melbourne')).isoformat(timespec='seconds'))
          PY
      - name: Guarded read-only preflight
        run: python scripts/apply_p1_source_scope_lifecycle_b.py --committed-at "$COMMITTED_AT"
      - name: Apply reviewed transaction
        env:
          WORLD_SIGNALS_ALLOW_P1_SOURCE_SCOPE_LIFECYCLE_B_APPLY: 'YES'
        run: python scripts/apply_p1_source_scope_lifecycle_b.py --apply --committed-at "$COMMITTED_AT"
      - name: Enforce exact four-file production mutation
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'data/canonical/registry.json',
              'data/sources/registry.json',
              'data/changes/ledger.json',
              'data/coverage/biosecurity_overlay.json',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          print('CHANGED', sorted(actual))
          if actual != expected:
              raise SystemExit(f'exact transaction surface failed: {actual!r} != {expected!r}')
          PY
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Python compilation
        run: python -m compileall -q scripts src
      - name: Browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Full site build
        run: python scripts/build_site.py
      - name: Independent transaction assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.world_signals.source_governance_audit import build_source_governance_audit

          can=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          led=json.loads(Path('data/changes/ledger.json').read_text())
          ov=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          exp=json.loads(Path('data/monitor/expectations.json').read_text())
          rec={r['occurrence_id']:r for r in can['records']}
          sources={r['source_id']:r for r in src['sources']}

          assert can['version']=='0.23' and len(can['records'])==669
          assert src['version']=='1.64' and len(src['sources'])==226
          assert led['version']=='0.12'
          assert ov['canonical_checkpoint']=={'registry_version':'0.23','record_count':669}
          assert len(rec)==669
          assert rec['WSO-REG-B-0007']['start_local']=='2026-09-15'
          assert rec['WSO-REG-A-0008']['start_local']=='2026-10-31'
          assert rec['WSO-EL-A-0004']['start_local']=='2027-01-05'
          assert rec['WSO-FIS-B-0011']['start_local'] is None
          assert rec['WSO-FIS-B-0011']['date_earliest'] is None
          assert rec['WSO-FIS-B-0011']['date_latest'] is None
          assert rec['WSO-FIS-B-0011']['legal_basis_source_id']=='WSSRC-FIS-025'
          assert rec['WSO-FIS-B-0011']['activation_mode']=='AUTHORITATIVE_RECURRING_RULE'
          assert rec['WSO-INT-A-0018']['date_earliest']=='2027-05-01'
          assert rec['WSO-INT-A-0018']['date_latest']=='2027-05-31'
          assert rec['WSO-INT-A-0019']['date_earliest']=='2027-11-01'
          assert rec['WSO-INT-A-0019']['date_latest']=='2027-11-30'
          for oid in ('WSO-INT-A-0018','WSO-INT-A-0019'):
              assert rec[oid]['start_local'] is None and rec[oid]['end_local'] is None
              assert rec[oid]['start_utc'] is None and rec[oid]['end_utc'] is None
              assert rec[oid]['time_precision']=='MONTH'
              assert rec[oid]['schedule_authority_scope']=='EVENT_SPECIFIC'
          assert sources['WSSRC-FIS-025']['canonical_dependency_count']==0
          assert {'WSSRC-REG4-001','WSSRC-REG4-002'} <= set(sources)
          assert exp['automatic_canonical_commit'] is False
          assert exp['google_calendar_write'] is False

          audit=build_source_governance_audit(can, src, exp)
          t=audit['totals']
          assert t['fully_explicit_governance_source_count']==74
          assert t['source_records_with_one_or_more_missing_governance_fields']==152
          assert t['backfill_research_priority_counts']['P1_CANONICAL_DEPENDENCY']==81
          assert t['backfill_research_priority_counts']['P2_REGISTRY_ONLY']==71

          added=led['changes'][-5:]
          assert len(added)==5
          assert all(x.get('committed_at') for x in added)
          assert all(x.get('canonical_mutation_committed') is True for x in added)
          print('INDEPENDENT_TRANSACTION_ASSERTIONS PASS')
          PY
      - name: Commit exact reviewed transaction
        run: |
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add data/canonical/registry.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json
          python - <<'PY'
          import subprocess
          expected = {
              'data/canonical/registry.json',
              'data/sources/registry.json',
              'data/changes/ledger.json',
              'data/coverage/biosecurity_overlay.json',
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'cached transaction surface failed: {actual!r}')
          PY
          git diff --cached --check
          git commit -m 'Apply P1 source-scope lifecycle B reviewed transaction'
          git push origin HEAD:p1-source-scope-lifecycle-b-transaction
