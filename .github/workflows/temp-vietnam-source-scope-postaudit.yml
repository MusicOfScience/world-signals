name: TEMP Vietnam source-scope post-audit

on:
  push:
    branches:
      - vietnam-source-scope-repair-a-transaction
    paths:
      - .github/workflows/temp-vietnam-source-scope-postaudit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact committed post-state and protected invariants
        run: |
          python - <<'PY'
          import copy
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          plan = json.loads(Path('data/coverage/VIETNAM_SOURCE_SCOPE_REPAIR_A_PLAN_v0.1.json').read_text())
          can = json.loads(Path('data/canonical/registry.json').read_text())
          src = json.loads(Path('data/sources/registry.json').read_text())
          led = json.loads(Path('data/changes/ledger.json').read_text())
          overlay = json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          exp = json.loads(Path('data/monitor/expectations.json').read_text())
          base_can = json.loads(subprocess.check_output(['git','show','origin/main:data/canonical/registry.json'], text=True))
          base_src = json.loads(subprocess.check_output(['git','show','origin/main:data/sources/registry.json'], text=True))
          base_led = json.loads(subprocess.check_output(['git','show','origin/main:data/changes/ledger.json'], text=True))
          base_overlay = json.loads(subprocess.check_output(['git','show','origin/main:data/coverage/biosecurity_overlay.json'], text=True))

          post = plan['postconditions']
          assert str(can['version']) == str(post['canonical_registry_version']) == '0.22'
          assert can['record_count'] == len(can['records']) == 669
          assert str(src['version']) == str(post['source_registry_version']) == '1.63'
          assert len(src['sources']) == 225
          assert str(led['version']) == str(post['change_ledger_version']) == '0.11'
          assert overlay['canonical_checkpoint'] == {'registry_version':'0.22','record_count':669}
          assert exp['automatic_canonical_commit'] is False
          assert exp['google_calendar_write'] is False

          before = {r['occurrence_id']: r for r in base_can['records']}
          after = {r['occurrence_id']: r for r in can['records']}
          assert list(before) == list(after)
          changed = [oid for oid in before if before[oid] != after[oid]]
          assert changed == ['WSO-REG-G-0001'], changed

          timing = ('start_local','end_local','start_utc','end_utc','date_earliest','date_latest','publication_datetime','timing_type','time_precision','all_day_semantics')
          for oid in before:
              assert {k:before[oid].get(k) for k in timing} == {k:after[oid].get(k) for k in timing}, oid

          occ = after['WSO-REG-G-0001']
          for k,v in plan['canonical_update']['set'].items():
              assert occ.get(k) == v, (k, occ.get(k), v)
          for k,v in plan['canonical_update']['must_preserve'].items():
              assert occ.get(k) == v, (k, occ.get(k), v)
          assert occ['start_local'] == '2026-10-20'
          assert occ['certainty_status'] == 'PROVISIONAL'
          assert occ['time_status'] == 'PROVISIONAL'

          before_sources = {s['source_id']:s for s in base_src['sources']}
          after_sources = {s['source_id']:s for s in src['sources']}
          assert list(after_sources) == list(before_sources) + ['WSSRC-REG5-002']
          changed_existing = [sid for sid in before_sources if before_sources[sid] != after_sources[sid]]
          assert changed_existing == ['WSSRC-REG5-001'], changed_existing
          counts = Counter(r.get('source_id') for r in can['records'] if r.get('source_id'))
          assert counts['WSSRC-REG5-001'] == 0
          assert counts['WSSRC-REG5-002'] == 1
          for sid in ('WSSRC-REG5-001','WSSRC-REG5-002'):
              stored = after_sources[sid].get('canonical_dependency_count')
              if stored is not None:
                  assert stored == counts[sid], (sid, stored, counts[sid])
          assert after_sources['WSSRC-REG5-002']['verification_mode'] == 'RIGHTS_HELD_MANUAL_ONLY'
          assert after_sources['WSSRC-REG5-002']['automated_monitoring_use'] == 'PROHIBITED_OR_RIGHTS_HOLD'

          assert led['changes'][:-1] == base_led['changes']
          assert len(led['changes']) == len(base_led['changes']) + 1
          actual = copy.deepcopy(led['changes'][-1])
          assert actual.pop('committed_at', None)
          assert actual == plan['change_ledger_entry']

          expected_overlay = copy.deepcopy(base_overlay)
          expected_overlay['canonical_checkpoint'] = {'registry_version':'0.22','record_count':669}
          assert overlay == expected_overlay

          print(json.dumps({
              'status':'PASS',
              'canonical':f"{can['version']} / {len(can['records'])}",
              'sources':f"{src['version']} / {len(src['sources'])}",
              'ledger':led['version'],
              'changed_occurrences':changed,
              'old_source_dependencies':counts['WSSRC-REG5-001'],
              'new_source_dependencies':counts['WSSRC-REG5-002'],
              'automatic_canonical_commit':exp['automatic_canonical_commit'],
              'google_calendar_write':exp['google_calendar_write'],
          }, indent=2))
          PY
      - name: Ensure transaction replay is fail-closed
        run: |
          if python scripts/apply_vietnam_source_scope_repair_a.py >/tmp/replay.out 2>/tmp/replay.err; then
            echo 'ERROR: transaction helper unexpectedly accepted replay'
            exit 1
          fi
          grep -q 'PRECONDITION FAILED' /tmp/replay.err /tmp/replay.out
      - name: Verify durable diff is exactly four production files
        run: |
          git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/temp-vietnam-source-scope-postaudit.yml$' | sort > /tmp/changed.txt
          printf '%s\n' \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/sources/registry.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test ! -e .github/workflows/temp-vietnam-source-scope-transaction.yml
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python and browser checks
        run: |
          python -m py_compile scripts/*.py src/world_signals/*.py src/world_signals/adapters/*.py
          node --check web/app.js
          node --check web/biosecurity.js
          node --check web/history.js
          node --check web/operations.js
      - name: Build site
        run: python scripts/build_site.py
