name: AZ Japan FIES Live-to-Analysis preflight v2

on:
  push:
    branches: [feature/post-ay-first-live-analysis-link-az]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove exact post-AY ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=bc8e588624e8a76f6847d7c80aef7e7fa5ecafa9
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"

      - name: Run AZ read-only simulation
        run: python scripts/apply_japan_fies_live_analysis_az.py --check-only

      - name: Validate untouched post-AY descendant
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/apply_japan_fies_live_analysis_az.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/live_analysis_bridge.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py

      - name: Materialise ephemeral AZ target
        run: python scripts/apply_japan_fies_live_analysis_az.py --apply

      - name: Validate ephemeral AZ target exhaustively
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/apply_japan_fies_live_analysis_az.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/live_analysis_bridge.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py

      - name: Prove AZ target and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_japan_fies_live_analysis_az.py --check-only
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import sys
          ROOT=Path('.')
          sys.path.insert(0,str(ROOT/'src'))
          from world_signals.live_analysis_bridge import production_live_input_count
          def load(p): return json.loads((ROOT/p).read_text())
          live_schema=load('data/live_intelligence/schema.json')
          live_obs=load('data/live_intelligence/observations.json')
          live_ev=load('data/live_intelligence/evidence_registry.json')
          schema=load('data/analysis/schema.json')
          reviews=load('data/analysis/event_reviews.json')
          evidence=load('data/analysis/evidence_registry.json')
          canonical=load('data/canonical/registry.json')
          assert live_schema['version']=='0.4'
          assert live_obs['version']=='0.4' and len(live_obs['observations'])==4
          assert live_ev['version']=='0.4' and len(live_ev['evidence'])==6
          assert schema['version']=='0.6'
          assert reviews['version']=='0.17' and len(reviews['reviews'])==21
          assert evidence['version']=='0.17' and len(evidence['evidence'])==95
          assert canonical['version']=='0.38' and len(canonical['records'])==688
          assert production_live_input_count(reviews)==1
          policy=schema['live_input_policy']
          assert policy['maximum_production_live_inputs']==1
          assert policy['maximum_live_inputs_per_review']==1
          assert policy['public_live_input_projection_allowed'] is False
          review=next(r for r in reviews['reviews'] if r['analysis_id']=='WSAN-JP-FIES-202607-001')
          assert review['canonical_occurrence_id']=='WSO-MAC-B-0041'
          assert review['live_inputs']==[{
              'observation_id':'WSLI-MAC-JPN-FIES-202607-001',
              'roles':['FACTUAL_INPUT'],
              'analysis_sections':['what_happened'],
          }]
          assert review['what_moved']==[]
          assert review['canonical_release_utc'] is None
          exact=sum(1 for r in reviews['reviews'] for m in (r.get('what_moved') or []) if m.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES')
          assert exact==0
          expected={
            'PROJECT_STATUS.md',
            'ROADMAP.md',
            'data/live_intelligence/schema.json',
            'data/live_intelligence/observations.json',
            'data/live_intelligence/evidence_registry.json',
            'data/analysis/schema.json',
            'data/analysis/event_reviews.json',
            'data/analysis/evidence_registry.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          PY
          for p in \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json; do
              test "$(git show HEAD:"$p" | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$p" | cut -d' ' -f1)"
          done

      - name: Restore branch and self-remove preflight workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-japan-fies-live-analysis-preflight-v2.yml
          git commit -m 'AZ: remove temporary read-only preflight workflow v2'
          git push origin HEAD:feature/post-ay-first-live-analysis-link-az
