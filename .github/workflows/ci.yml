name: Validate WORLD SIGNALS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-signals-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Defaults to GitHub-hosted compute. A configured self-hosted label is used
    # only for trusted same-repository PRs, pushes and manual runs. Fork PRs
    # always fall back to ubuntu-latest rather than executing on a local host.
    runs-on: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.WORLD_SIGNALS_VALIDATION_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Validate the actual PR head rather than GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Fetch exact pull-request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Fetch merge second parent for post-merge proof
        if: github.event_name == 'push'
        shell: bash
        run: |
          read -r -a parents <<< "$(git show -s --format=%P "$GITHUB_SHA")"
          if [[ "${#parents[@]}" -eq 2 ]]; then
            git fetch --no-tags --depth=1 origin "${parents[1]}"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Classify validation surface
        id: validation-profile
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--event "$GITHUB_EVENT_NAME" --head-ref "$HEAD_SHA" --classify-only)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--base-ref "$BASE_SHA")
          fi
          profile="$(python3 scripts/validate_world_signals.py "${args[@]}")"
          case "$profile" in
            FULL|SAFE_RESEARCH_DOCS|POST_MERGE) ;;
            *) echo "Unexpected validation profile: $profile" >&2; exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Selected validation profile: **$profile**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        if: steps.validation-profile.outputs.profile == 'FULL'
        with:
          node-version: '24'

      - name: Run portable validation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_PROFILE: ${{ steps.validation-profile.outputs.profile }}
        run: |
          args=(--event "$GITHUB_EVENT_NAME" --head-ref "$HEAD_SHA" --profile "$VALIDATION_PROFILE")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--base-ref "$BASE_SHA")
          fi
          python3 scripts/validate_world_signals.py "${args[@]}"

      - name: Upload validation and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-signals-validation-${{ github.run_id }}
          path: |
            artifacts/validation/summary.json
            artifacts/coverage
          if-no-files-found: ignore
          retention-days: 30
