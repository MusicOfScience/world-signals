name: Validate WORLD SIGNALS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_live_intelligence.py
      - run: python scripts/validate_osint_promotion.py
      - run: python scripts/validate_signal_admission.py
      - run: python scripts/validate_signals.py
      - run: python scripts/validate_relationships.py
      - run: python scripts/validate_risks.py
      - run: python scripts/validate_scenarios.py
      - run: python scripts/validate_forecasts.py
      - run: python scripts/validate_outcomes.py
      - run: python scripts/validate_evaluation.py
      - run: python scripts/validate_analysis.py
      - run: python scripts/project_state_snapshot.py --check
      # The full test suite includes explicit integration checks for the
      # disposable public and local operator projections. Build those outputs
      # before tests on a clean checkout; they are intentionally ignored and
      # must not be committed merely to satisfy CI.
      - run: python scripts/build_site.py
      - run: python scripts/build_operator_site.py
      - run: python scripts/validate_public_site.py
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/build_ics.py scripts/build_site.py scripts/build_operator_site.py scripts/validate_public_site.py scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_live_intelligence.py scripts/validate_osint_promotion.py scripts/validate_signal_admission.py scripts/validate_signals.py scripts/validate_relationships.py scripts/validate_risks.py scripts/validate_scenarios.py scripts/validate_forecasts.py scripts/validate_outcomes.py scripts/validate_evaluation.py scripts/validate_analysis.py scripts/project_state_snapshot.py scripts/run_cross_layer_coverage_audit.py scripts/apply_analysis_revision_contract_ba.py scripts/validate_world_state_history.py scripts/admit_world_state_health_candidate.py src/world_signals/icalendar.py src/world_signals/live_intelligence.py src/world_signals/osint_engine.py src/world_signals/osint_promotion.py src/world_signals/signals.py src/world_signals/signal_admission.py src/world_signals/relationships.py src/world_signals/risks.py src/world_signals/scenarios.py src/world_signals/forecasts.py src/world_signals/outcomes.py src/world_signals/evaluation.py src/world_signals/analysis.py src/world_signals/analysis_revision.py src/world_signals/analysis_revision_projection.py src/world_signals/live_analysis_bridge.py src/world_signals/cross_layer_coverage.py src/world_signals/world_state_candidate.py src/world_signals/world_state_history.py src/world_signals/world_state_admission.py
      - run: node --check web/app.js
      - run: node --check web/horizon.js
      - run: node --check web/native-calendar.js
      - run: node --check web/history.js
      - run: node --check web/operations.js
      - run: node --check web/biosecurity.js
      - run: node --check web/analysis.js
      - run: node --check web/operator.js
