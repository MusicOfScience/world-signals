name: Validate WORLD SIGNALS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_live_intelligence.py
      - run: python scripts/validate_analysis.py
      - run: python scripts/project_state_snapshot.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/build_ics.py scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_live_intelligence.py scripts/validate_analysis.py scripts/project_state_snapshot.py scripts/run_cross_layer_coverage_audit.py scripts/apply_analysis_revision_contract_ba.py src/world_signals/icalendar.py src/world_signals/live_intelligence.py src/world_signals/analysis.py src/world_signals/analysis_revision.py src/world_signals/analysis_revision_projection.py src/world_signals/live_analysis_bridge.py src/world_signals/cross_layer_coverage.py
      - run: node --check web/app.js
      - run: node --check web/horizon.js
      - run: node --check web/native-calendar.js
      - run: node --check web/history.js
      - run: node --check web/operations.js
      - run: node --check web/biosecurity.js
      - run: node --check web/analysis.js
      - run: python scripts/build_site.py
