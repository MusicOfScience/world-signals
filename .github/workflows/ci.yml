name: Validate WORLD SIGNALS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/validate_registry.py
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py
      - run: node --check web/app.js
      - run: node --check web/history.js
      - run: node --check web/operations.js
      - run: node --check web/biosecurity.js
      - run: python scripts/build_site.py
