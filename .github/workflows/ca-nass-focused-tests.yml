name: CA NASS focused tests

on:
  push:
    branches:
      - feature/post-bz-pressure-audit-ca
    paths:
      - .github/workflows/ca-nass-focused-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and run CA NASS contract tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=07c558c8811795f0aed40e73bd386cc70344191e
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python -m unittest tests.test_nass_asb_ical_ca -v
          python -m py_compile src/world_signals/adapters/nass_asb_ical.py src/world_signals/nass_asb_monitor.py
          test -z "$(git status --porcelain)"
