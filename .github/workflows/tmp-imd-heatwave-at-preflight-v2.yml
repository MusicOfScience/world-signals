name: WORLD SIGNALS AT repaired read-only preflight

on:
  push:
    branches:
      - feature/post-as-pressure-audit-at
    paths:
      - .github/workflows/tmp-imd-heatwave-at-preflight-v2.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-74 base and repaired workflow hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=92bf6cba7506483dd861680924879b1ded0f4ddc
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test ! -e .github/workflows/tmp-at-descendant-repair.yml
          test ! -e .github/workflows/tmp-imd-heatwave-at-transaction.yml
          git diff --check "$BASE"...HEAD
      - name: Read-only overlay-aware AT simulation
        run: python scripts/apply_imd_heatwave_outlook_at_transaction.py --check
      - name: Targeted AT and descendant regressions
        run: |
          python -m unittest \
            tests.test_imd_heatwave_outlook_at \
            tests.test_imd_heatwave_outlook_at_overlay_repair \
            tests.test_australian_tropical_cyclone_season_analysis_aj \
            tests.test_bank_of_canada_analysis_ai \
            tests.test_unfccc_sb64_historical_anchor_ah -v
      - name: Validate current governed layers
        run: |
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
      - name: Run full repository suite
        run: python -m unittest discover -s tests -v
      - name: Compile production Python paths
        run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_analysis.py scripts/apply_imd_heatwave_outlook_at.py scripts/apply_imd_heatwave_outlook_at_transaction.py src/world_signals/analysis.py src/world_signals/analytical_overlays.py
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Build static site
        run: python scripts/build_site.py
      - name: Prove read-only preflight left governed state untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain -- data/canonical data/sources data/coverage/biosecurity_overlay.json data/changes data/monitor data/analysis)" = ""
