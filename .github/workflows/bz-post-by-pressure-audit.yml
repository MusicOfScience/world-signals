name: BZ post-BY pressure audit

on:
  push:
    branches:
      - feature/post-by-pressure-audit-bz
    paths:
      - .github/workflows/bz-post-by-pressure-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BY base and inspect European Council contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ccb20539c10d0965de84efa298ba75634c19249
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import json,re
          from pathlib import Path
          C=json.loads(Path('data/canonical/registry.json').read_text())
          S=json.loads(Path('data/sources/registry.json').read_text())
          M=json.loads(Path('data/monitor/expectations.json').read_text())
          src=[x for x in S['sources'] if x.get('source_id')=='WSSRC-INT-003']
          assert len(src)==1
          rows=[x for x in C['records'] if x.get('source_id')=='WSSRC-INT-003']
          assert len(rows)==3
          assert not any(x.get('adapter_id')=='EUROPEAN_COUNCIL_MEETINGS_RSS' for x in M['adapters'])
          ints=sorted(x['source_id'] for x in S['sources'] if re.fullmatch(r'WSSRC-INT-\d+',str(x.get('source_id'))))
          nums={int(x.rsplit('-',1)[1]) for x in ints}
          next_unused=next(n for n in range(1,1000) if n not in nums)
          print('BASELINE',json.dumps({'canonical_version':C['version'],'canonical_count':len(C['records']),'sources_version':S['version'],'sources_count':len(S['sources']),'monitor_version':M['version'],'monitor_count':len(M['adapters']),'automatic_canonical_commit':M['automatic_canonical_commit'],'google_calendar_write':M['google_calendar_write']},sort_keys=True))
          print('INT_SOURCE_IDS',json.dumps(ints))
          print('FIRST_UNUSED_INT_ID',f'WSSRC-INT-{next_unused:03d}')
          print('INT030',json.dumps([x for x in S['sources'] if x.get('source_id')=='WSSRC-INT-030'],sort_keys=True,ensure_ascii=False))
          print('SOURCE_OBJECT',json.dumps(src[0],sort_keys=True,ensure_ascii=False))
          print('CANONICAL_ROWS',json.dumps(rows,sort_keys=True,ensure_ascii=False))
          PY
