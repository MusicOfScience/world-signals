name: BT CBSL RSS one-shot live preflight

on:
  push:
    branches:
      - feature/post-bs-rbi-rss-bt

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and materialise BT post-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2b74c10905760c98c75b3598df96441f99841b00"
          test "$(git merge-base HEAD origin/main)" = "2b74c10905760c98c75b3598df96441f99841b00"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          python scripts/apply_cbsl_mpr_rss_monitor_bt.py
          WORLD_SIGNALS_APPLY_MONITOR_BT=1 python scripts/apply_cbsl_mpr_rss_monitor_bt.py --apply
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/bt-live-protected.before
      - name: Audit exact five-file materialisation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          },changed
          PY
      - name: Execute exactly one official CBSL MPR RSS request and real review comparator
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters import fetch_cbsl_mpr_rss
          from world_signals.cbsl_monetary_monitor import cbsl_mpr_rss_review_candidates

          items,snap=fetch_cbsl_mpr_rss(timeout=30)
          assert snap.status==200
          assert len(items)>0

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(x for x in monitor['adapters'] if x['adapter_id']=='CBSL_MONETARY_POLICY_RSS')
          candidates,observations=cbsl_mpr_rss_review_candidates(canonical['records'],items,config)

          configured=set(config['canonical_occurrence_ids'])
          assert configured=={'WSO-REG-J-0006','WSO-REG-J-0007'}
          historical={(x.review_year,x.review_number,x.link_date) for x in items}
          assert {
            (2026,1,'2026-01-28'),
            (2026,2,'2026-03-25'),
            (2026,3,'2026-05-26'),
            (2026,4,'2026-07-22'),
          }.issubset(historical)
          assert not any(x.review_year==2026 and x.review_number in {5,6} for x in items)
          # On 8 September, neither the 30 September nor 20 November public
          # announcement can legitimately exist. A positive candidate would
          # indicate classifier/scope drift and must fail closed.
          assert candidates==[],candidates
          absence=[x for x in observations if x['type']=='CBSL_RSS_ABSENCE_HAS_NO_SCHEDULE_LIFECYCLE_OR_CERTAINTY_SEMANTICS']
          assert len(absence)==1
          assert absence[0]['matched_occurrence_count']==0
          outside=[x for x in observations if x['type']=='CBSL_MONETARY_POLICY_REVIEW_PUBLICATION_OUTSIDE_CONFIGURED_SCOPE']
          assert len(outside)>=4
          assert config['request_budget_per_run']==1
          assert config['schedule_authority'] is False
          assert config['lifecycle_authority'] is False
          assert config['certainty_authority'] is False
          assert config['rss_has_publication_clock'] is False
          assert config['official_link_filename_date_is_clock_time'] is False
          assert config['canonical_clock_mutation_allowed'] is False
          assert config['automatic_item_link_fetch_allowed'] is False
          assert config['automatic_schedule_html_fetch_allowed'] is False
          assert config['automatic_commit_allowed'] is False

          print(json.dumps({
            'status':snap.status,
            'content_type':snap.content_type,
            'body_sha256':snap.body_sha256,
            'item_count':len(items),
            'historical_2026_review_count':sum(x.review_year==2026 and x.review_number<=4 for x in items),
            'review_candidate_count':len(candidates),
            'configured_match_count':absence[0]['matched_occurrence_count'],
            'request_count':1,
            'item_link_followup_request_count':0,
            'schedule_html_followup_request_count':0,
            'rss_has_publication_clock':False,
            'official_link_filename_date_is_clock_time':False,
            'automatic_commit_allowed':False,
          },indent=2,sort_keys=True))
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/cbsl_rss.py src/world_signals/cbsl_monetary_monitor.py scripts/apply_cbsl_mpr_rss_monitor_bt.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore materialisation byte-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/bt-live-protected.after
          diff -u /tmp/bt-live-protected.before /tmp/bt-live-protected.after
          git restore -- data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          rm -rf docs
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
