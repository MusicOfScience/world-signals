name: TEMP priority anchor R inventory

on:
  push:
    branches:
      - feature/priority-region-historical-anchors-r
    paths:
      - .github/workflows/_temp-priority-anchor-r.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print available source ID ranges and dependency counts
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          sources=json.loads(Path('data/sources/registry.json').read_text())
          for prefix in ['WSSRC-MAC-','WSSRC-REG-','WSSRC-REGJ-','WSSRC-REG2-']:
              rows=[s for s in sources['sources'] if str(s.get('source_id','')).startswith(prefix)]
              print('\n',prefix,'COUNT',len(rows))
              for s in sorted(rows,key=lambda x:x['source_id']):
                  print(s['source_id'], s.get('institution'), 'deps=',s.get('canonical_dependency_count'), 'role=',s.get('endpoint_role'))
          print('\nTOTAL',sources['version'],len(sources['sources']))
          PY
