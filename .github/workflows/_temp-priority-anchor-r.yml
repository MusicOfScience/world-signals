name: TEMP priority anchor R inventory

on:
  push:
    branches:
      - feature/priority-region-historical-anchors-r
    paths:
      - .github/workflows/_temp-priority-anchor-r.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print completion change ledger and assertion contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          schema=json.loads(Path('data/canonical/schema.json').read_text())
          ledger=json.loads(Path('data/changes/ledger.json').read_text())

          print('CHECKPOINT', canonical['version'], len(canonical['records']), ledger.get('version'), len(ledger.get('changes',[])))
          print('\n=== COMPLETION LEDGER ENTRIES ===')
          wanted={'WSO-MAC-A-0025','WSO-8df73c7804d45880'}
          for row in ledger.get('changes',[]):
              if row.get('occurrence_id') in wanted:
                  print(json.dumps(row, indent=2, sort_keys=True))

          print('\n=== SCHEMA SOURCE ASSERTION FIELDS ===')
          print(json.dumps(schema.get('source_assertion_fields'), indent=2, sort_keys=True))
          print('\n=== SCHEMA OCCURRENCE CHANGE FIELDS ===')
          print(json.dumps(schema.get('occurrence_change_fields'), indent=2, sort_keys=True))
          print('\n=== CONTROLLED VOCABULARIES RELEVANT ===')
          vocab=schema.get('controlled_vocabularies') or {}
          for key in sorted(vocab):
              if any(token in key.lower() for token in ['change','review','assert','lifecycle','certainty','evidence','status']):
                  print(key, json.dumps(vocab[key], sort_keys=True))

          print('\n=== RECENT LEDGER SHAPE SAMPLE ===')
          for row in ledger.get('changes',[])[-5:]:
              print(json.dumps(row, indent=2, sort_keys=True))
          PY
