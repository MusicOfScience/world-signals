name: TEMP priority anchor R inventory

on:
  push:
    branches:
      - feature/priority-region-historical-anchors-r
    paths:
      - .github/workflows/_temp-priority-anchor-r.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print completed-anchor and target-series semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          schema=json.loads(Path('data/canonical/schema.json').read_text())
          by_occ={r['occurrence_id']:r for r in canonical['records']}
          by_source={s['source_id']:s for s in sources['sources']}

          print('CHECKPOINT', canonical['version'], len(canonical['records']), sources['version'], len(sources['sources']), schema['version'])

          print('\n=== COMPLETED REPRESENTATIVES ===')
          for oid in ['WSO-MAC-A-0025','WSO-8df73c7804d45880']:
              print(oid)
              print(json.dumps(by_occ[oid], indent=2, sort_keys=True))

          print('\n=== TARGET SERIES REPRESENTATIVES ===')
          targets=['WSER-MAC-IN-GDP','WSER-REG-ID-BI','WSER-REGJ-EG-CBE-MPC','WSER-REG2-AR-CPI']
          for sid in targets:
              rows=[r for r in canonical['records'] if r.get('series_id')==sid]
              print('\nSERIES', sid, 'COUNT', len(rows))
              for r in rows[:2]: print(json.dumps(r, indent=2, sort_keys=True))

          print('\n=== TARGET SOURCE ROWS ===')
          for sid in ['WSSRC-MAC-017','WSSRC-REG-004','WSSRC-REGJ-005','WSSRC-REG2-006']:
              print(sid)
              print(json.dumps(by_source[sid], indent=2, sort_keys=True))

          print('\n=== REGISTRY TOP-LEVEL KEYS ===')
          print(sorted(canonical.keys()))
          print('\n=== SCHEMA CONTROLLED VALUES / FIELD NAMES ===')
          print(json.dumps({
            'top_keys': sorted(schema.keys()),
            'lifecycle_values': schema.get('lifecycle_status_values'),
            'certainty_values': schema.get('certainty_values'),
            'timing_types': schema.get('timing_type_values'),
            'publication_time_semantics_values': schema.get('publication_time_semantics_values'),
            'record_required_fields': schema.get('record_required_fields'),
          }, indent=2, sort_keys=True))
          PY
