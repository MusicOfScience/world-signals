name: TEMP priority anchor R reviewed apply

on:
  push:
    branches:
      - feature/priority-region-historical-anchors-r
    paths:
      - .github/workflows/_temp-priority-anchor-r.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact reviewed pre-state
        shell: bash
        run: |
          set -euo pipefail
          BASE=a8bfb87bb7e889381ba67ab83c5f32218e6c2bd2
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- data/canonical/registry.json data/canonical/schema.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/monitor/expectations.json data/monitor/operations_policy.json data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
      - name: Re-run fail-closed check-only transaction
        run: python scripts/apply_priority_region_historical_anchors_r.py
      - name: Apply reviewed transaction to working tree
        env:
          WORLD_SIGNALS_APPLY_HISTORICAL_ANCHORS_R: YES
        run: python scripts/apply_priority_region_historical_anchors_r.py --apply
      - name: Validate exact reviewed post-state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_priority_region_historical_anchors_r -v
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          l=json.loads(Path('data/changes/ledger.json').read_text())
          o=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          assert (c['version'],c['record_count'],len(c['records']))==('0.29',678,678)
          assert (s['version'],len(s['sources']))==('1.71',236)
          assert (l['version'],len(l['changes']))==('0.16',48)
          assert (o['version'],o['canonical_checkpoint'])==('0.4',{'registry_version':'0.29','record_count':678})
          PY
      - name: Assert write boundary and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            data/canonical/registry.json
            data/changes/ledger.json
            data/coverage/PRIORITY_REGION_HISTORICAL_ANCHORS_R_TRANSACTION_AUDIT_v0.1.md
            data/coverage/biosecurity_overlay.json
            data/sources/registry.json
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code HEAD -- data/canonical/schema.json data/monitor/expectations.json data/monitor/operations_policy.json data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
          git rm .github/workflows/_temp-priority-anchor-r.yml
          git add data/canonical/registry.json data/changes/ledger.json data/coverage/PRIORITY_REGION_HISTORICAL_ANCHORS_R_TRANSACTION_AUDIT_v0.1.md data/coverage/biosecurity_overlay.json data/sources/registry.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_staged=(
            .github/workflows/_temp-priority-anchor-r.yml
            data/canonical/registry.json
            data/changes/ledger.json
            data/coverage/PRIORITY_REGION_HISTORICAL_ANCHORS_R_TRANSACTION_AUDIT_v0.1.md
            data/coverage/biosecurity_overlay.json
            data/sources/registry.json
          )
          printf '%s\n' "${expected_staged[@]}" | sort > /tmp/expected_staged
          printf '%s\n' "${staged[@]}" | sort > /tmp/actual_staged
          diff -u /tmp/expected_staged /tmp/actual_staged
      - name: Commit reviewed feature-branch transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git commit -m "Apply priority-region historical anchor transaction R [skip ci]"
          git push origin HEAD:feature/priority-region-historical-anchors-r
