name: TEMP P1 selected metadata diagnostic

on:
  push:
    branches:
      - source-governance-p1-selection-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Inspect selected source metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('data/sources/registry.json').read_text())
          ids={'WSSRC-INT-010','WSSRC-INT-017','WSSRC-REG2-002','WSSRC-REG6-002','WSSRC-REG-011','WSSRC-INT-026','WSSRC-REG6-001','WSSRC-REG5-001'}
          for s in src.get('sources',[]):
              if s.get('source_id') in ids:
                  keep={k:s.get(k,'__ABSENT__') for k in [
                    'source_id','institution','jurisdiction','domain','authoritative_url','backup_authoritative_source',
                    'canonical_dependency_count','canonical_provenance_use','automated_monitoring_use','verification_mode',
                    'monitoring_readiness_status','monitoring_activation_status','governance_backfill_reviewed_at','governance_backfill_basis'
                  ]}
                  print(json.dumps(keep,ensure_ascii=False,sort_keys=True))
          PY
