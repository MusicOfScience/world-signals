name: Preflight WORLD SIGNALS P0 source governance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-governance-p0-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: P0 governance migration tests
        run: python -m unittest tests.test_source_governance_p0 -v
      - name: Check-only transaction against current state
        run: python scripts/apply_source_governance_p0.py
      - name: Canonical registry validation
        run: python scripts/validate_registry.py
      - name: Check-only must leave repository untouched
        run: git diff --exit-code
