name: WORLD SIGNALS AK tightened exact-market preflight

on:
  push:
    branches:
      - feature/post-aj-pressure-audit-ak
    paths:
      - .github/workflows/tmp-exact-market-contract-ak-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AJ base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=53e98457b70aa0dda4da490d5fe3210ce333ecae
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
      - name: Simulate tightened exact-market contract without writes
        run: python scripts/apply_exact_market_measurement_contract_ak.py --check
      - name: Exercise synthetic exact-series and rights-provenance fixtures
        run: python -m unittest tests.test_exact_market_measurement_contract_ak -v
      - name: Validate current canonical registry
        run: python scripts/validate_registry.py
      - name: Validate current Analysis layer
        run: python scripts/validate_analysis.py
      - name: Run full repository suite on unchanged production state
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q scripts src tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Build static site from unchanged production state
        run: python scripts/build_site.py
