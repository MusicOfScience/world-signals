name: BP Federal Reserve monetary RSS read-only diagnostic

on:
  push:
    branches:
      - feature/post-bo-fed-monetary-rss-monitor-bp

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BO base and governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          test "$(git merge-base HEAD origin/main)" = "edc800a694370b66d4c5c6d0a465fb3e5e554218"
          python - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert (sources['version'],len(sources['sources']))==('1.88',247)
          assert (monitor['version'],len(monitor['adapters']))==('0.13',11)
          assert not any(r.get('source_id')=='WSSRC-CB-015' for r in sources['sources'])
          assert not any(r.get('adapter_id')=='FED_MONETARY_POLICY_RSS' for r in monitor['adapters'])
          fomc=next(r for r in sources['sources'] if r['source_id']=='WSSRC-CB-001')
          assert fomc['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert fomc['monitoring_activation_status']=='ENDPOINT_PERMISSION_HOLD_NO_PRODUCTION_ROUTE'
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False
          PY
      - name: Derive exact FOMC Canonical publication scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          all_rows=[r for r in canonical['records'] if r.get('source_id')=='WSSRC-CB-001']
          assert len(all_rows)==44
          publication_series={'WS.CB.FED.FOMC_POLICY_DECISION','WS.CB.FED.FOMC_MINUTES'}
          rows=[r for r in all_rows if r.get('series_id') in publication_series]
          rows.sort(key=lambda r:(r.get('start_local') or '',r['series_id'],r['occurrence_id']))
          assert len(rows)==22
          assert Counter(r['series_id'] for r in rows)==Counter({'WS.CB.FED.FOMC_POLICY_DECISION':11,'WS.CB.FED.FOMC_MINUTES':11})
          assert {r.get('source_timezone') for r in rows}=={'America/New_York'}
          assert all(r.get('time_precision')=='MINUTE' for r in rows)
          print('FOMC_PUBLICATION_SCOPE='+json.dumps([{k:r.get(k) for k in ('occurrence_id','series_id','start_local','source_id','source_timezone','time_precision','lifecycle_status')} for r in rows],sort_keys=True))
          PY
      - name: Probe official Fed RSS and policy pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re
          from urllib.request import Request,urlopen
          from xml.etree import ElementTree as ET

          UA='WORLD-SIGNALS/0.1 read-only governance probe'
          urls={
            'rss':'https://www.federalreserve.gov/feeds/press_monetary.xml',
            'feeds':'https://www.federalreserve.gov/feeds/feeds.htm',
            'disclaimer':'https://www.federalreserve.gov/disclaimer.htm',
          }
          bodies={}
          meta={}
          for key,url in urls.items():
            req=Request(url,headers={'User-Agent':UA,'Accept':'application/rss+xml,application/xml,text/xml,text/html,*/*;q=0.1'})
            with urlopen(req,timeout=30) as resp:
              body=resp.read()
              bodies[key]=body
              meta[key]={'status':resp.status,'content_type':resp.headers.get('Content-Type'),'length':len(body),'sha256':hashlib.sha256(body).hexdigest(),'final_url':resp.geturl()}
              assert resp.status==200
          feeds_text=re.sub(r'\s+',' ',bodies['feeds'].decode('utf-8','replace')).lower()
          disclaimer_text=re.sub(r'\s+',' ',bodies['disclaimer'].decode('utf-8','replace')).lower()
          assert 'rss' in feeds_text and 'reader' in feeds_text and 'aggregator' in feeds_text
          assert 'automatically incorporates changes' in feeds_text
          assert 'public domain' in disclaimer_text and 'copied and distributed without permission' in disclaimer_text

          root=ET.fromstring(bodies['rss'])
          assert root.tag.lower().endswith('rss')
          channel=root.find('channel')
          assert channel is not None
          items=[]
          for item in channel.findall('item'):
            row={tag:(item.findtext(tag) or '').strip() for tag in ('title','link','description','pubDate','guid')}
            items.append(row)
          assert items
          monetary=[r for r in items if 'fomc' in (r['title']+' '+r['description']).lower() or 'federal open market committee' in (r['title']+' '+r['description']).lower()]
          assert monetary
          statement=[r for r in monetary if 'statement' in (r['title']+' '+r['description']).lower()]
          minutes=[r for r in monetary if 'minutes' in (r['title']+' '+r['description']).lower()]
          assert statement, 'no FOMC statement item found in current feed'
          assert minutes, 'no FOMC minutes item found in current feed'
          print('FED_RSS_META='+json.dumps(meta,sort_keys=True))
          print('FED_RSS_ITEM_COUNT=',len(items))
          print('FED_RSS_MONETARY_MATCH_COUNT=',len(monetary))
          print('FED_RSS_STATEMENT_MATCHES='+json.dumps(statement[:5],sort_keys=True))
          print('FED_RSS_MINUTES_MATCHES='+json.dumps(minutes[:5],sort_keys=True))
          PY
      - name: Verify repository byte-clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
