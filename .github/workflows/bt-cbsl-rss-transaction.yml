name: BT CBSL RSS controlled transaction

on:
  push:
    branches:
      - feature/post-bs-rbi-rss-bt

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BS ancestry and clean workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2b74c10905760c98c75b3598df96441f99841b00"
          test "$(git merge-base HEAD origin/main)" = "2b74c10905760c98c75b3598df96441f99841b00"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/bt-transaction-protected.before
      - name: Materialise bounded BT post-state through reviewed helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_cbsl_mpr_rss_monitor_bt.py
          WORLD_SIGNALS_APPLY_MONITOR_BT=1 python scripts/apply_cbsl_mpr_rss_monitor_bt.py --apply
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          }
          assert changed==expected,(changed,expected)
          PY
      - name: Validate complete materialised repository
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/cbsl_rss.py src/world_signals/cbsl_monetary_monitor.py scripts/apply_cbsl_mpr_rss_monitor_bt.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers, self-remove transaction, and commit exact boundary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/bt-transaction-protected.after
          diff -u /tmp/bt-transaction-protected.before /tmp/bt-transaction-protected.after
          rm .github/workflows/bt-cbsl-rss-transaction.yml
          git add data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py .github/workflows/bt-cbsl-rss-transaction.yml
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
            '.github/workflows/bt-cbsl-rss-transaction.yml',
          }
          assert staged==expected,(staged,expected)
          unstaged=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert not unstaged,unstaged
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert not untracked,untracked
          PY
          git config user.name "world-signals-transaction"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "BT: materialise CBSL RSS monitor activation"
          git push origin HEAD:feature/post-bs-rbi-rss-bt
