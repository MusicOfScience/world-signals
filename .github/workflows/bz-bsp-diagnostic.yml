name: BZ BSP schedule diagnostic

on:
  push:
    branches:
      - feature/post-by-pressure-audit-bz
    paths:
      - .github/workflows/bz-bsp-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and probe alternate BSP publication schedule
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ccb20539c10d0965de84efa298ba75634c19249
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import hashlib, html, json, re, urllib.request, urllib.robotparser
          from html.parser import HTMLParser
          from pathlib import Path

          SOURCE_ID='WSSRC-REGJ-003'
          ROBOTS='https://www.bsp.gov.ph/robots.txt'
          CANONICAL_SCHEDULE='https://www.bsp.gov.ph/Pages/PriceStability/ScheduleOfMeetingsOfTheAdvisoryCommitteeAndMonetaryBoardOnMonetaryPolicy.aspx'
          ARS='https://www.bsp.gov.ph/Statistics/Advance%20Release%20Schedule/AdvanceReleaseSchedule.aspx'
          UA='WORLD-SIGNALS-read-only-monitor/0.1'

          C=json.loads(Path('data/canonical/registry.json').read_text())
          S=json.loads(Path('data/sources/registry.json').read_text())
          src=[x for x in S['sources'] if x.get('source_id')==SOURCE_ID]
          assert len(src)==1
          deps=[r for r in C['records'] if r.get('source_id')==SOURCE_ID]
          assert len(deps)==src[0]['canonical_dependency_count']==2
          expected={r['occurrence_id']:r['start_local'] for r in deps}
          assert expected=={'WSO-REG-J-0008':'2026-10-22','WSO-REG-J-0009':'2026-12-17'}
          for r in deps:
              assert r['source_timezone']=='Asia/Manila'
              assert r['timing_type']=='CIVIL_DATE'
              assert r['time_precision']=='DAY'
              assert r['lifecycle_status']=='PLANNED'
              assert r['certainty_status']=='CONFIRMED'

          requests=[]
          def get(url,accept):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  body=resp.read()
                  meta={'url':url,'status':resp.status,'content_type':resp.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
                  requests.append(meta); print('FETCH',json.dumps(meta,sort_keys=True)); return resp.headers,body

          rh,rb=get(ROBOTS,'text/plain,*/*;q=0.1')
          assert requests[-1]['status']==200
          text=rb.decode('utf-8','replace')
          assert '<html' not in text.lower() and '<!doctype' not in text.lower()
          assert any(line.lstrip().lower().startswith('user-agent:') for line in text.splitlines())
          rp=urllib.robotparser.RobotFileParser(); rp.set_url(ROBOTS); rp.parse(text.splitlines())
          policy={
              'canonical_schedule_allowed':rp.can_fetch(UA,CANONICAL_SCHEDULE),
              'advance_release_schedule_allowed':rp.can_fetch(UA,ARS),
              'crawl_delay':rp.crawl_delay(UA) or rp.crawl_delay('*') or 0,
              'lines':len(text.splitlines()),
          }
          print('ROBOTS_POLICY',json.dumps(policy,sort_keys=True))
          assert policy['canonical_schedule_allowed'] is False
          assert policy['advance_release_schedule_allowed'] is True

          ah,ab=get(ARS,'text/html,*/*;q=0.1')
          assert len(requests)==2
          ct=(ah.get('Content-Type') or '').lower(); assert 'html' in ct
          assert len(ab)>10000
          raw=ab.decode('utf-8','replace'); low=raw.lower()
          for marker in ('request rejected','access denied','captcha','cf-chl-'):
              assert marker not in low,marker

          class Visible(HTMLParser):
              def __init__(self): super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style','noscript'): self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style','noscript') and self.skip: self.skip-=1
              def handle_data(self,data):
                  if not self.skip: self.parts.append(data)
          p=Visible(); p.feed(raw)
          visible=' '.join(html.unescape(' '.join(p.parts)).split())
          assert 'Advance Release Schedule' in visible
          assert 'Press Release on Monetary Policy Stance' in visible

          # Require the two exact future release dates near the exact publication label.
          label='Press Release on Monetary Policy Stance'
          positions=[m.start() for m in re.finditer(re.escape(label),visible,re.I)]
          assert positions, 'monetary-policy stance label absent'
          windows=[visible[max(0,i-500):i+1200] for i in positions]
          joined=' '.join(windows)
          oct_match=bool(re.search(r'(Oct(?:ober)?\s+22|22\s+Oct(?:ober)?)',joined,re.I))
          dec_match=bool(re.search(r'(Dec(?:ember)?\s+17|17\s+Dec(?:ember)?)',joined,re.I))
          assert oct_match and dec_match,(oct_match,dec_match,joined[:1500])
          result={
              'source_role':'SEPARATE_FIRST_PARTY_PUBLICATION_SCHEDULE_CANDIDATE',
              'canonical_source_unchanged':SOURCE_ID,
              'occurrence_ids':sorted(expected),
              'oct_22_match':oct_match,
              'dec_17_match':dec_match,
              'visible_chars':len(visible),
              'requests':len(requests),
              'followups':0,
              'clock_inference':False,
              'lifecycle_authority':False,
              'certainty_authority':False,
              'canonical_mutation':False,
          }
          print('SEMANTICS',json.dumps(result,sort_keys=True))
          print('REQUESTS',json.dumps(requests,sort_keys=True))
          PY
