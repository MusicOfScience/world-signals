name: BZ BSP schedule diagnostic

on:
  push:
    branches:
      - feature/post-by-pressure-audit-bz
    paths:
      - .github/workflows/bz-bsp-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and perform bounded BSP probe
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ccb20539c10d0965de84efa298ba75634c19249
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import hashlib, html, json, re, time, urllib.request, urllib.robotparser
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          SOURCE_ID='WSSRC-REGJ-003'
          ROBOTS='https://www.bsp.gov.ph/robots.txt'
          SCHEDULE='https://www.bsp.gov.ph/Pages/PriceStability/ScheduleOfMeetingsOfTheAdvisoryCommitteeAndMonetaryBoardOnMonetaryPolicy.aspx'
          UA='WORLD-SIGNALS-read-only-monitor/0.1'

          C=json.loads(Path('data/canonical/registry.json').read_text())
          S=json.loads(Path('data/sources/registry.json').read_text())
          src=[x for x in S['sources'] if x.get('source_id')==SOURCE_ID]
          assert len(src)==1
          deps=[r for r in C['records'] if r.get('source_id')==SOURCE_ID]
          assert len(deps)==src[0]['canonical_dependency_count']==2
          print('SOURCE',json.dumps({k:src[0].get(k) for k in ('source_id','institution','authoritative_url','automated_monitoring_use','automated_retrieval_permission','monitoring_readiness_status','monitoring_activation_status','canonical_dependency_count')},sort_keys=True))
          print('CANONICAL',json.dumps([{k:r.get(k) for k in ('occurrence_id','canonical_name','start_local','source_timezone','timing_type','time_precision','lifecycle_status','certainty_status','series_id')} for r in deps],sort_keys=True))

          requests=[]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/plain,text/html;q=0.9,*/*;q=0.1'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  body=resp.read()
                  meta={'url':url,'status':resp.status,'content_type':resp.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
                  requests.append(meta); print('FETCH',json.dumps(meta,sort_keys=True)); return resp.headers,body

          rh,rb=get(ROBOTS)
          assert requests[-1]['status']==200
          text=rb.decode('utf-8','replace')
          assert '<html' not in text.lower() and '<!doctype' not in text.lower()
          assert any(line.lstrip().lower().startswith('user-agent:') for line in text.splitlines())
          rp=urllib.robotparser.RobotFileParser(); rp.set_url(ROBOTS); rp.parse(text.splitlines())
          allowed=rp.can_fetch(UA,SCHEDULE)
          delay=rp.crawl_delay(UA) or rp.crawl_delay('*') or 0
          print('ROBOTS_POLICY',json.dumps({'allowed':allowed,'crawl_delay':delay,'lines':len(text.splitlines())},sort_keys=True))
          assert allowed
          if delay: time.sleep(min(float(delay),10.0))

          sh,sb=get(SCHEDULE)
          assert len(requests)==2
          ct=(sh.get('Content-Type') or '').lower(); assert 'html' in ct
          assert len(sb)>10000
          raw=sb.decode('utf-8','replace')
          low=raw.lower()
          for marker in ('request rejected','access denied','captcha','cf-chl-'):
              assert marker not in low,marker

          class T(HTMLParser):
              def __init__(self): super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style','noscript'): self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style','noscript') and self.skip: self.skip-=1
              def handle_data(self,data):
                  if not self.skip: self.parts.append(data)
          p=T(); p.feed(raw)
          visible=' '.join(html.unescape(' '.join(p.parts)).split())
          assert 'Calendar of Monetary Policy Meetings' in visible
          assert '2026 Schedule of Monetary Policy Meetings' in visible
          assert re.search(r'Oct\s+22\s*\(Thu',visible,re.I)
          assert re.search(r'Dec\s+17\s*\(Thu',visible,re.I)
          print('SEMANTICS',json.dumps({'oct_22':True,'dec_17':True,'visible_chars':len(visible),'requests':len(requests),'followups':0,'clock_inference':False,'canonical_mutation':False},sort_keys=True))
          print('REQUESTS',json.dumps(requests,sort_keys=True))
          PY
