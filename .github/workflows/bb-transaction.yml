name: BB controlled BARMM Canonical transaction

on:
  push:
    branches:
      - feature/post-ba-barmm-election-anchor-bb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact base and untouched BB prestate
        run: |
          set -euo pipefail
          git fetch origin main
          expected=b8c5372198e3141c4c3f79ace13083877447f71b
          test "$(git rev-parse origin/main)" = "$expected"
          test "$(git merge-base HEAD origin/main)" = "$expected"
          python scripts/apply_barmm_parliamentary_election_bb.py --check-only
          python - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          ledger=json.loads(Path('data/changes/ledger.json').read_text())
          overlay=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          assert canonical['version']=='0.38' and canonical['record_count']==688
          assert sources['version']=='1.80' and len(sources['sources'])==243
          assert ledger['version']=='0.24' and len(ledger['changes'])==59
          assert overlay['version']=='0.13' and overlay['canonical_checkpoint']=={'registry_version':'0.38','record_count':688}
          assert not any(r.get('occurrence_id')=='WSO-EL-PH-BARMM-20260914' for r in canonical['records'])
          assert not any(r.get('source_id')=='WSSRC-EL-PH-001' for r in sources['sources'])
          assert not any(r.get('change_id')=='WSCHANGE-138c3977e91ced60d8' for r in ledger['changes'])
          PY

      - name: Capture protected hashes
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/schema.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json > /tmp/bb-protected.sha256

      - name: Materialise BB governed target
        env:
          WORLD_SIGNALS_BB_ALLOW_WRITE: '1'
        run: |
          set -euo pipefail
          python scripts/apply_barmm_parliamentary_election_bb.py --apply

      - name: Validate materialised repository completely
        run: |
          set -euo pipefail
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/apply_japan_fies_live_analysis_az.py scripts/apply_analysis_revision_contract_ba.py scripts/apply_barmm_parliamentary_election_bb.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          python scripts/build_site.py
          rm -rf docs

      - name: Prove protected hashes and exact six governed mutations
        run: |
          set -euo pipefail
          sha256sum -c /tmp/bb-protected.sha256
          git status --porcelain | awk '{print $2}' | sort > /tmp/actual
          printf '%s\n' \
            PROJECT_STATUS.md \
            ROADMAP.md \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/sources/registry.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          python - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          ledger=json.loads(Path('data/changes/ledger.json').read_text())
          overlay=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          assert canonical['version']=='0.39' and canonical['record_count']==689 and len(canonical['records'])==689
          assert sources['version']=='1.81' and len(sources['sources'])==244
          assert ledger['version']=='0.25' and len(ledger['changes'])==60
          assert overlay['version']=='0.14' and overlay['canonical_checkpoint']=={'registry_version':'0.39','record_count':689}
          row=next(r for r in canonical['records'] if r.get('occurrence_id')=='WSO-EL-PH-BARMM-20260914')
          assert row['timing_type']=='CIVIL_DATE'
          assert row['start_local']=='2026-09-14'
          assert row['source_timezone']=='Asia/Manila'
          assert row['start_utc'] is None and row['end_utc'] is None
          assert row['lifecycle_status']=='PLANNED' and row['certainty_status']=='CONFIRMED'
          assert row['election_milestone_type']=='POLL_GENERAL'
          assert row['source_id']=='WSSRC-EL-PH-001'
          assert row['observed_market_response'] is None
          source=next(r for r in sources['sources'] if r.get('source_id')=='WSSRC-EL-PH-001')
          assert source['automated_monitoring_use']=='PROHIBITED_OR_RIGHTS_HOLD'
          assert source['monitoring_readiness_status']=='RIGHTS_AUDIT_REQUIRED'
          assert source['verification_mode']=='RIGHTS_HELD_MANUAL_ONLY'
          PY

      - name: Write permanent BB transaction audit
        run: |
          set -euo pipefail
          cat > data/coverage/BARMM_PARLIAMENTARY_ELECTION_BB_TRANSACTION_AUDIT_v0.1.md <<EOF
          # BARMM Parliamentary Election BB — Transaction Audit v0.1

          ## Transaction identity

          - Branch: \`feature/post-ba-barmm-election-anchor-bb\`
          - Exact post-BA main base: \`b8c5372198e3141c4c3f79ace13083877447f71b\`
          - Final green read-only preflight: GitHub Actions run \`34032205529\`
          - Controlled transaction run: GitHub Actions run \`${GITHUB_RUN_ID}\`
          - Merge policy: **manual merge only; no auto-merge**

          ## Pressure-audit decision

          BB repairs a first-order elections/governance coverage gap with one bounded BARMM parliamentary-election occurrence. The authoritative date source is the Philippine Commission on Elections (COMELEC) BARMM election calendar. Context from other institutions is not promoted into Canonical date authority.

          ## Canonical transaction

          - Canonical Registry: **v0.38 / 688 → v0.39 / 689**
          - Source Registry: **v1.80 / 243 → v1.81 / 244**
          - reviewed Change Ledger: **v0.24 / 59 → v0.25 / 60**
          - biosecurity overlay: **v0.13 → v0.14 checkpoint alignment only**, with non-version/checkpoint semantics unchanged
          - Live Intelligence: **unchanged v0.4 / 4 observations / 6 evidence rows**
          - Analysis: **unchanged schema v0.7 / 21 reviews / 95 evidence rows**
          - production \`live_inputs\`: **unchanged at 1**
          - production Analysis revisions: **unchanged at 0**
          - production \`EXACT_TIMESTAMP_SERIES\`: **unchanged at 0**

          New stable occurrence: \`WSO-EL-PH-BARMM-20260914\`, series \`WSER-EL-PH-BARMM-PE\`, source \`WSSRC-EL-PH-001\`, ledger entry \`WSCHANGE-138c3977e91ced60d8\`.

          The election is represented as **14 September 2026**, \`CIVIL_DATE\`, \`Asia/Manila\`, \`DAY\` precision, \`PLANNED\`, \`CONFIRMED\`, milestone \`POLL_GENERAL\`. No polling clock time, UTC timestamp, result, or observed market response is invented.

          ## Source governance

          COMELEC is admitted for manual authoritative provenance. Automated monitoring remains explicitly closed: \`PROHIBITED_OR_RIGHTS_HOLD\`, \`RIGHTS_AUDIT_REQUIRED\`, \`RIGHTS_HELD_MANUAL_ONLY\`. Candidate-content collection and raw-evidence redistribution are not authorised by BB.

          ## Mutation boundary

          The transaction changed exactly six governed state files:

          1. \`data/canonical/registry.json\`
          2. \`data/sources/registry.json\`
          3. \`data/changes/ledger.json\`
          4. \`data/coverage/biosecurity_overlay.json\`
          5. \`PROJECT_STATUS.md\`
          6. \`ROADMAP.md\`

          This audit document is a seventh permanent transaction record, not Canonical/event state. Canonical schema, monitor expectations/operations, Live Intelligence data/schema and Analysis data/schema were hash-protected and unchanged.

          ## Preflight regressions repaired before transaction

          The repeated ephemeral preflights exposed historical tests/helpers that incorrectly treated old checkpoint values as permanent descendant ceilings. Repairs followed the rule **freeze history, not descendants**:

          - BA status handling now preserves the frozen Analysis-revision foundation while allowing later valid status checkpoints.
          - BB tests validate both exact prestate simulation and reviewed poststate without permitting transaction replay.
          - AZ status and CLI guards preserve the inaugural one-input Live→Analysis contract while accepting reviewed Analysis descendants.
          - AV public Live projection metadata now reports the actual current Canonical build checkpoint while its AV foundation checkpoint remains separately frozen.

          Failed diagnostic/preflight runs did not commit BB governed data; runners restored ephemeral changes and temporary workflows were removed. The final preflight passed the untouched and ephemeral-BB full repository test/build gates, protected-file hashes, exact mutation boundary and clean restoration.

          ## Validation

          The controlled transaction re-ran Live Intelligence validation, Analysis validation, full unittest discovery, Python compilation, JavaScript syntax checks and static-site build before any governed target commit. Protected hashes and the exact six-file governed mutation boundary were rechecked after materialisation.

          Automatic Canonical commit remains off outside this reviewed transaction. Calendar writes remain off. No downstream Live or Analysis population is authorised by BB.
          EOF
          sed -i 's/^          //' data/coverage/BARMM_PARLIAMENTARY_ELECTION_BB_TRANSACTION_AUDIT_v0.1.md

      - name: Commit exact target plus audit and self-remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            PROJECT_STATUS.md \
            ROADMAP.md \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/sources/registry.json \
            data/coverage/BARMM_PARLIAMENTARY_ELECTION_BB_TRANSACTION_AUDIT_v0.1.md
          git diff --cached --name-only | sort > /tmp/actual
          printf '%s\n' \
            PROJECT_STATUS.md \
            ROADMAP.md \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/sources/registry.json \
            data/coverage/BARMM_PARLIAMENTARY_ELECTION_BB_TRANSACTION_AUDIT_v0.1.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "BB: materialise BARMM election Canonical anchor"
          git rm .github/workflows/bb-transaction.yml
          git commit -m "BB: remove temporary controlled transaction workflow"
          git push origin HEAD:feature/post-ba-barmm-election-anchor-bb
