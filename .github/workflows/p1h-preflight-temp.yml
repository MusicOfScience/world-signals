name: TEMP P1-H governance preflight

on:
  push:
    branches:
      - source-governance-p1h-research

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Guarded read-only P1-H preflight
        run: python scripts/apply_source_governance_p1h.py
      - name: Validate canonical/source registry
        run: python scripts/validate_registry.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python monitor/governance code
        run: python -m py_compile scripts/apply_source_governance_p1h.py scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/run_live_monitor.py src/world_signals/source_governance_audit.py
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Build static site
        run: python scripts/build_site.py
      - name: Confirm read-only repository state
        run: git diff --exit-code
