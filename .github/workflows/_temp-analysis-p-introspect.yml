name: TEMP analysis P registry introspection

on:
  push:
    branches:
      - feature/analytical-layer-foundation-p
    paths:
      - .github/workflows/_temp-analysis-p-introspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print recent canonical event candidates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          r=json.loads(Path('data/canonical/registry.json').read_text())
          rows=[]
          for x in r['records']:
              vals=[]
              for k in ('start_utc','start_local','publication_datetime','date_earliest','date_latest'):
                  v=x.get(k)
                  if v: vals.append(str(v))
              if any(v.startswith(('2026-09-01','2026-09-02','2026-09-03','2026-09-04','2026-09-05')) for v in vals):
                  rows.append({k:x.get(k) for k in (
                      'occurrence_id','series_id','institution','jurisdiction','event_type','subcategory',
                      'certainty_status','lifecycle_status','timing_type','start_local','start_utc',
                      'publication_datetime','source_id','intrinsic_importance','expected_market_sensitivity'
                  )})
          print(json.dumps(rows, indent=2, sort_keys=True))
          print('candidate_count=',len(rows))
          if not rows:
              raise SystemExit('no recent canonical candidates')
          PY