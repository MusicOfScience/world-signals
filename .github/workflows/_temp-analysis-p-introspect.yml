name: TEMP analysis P registry introspection

on:
  push:
    branches:
      - feature/analytical-layer-foundation-p
    paths:
      - .github/workflows/_temp-analysis-p-introspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print actual RBA canonical series and August records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/canonical/registry.json').read_text())
          rows=[]
          for x in r['records']:
              hay=' '.join(str(x.get(k,'')) for k in ('institution','jurisdiction','series_id','title','event_type','source_id'))
              if 'Reserve Bank of Australia' in hay or '.RBA.' in hay or 'RBA' in str(x.get('series_id','')):
                  rows.append({
                      k:x.get(k) for k in (
                          'occurrence_id','series_id','institution','jurisdiction','title','event_type',
                          'certainty_status','lifecycle_status','timing_type','start_local','start_utc',
                          'end_local','end_utc','date_earliest','date_latest','publication_datetime',
                          'publication_time_semantics','source_id'
                      )
                  })
          print(json.dumps(rows, indent=2, sort_keys=True))
          if not rows:
              raise SystemExit('no RBA-shaped canonical records found')
          PY