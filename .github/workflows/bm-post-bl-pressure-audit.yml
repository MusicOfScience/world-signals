name: BM post-BL pressure audit probe

on:
  push:
    branches:
      - feature/post-bl-pressure-audit-bm

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BL base and run read-only pressure audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1edd6ac0b540db60519fdccab5c404d42d8fc442"
          test "$(git merge-base HEAD origin/main)" = "1edd6ac0b540db60519fdccab5c404d42d8fc442"
          git diff --quiet origin/main -- data/canonical/registry.json data/sources/registry.json data/monitor/expectations.json data/live_intelligence data/analysis
          PYTHONPATH=src python - <<'PY'
          from collections import Counter, defaultdict
          import json
          from pathlib import Path
          from world_signals.monitor_coverage import build_monitor_coverage_audit
          from world_signals.analysis import analysis_population_readiness, validate_analysis

          def load(path):
              return json.loads(Path(path).read_text())
          def counts(values):
              return dict(sorted(Counter(str(v) if v not in (None,'') else 'NOT_RECORDED_IN_REGISTRY' for v in values).items(), key=lambda x:(-x[1],x[0])))

          canonical=load('data/canonical/registry.json')
          sources=load('data/sources/registry.json')
          monitor=load('data/monitor/expectations.json')
          live_obs=load('data/live_intelligence/observations.json')
          live_ev=load('data/live_intelligence/evidence_registry.json')
          analysis_schema=load('data/analysis/schema.json')
          analysis_reviews=load('data/analysis/event_reviews.json')
          analysis_ev=load('data/analysis/evidence_registry.json')

          cov=build_monitor_coverage_audit(canonical,sources,monitor)
          validation=validate_analysis(analysis_schema,analysis_ev,analysis_reviews,canonical)
          assert validation.ok, validation.errors
          readiness=analysis_population_readiness(analysis_schema,analysis_reviews,canonical)

          records=canonical['records']
          source_rows=sources['sources']
          source_map={x['source_id']:x for x in source_rows}
          configured_source_ids={x['source_id'] for x in monitor['adapters']}
          canonical_uses=defaultdict(list)
          for row in records:
              sid=row.get('source_id')
              if sid:
                  canonical_uses[sid].append(row)
          active_sources=[source_map[sid] for sid in canonical_uses if sid in source_map]

          reviewed_ids={r.get('canonical_occurrence_id') for r in analysis_reviews.get('reviews',[]) if r.get('review_phase')=='POST_EVENT' and r.get('review_state') in {'REVIEWED_SAMPLE','REVIEWED'}}
          completed=[r for r in records if r.get('lifecycle_status')=='COMPLETED']
          completed_unreviewed=[r for r in completed if r.get('occurrence_id') not in reviewed_ids]

          ready_nonconfigured=[]
          for src in active_sources:
              sid=src['source_id']
              if sid in configured_source_ids:
                  continue
              uses=canonical_uses[sid]
              auto=src.get('automated_monitoring_use')
              verify=src.get('verification_mode')
              readiness_status=src.get('monitoring_readiness_status')
              if auto=='CLEARED' or verify=='AUTOMATED_PILOT' or readiness_status in {
                  'PILOT_VALIDATED_NO_AUTO_COMMIT','PILOT_RESEARCH_VALIDATED_AUTOMATION_ROUTE_CANDIDATE','ENDPOINT_TEST_PRIORITY','LIVE_VALIDATED_NO_AUTO_COMMIT'
              }:
                  ready_nonconfigured.append({
                      'source_id':sid,
                      'institution':src.get('institution'),
                      'jurisdiction':src.get('jurisdiction'),
                      'domain':src.get('domain'),
                      'canonical_occurrence_count':len(uses),
                      'regions':sorted({u.get('region') for u in uses if u.get('region')}),
                      'categories':sorted({u.get('category') for u in uses if u.get('category')}),
                      'series_ids':sorted({u.get('series_id') for u in uses if u.get('series_id')}),
                      'automated_monitoring_use':auto,
                      'verification_mode':verify,
                      'monitoring_readiness_status':readiness_status,
                      'monitoring_activation_status':src.get('monitoring_activation_status'),
                  })
          ready_nonconfigured.sort(key=lambda x:(x['regions'],x['categories'],-x['canonical_occurrence_count'],x['source_id']))

          movements=[]
          for review in analysis_reviews.get('reviews',[]):
              movements.extend(review.get('what_moved') or [])

          result={
              'checkpoint':{
                  'main_sha':'1edd6ac0b540db60519fdccab5c404d42d8fc442',
                  'canonical':[canonical.get('version'),len(records)],
                  'sources':[sources.get('version'),len(source_rows)],
                  'monitor':[monitor.get('version'),len(monitor.get('adapters',[]))],
                  'live':[live_obs.get('version'),len(live_obs.get('observations',[])),len(live_ev.get('evidence',[]))],
                  'analysis':[analysis_reviews.get('version'),len(analysis_reviews.get('reviews',[])),len(analysis_ev.get('evidence',[]))],
                  'automatic_canonical_commit':monitor.get('automatic_canonical_commit'),
                  'google_calendar_write':monitor.get('google_calendar_write'),
              },
              'monitor_coverage':{
                  'totals':cov['totals'],
                  'regions_without_scope':cov['diagnostic_prompts']['canonical_regions_without_configured_monitor_scope'],
                  'categories_without_scope':cov['diagnostic_prompts']['canonical_categories_without_configured_monitor_scope'],
                  'by_region':cov['by_region'],
                  'by_category':cov['by_category'],
                  'adapter_inventory':[{k:a.get(k) for k in ('adapter_id','source_id','source_institution','monitor_role','regions','categories','series_ids')} for a in cov['adapter_inventory']],
              },
              'source_governance':{
                  'active_canonical_source_count':len(active_sources),
                  'automated_monitoring_use':counts([s.get('automated_monitoring_use') for s in active_sources]),
                  'verification_mode':counts([s.get('verification_mode') for s in active_sources]),
                  'monitoring_readiness_status':counts([s.get('monitoring_readiness_status') for s in active_sources]),
                  'ready_or_near_ready_nonconfigured':ready_nonconfigured,
              },
              'analysis_pressure':{
                  'readiness':readiness,
                  'completed_count':len(completed),
                  'reviewed_completed_count':len(reviewed_ids),
                  'completed_unreviewed':[{
                      'occurrence_id':r.get('occurrence_id'),'canonical_name':r.get('canonical_name'),'institution':r.get('institution'),'region':r.get('region'),'category':r.get('category'),'event_type':r.get('event_type'),'intrinsic_importance':r.get('intrinsic_importance'),'expected_market_sensitivity':r.get('expected_market_sensitivity')
                  } for r in completed_unreviewed],
                  'market_movement_rows':len(movements),
                  'exact_timestamp_series_rows':sum(1 for m in movements if m.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES'),
              },
          }
          print('BM_AUDIT_JSON_BEGIN')
          print(json.dumps(result,sort_keys=True))
          print('BM_AUDIT_JSON_END')
          PY
          git diff --exit-code
