name: BD controlled Live transaction

on:
  push:
    branches:
      - feature/post-bc-vietnam-live-bd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact post-BC ancestry and transaction prestate
        run: |
          set -euo pipefail
          git fetch origin main
          base=667d0fbcc92f937b0cb609d619b664a2a97e8165
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"
          test -z "$(git status --porcelain)"
          python scripts/apply_vietnam_myanmar_live_bd.py --check-only
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/validate_checkpoint_contracts.py

      - name: Snapshot protected paths and materialise BD
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          plan=json.loads(Path('data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_PLAN_v0.1.json').read_text())
          before={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in plan['protected_paths']}
          Path('/tmp/bd-protected-before.json').write_text(json.dumps(before, sort_keys=True))
          PY
          python scripts/apply_vietnam_myanmar_live_bd.py --apply

      - name: Prove exact governed mutation and target invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          plan=json.loads(Path('data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_PLAN_v0.1.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          authorised=set(plan['authorised_governed_writes'])
          if changed != authorised:
              raise SystemExit(f'BD governed mutation mismatch: changed={sorted(changed)} authorised={sorted(authorised)}')
          schema=json.loads(Path('data/live_intelligence/schema.json').read_text())
          observations=json.loads(Path('data/live_intelligence/observations.json').read_text())
          evidence=json.loads(Path('data/live_intelligence/evidence_registry.json').read_text())
          target=plan['target_state']
          assert schema['version']==target['live_schema_version']=='0.5'
          assert len(observations['observations'])==target['live_observation_count']==5
          assert len(evidence['evidence'])==target['live_evidence_count']==7
          assert observations['population_state']==target['population_state']=='CONTROLLED_GEOPOLITICAL_SPECIMEN'
          row=next(x for x in observations['observations'] if x['observation_id']==plan['selection']['observation_id'])
          assert row['observation_type']=='GEOPOLITICAL_DEVELOPMENT'
          assert row['canonical_links']==[]
          assert row['event_time']=={'precision':'CIVIL_DATE','event_date':'2026-09-05'}
          assert row['revision_of_observation_id'] is None
          assert row['automatic_canonical_commit'] is False
          assert row['google_calendar_write'] is False
          ev=next(x for x in evidence['evidence'] if x['evidence_id']=='WSEV-LI-VNM-MMR-VGP-20260905')
          assert ev['evidence_class']=='PRIMARY_OFFICIAL'
          assert ev['publication_time']['published_at_utc']=='2026-09-05T09:16:00Z'
          policy=schema['population_policy']
          assert policy['maximum_observation_count']==5
          assert policy['maximum_evidence_count']==7
          assert policy['automatic_ingestion_allowed'] is False
          assert policy['public_observation_projection_allowed'] is False
          print('BD governed mutation and target invariants: PASS')
          PY

      - name: Validate complete materialised descendant
        run: |
          set -euo pipefail
          python scripts/apply_vietnam_myanmar_live_bd.py --check-only
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/validate_checkpoint_contracts.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/validate_checkpoint_contracts.py \
            scripts/apply_analysis_revision_contract_ba.py \
            scripts/apply_japan_fies_live_analysis_az.py \
            scripts/apply_barmm_parliamentary_election_bb.py \
            scripts/apply_vietnam_myanmar_live_bd.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/analysis_revision.py \
            src/world_signals/analysis_revision_projection.py \
            src/world_signals/live_analysis_bridge.py \
            src/world_signals/checkpoint_contract.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py

      - name: Restore build-only outputs and prove protected paths unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          plan=json.loads(Path('data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_PLAN_v0.1.json').read_text())
          authorised=set(plan['authorised_governed_writes'])
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          extras=sorted(changed-authorised)
          if extras:
              subprocess.run(['git','checkout','--',*extras], check=True)
          subprocess.run(['git','clean','-fd'], check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          if changed != authorised:
              raise SystemExit(f'BD post-build mutation mismatch: {sorted(changed)}')
          before=json.loads(Path('/tmp/bd-protected-before.json').read_text())
          after={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in before}
          if before != after:
              drift={p:(before[p],after[p]) for p in before if before[p]!=after[p]}
              raise SystemExit(f'BD protected-path drift: {drift}')
          print('BD post-build boundary and protected hashes: PASS')
          PY

      - name: Write transaction audit, commit and push governed BD state
        run: |
          set -euo pipefail
          cat > data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_TRANSACTION_AUDIT_v0.1.md <<EOF
          # WORLD SIGNALS — BD Vietnam–Myanmar Live transaction audit v0.1

          ## Transaction identity

          - Governing tranche: **BD — bounded Vietnam–Myanmar geopolitical Live specimen**
          - Exact post-BC `main` base: `667d0fbcc92f937b0cb609d619b664a2a97e8165`
          - Transaction workflow run: `${GITHUB_RUN_ID}`
          - Transaction workflow head: `${GITHUB_SHA}`
          - Manual merge only: **YES**
          - Auto-merge: **PROHIBITED**

          ## Selection and source-time boundary

          BD admits one current first-party geopolitical development: the Government of Viet Nam report of the 5 September 2026 Viet Nam–Myanmar leaders' meeting and agreement to elevate defence/security cooperation as a bilateral pillar.

          The source supplies a publication timestamp equivalent to **2026-09-05T09:16:00Z**, but describes the leaders' meeting only as occurring on Saturday morning. WORLD SIGNALS therefore stores the event itself at **CIVIL_DATE 2026-09-05** and does not convert the publication clock time or the phrase “Saturday morning” into a fabricated event timestamp.

          The observation has no pre-existing Canonical occurrence identity. BD therefore leaves `canonical_links` empty rather than manufacturing a summit occurrence after the fact.

          ## Pressure-audit decision

          BD was selected over three competing pressures: a BARMM Live backfill merely to exercise `CONTEXT_FOR`, an OPEC outcome before OPEC's own authoritative publication, and a first Analysis revision without evidence sufficient to change a reviewed analytical judgement. Coverage diagnostics remain prompts rather than quotas.

          ## Governed state

          Pre-BD:
          - Live Intelligence schema **v0.4**
          - Live observations **4**
          - Live evidence **6**
          - Analysis **21 reviews / 95 evidence**
          - production Live inputs **1**
          - production Analysis revisions **0**
          - production `EXACT_TIMESTAMP_SERIES` **0**

          Post-BD:
          - Live Intelligence schema **v0.5**
          - Live observations **5**
          - Live evidence **7**
          - population state `CONTROLLED_GEOPOLITICAL_SPECIMEN`
          - Analysis remains **21 reviews / 95 evidence**
          - production Live inputs remain **1**
          - production Analysis revisions remain **0**
          - production `EXACT_TIMESTAMP_SERIES` remains **0**

          ## Authorised governed writes

          Exactly five governed paths were mutated:
          1. `data/live_intelligence/schema.json`
          2. `data/live_intelligence/observations.json`
          3. `data/live_intelligence/evidence_registry.json`
          4. `PROJECT_STATUS.md`
          5. `ROADMAP.md`

          This audit file is transaction provenance, not a sixth governed target write.

          ## Protected layers

          Canonical Registry, Canonical schema, Source Registry, Change Ledger, biosecurity overlay, monitor expectations/operations policy and all Analysis data/schema were protected by pre/post SHA-256 comparison and remained byte-identical.

          Public Live projection remains closed. Automatic ingestion, automatic story clustering, automatic Canonical commit and Google Calendar writes remain closed. No Source Registry, Canonical, Change Ledger, Monitor or Analysis row was created or changed by BD.

          ## Preflight and descendant repairs

          - BA/AZ/BC descendant-safety repair run `34036245528`: **SUCCESS**. Historical checkpoints remain frozen while mutable recovery prose and later reviewed population are not misclassified as drift.
          - BD diagnostic preflight v3 run `34036665422`: untouched repository and BD mutation boundary/validators passed; it exposed a stale BB downstream-population ceiling and cleaned up without persistent BD state.
          - BB descendant repair run `34037050893`: **SUCCESS**. BB's exact historical Canonical/source/change contribution remains frozen while unrelated later Live/Analysis growth is validated as a descendant floor.
          - Decisive BD full two-state preflight v4 run `34037103779`: **SUCCESS**, including untouched full CI/build, ephemeral BD exact five-file mutation proof, full post-BD descendant CI/build and protected-path byte equality.

          ## Transaction validation

          This transaction reran Registry, Live Intelligence, Analysis and historical-checkpoint validators; the complete unit suite; Python compilation; JavaScript syntax checks; and static-site build after materialising BD. Build-only outputs were removed/restored before commit, and the final tracked mutation set was re-proved.

          ## Merge policy

          The transaction commits only to `feature/post-bc-vietnam-live-bd`. It does not merge itself. A single ordinary pull request and ordinary PR CI remain mandatory; the user performs the merge manually.
          EOF

          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          plan=json.loads(Path('data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_PLAN_v0.1.json').read_text())
          expected=set(plan['authorised_governed_writes']) | {'data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_TRANSACTION_AUDIT_v0.1.md'}
          tracked=set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual=tracked|untracked
          if actual != expected:
              raise SystemExit(f'BD final transaction write-set mismatch: actual={sorted(actual)} expected={sorted(expected)}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/live_intelligence/schema.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json PROJECT_STATUS.md ROADMAP.md data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_TRANSACTION_AUDIT_v0.1.md
          git commit -m "BD: materialise Vietnam-Myanmar Live specimen"
          git push origin HEAD:feature/post-bc-vietnam-live-bd

      - name: Self-remove successful transaction workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/bd-controlled-transaction.yml
          git commit -m "BD: remove temporary controlled transaction workflow"
          git push origin HEAD:feature/post-bc-vietnam-live-bd

      - name: Fail-safe cleanup without persistent BD state
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/bd-controlled-transaction.yml
          git commit -m "BD: remove failed controlled transaction workflow"
          git push --force-with-lease origin HEAD:feature/post-bc-vietnam-live-bd
