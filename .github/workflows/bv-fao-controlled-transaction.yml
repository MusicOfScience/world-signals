name: BV FAO controlled transaction

on:
  push:
    branches:
      - feature/post-bu-pressure-audit-bv
    paths:
      - '.github/workflows/bv-fao-controlled-transaction.yml'

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Exact ancestry, clean tree and protected snapshots
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test "$(git merge-base HEAD origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test -z "$(git status --porcelain)"
          cp data/sources/registry.json /tmp/bv-sources-before.json
          cp data/monitor/expectations.json /tmp/bv-expectations-before.json
          cat > /tmp/bv-protected-files <<'EOF'
          data/canonical/registry.json
          data/canonical/schema.json
          data/changes/ledger.json
          data/coverage/biosecurity_overlay.json
          data/monitor/operations_policy.json
          data/live_intelligence/schema.json
          data/live_intelligence/observations.json
          data/live_intelligence/evidence_registry.json
          data/analysis/schema.json
          data/analysis/event_reviews.json
          data/analysis/evidence_registry.json
          EOF
          xargs sha256sum < /tmp/bv-protected-files > /tmp/bv-protected.before
      - name: Guarded helper check and apply
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BV: '1'
        run: |
          set -euo pipefail
          python scripts/apply_fao_release_calendar_monitor_bv.py
          python scripts/apply_fao_release_calendar_monitor_bv.py --apply
      - name: Audit exact five-file governed mutation and FAO source boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/bv-actual-files
          cat > /tmp/bv-expected-files <<'EOF'
          data/monitor/expectations.json
          data/sources/registry.json
          scripts/run_adapter_smoke.py
          scripts/run_live_monitor.py
          src/world_signals/adapters/__init__.py
          EOF
          sort -o /tmp/bv-expected-files /tmp/bv-expected-files
          diff -u /tmp/bv-expected-files /tmp/bv-actual-files
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          before=json.loads(Path('/tmp/bv-sources-before.json').read_text())
          after=json.loads(Path('data/sources/registry.json').read_text())
          exp_before=json.loads(Path('/tmp/bv-expectations-before.json').read_text())
          exp_after=json.loads(Path('data/monitor/expectations.json').read_text())
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          spec=importlib.util.spec_from_file_location('bvtx','scripts/apply_fao_release_calendar_monitor_bv.py')
          tx=importlib.util.module_from_spec(spec); spec.loader.exec_module(tx)
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert (before['version'],len(before['sources']))==('1.94',252)
          assert (after['version'],len(after['sources']))==('1.95',252)
          assert (exp_before['version'],len(exp_before['adapters']))==('0.19',17)
          assert (exp_after['version'],len(exp_after['adapters']))==('0.20',18)
          assert exp_after['automatic_canonical_commit'] is False
          assert exp_after['google_calendar_write'] is False
          b={x['source_id']:x for x in before['sources']}; a={x['source_id']:x for x in after['sources']}
          assert set(a)==set(b)
          for sid in b:
              if sid!='WSSRC-COM-010': assert a[sid]==b[sid],sid
          changed=tx._changed_keys(b['WSSRC-COM-010'],a['WSSRC-COM-010'])
          assert changed and changed <= tx.ALLOWED_SOURCE_MUTATION_KEYS,(changed-tx.ALLOWED_SOURCE_MUTATION_KEYS)
          src=a['WSSRC-COM-010']
          assert src['canonical_dependency_count']==9
          assert src['canonical_provenance_use']=='MANUAL_INFORMATIONAL_REFERENCE_ONLY'
          assert src['licence_review_status']=='CLEARED_FOR_FACTUAL_METADATA'
          assert src['ingestion_permission']=='PUBLIC_FACTS_ALLOWED'
          assert src['redistribution_permission']=='PUBLIC_FACTUAL_METADATA_ONLY'
          assert src['automated_monitoring_use']=='CLEARED_BOUNDED_RELEASE_CALENDAR'
          assert src['automated_retrieval_permission']=='BOUNDED_OFFICIAL_CALENDAR_ROBOTS_COMPATIBLE'
          assert src['monitoring_readiness_status']=='LIVE_VALIDATED_NO_AUTO_COMMIT'
          assert src['live_adapter_id']=='FAO_RELEASE_CALENDAR'
          assert exp_after['adapters'][:-1]==exp_before['adapters']
          route=exp_after['adapters'][-1]
          assert route['adapter_id']=='FAO_RELEASE_CALENDAR'
          assert route['source_id']=='WSSRC-COM-010'
          assert route['canonical_schedule_source_id']=='WSSRC-COM-010'
          assert route['same_source_identity_for_canonical_and_monitor'] is True
          assert len(route['canonical_occurrence_ids'])==6
          assert route['request_budget_per_run']==2
          assert route['robots_requests_per_run']==1
          assert route['calendar_requests_per_run']==1
          assert route['followup_requests_per_run']==0
          for key in ('schedule_authority','lifecycle_authority','certainty_authority','canonical_clock_mutation_allowed','automatic_amis_followup_allowed','automatic_faostat_followup_allowed','automatic_pdf_fetch_allowed','automatic_news_followup_allowed','automatic_search_route_discovery_allowed','automatic_commit_allowed'):
              assert route[key] is False,(key,route[key])
          print('BV_SOURCE_AND_ROUTE_MUTATION_AUDIT_PASS',sorted(changed))
          PY
      - name: Full validators tests compile and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_live_intelligence.py scripts/validate_analysis.py scripts/apply_analysis_revision_contract_ba.py src/world_signals/live_intelligence.py src/world_signals/analysis.py src/world_signals/analysis_revision.py src/world_signals/analysis_revision_projection.py src/world_signals/live_analysis_bridge.py src/world_signals/adapters/fao_release_calendar.py src/world_signals/fao_release_monitor.py scripts/apply_fao_release_calendar_monitor_bv.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Prove protected layers unchanged and build produced no extra mutation
        shell: bash
        run: |
          set -euo pipefail
          xargs sha256sum < /tmp/bv-protected-files > /tmp/bv-protected.after
          diff -u /tmp/bv-protected.before /tmp/bv-protected.after
          git diff --name-only | sort > /tmp/bv-after-build-files
          diff -u /tmp/bv-expected-files /tmp/bv-after-build-files
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Self-remove, stage exact transaction set, recheck main, commit and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bv-fao-controlled-transaction.yml
          git add data/monitor/expectations.json data/sources/registry.json scripts/run_adapter_smoke.py scripts/run_live_monitor.py src/world_signals/adapters/__init__.py
          git diff --cached --name-only | sort > /tmp/bv-staged
          cat > /tmp/bv-expected-staged <<'EOF'
          .github/workflows/bv-fao-controlled-transaction.yml
          data/monitor/expectations.json
          data/sources/registry.json
          scripts/run_adapter_smoke.py
          scripts/run_live_monitor.py
          src/world_signals/adapters/__init__.py
          EOF
          sort -o /tmp/bv-expected-staged /tmp/bv-expected-staged
          diff -u /tmp/bv-expected-staged /tmp/bv-staged
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test "$(git merge-base HEAD origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          git config user.name 'WORLD SIGNALS transaction bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'BV: activate FAO release-calendar monitor'
          git push origin HEAD:feature/post-bu-pressure-audit-bv
