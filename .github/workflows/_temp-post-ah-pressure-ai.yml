name: TEMP AI Bank of Canada Analysis transaction

on:
  push:
    branches:
      - feature/post-ah-pressure-audit-ai

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-63 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "b12058d260a8139c893feb52ad864258044e83b2"
      - name: Reproduce post-AH pressure audit
        run: python scripts/audit_post_ah_pressure_ai.py
      - name: Fail-closed AI check-only transform
        run: python scripts/apply_bank_of_canada_analysis_ai.py
      - name: AI tests before write
        run: python -m unittest tests.test_bank_of_canada_analysis_ai -v
      - name: Apply reviewed AI transaction
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_AI: REVIEWED_APPLY
        run: python scripts/apply_bank_of_canada_analysis_ai.py --apply
      - name: Validate canonical remains sound
        run: python scripts/validate_registry.py
      - name: Validate Analysis post-state
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_bank_of_canada_analysis_ai.py \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_analysis.py \
            src/world_signals/analysis.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Exact AI production mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'data/analysis/event_reviews.json',
              'data/analysis/evidence_registry.json',
              'data/analysis/BANK_OF_CANADA_ANALYSIS_AI_TRANSACTION_AUDIT_v0.1.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'AI mutation boundary drift: expected {sorted(expected)}, got {sorted(paths)}')
          print('AI_MUTATION_BOUNDARY_OK')
          PY
      - name: Commit reviewed transaction and self-remove temporary audit files
        run: |
          rm .github/workflows/_temp-post-ah-pressure-ai.yml
          rm scripts/audit_post_ah_pressure_ai.py
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            data/analysis/BANK_OF_CANADA_ANALYSIS_AI_TRANSACTION_AUDIT_v0.1.md \
            .github/workflows/_temp-post-ah-pressure-ai.yml \
            scripts/audit_post_ah_pressure_ai.py
          git commit -m "Apply Bank of Canada Analysis AI"
          git push origin HEAD:feature/post-ah-pressure-audit-ai
