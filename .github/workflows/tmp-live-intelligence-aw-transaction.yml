name: WORLD SIGNALS AW Live Intelligence Nepal transaction

on:
  push:
    branches:
      - feature/post-av-pressure-audit-aw
    paths:
      - .github/workflows/tmp-live-intelligence-aw-transaction.yml

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/post-av-pressure-audit-aw
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-77 base and live main
        run: |
          BASE=4768c73532c4ba4038b30314079b85be64fbee01
          git fetch origin main
          test "$(git merge-base HEAD $BASE)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test ! -e .github/workflows/tmp-live-intelligence-aw-preflight.yml
          test ! -e .github/workflows/tmp-live-intelligence-aw-code-patch.yml
          test ! -e .github/workflows/tmp-live-intelligence-aw-av-test-repair.yml
          test ! -e scripts/tmp_patch_live_intelligence_aw.py
          test ! -e scripts/tmp_patch_av_descendant_aw.py
          test "$(find .github/workflows -maxdepth 1 -type f -name 'tmp-*' | wc -l)" -eq 1
          git diff --check $BASE..HEAD
      - name: Prove protected upstream and Live production pre-state unchanged
        run: |
          BASE=4768c73532c4ba4038b30314079b85be64fbee01
          for path in \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json; do
              git diff --exit-code $BASE..HEAD -- "$path"
          done
      - name: Read-only simulation and prewrite regressions
        run: |
          python scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_live_intelligence_foundation_av -v
          python -m unittest tests.test_nepal_rasuwa_flood_live_intelligence_aw -v
      - name: Controlled Live Intelligence write
        env:
          WORLD_SIGNALS_APPLY_LIVE_INTELLIGENCE_AW: '1'
        run: python scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py --write
      - name: Validate postwrite state
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_live_intelligence_foundation_av -v
          python -m unittest tests.test_nepal_rasuwa_flood_live_intelligence_aw -v
          python -m unittest discover -s tests -v
      - name: Compile Python and check browser JavaScript
        run: |
          python -m py_compile scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py scripts/validate_live_intelligence.py src/world_signals/live_intelligence.py scripts/build_site.py scripts/validate_analysis.py src/world_signals/analysis.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Build static site and prove private curated-store projection
        run: |
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('docs/data/live_intelligence.json').read_text())
          meta=live['metadata']
          assert meta['projection_type']=='LIVE_INTELLIGENCE_CURATED_STORE_NOT_RUNTIME_FEED', meta
          assert meta['schema_version']=='0.2', meta
          assert meta['population_state']=='CONTROLLED_SINGLE_SPECIMEN', meta
          assert meta['population_mode']=='CONTROLLED_SINGLE_SPECIMEN', meta
          assert meta['internal_observation_count']==1, meta
          assert meta['internal_evidence_count']==2, meta
          assert meta['public_observation_count']==0, meta
          assert meta['canonical_registry_version_at_build']=='0.38', meta
          assert meta['canonical_record_count_at_build']==688, meta
          assert meta['runtime_feed_claim'] is False, meta
          assert live['observations']==[], live
          summary=json.loads(Path('docs/data/source_summary.json').read_text())
          assert summary['configured_live_monitor_routes']==8, summary
          assert summary['live_intelligence_schema_version']=='0.2', summary
          assert summary['live_intelligence_population_state']=='CONTROLLED_SINGLE_SPECIMEN', summary
          assert summary['live_intelligence_internal_observation_count']==1, summary
          assert summary['live_intelligence_public_observation_count']==0, summary
          assert summary['analysis_review_count']==20, summary
          print('AW postwrite static projection proof PASS')
          PY
      - name: Prove protected upstream bytes unchanged and exact write mutation boundary
        run: |
          BASE=4768c73532c4ba4038b30314079b85be64fbee01
          for path in \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json; do
              git diff --exit-code $BASE..HEAD -- "$path"
              git diff --exit-code -- "$path"
          done
          python - <<'PY'
          import subprocess
          expected={
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'data/live_intelligence/NEPAL_RASUWA_FLOOD_LIVE_INTELLIGENCE_AW_TRANSACTION_AUDIT_v0.1.md',
          }
          raw=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True)
          actual=set()
          for line in raw.splitlines():
              if not line.strip():
                  continue
              path=line[3:]
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              actual.add(path)
          assert actual==expected, (actual, expected, raw)
          print('AW exact production mutation boundary PASS')
          PY
      - name: Commit production transaction and self-remove workflow
        env:
          BRANCH: feature/post-av-pressure-audit-aw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/live_intelligence/NEPAL_RASUWA_FLOOD_LIVE_INTELLIGENCE_AW_TRANSACTION_AUDIT_v0.1.md
          git commit -m "AW: add Nepal flood first Live Intelligence specimen"
          git push origin HEAD:$BRANCH
          git rm .github/workflows/tmp-live-intelligence-aw-transaction.yml
          git commit -m "AW: remove Live Intelligence transaction workflow"
          git push origin HEAD:$BRANCH
