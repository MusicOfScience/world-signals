name: BD projection-call repair

on:
  push:
    branches:
      - feature/post-bc-vietnam-live-bd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch helper and test calls
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('scripts/apply_vietnam_myanmar_live_bd.py'): (
                  'public_live_intelligence_projection(schema, evidence, observations)',
                  'public_live_intelligence_projection(schema, evidence, observations, canonical)',
              ),
              Path('tests/test_vietnam_myanmar_live_bd.py'): (
                  'public_live_intelligence_projection(schema, evidence, observations)',
                  'public_live_intelligence_projection(schema, evidence, observations, self.canonical)',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one projection-call anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify repaired read-only contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_vietnam_myanmar_live_bd.py tests/test_vietnam_myanmar_live_bd.py
          python scripts/apply_vietnam_myanmar_live_bd.py --check-only
          python -m unittest tests.test_vietnam_myanmar_live_bd -v
      - name: Commit repair and self-remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/apply_vietnam_myanmar_live_bd.py tests/test_vietnam_myanmar_live_bd.py
          git commit -m "BD: pass Canonical registry to public projection"
          git rm .github/workflows/bd-fix-projection-call.yml
          git commit -m "BD: remove temporary projection repair workflow"
          git push origin HEAD:feature/post-bc-vietnam-live-bd
