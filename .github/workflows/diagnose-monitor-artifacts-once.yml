name: Diagnose WORLD SIGNALS monitor artefacts once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-monitor-artifacts-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: List live-monitor runs and retained artefacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          token=os.environ['GITHUB_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          base=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'WORLD-SIGNALS-monitor-artifact-diagnostic',
          }
          def get(url):
              req=Request(url,headers=headers)
              with urlopen(req,timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          runs=get(base+'/actions/workflows/live-monitor.yml/runs?per_page=20').get('workflow_runs',[])
          print('RUN_COUNT',len(runs))
          for run in runs:
              rid=run.get('id')
              print('RUN',json.dumps({
                  'id':rid,
                  'run_number':run.get('run_number'),
                  'event':run.get('event'),
                  'status':run.get('status'),
                  'conclusion':run.get('conclusion'),
                  'head_sha':run.get('head_sha'),
                  'created_at':run.get('created_at'),
                  'updated_at':run.get('updated_at'),
              },sort_keys=True))
              artefacts=get(base+f'/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
              print('ARTEFACT_COUNT',rid,len(artefacts))
              for artefact in artefacts:
                  print('ARTEFACT',json.dumps({
                      'id':artefact.get('id'),
                      'name':artefact.get('name'),
                      'expired':artefact.get('expired'),
                      'created_at':artefact.get('created_at'),
                      'expires_at':artefact.get('expires_at'),
                      'size_in_bytes':artefact.get('size_in_bytes'),
                  },sort_keys=True))
          PY
