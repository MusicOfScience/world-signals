name: Diagnose WORLD SIGNALS monitor artefacts once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-monitor-artifacts-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose latest retained artefact download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io, json, os, zipfile
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler

          token=os.environ['GITHUB_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          base=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'WORLD-SIGNALS-monitor-artifact-diagnostic',
          }
          def get_json(url):
              with urlopen(Request(url,headers=headers),timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          runs=get_json(base+'/actions/workflows/live-monitor.yml/runs?status=success&per_page=10').get('workflow_runs',[])
          print('SUCCESS_RUN_COUNT',len(runs))
          selected=None
          for run in runs:
              rid=run['id']
              artefacts=get_json(base+f'/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
              wanted=f'world-signals-live-monitor-{rid}'
              artefact=next((a for a in artefacts if a.get('name')==wanted and not a.get('expired')),None)
              print('CANDIDATE_RUN',rid,'RUN_NUMBER',run.get('run_number'),'WANTED',wanted,'FOUND',bool(artefact))
              if artefact:
                  selected=(run,artefact)
                  break
          if not selected:
              raise SystemExit('No matching uniquely named retained artefact')

          run,artefact=selected
          artifact_id=artefact['id']
          archive_url=base+f'/actions/artifacts/{artifact_id}/zip'
          print('SELECTED',json.dumps({'run_id':run['id'],'run_number':run.get('run_number'),'artifact_id':artifact_id,'name':artefact['name']}))

          # Show the GitHub redirect without forwarding repository credentials to the
          # signed storage URL. urllib's default redirect path was the suspected fault.
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=build_opener(NoRedirect)
          try:
              opener.open(Request(archive_url,headers=headers),timeout=30)
              raise SystemExit('Expected artifact endpoint to redirect')
          except HTTPError as exc:
              print('ARTIFACT_ENDPOINT_STATUS',exc.code)
              location=exc.headers.get('Location')
              print('SIGNED_REDIRECT_PRESENT',bool(location))
              if exc.code not in (301,302,303,307,308) or not location:
                  raise

          # Fetch the signed storage URL without the GitHub Authorization header.
          with urlopen(Request(location,headers={'User-Agent':'WORLD-SIGNALS-monitor-artifact-diagnostic'}),timeout=30) as response:
              blob=response.read()
              print('SIGNED_DOWNLOAD_STATUS',response.status,'BYTES',len(blob))
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              print('ZIP_FILES',json.dumps(sorted(archive.namelist())))
          PY
