name: CD post-CC pressure audit

on:
  push:
    branches:
      - feature/post-cc-pressure-audit-cd
    paths:
      - '.github/workflows/cd-post-cc-pressure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact post-CC baseline and governed state
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='c186835d9d6b36620177badfff604f309ceb35d4'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          lo=json.loads(Path('data/live_intelligence/observations.json').read_text())
          le=json.loads(Path('data/live_intelligence/evidence_registry.json').read_text())
          ar=json.loads(Path('data/analysis/event_reviews.json').read_text())
          ae=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('2.02',257)
          assert (m['version'],len(m['adapters']))==('0.27',25)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          print('BASE',base)
          print('GOVERNED',{'canonical':[c['version'],len(c['records'])],'sources':[s['version'],len(s['sources'])],'monitor':[m['version'],len(m['adapters'])]})
          print('LIVE_LAYER',{'version':lo.get('version'),'observations':len(lo.get('observations',[])),'evidence':len(le.get('evidence',[])),'population_state':lo.get('population_state')})
          print('ANALYSIS_LAYER',{'version':ar.get('version'),'reviews':len(ar.get('reviews',[])),'evidence':len(ae.get('evidence',[]))})
          PY
      - name: Recompute monitor coverage audit
        run: python scripts/run_monitor_coverage_audit.py
      - name: Print architecture frontier diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          lo=json.loads(Path('data/live_intelligence/observations.json').read_text())
          ar=json.loads(Path('data/analysis/event_reviews.json').read_text())
          audit=json.loads(Path('artifacts/monitor/monitor-coverage-audit.json').read_text())
          print('MONITOR_TOTALS',json.dumps(audit.get('totals',{}),sort_keys=True))
          print('DIAGNOSTIC_PROMPTS',json.dumps(audit.get('diagnostic_prompts',{}),sort_keys=True))
          adapters=m['adapters']
          print('MONITOR_ROLES',json.dumps(sorted({x.get('monitor_role') for x in adapters if x.get('monitor_role')}),ensure_ascii=False))
          print('AUTHORITY_GATE_COUNTS')
          keys=['schedule_authority','clock_authority','lifecycle_authority','certainty_authority','condition_state_authority','canonical_datetime_mutation_allowed','automatic_new_occurrence_creation_allowed','automatic_live_or_analysis_promotion_allowed','automatic_commit_allowed']
          for k in keys:
              vals=[x.get(k) for x in adapters if k in x]
              print(k,{'true':sum(v is True for v in vals),'false':sum(v is False for v in vals),'missing':len(adapters)-len(vals)})
          print('CANONICAL_STATUS_COUNTS')
          for field in ['certainty_status','activation_mode','event_state','time_status','timing_type','category']:
              ctr=Counter(r.get(field) for r in c['records'])
              print(field,json.dumps(ctr.most_common(),ensure_ascii=False))
          def render_counter(values):
              ctr=Counter(values)
              return sorted(((('<MISSING>' if k is None else str(k)),v) for k,v in ctr.items()),key=lambda kv:kv[0])
          print('SOURCE_MONITOR_USE_COUNTS',json.dumps(render_counter(x.get('automated_monitoring_use') for x in s['sources']),ensure_ascii=False))
          print('SOURCE_CANONICAL_USE_COUNTS',json.dumps(render_counter(x.get('canonical_provenance_use') for x in s['sources']),ensure_ascii=False))
          print('LIVE_OBSERVATION_TYPES',json.dumps(render_counter(x.get('observation_type',x.get('type')) for x in lo.get('observations',[])),ensure_ascii=False))
          print('LIVE_LINKED_OCCURRENCES',sum(bool(x.get('occurrence_id') or x.get('canonical_occurrence_id')) for x in lo.get('observations',[])))
          print('ANALYSIS_REVIEW_TYPES',json.dumps(render_counter(x.get('review_type',x.get('analysis_type')) for x in ar.get('reviews',[])),ensure_ascii=False))
          print('ANALYSIS_LINKED_OCCURRENCES',sum(bool(x.get('occurrence_id') or x.get('canonical_occurrence_id')) for x in ar.get('reviews',[])))
          PY
      - name: Prove governed layers unchanged
        run: |
          git diff --exit-code c186835d9d6b36620177badfff604f309ceb35d4..HEAD -- data/canonical/registry.json data/sources/registry.json data/monitor/expectations.json data/changes data/live_intelligence data/analysis scripts src tests web
      - name: Upload pressure audit
        uses: actions/upload-artifact@v4
        with:
          name: cd-post-cc-pressure-audit-${{ github.run_id }}
          path: artifacts/monitor
          if-no-files-found: error
          retention-days: 90
