name: CK PIF guarded transaction

on:
  push:
    branches:
      - feature/post-cj-pif-canonical-source-repair-ck
    paths:
      - data/coverage/PIF_LEADERS_MEETING_CK_PLAN_v0.1.json
      - .github/workflows/ck-pif-transaction.yml

permissions:
  contents: write

jobs:
  transact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CK branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact post-CJ base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=286af17018562fe211db47dd22112a75b842a367
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test "$(git rev-parse --abbrev-ref HEAD)" = "feature/post-cj-pif-canonical-source-repair-ck"

      - name: Probe existing PIF identity read-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          registry = json.loads((root/'data/canonical/registry.json').read_text())
          sources = json.loads((root/'data/sources/registry.json').read_text())
          rows = [r for r in registry['records'] if r.get('source_id') == 'WSSRC-INT-012' or r.get('host_binding_id') == 'WSHB-PIF-2026-PW' or 'Pacific Islands Forum' in str(r.get('canonical_name',''))]
          src = next(s for s in sources['sources'] if s.get('source_id') == 'WSSRC-INT-012')
          print('PIF_EXISTING_ROWS=' + json.dumps(rows, ensure_ascii=False, sort_keys=True))
          print('PIF_SOURCE=' + json.dumps(src, ensure_ascii=False, sort_keys=True))
          PY

      - name: Simulate CK transaction
        run: python scripts/apply_pif_leaders_meeting_ck.py

      - name: Run focused CK contract tests before write
        run: python -m unittest discover -s tests -p 'test_pif_leaders_meeting_ck.py' -v

      - name: Materialise reviewed CK transaction
        env:
          WORLD_SIGNALS_APPLY_PIF_LEADERS_CK: REVIEWED_APPLY
        run: python scripts/apply_pif_leaders_meeting_ck.py --apply

      - name: Refresh mechanically derived recovery state
        env:
          WORLD_SIGNALS_WRITE_DERIVED_STATE: YES
        run: python scripts/project_state_snapshot.py --write

      - name: Validate Canonical Registry
        run: python scripts/validate_registry.py

      - name: Validate Live Intelligence
        run: python scripts/validate_live_intelligence.py

      - name: Validate Analysis
        run: python scripts/validate_analysis.py

      - name: Verify derived-state consistency
        run: python scripts/project_state_snapshot.py --check

      - name: Run complete historical suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python transaction and validation paths
        run: |
          python -m py_compile \
            scripts/apply_pif_leaders_meeting_ck.py \
            scripts/project_state_snapshot.py \
            scripts/validate_registry.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Build static site
        run: python scripts/build_site.py

      - name: Enforce bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          allowed=$(cat <<'EOF'
          PROJECT_STATUS.md
          README.md
          ROADMAP.md
          data/canonical/registry.json
          data/changes/ledger.json
          data/coverage/PIF_LEADERS_MEETING_CK_TRANSACTION_AUDIT_v0.1.md
          data/coverage/biosecurity_overlay.json
          data/sources/registry.json
          data/status/current_state.json
          EOF
          )
          actual="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' "$allowed" | sed 's/^          //' | sed '/^$/d' | sort)"
          printf 'CK generated diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --exit-code HEAD -- OPEC_QUARANTINE.md data/monitor/expectations.json data/monitor/operations_policy.json data/live_intelligence/schema.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/schema.json data/analysis/event_reviews.json data/analysis/evidence_registry.json

      - name: Commit reviewed CK materialisation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "world-signals-ck-transaction"
          git config user.email "actions@users.noreply.github.com"
          git add \
            PROJECT_STATUS.md README.md ROADMAP.md \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/PIF_LEADERS_MEETING_CK_TRANSACTION_AUDIT_v0.1.md \
            data/coverage/biosecurity_overlay.json \
            data/sources/registry.json \
            data/status/current_state.json
          git diff --cached --quiet && { echo 'Expected CK materialisation diff is empty'; exit 1; }
          git commit -m "CK: materialise Pacific Islands Forum canonical repair"
          git push origin HEAD:feature/post-cj-pif-canonical-source-repair-ck
