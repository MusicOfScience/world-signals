name: BF post-BE registry interrogation

on:
  push:
    branches:
      - feature/post-be-pressure-audit-bf

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact post-BE ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "629ab595ecccaf86a92bbd8cdfdab4297496b298"
          test "$(git merge-base HEAD origin/main)" = "629ab595ecccaf86a92bbd8cdfdab4297496b298"
      - name: Interrogate current governed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          root=Path('.')
          canonical=json.loads((root/'data/canonical/registry.json').read_text())
          sources=json.loads((root/'data/sources/registry.json').read_text())
          reviews=json.loads((root/'data/analysis/event_reviews.json').read_text())
          live=json.loads((root/'data/live_intelligence/observations.json').read_text())

          records=canonical['records']
          review_ids={r.get('canonical_occurrence_id') for r in reviews.get('reviews',[])}
          print('CHECKPOINT', canonical.get('version'), canonical.get('record_count'), sources.get('version'), len(sources.get('sources',[])), reviews.get('version'), len(reviews.get('reviews',[])), live.get('version'), len(live.get('observations',[])))

          print('\nOPEC_CANONICAL_ROWS')
          for r in records:
              if r.get('source_id')=='WSSRC-COM-001' or str(r.get('series_id','')).startswith('WSER-COM-OPEC'):
                  keep={k:r.get(k) for k in ('occurrence_id','series_id','canonical_name','start_local','end_local','source_timezone','start_utc','lifecycle_status','certainty_status','source_id','category','event_type','intrinsic_importance','expected_market_sensitivity')}
                  print(json.dumps(keep, ensure_ascii=False, sort_keys=True))

          print('\nOPEC_SOURCE_RECORD')
          for s in sources.get('sources',[]):
              if s.get('source_id')=='WSSRC-COM-001':
                  keep={k:s.get(k) for k in ('source_id','institution','authoritative_url','canonical_dependency_count','canonical_provenance_use','automated_monitoring_use','verification_mode','monitoring_readiness_status')}
                  print(json.dumps(keep, ensure_ascii=False, sort_keys=True))

          print('\nIPPC_CANONICAL_MATCHES')
          found=False
          for r in records:
              hay=' '.join(str(r.get(k,'')) for k in ('canonical_name','institution','series_id','source_id')).lower()
              if 'phytosan' in hay or 'ippc' in hay or 'cpm-21' in hay:
                  found=True
                  print(json.dumps({k:r.get(k) for k in ('occurrence_id','series_id','canonical_name','start_local','end_local','lifecycle_status','certainty_status','source_id')}, ensure_ascii=False, sort_keys=True))
          if not found: print('NONE')

          print('\nCOMPLETED_UNREVIEWED_NEAR_CURRENT')
          rows=[]
          for r in records:
              if r.get('lifecycle_status')=='COMPLETED' and r.get('occurrence_id') not in review_ids:
                  # The Analysis validator owns eligibility; this is deliberately a broad discovery view.
                  d=str(r.get('start_local') or '')
                  if d >= '2026-08-01':
                      rows.append(r)
          for r in sorted(rows,key=lambda x:str(x.get('start_local') or '')):
              print(json.dumps({k:r.get(k) for k in ('occurrence_id','series_id','canonical_name','start_local','category','event_type','intrinsic_importance','expected_market_sensitivity')}, ensure_ascii=False, sort_keys=True))

          print('\nUPCOMING_30D_HIGH_SIGNAL')
          for r in sorted(records,key=lambda x:str(x.get('start_local') or '')):
              d=str(r.get('start_local') or '')
              if '2026-09-07' <= d <= '2026-10-07' and r.get('lifecycle_status')!='COMPLETED':
                  imp=r.get('intrinsic_importance')
                  sens=r.get('expected_market_sensitivity')
                  if imp in ('HIGH','CRITICAL','VERY_HIGH') or sens in ('HIGH','CRITICAL','VERY_HIGH'):
                      print(json.dumps({k:r.get(k) for k in ('occurrence_id','series_id','canonical_name','start_local','end_local','category','event_type','lifecycle_status','certainty_status','source_id','intrinsic_importance','expected_market_sensitivity')}, ensure_ascii=False, sort_keys=True))

          print('\nLIVE_TYPES')
          print(json.dumps(Counter(r.get('observation_type') for r in live.get('observations',[])), sort_keys=True))
          print('LIVE_IDS')
          for r in live.get('observations',[]):
              print(r.get('observation_id'), r.get('observation_type'), r.get('headline'))

          print('\nANALYSIS_EVENT_TYPES')
          print(json.dumps(Counter(r.get('canonical_event_type') for r in reviews.get('reviews',[])), sort_keys=True))
          PY
      - name: Self-remove interrogation workflow
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          rm -f .github/workflows/bf-pressure-interrogation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/bf-pressure-interrogation.yml
          if ! git diff --cached --quiet; then
            git commit -m 'BF: remove temporary post-BE registry interrogation'
            git push origin HEAD:feature/post-be-pressure-audit-bf
          fi
