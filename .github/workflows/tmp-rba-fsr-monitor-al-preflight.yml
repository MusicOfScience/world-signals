name: WORLD SIGNALS AL RBA FSR alignment preflight

on:
  push:
    branches:
      - feature/post-ak-pressure-audit-al
    paths:
      - .github/workflows/tmp-rba-fsr-monitor-al-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-AK base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=72103267f90475b04c80129e03b41b605d4b7f58
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -z "$(git status --porcelain=v1)"
      - name: Read-only fail-closed simulation
        run: python scripts/apply_rba_fsr_monitor_alignment_al.py --check
      - name: Run AL regression fixtures
        run: python -m unittest tests.test_rba_fsr_monitor_alignment_al -v
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis layer
        run: python scripts/validate_analysis.py
      - name: Run full repository suite
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q scripts src tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Build static site
        run: python scripts/build_site.py
      - name: Prove no production write occurred
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
