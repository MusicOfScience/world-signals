name: BU INDEC governed commit

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu
    paths:
      - '.github/workflows/bu-indec-calendar-commit.yml'

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and materialise only governed BU files
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BU: '1'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          python scripts/apply_indec_cpi_calendar_monitor_bu.py
          WORLD_SIGNALS_APPLY_MONITOR_BU=1 python scripts/apply_indec_cpi_calendar_monitor_bu.py --apply
          python - <<'PY'
          import subprocess
          expected={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          PY
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python scripts/build_site.py
          rm -rf docs
      - name: Commit exact governed file set
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'BU: activate INDEC CPI calendar monitor'
          file_pattern: 'data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py'
