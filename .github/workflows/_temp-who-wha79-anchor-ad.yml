name: Temporary WHO WHA79 historical anchor AD

on:
  push:
    branches:
      - feature/health-governance-anchor-ad

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-58 merge base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "de352644445d6b5e445aba7793c0e16f5960efc4"
      - name: Fail-closed AD check-only transform
        run: python scripts/apply_who_wha79_historical_anchor_ad.py
      - name: AD-specific tests before apply
        run: python -m unittest tests.test_who_wha79_historical_anchor_ad -v
      - name: Reviewed AD apply
        env:
          WORLD_SIGNALS_APPLY_WHA79_ANCHOR_AD: REVIEWED_APPLY
        run: python scripts/apply_who_wha79_historical_anchor_ad.py --apply
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_who_wha79_historical_anchor_ad.py \
            scripts/probe_post_ac_gap_candidates_ad.py \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_analysis.py \
            src/world_signals/analysis.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Prove AD production mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              "data/canonical/registry.json",
              "data/sources/registry.json",
              "data/changes/ledger.json",
              "data/coverage/biosecurity_overlay.json",
              "data/coverage/WHO_WHA79_HISTORICAL_ANCHOR_AD_TRANSACTION_AUDIT_v0.1.md",
          }
          changed = set(subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f"AD mutation boundary drift: expected {sorted(expected)}, got {sorted(paths)}")
          print("AD_MUTATION_BOUNDARY_OK")
          PY
      - name: Commit reviewed AD transaction and self-remove workflow
        run: |
          rm .github/workflows/_temp-who-wha79-anchor-ad.yml
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add \
            data/canonical/registry.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/coverage/WHO_WHA79_HISTORICAL_ANCHOR_AD_TRANSACTION_AUDIT_v0.1.md \
            .github/workflows/_temp-who-wha79-anchor-ad.yml
          git commit -m "Apply WHO WHA79 historical anchor AD transaction"
          git push origin HEAD:feature/health-governance-anchor-ad
