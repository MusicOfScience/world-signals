name: TEMP AF descendant repair gate

on:
  push:
    branches:
      - feature/post-ae-gap-recon-af

permissions:
  contents: read

jobs:
  repair-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-60 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "e576719bcbaf94730444cf64b1a1abeeacb25727"
      - name: Fail-closed AF check-only transform
        run: python scripts/apply_australian_tropical_cyclone_season_anchor_af.py
      - name: AF contract tests
        run: python -m unittest tests.test_australian_tropical_cyclone_season_anchor_af -v
      - name: Historical descendant tests under repair
        run: |
          python -m unittest \
            tests.test_east_asia_lifecycle_repair_z \
            tests.test_source_native_fiscal_analysis_v \
            tests.test_eu_russia_sanctions_renewal_anchor_ae -v
      - name: Canonical validator pre-state
        run: python scripts/validate_registry.py
      - name: Analysis validator pre-state
        run: python scripts/validate_analysis.py
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_australian_tropical_cyclone_season_anchor_af.py \
            tests/test_east_asia_lifecycle_repair_z.py \
            tests/test_source_native_fiscal_analysis_v.py \
            tests/test_eu_russia_sanctions_renewal_anchor_ae.py
