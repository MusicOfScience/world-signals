name: BL Japan household-spending read-only preflight

on:
  push:
    branches:
      - feature/post-bk-japan-statistics-api-bl

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BK base and pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3952ec1f5a6022fec43210103f7a7244442e3201"
          test "$(git merge-base HEAD origin/main)" = "3952ec1f5a6022fec43210103f7a7244442e3201"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records'])) == ('0.41',689)
          assert (s['version'],len(s['sources'])) == ('1.84',246)
          assert (m['version'],len(m['adapters'])) == ('0.11',9)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          assert not any(x.get('source_id')=='WSSRC-MAC-030' for x in s['sources'])
          assert not any(x.get('adapter_id')=='JAPAN_HHSPEND_STATISTICS_DASHBOARD_API' for x in m['adapters'])
          PY
      - name: Snapshot all governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/monitor/review_candidate_state_contract.json \
            data/monitor/review_decisions.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json > /tmp/bl-governed-pre.sha
      - name: Reconfirm guarded check-only transforms
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_japan_household_spending_monitor_bl.py
          python scripts/repair_bk_monitor_ceiling_bl.py
          python -m unittest tests.test_japan_household_spending_monitor_bl -v
      - name: Materialise BL locally only
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BL: "1"
        run: |
          set -euo pipefail
          python scripts/apply_japan_household_spending_monitor_bl.py --apply
          python scripts/repair_bk_monitor_ceiling_bl.py --apply
      - name: Prove exact local mutation boundary and post-state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
            'tests/test_eurostat_monitor_bk.py',
          }
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed=tracked|untracked
          assert changed == expected, (sorted(changed),sorted(expected))
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (s['version'],len(s['sources'])) == ('1.85',247)
          assert (m['version'],len(m['adapters'])) == ('0.12',10)
          machine=next(x for x in s['sources'] if x['source_id']=='WSSRC-MAC-030')
          schedule=next(x for x in s['sources'] if x['source_id']=='WSSRC-MAC-024')
          route=next(x for x in m['adapters'] if x['adapter_id']=='JAPAN_HHSPEND_STATISTICS_DASHBOARD_API')
          assert machine['canonical_dependency_count']==0
          assert machine['automated_monitoring_use']=='CLEARED'
          assert schedule['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert route['source_id']=='WSSRC-MAC-030'
          assert route['source_role_contract']['canonical_schedule_source_id']=='WSSRC-MAC-024'
          assert route['automatic_commit_allowed'] is False
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          bk=Path('tests/test_eurostat_monitor_bk.py').read_text()
          assert 'self.assertGreaterEqual(dotted(sources["version"]), dotted("1.84"))' in bk
          assert 'eurostat["live_adapter_id"], "EUROSTAT_RELEASE_CALENDAR_ICS"' in bk
          PY
      - name: Run materialised targeted and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest \
            tests.test_japan_household_spending_monitor_bl \
            tests.test_eurostat_monitor_bk \
            tests.test_japan_mof_jgb_adapter \
            tests.test_rba_mpb_adapter -v
          python -m unittest discover -s tests -v
          python -m py_compile \
            src/world_signals/adapters/japan_statistics_dashboard.py \
            src/world_signals/japan_household_spending_monitor.py \
            scripts/apply_japan_household_spending_monitor_bl.py \
            scripts/repair_bk_monitor_ceiling_bl.py \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Exercise materialised Japan route live with one bounded request
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          from world_signals.adapters import fetch_japan_household_spending_data
          from world_signals.japan_household_spending_monitor import japan_household_spending_review_candidates
          registry=json.loads(Path('data/canonical/registry.json').read_text())
          expectations=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(x for x in expectations['adapters'] if x['adapter_id']=='JAPAN_HHSPEND_STATISTICS_DASHBOARD_API')
          query=config['api_query']
          values,snap=fetch_japan_household_spending_data(time_from=query['time_from'],time_to=query['time_to'],timeout=30)
          periods=[v.reference_period_code for v in values]
          candidates,observations=japan_household_spending_review_candidates(
              registry['records'],values,config,now_utc=datetime(2026,9,8,0,0,tzinfo=timezone.utc)
          )
          print({'status':snap.status,'values':len(values),'periods':periods,'candidates':len(candidates),'candidate_types':[c['candidate_type'] for c in candidates],'observation_types':[o['type'] for o in observations]})
          assert snap.status==200
          assert '20260700' in periods
          july=next(v for v in values if v.reference_period_code=='20260700')
          assert july.indicator_code=='0704010101000010000'
          assert july.stat_code=='00200561'
          # If August appears unexpectedly before 9 Oct, that is a valid review signal rather than a technical failure.
          if '20260800' in periods:
              assert any(c['candidate_type']=='JAPAN_HHSPEND_DATA_AVAILABLE_BEFORE_PLANNED_RELEASE_REVIEW' for c in candidates)
          else:
              assert not candidates
          PY
      - name: Restore ephemeral BL writes and prove original governed bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            data/sources/registry.json \
            data/monitor/expectations.json \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py \
            src/world_signals/adapters/__init__.py \
            tests/test_eurostat_monitor_bk.py
          rm -rf docs artifacts review_candidates/live || true
          sha256sum -c /tmp/bl-governed-pre.sha
