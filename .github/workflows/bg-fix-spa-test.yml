name: BG SPA test assertion repair
on:
  push:
    branches: [feature/post-bf-pressure-audit-bg]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "299a9295e76ebfb0c995c70b29ff37dbe222134b"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "363c5ff249ca8833744f15d74750d9377e8a9002"
          test "$(git merge-base HEAD origin/main)" = "363c5ff249ca8833744f15d74750d9377e8a9002"
      - name: Repair substring assertion and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_opec_official_confirmation_bg.py')
          text=path.read_text(encoding='utf-8')
          old='self.assertIn("not the competent OPEC issuing institution", source["known_limitations"])'
          new='self.assertTrue(any("not the competent OPEC issuing institution" in item for item in source["known_limitations"]))'
          assert text.count(old)==1, text.count(old)
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          rm .github/workflows/bg-fix-spa-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_opec_official_confirmation_bg.py .github/workflows/bg-fix-spa-test.yml
          git commit -m 'BG: correct SPA limitation substring assertion'
          git push origin HEAD:feature/post-bf-pressure-audit-bg
