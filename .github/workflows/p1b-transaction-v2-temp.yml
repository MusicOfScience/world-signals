name: TEMP P1-B governance transaction v2

on:
  push:
    branches: [source-governance-p1b-transaction-v2]

permissions:
  contents: write

jobs:
  transaction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read-only P1-B preflight
        run: python scripts/apply_source_governance_p1b.py
      - name: Apply guarded P1-B source-governance transaction
        env:
          WORLD_SIGNALS_ALLOW_P1B_GOVERNANCE_APPLY: YES
        run: python scripts/apply_source_governance_p1b.py --apply
      - name: Enforce source-registry-only working diff
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
          git diff --exit-code -- data/canonical/registry.json
          git diff --exit-code -- data/monitor/expectations.json
          git diff --exit-code -- scripts/run_live_monitor.py
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile monitor support scripts
        run: python -m compileall -q src scripts
      - name: Check browser JavaScript
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Build derived site
        run: python scripts/build_site.py
      - name: Reconfirm protected diff after validation
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
          git diff --exit-code -- data/canonical/registry.json data/monitor/expectations.json scripts/run_live_monitor.py
      - name: Commit source registry transaction
        run: |
          git config user.name "world-signals-governance"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources/registry.json
          git commit -m "Apply P1-B source-governance backfill"
          git push origin HEAD:source-governance-p1b-transaction-v2
