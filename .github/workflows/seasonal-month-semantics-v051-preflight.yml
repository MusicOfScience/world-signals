name: Preflight WORLD SIGNALS seasonal month semantics v0.51

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_seasonal_month_semantics_v051.py'
      - 'src/world_signals/temporal.py'
      - 'tests/test_temporal_windows.py'
      - '.github/workflows/seasonal-month-semantics-v051-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-signals-seasonal-month-semantics-v051-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run schema v0.51 migration in memory only
        run: PYTHONPATH=. python scripts/apply_seasonal_month_semantics_v051.py
      - name: Run temporal tests
        run: python -m unittest tests.test_temporal_windows -v
      - name: Validate current canonical registry
        run: python scripts/validate_registry.py
      - name: Prove source of truth remains unchanged
        shell: bash
        run: |
          git diff --exit-code
          python - <<'PY'
          import json
          from pathlib import Path
          schema=json.loads(Path('data/canonical/schema.json').read_text())
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          assert schema['version']=='0.50'
          assert reg['version']=='0.19'
          assert reg['record_count']==668
          assert 'SEASONAL_MONTH_RANGE' not in schema['controlled_vocabularies']['publication_time_semantics']
          print('Schema v0.51 preflight left source-of-truth untouched: PASS')
          PY
