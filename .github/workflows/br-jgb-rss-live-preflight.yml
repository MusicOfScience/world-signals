name: BR JGB RSS one-shot live preflight

on:
  push:
    branches:
      - feature/post-bq-jgb-monitor-br

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and materialise BR post-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1b021a5edb6b80dfab672f38047377d39dcae497"
          test "$(git merge-base HEAD origin/main)" = "1b021a5edb6b80dfab672f38047377d39dcae497"
          python scripts/apply_japan_mof_jgb_rss_monitor_br.py
          WORLD_SIGNALS_APPLY_MONITOR_BR=1 python scripts/apply_japan_mof_jgb_rss_monitor_br.py --apply
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/br-live-protected.before
      - name: Audit exact five-file materialisation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py'
          },changed
          PY
      - name: Execute exactly one official MOF RSS request and real review comparator
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters import fetch_japan_mof_news_rss
          from world_signals.japan_mof_jgb_monitor import japan_mof_jgb_rss_review_candidates

          items,snap=fetch_japan_mof_news_rss(timeout=30)
          assert snap.status==200
          assert len(items)>0
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(x for x in monitor['adapters'] if x['adapter_id']=='JAPAN_MOF_JGB_RSS')
          candidates,observations=japan_mof_jgb_rss_review_candidates(canonical['records'],items,config)
          result_candidates=[x for x in candidates if x['candidate_type']=='JAPAN_MOF_JGB_AUCTION_RESULT_PUBLICATION_EVIDENCE']
          sep8=[x for x in result_candidates if x['occurrence_ids']==['WSO-FIS-A-0016']]
          assert len(sep8)==1,(len(result_candidates),result_candidates)
          assert sep8[0]['event_state_inference']=='NONE'
          assert sep8[0]['automatic_commit_allowed'] is False
          assert sep8[0]['canonical_clock_mutation_allowed'] is False
          completed=[x for x in observations if x['type']=='JAPAN_MOF_JGB_COMPLETED_OCCURRENCE_RESULT_PRESENT_NO_LIFECYCLE_ACTION' and x['occurrence_id']=='WSO-FIS-A-0015']
          assert completed
          special=[x for x in observations if x['type']=='JAPAN_MOF_JGB_SPECIAL_PARTICIPANT_RESULT_CORROBORATION_ONLY' and x.get('occurrence_id')=='WSO-FIS-A-0016']
          assert special
          absence=[x for x in observations if x['type']=='JAPAN_MOF_JGB_RSS_ABSENCE_HAS_NO_SCHEDULE_LIFECYCLE_OR_CERTAINTY_SEMANTICS']
          assert len(absence)==1
          print(json.dumps({
            'status':snap.status,
            'content_type':snap.content_type,
            'body_sha256':snap.body_sha256,
            'item_count':len(items),
            'review_candidate_count':len(candidates),
            'sep8_standard_result_candidate_count':len(sep8),
            'completed_sep3_observation_count':len(completed),
            'sep8_special_participant_corroboration_count':len(special),
            'request_count':1,
            'schedule_authority':False,
            'lifecycle_authority':False,
            'rss_publication_time_is_auction_time':False,
            'automatic_calendar_html_fetch_allowed':False,
            'automatic_commit_allowed':False,
          },indent=2,sort_keys=True))
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/japan_mof_rss.py src/world_signals/japan_mof_jgb_monitor.py scripts/apply_japan_mof_jgb_rss_monitor_br.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore materialisation byte-clean
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/br-live-protected.after
          diff -u /tmp/br-live-protected.before /tmp/br-live-protected.after
          git restore -- data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
