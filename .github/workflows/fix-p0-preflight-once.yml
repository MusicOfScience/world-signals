name: Fix WORLD SIGNALS P0 preflight once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-p0-preflight-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Snapshot protected state
        run: |
          sha256sum data/canonical/registry.json > /tmp/canonical.sha
          sha256sum data/sources/registry.json > /tmp/sources.sha
          sha256sum data/monitor/expectations.json > /tmp/expectations.sha
          sha256sum data/monitor/operations_policy.json > /tmp/policy.sha
      - name: Correct live dependency precondition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan_path=Path('data/coverage/SOURCE_GOVERNANCE_P0_BACKFILL_PLAN_v0.1.json')
          plan=json.loads(plan_path.read_text(encoding='utf-8'))
          p=plan['preconditions']
          p['colombia_canonical_dependency_count']=1
          spec=plan['source_updates']['WSSRC-REG4-001']
          old=spec['expected'].pop('canonical_dependency_count',None)
          if old != 1:
              raise SystemExit(f'unexpected plan canonical_dependency_count {old!r}')
          spec['set']['canonical_dependency_count']=1
          plan_path.write_text(json.dumps(plan,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          script_path=Path('scripts/apply_source_governance_p0.py')
          text=script_path.read_text(encoding='utf-8')
          needle='''    for source_id, spec in plan["source_updates"].items():\n        if source_id not in sources:\n            continue\n        _assert_exact_fields(\n            sources[source_id],\n            spec.get("expected") or {},\n            f"source {source_id}",\n            errors,\n        )\n\n    configs = _configs_by_id(expectations)\n'''
          replacement='''    for source_id, spec in plan["source_updates"].items():\n        if source_id not in sources:\n            continue\n        _assert_exact_fields(\n            sources[source_id],\n            spec.get("expected") or {},\n            f"source {source_id}",\n            errors,\n        )\n\n    colombia_canonical_count = sum(\n        1\n        for record in canonical.get("records", [])\n        if record.get("source_id") == OLD_COLOMBIA_SOURCE_ID\n    )\n    if colombia_canonical_count != p["colombia_canonical_dependency_count"]:\n        errors.append(\n            "Colombia canonical dependency count derived from registry: "\n            f"{colombia_canonical_count} != {p['colombia_canonical_dependency_count']}"\n        )\n\n    configs = _configs_by_id(expectations)\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected one script insertion point, found {text.count(needle)}')
          script_path.write_text(text.replace(needle,replacement),encoding='utf-8')

          test_path=Path('tests/test_source_governance_p0.py')
          text=test_path.read_text(encoding='utf-8')
          needle='''                "source_id": "WSSRC-REG4-001",\n            }\n            for i in range(p["canonical_record_count"])\n'''
          replacement='''                "source_id": "WSSRC-REG4-001" if i == 0 else "WSSRC-FIN-001",\n            }\n            for i in range(p["canonical_record_count"])\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected one synthetic fixture source pattern, found {text.count(needle)}')
          test_path.write_text(text.replace(needle,replacement),encoding='utf-8')
          PY
      - name: Verify protected state unchanged
        run: |
          sha256sum -c /tmp/canonical.sha
          sha256sum -c /tmp/sources.sha
          sha256sum -c /tmp/expectations.sha
          sha256sum -c /tmp/policy.sha
      - name: Run focused tests and check-only migration
        run: |
          python -m unittest tests.test_source_governance_p0 -v
          python scripts/apply_source_governance_p0.py
          python scripts/validate_registry.py
      - name: Restrict changed files
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' data/coverage/SOURCE_GOVERNANCE_P0_BACKFILL_PLAN_v0.1.json scripts/apply_source_governance_p0.py tests/test_source_governance_p0.py | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
      - name: Commit correction
        run: |
          git config user.name 'world-signals-guarded-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/coverage/SOURCE_GOVERNANCE_P0_BACKFILL_PLAN_v0.1.json scripts/apply_source_governance_p0.py tests/test_source_governance_p0.py
          git commit -m 'Fix P0 governance dependency precondition'
          git push origin HEAD:main
