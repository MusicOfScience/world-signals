name: CM closeout recovery surfaces

on:
  push:
    branches:
      - feature/post-cl-live-correction-conflict-contract-cm

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact post-CL main boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=1e4a6bbc8670fc36a452740401461f28e313c031
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"

      - name: Reconcile CM recovery narrative
        run: python scripts/closeout_cm_docs_tmp.py

      - name: Verify mechanically derived state remains consistent
        run: python scripts/project_state_snapshot.py --check

      - name: Remove temporary machinery and enforce docs-only mutation
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=${{ github.sha }}
          git rm scripts/closeout_cm_docs_tmp.py
          git rm .github/workflows/cm-closeout-docs.yml
          actual=$(mktemp)
          expected=$(mktemp)
          git diff --name-only "$BEFORE" | sort > "$actual"
          cat > "$expected" <<'EOF'
          .github/workflows/cm-closeout-docs.yml
          PROJECT_STATUS.md
          ROADMAP.md
          scripts/closeout_cm_docs_tmp.py
          EOF
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

      - name: Commit CM closeout narratives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name world-signals-cm-closeout
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "CM: reconcile closeout and select CN"
          git push origin "HEAD:${GITHUB_REF_NAME}"
