name: TEMP P1 81 selected scope diagnostic
on:
  push:
    paths:
      - '.github/workflows/temp-p1-81-selection-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p1-81-selection-diagnostic
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print selected source and canonical contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids=['WSSRC-REGJ-002','WSSRC-RISK-001','WSSRC-REG2-004','WSSRC-HEALTH-004','WSSRC-REG-009','WSSRC-INT-018','WSSRC-COM-005']
          can=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          by={r['source_id']:r for r in src['sources']}
          print('CHECKPOINT',can['version'],src['version'],len(can['records']),len(src['sources']))
          for sid in ids:
              print('\n=== SOURCE',sid,'===')
              print(json.dumps(by[sid],ensure_ascii=False,indent=2,sort_keys=True))
              rr=[r for r in can['records'] if r.get('source_id')==sid]
              print('DEPENDENCIES',len(rr))
              for r in rr:
                  print(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True))
          PY
