name: TEMP P1 balanced governance D simulation
on:
  push:
    paths:
      - '.github/workflows/temp-p1-balanced-governance-d-sim.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read-only preflight
        run: python scripts/apply_p1_balanced_governance_d.py --committed-at '2026-09-05T16:30:00+10:00'
      - name: Apply in disposable checkout
        env:
          WORLD_SIGNALS_ALLOW_P1_BALANCED_GOVERNANCE_D_APPLY: 'YES'
        run: python scripts/apply_p1_balanced_governance_d.py --apply --committed-at '2026-09-05T16:30:00+10:00'
      - name: Exact four-file simulated mutation
        run: |
          python - <<'PY'
          import subprocess
          expected={'data/canonical/registry.json','data/sources/registry.json','data/changes/ledger.json','data/coverage/biosecurity_overlay.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          print('CHANGED',sorted(actual))
          assert actual==expected,(actual,expected)
          PY
      - name: Independent post-state assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.world_signals.source_governance_audit import build_source_governance_audit
          can=json.loads(Path('data/canonical/registry.json').read_text()); src=json.loads(Path('data/sources/registry.json').read_text()); led=json.loads(Path('data/changes/ledger.json').read_text()); ov=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text()); exp=json.loads(Path('data/monitor/expectations.json').read_text())
          assert can['version']=='0.25' and len(can['records'])==669
          assert src['version']=='1.66' and len(src['sources'])==227
          assert led['version']=='0.14'
          assert ov['canonical_checkpoint']=={'registry_version':'0.25','record_count':669}
          r=next(x for x in can['records'] if x['occurrence_id']=='WSO-TRD-A-0002')
          assert r['date_earliest']=='2026-09-25' and r['date_latest']=='2026-09-28'
          assert r['certainty_status']=='PROVISIONAL' and r['activation_mode']=='CONDITIONAL' and r['condition_state']=='PENDING'
          assert r['primary_source_assertion_id']=='WSA-824057952e18ea60' and r['last_successful_assertion_id']=='WSA-824057952e18ea60'
          assert r['legal_basis_source_id']=='WSSRC-TRD-008'
          sm={x['source_id']:x for x in src['sources']}
          assert sm['WSSRC-TRD-008']['canonical_dependency_count']==0
          assert sum(1 for x in can['records'] if x.get('source_id')=='WSSRC-TRD-008')==0
          expected={'WSSRC-RISK-002','WSSRC-COM-009','WSSRC-COM-008','WSSRC-INT-013','WSSRC-HEALTH-002','WSSRC-TRD-002','WSSRC-REG2-003','WSSRC-EL-VIC-001','WSSRC-TRD-008'}
          for sid in expected:
              for k in ('canonical_provenance_use','automated_monitoring_use','verification_mode'):
                  assert sm[sid].get(k) is not None,(sid,k)
          assert all(sm[sid]['verification_mode']!='AUTOMATED_PILOT' for sid in expected)
          audit=build_source_governance_audit(can,src,exp)['totals']
          totals={'fully_explicit':audit['fully_explicit_governance_source_count'],'missing_any':audit['source_records_with_one_or_more_missing_governance_fields'],'p1':audit['backfill_research_priority_counts']['P1_CANONICAL_DEPENDENCY'],'p2':audit['backfill_research_priority_counts']['P2_REGISTRY_ONLY']}
          print('GOVERNANCE',totals)
          assert totals=={'fully_explicit':90,'missing_any':137,'p1':66,'p2':71},totals
          assert exp['automatic_canonical_commit'] is False and exp['google_calendar_write'] is False
          assert next(x for x in can['records'] if x['occurrence_id']=='WSO-REG-A-0014')['start_local']=='2026-10-09'
          assert next(x for x in can['records'] if x['occurrence_id']=='WSO-EL-A-0004')['start_local']=='2027-01-05'
          print('INDEPENDENT_SIM_AUDIT PASS')
          PY
      - name: Registry validator
        run: python scripts/validate_registry.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Python compilation
        run: python -m compileall -q scripts src
      - name: Browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Full site build
        run: python scripts/build_site.py
      - name: Prove disposable checkout only
        run: |
          test -n "$GITHUB_RUN_ID"
          echo 'DISPOSABLE_CHECKOUT_ONLY PASS'
