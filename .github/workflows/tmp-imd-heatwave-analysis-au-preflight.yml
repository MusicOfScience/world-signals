name: WORLD SIGNALS AU IMD outlook Analysis read-only preflight v2

on:
  push:
    branches:
      - feature/post-at-pressure-audit-au
    paths:
      - .github/workflows/tmp-imd-heatwave-analysis-au-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-75 base and workflow hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=03a8f87f17570c2520edadf78237ed07d946107a
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          test ! -e .github/workflows/tmp-au-descendant-repair.yml
          test ! -e .github/workflows/tmp-au-whitespace-cleanup.yml
          test ! -e .github/workflows/tmp-imd-heatwave-analysis-au-transaction.yml
      - name: Read-only AU simulation
        run: python scripts/apply_imd_heatwave_outlook_analysis_au.py --check
      - name: Targeted AU and AQ regressions
        run: |
          python -m unittest \
            tests.test_imd_heatwave_outlook_analysis_au \
            tests.test_eu_russia_sanctions_analysis_aq -v
      - name: Validate current governed layers
        run: |
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
      - name: Run full repository suite
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q src scripts tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Build static site
        run: python scripts/build_site.py
      - name: Prove read-only state and exact-series zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reviews=json.loads(Path('data/analysis/event_reviews.json').read_text())
          assert reviews['version']=='0.15'
          assert len(reviews['reviews'])==19
          assert reviews['canonical_checkpoint']=={'registry_version':'0.37','record_count':687}
          evidence=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert evidence['version']=='0.15'
          assert len(evidence['evidence'])==85
          exact=sum(1 for r in reviews['reviews'] for m in (r.get('what_moved') or []) if m.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES')
          assert exact==0, exact
          print('AU_READ_ONLY_STATE_OK EXACT_TIMESTAMP_SERIES=0')
          PY
          rm -rf artifacts review_candidates/live site _site public
          git diff --exit-code
