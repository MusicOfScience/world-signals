name: BS post-BR read-only pressure audit

on:
  push:
    branches:
      - feature/post-br-pressure-audit-bs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BR baseline and compute monitor pressure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          test "$(git merge-base HEAD origin/main)" = "22a5c0a922d3a126bf268acb61a68abe1bfe5075"
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert (sources['version'],len(sources['sources']))==('1.91',249)
          assert (monitor['version'],len(monitor['adapters']))==('0.16',14)
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False

          by_occ={r['occurrence_id']:r for r in canonical['records']}
          by_source={r['source_id']:r for r in sources['sources']}
          region_total=Counter(r.get('region') or 'UNKNOWN' for r in canonical['records'])
          region_monitored_occ=Counter()
          region_routes=Counter()
          route_rows=[]
          monitored_ids=set()
          for adapter in monitor['adapters']:
              ids=list(adapter.get('canonical_occurrence_ids') or [])
              regions=Counter()
              for oid in ids:
                  if oid in by_occ:
                      reg=by_occ[oid].get('region') or 'UNKNOWN'
                      regions[reg]+=1
                      region_monitored_occ[reg]+=1
                      monitored_ids.add(oid)
              for reg in regions:
                  region_routes[reg]+=1
              route_rows.append({
                  'adapter_id':adapter.get('adapter_id'),
                  'source_id':adapter.get('source_id'),
                  'occurrence_count':len(ids),
                  'regions':dict(regions),
                  'schedule_authority':adapter.get('schedule_authority'),
                  'lifecycle_authority':adapter.get('lifecycle_authority'),
              })

          deps=defaultdict(list)
          for row in canonical['records']:
              sid=row.get('source_id')
              if sid:
                  deps[sid].append(row)

          priority={'Oceania / Pacific','Pacific','South Asia','Southeast Asia','Latin America','Africa'}
          candidates=[]
          for sid,rows in deps.items():
              src=by_source.get(sid)
              if not src:
                  continue
              regions=Counter(r.get('region') or 'UNKNOWN' for r in rows)
              if not set(regions)&priority:
                  continue
              route_count=sum(1 for a in monitor['adapters'] if a.get('source_id')==sid)
              unmonitored=[r for r in rows if r['occurrence_id'] not in monitored_ids]
              candidates.append({
                  'source_id':sid,
                  'institution':src.get('institution'),
                  'jurisdiction':src.get('jurisdiction'),
                  'domain':src.get('domain'),
                  'source_type':src.get('source_type'),
                  'regions':dict(regions),
                  'canonical_dependency_count':src.get('canonical_dependency_count'),
                  'actual_dependency_count':len(rows),
                  'unmonitored_dependency_count':len(unmonitored),
                  'existing_route_count_for_source':route_count,
                  'automated_monitoring_use':src.get('automated_monitoring_use'),
                  'automated_retrieval_permission':src.get('automated_retrieval_permission'),
                  'verification_mode':src.get('verification_mode'),
                  'monitoring_readiness_status':src.get('monitoring_readiness_status'),
                  'monitoring_activation_status':src.get('monitoring_activation_status'),
                  'runtime_health_state':src.get('runtime_health_state'),
                  'machine_readable_available':src.get('machine_readable_available'),
                  'parser_type':src.get('parser_type'),
                  'monitor_endpoints':src.get('monitor_endpoints'),
                  'authoritative_url':src.get('authoritative_url'),
                  'future_dates':[r.get('start_local') for r in unmonitored if str(r.get('start_local',''))>='2026-09-08'][:12],
              })

          rank={'CLEARED':0,'ENDPOINT_REVIEW_REQUIRED':1,'PENDING':2,None:3}
          candidates.sort(key=lambda x:(
              rank.get(x['automated_monitoring_use'],2),
              -x['unmonitored_dependency_count'],
              x['source_id']
          ))
          print(json.dumps({
              'baseline':'22a5c0a922d3a126bf268acb61a68abe1bfe5075',
              'canonical':[canonical['version'],len(canonical['records'])],
              'sources':[sources['version'],len(sources['sources'])],
              'monitor':[monitor['version'],len(monitor['adapters'])],
              'regional_canonical_occurrences':dict(region_total),
              'regional_monitored_occurrence_links':dict(region_monitored_occ),
              'regional_configured_route_presence':dict(region_routes),
              'routes':route_rows,
              'priority_region_candidate_sources':candidates,
          },indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Prove audit is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
