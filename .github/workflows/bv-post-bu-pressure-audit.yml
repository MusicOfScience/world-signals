name: BV post-BU read-only readiness shortlist

on:
  push:
    branches:
      - feature/post-bu-pressure-audit-bv
    paths:
      - '.github/workflows/bv-post-bu-pressure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BU baseline and shortlist future monitor candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test "$(git merge-base HEAD origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path

          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('1.94',252)
          assert (m['version'],len(m['adapters']))==('0.19',17)
          assert not m['automatic_canonical_commit'] and not m['google_calendar_write']

          by_source={x['source_id']:x for x in s['sources']}
          monitored={oid for a in m['adapters'] for oid in (a.get('canonical_occurrence_ids') or [])}
          region_routes=Counter()
          by_occ={r['occurrence_id']:r for r in c['records']}
          for a in m['adapters']:
              for region in {by_occ[oid].get('region') for oid in (a.get('canonical_occurrence_ids') or []) if oid in by_occ}:
                  region_routes[region]+=1

          deps=defaultdict(list)
          for r in c['records']:
              if r.get('source_id'):
                  deps[r['source_id']].append(r)

          rows=[]
          for sid,records in deps.items():
              src=by_source.get(sid)
              if not src: continue
              future=[r for r in records if str(r.get('start_local') or '')>='2026-09-08' and r['occurrence_id'] not in monitored]
              if not future: continue
              governance=' | '.join(str(src.get(k) or '') for k in (
                  'monitoring_readiness_status','monitoring_activation_status','automated_retrieval_permission',
                  'automated_monitoring_use','ingestion_permission','licence_review_status','runtime_health_state'
              ))
              u=governance.upper()
              if any(x in u for x in ('MANUAL_ONLY_RIGHTS_HOLD','PRODUCTION_AUTOMATION_HOLD','PRIOR_WRITTEN','RIGHTS_AUDIT_REQUIRED')):
                  bucket='HOLD'
              elif any(x in u for x in ('READY','OPERATIONALLY_CLEARED','ACTIVE')):
                  bucket='READY_OR_ACTIVE'
              elif any(x in u for x in ('ENDPOINT_REVIEW','REVIEW_REQUIRED','PENDING_ENDPOINT')):
                  bucket='ENDPOINT_REVIEW'
              else:
                  bucket='UNCLASSIFIED'
              regions=Counter(r.get('region') or 'UNKNOWN' for r in future)
              rows.append({
                  'bucket':bucket,
                  'source_id':sid,
                  'institution':src.get('institution'),
                  'jurisdiction':src.get('jurisdiction'),
                  'future_unmonitored':len(future),
                  'regions':dict(regions),
                  'regional_route_floor':min(region_routes.get(k,0) for k in regions),
                  'source_type':src.get('source_type'),
                  'machine_readable_available':src.get('machine_readable_available'),
                  'parser_type':src.get('parser_type'),
                  'monitoring_readiness_status':src.get('monitoring_readiness_status'),
                  'monitoring_activation_status':src.get('monitoring_activation_status'),
                  'automated_retrieval_permission':src.get('automated_retrieval_permission'),
                  'automated_monitoring_use':src.get('automated_monitoring_use'),
                  'licence_review_status':src.get('licence_review_status'),
                  'authoritative_url':src.get('authoritative_url'),
                  'occurrences':[{
                      'occurrence_id':r['occurrence_id'],
                      'name':r.get('canonical_name') or r.get('title'),
                      'start_local':r.get('start_local'),
                      'region':r.get('region')
                  } for r in future],
              })

          order={'READY_OR_ACTIVE':0,'ENDPOINT_REVIEW':1,'UNCLASSIFIED':2,'HOLD':3}
          rows.sort(key=lambda x:(order[x['bucket']],x['regional_route_floor'],-x['future_unmonitored'],x['source_id']))
          shortlisted=[r for r in rows if r['bucket']!='HOLD'][:30]
          held=Counter()
          for r in rows:
              if r['bucket']=='HOLD':
                  for reg,n in r['regions'].items(): held[reg]+=n
          print('SHORTLIST_JSON')
          print(json.dumps(shortlisted,indent=2,ensure_ascii=False,sort_keys=True))
          print('HELD_FUTURE_DEPENDENCIES_BY_REGION',json.dumps(held,sort_keys=True))
          print('SHORTLIST_COUNT',len(shortlisted))
          PY
      - name: Prove audit is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
