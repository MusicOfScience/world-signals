name: TEMP P1-E status refresh

on:
  push:
    branches: [source-governance-p1e-research]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh project checkpoint after P1-D
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_STATUS.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**Tier-1 source registry:** v1.55 — **223 sources**.', '**Tier-1 source registry:** v1.56 — **223 sources**.', 1)
          s=s.replace('stale relative to current v0.20 / v1.55.', 'stale relative to current v0.20 / v1.56.', 1)
          s=s.replace('**127 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.', '**121 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.', 1)
          old='''P1-D research is frozen for RBA release scheduling, U.S. BEA, Statistics Bureau of Japan, Bank Indonesia, INDEC Argentina and Kenya Law / Constitution — **40 canonical dependencies** across Australia, the United States, Japan, Indonesia, Argentina and Kenya. Bank Indonesia remains manual/rights-held because no source-specific reuse/automation clearance was identified.\n\nBrazil TSE and Swiss National Bank remain excluded for provenance-scope repair. SNB's registered decisions/history URL still does not directly support the forward assessment schedule; Brazil's `2027-01-05` inauguration remains constitutionally grounded rather than an electoral-calendar date.\n\nDurable P1-C audit: `data/coverage/SOURCE_GOVERNANCE_P1C_BACKFILL_AUDIT_v0.1.md`.\nP1-D research/plan: `data/coverage/SOURCE_GOVERNANCE_P1D_RESEARCH_v0.1.md` and `data/coverage/SOURCE_GOVERNANCE_P1D_BACKFILL_PLAN_v0.1.json`.\n'''
          new='''### P1-D international / cross-domain tranche — COMPLETE\n\nP1-D backfilled RBA release scheduling, U.S. BEA, Statistics Bureau of Japan, Bank Indonesia, INDEC Argentina and Kenya Law / Constitution — **40 canonical dependencies** across Australia, the United States, Japan, Indonesia, Argentina and Kenya. Source registry advanced **v1.55 → v1.56 / 223**; canonical remains **v0.20 / 669** and monitor expectations **v0.7**.\n\nGuarded transaction run `33865020762` passed preflight, exact one-file enforcement, registry validation and the full unit suite. PR #11 merged as `fbd95ede5a02daebfa6271e101a2e006ae9ca4ac`. Independent post-P1-D audit run `33866450058` measured:\n\n- **31** fully explicit governance sources;\n- **192** sources still missing at least one governance field;\n- **0 P0** configured-monitor dependencies;\n- **121 P1** canonical dependencies;\n- **71 P2** registry-only sources;\n- missing `canonical_provenance_use`: **182**;\n- missing `automated_monitoring_use`: **182**;\n- missing `verification_mode`: **192**.\n\nP1-E research is frozen for ECB monetary-policy publications, Bank of England MPC dates, Japan Customs/MOF trade statistics, ABS CPI, Convention on Biological Diversity COP and Central Bank of Egypt — **43 canonical dependencies**. BoE and CBD remain rights-held/manual; Japan Customs and ABS retain automated-pilot verification without inferring production polling permission.\n\nBrazil TSE and Swiss National Bank remain excluded for provenance-scope repair. SNB's registered decisions/history URL still does not directly support the forward assessment schedule; Brazil's `2027-01-05` inauguration remains constitutionally grounded rather than an electoral-calendar date.\n\nDurable P1-D audit: `data/coverage/SOURCE_GOVERNANCE_P1D_BACKFILL_AUDIT_v0.1.md`.\nP1-E research/plan: `data/coverage/SOURCE_GOVERNANCE_P1E_RESEARCH_v0.1.md` and `data/coverage/SOURCE_GOVERNANCE_P1E_BACKFILL_PLAN_v0.1.json`.\n'''
          if old not in s:
              raise SystemExit('P1-D status block anchor not found')
          s=s.replace(old,new,1)
          old_next='''3. **Source-governance P1-D transaction gate** — review/merge the frozen P1-D infrastructure, reconcile merged source v1.55 and run the guarded read-only preflight before any registry-only v1.56 transaction; Brazil TSE and SNB remain excluded pending source-scope repair.\n'''
          new_next='''3. **Source-governance P1-E transaction gate** — review/merge the frozen P1-E infrastructure, reconcile merged source v1.56 and run the guarded read-only preflight before any registry-only v1.57 transaction; Brazil TSE and SNB remain excluded pending source-scope repair.\n'''
          if old_next not in s:
              raise SystemExit('next-work P1-D anchor not found')
          s=s.replace(old_next,new_next,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify status-only diff
        run: test "$(git diff --name-only)" = "PROJECT_STATUS.md"
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit status refresh
        run: |
          git config user.name "world-signals-status"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Refresh checkpoint after P1-D"
          git push origin HEAD:source-governance-p1e-research
