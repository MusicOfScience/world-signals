name: BW Japan CPI read-only endpoint diagnostic

on:
  push:
    branches:
      - feature/post-bv-pressure-audit-bw

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BV ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git merge-base HEAD origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
      - name: Execute exactly two official Statistics Bureau requests and retain raw evidence
        shell: bash
        run: |
          set -u
          TMP="$RUNNER_TEMP/bw-jp-cpi"
          mkdir -p "$TMP"
          ROBOTS='https://www.stat.go.jp/robots.txt'
          SCHEDULE='https://www.stat.go.jp/english/data/cpi/1582.html'
          set +e
          curl --silent --show-error --max-redirs 0 -A 'WORLD-SIGNALS/0.1 (+review-only schedule monitor)' -D "$TMP/robots.headers" -o "$TMP/robots.body" -w '%{http_code}|%{content_type}|%{url_effective}\n' "$ROBOTS" > "$TMP/robots.meta"
          ROBOTS_CURL=$?
          curl --silent --show-error --max-redirs 0 -A 'WORLD-SIGNALS/0.1 (+review-only schedule monitor)' -D "$TMP/schedule.headers" -o "$TMP/schedule.body" -w '%{http_code}|%{content_type}|%{url_effective}\n' "$SCHEDULE" > "$TMP/schedule.meta"
          SCHEDULE_CURL=$?
          set -e
          export ROBOTS_CURL SCHEDULE_CURL
          python - <<'PY'
          import hashlib, html, json, os, re
          from pathlib import Path
          from urllib.robotparser import RobotFileParser

          root=Path(os.environ['RUNNER_TEMP'])/'bw-jp-cpi'
          def meta(name):
              p=root/f'{name}.meta'
              if not p.exists(): return {'raw':None,'status':None,'content_type':None,'effective_url':None}
              raw=p.read_text(errors='replace').strip()
              parts=raw.split('|',2)
              return {
                  'raw':raw,
                  'status':int(parts[0]) if parts and parts[0].isdigit() else None,
                  'content_type':parts[1] if len(parts)>1 else None,
                  'effective_url':parts[2] if len(parts)>2 else None,
              }
          def body(name):
              p=root/f'{name}.body'
              return p.read_bytes() if p.exists() else b''

          rm=meta('robots'); sm=meta('schedule')
          rb=body('robots'); sb=body('schedule')
          schedule_text=sb.decode('utf-8','replace')
          stripped=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',schedule_text)))
          expected={
              'August, 2026':'September 18',
              'September':'October 23',
              'October':'November 20',
              'November':'December 18',
              'December':'January 22, 2027',
              'January, 2027':'February 19',
              'February':'March 19',
          }
          checks={}
          for survey_month,release in expected.items():
              pattern=re.escape(survey_month)+r'.{0,220}?'+re.escape(release)
              checks[survey_month]=bool(re.search(pattern,stripped,re.I))

          robots_state='UNRESOLVED_NO_PERMISSION_INFERENCE'
          robots_allows=None
          if rm['status']==200:
              rt=rb.decode('utf-8','replace')
              if 'user-agent' in rt.lower():
                  rp=RobotFileParser(); rp.parse(rt.splitlines())
                  robots_allows=rp.can_fetch('*','https://www.stat.go.jp/english/data/cpi/1582.html')
                  robots_state='VALID_POLICY_ALLOW' if robots_allows else 'VALID_POLICY_DISALLOW'
              else:
                  robots_state='HTTP_200_NON_ROBOTS_BODY_NO_PERMISSION_INFERENCE'
          elif rm['status'] in (404,410):
              robots_state='NO_ROBOTS_RESOURCE_NO_PERMISSION_INFERENCE'
          elif rm['status'] is not None:
              robots_state=f'HTTP_{rm["status"]}_NO_PERMISSION_INFERENCE'

          result={
              'reference_date':'2026-09-09',
              'baseline':'b277939bc6c540d0986f298a832c7d63a29a2d19',
              'request_count':2,
              'followup_request_count':0,
              'curl_exit_codes':{
                  'robots':int(os.environ.get('ROBOTS_CURL','999')),
                  'schedule':int(os.environ.get('SCHEDULE_CURL','999')),
              },
              'robots':{
                  **rm,
                  'bytes':len(rb),
                  'sha256':hashlib.sha256(rb).hexdigest(),
                  'body_prefix':rb[:200].decode('utf-8','replace'),
                  'state':robots_state,
                  'allows_schedule_path':robots_allows,
              },
              'schedule':{
                  **sm,
                  'bytes':len(sb),
                  'sha256':hashlib.sha256(sb).hexdigest(),
                  'body_prefix':sb[:300].decode('utf-8','replace'),
                  'has_schedule_heading':'Schedule of Release' in schedule_text,
                  'has_last_update':'Last Update' in schedule_text,
                  'has_23_january_2026':'23 January 2026' in schedule_text,
                  'configured_national_cpi_date_matches':checks,
                  'configured_match_count':sum(checks.values()),
                  'clock_exposed_by_schedule':False,
              },
              'authority_contract':{
                  'civil_date_identity_evidence_only':True,
                  'clock_authority':False,
                  'lifecycle_authority':False,
                  'certainty_authority':False,
                  'automatic_canonical_commit':False,
                  'google_calendar_write':False,
                  'automatic_live_or_analysis_promotion':False,
              },
          }
          out=Path(os.environ['RUNNER_TEMP'])/'bw-japan-cpi-diagnostic.json'
          out.write_text(json.dumps(result,indent=2,sort_keys=True))
          print(out.read_text())
          PY
      - name: Prove repository remains read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload diagnostic result before acceptance gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bw-japan-cpi-diagnostic
          path: ${{ runner.temp }}/bw-japan-cpi-diagnostic.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce endpoint acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'bw-japan-cpi-diagnostic.json'
          r=json.loads(p.read_text())
          assert r['curl_exit_codes']=={'robots':0,'schedule':0}, r['curl_exit_codes']
          assert r['schedule']['status']==200, r['schedule']
          assert 'text/html' in (r['schedule']['content_type'] or '').lower(), r['schedule']
          assert r['schedule']['bytes']>10000, r['schedule']['bytes']
          assert r['schedule']['has_schedule_heading'] is True
          assert r['schedule']['has_last_update'] is True
          assert r['schedule']['configured_match_count']==7, r['schedule']['configured_national_cpi_date_matches']
          if r['robots']['status']==200:
              assert r['robots']['state']=='VALID_POLICY_ALLOW', r['robots']
          else:
              assert r['robots']['status'] in (404,410), r['robots']
          PY
