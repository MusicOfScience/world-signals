name: Temporary nonmarket institutional analysis W transaction

on:
  push:
    branches:
      - feature/nonmarket-institutional-analysis-w
    paths:
      - 'data/analysis/NONMARKET_INSTITUTIONAL_ANALYSIS_W_*'
      - 'scripts/apply_nonmarket_institutional_analysis_w.py'
      - 'tests/test_nonmarket_institutional_analysis_w.py'
      - '.github/workflows/_temp-analysis-w.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-51 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "cfa55b4aa6c7e907613c349557c64276e9c6498e"
      - name: Fail-closed W check
        run: python scripts/apply_nonmarket_institutional_analysis_w.py
      - name: W-specific tests
        run: python -m unittest tests.test_nonmarket_institutional_analysis_w -v
      - name: Reviewed W apply
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_W: REVIEWED_APPLY
        run: python scripts/apply_nonmarket_institutional_analysis_w.py --apply
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: python -m py_compile scripts/*.py src/world_signals/*.py
      - name: Browser JavaScript checks
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Static site build
        run: python scripts/build_site.py
      - name: Prove protected upstream and schema untouched
        run: |
          git diff --exit-code origin/main -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json
      - name: Commit reviewed transaction and self-remove workflow
        run: |
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add data/analysis/event_reviews.json data/analysis/evidence_registry.json data/analysis/NONMARKET_INSTITUTIONAL_ANALYSIS_W_TRANSACTION_AUDIT_v0.1.md
          git rm .github/workflows/_temp-analysis-w.yml
          git commit -m "Apply nonmarket institutional analysis W transaction"
          git push origin HEAD:feature/nonmarket-institutional-analysis-w
