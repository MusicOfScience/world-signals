name: BW Japan CPI read-only contract inspection

on:
  push:
    branches:
      - feature/post-bv-pressure-audit-bw

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BV ancestry and retain contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git merge-base HEAD origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          python - <<'PY'
          import json, os
          from pathlib import Path

          source_id='WSSRC-MAC-014'
          occurrence_ids=[f'WSO-MAC-A-{n:04d}' for n in range(50,57)]
          sources=json.loads(Path('data/sources/registry.json').read_text())
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          src=[s for s in sources['sources'] if s['source_id']==source_id]
          assert len(src)==1
          rows=[r for r in canonical['records'] if r['occurrence_id'] in occurrence_ids]
          by_id={r['occurrence_id']:r for r in rows}
          assert set(by_id)==set(occurrence_ids)
          routes=[a for a in monitor['adapters'] if a.get('source_id')==source_id]
          result={
              'baseline':'b277939bc6c540d0986f298a832c7d63a29a2d19',
              'source_registry':[sources['version'],len(sources['sources'])],
              'canonical_registry':[canonical['version'],len(canonical['records'])],
              'monitor':[monitor['version'],len(monitor['adapters'])],
              'source':src[0],
              'canonical_occurrences':[by_id[oid] for oid in occurrence_ids],
              'existing_routes_for_source':routes,
              'automatic_canonical_commit':monitor['automatic_canonical_commit'],
              'google_calendar_write':monitor['google_calendar_write'],
          }
          out=Path(os.environ['RUNNER_TEMP'])/'bw-japan-cpi-contract.json'
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False,sort_keys=True))
          print(out.read_text())
          PY
      - name: Prove repository remains read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload contract result
        uses: actions/upload-artifact@v4
        with:
          name: bw-japan-cpi-contract
          path: ${{ runner.temp }}/bw-japan-cpi-contract.json
          if-no-files-found: error
          retention-days: 1
