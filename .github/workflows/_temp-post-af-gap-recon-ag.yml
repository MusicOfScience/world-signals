name: TEMP AG South Korea local-election transaction

on:
  push:
    branches:
      - feature/post-af-gap-recon-ag

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-61 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "3ebd01e1f6f3ba2b09343f238f3ac72262484391"
      - name: Fail-closed AG check-only transform
        run: python scripts/apply_south_korea_local_election_anchor_ag.py
      - name: AG tests before write
        run: python -m unittest tests.test_south_korea_local_election_anchor_ag -v
      - name: Apply reviewed AG transaction
        env:
          WORLD_SIGNALS_APPLY_KR_LOCAL_ELECTION_ANCHOR_AG: REVIEWED_APPLY
        run: python scripts/apply_south_korea_local_election_anchor_ag.py --apply
      - name: Validate canonical post-state
        run: python scripts/validate_registry.py
      - name: Validate Analysis remains sound
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/apply_south_korea_local_election_anchor_ag.py \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_analysis.py \
            src/world_signals/analysis.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Exact AG production mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'data/canonical/registry.json',
              'data/sources/registry.json',
              'data/changes/ledger.json',
              'data/coverage/biosecurity_overlay.json',
              'data/coverage/SOUTH_KOREA_LOCAL_ELECTION_HISTORICAL_ANCHOR_AG_TRANSACTION_AUDIT_v0.1.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'AG mutation boundary drift: expected {sorted(expected)}, got {sorted(paths)}')
          print('AG_MUTATION_BOUNDARY_OK')
          PY
      - name: Commit reviewed transaction and self-remove temporary research files
        run: |
          rm .github/workflows/_temp-post-af-gap-recon-ag.yml
          rm scripts/probe_post_af_gap_candidates_ag.py
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add \
            data/canonical/registry.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/coverage/SOUTH_KOREA_LOCAL_ELECTION_HISTORICAL_ANCHOR_AG_TRANSACTION_AUDIT_v0.1.md \
            .github/workflows/_temp-post-af-gap-recon-ag.yml \
            scripts/probe_post_af_gap_candidates_ag.py
          git commit -m "Apply South Korea local-election historical anchor AG"
          git push origin HEAD:feature/post-af-gap-recon-ag
