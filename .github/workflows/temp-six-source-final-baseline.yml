name: TEMP six-source final baseline
on:
  push:
    paths:
      - '.github/workflows/temp-six-source-final-baseline.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print six source baselines and versions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids=['WSSRC-MAC-021','WSSRC-REG2-005','WSSRC-REG-005','WSSRC-EL-ZA-001','WSSRC-INT-021','WSSRC-FIS-023']
          src=json.loads(Path('data/sources/registry.json').read_text())
          can=json.loads(Path('data/canonical/registry.json').read_text())
          led=json.loads(Path('data/changes/ledger.json').read_text())
          overlay=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          exp=json.loads(Path('data/monitor/expectations.json').read_text())
          print('VERSIONS',json.dumps({'canonical':can.get('version'),'canonical_count':len(can.get('records',[])),'source':src.get('version'),'source_count':len(src.get('sources',[])),'ledger':led.get('version'),'overlay_checkpoint':overlay.get('canonical_checkpoint'),'monitor':exp.get('version'),'automatic_canonical_commit':exp.get('automatic_canonical_commit'),'google_calendar_write':exp.get('google_calendar_write')},sort_keys=True))
          for sid in ids:
              row=next(r for r in src['sources'] if r['source_id']==sid)
              print('SOURCE',sid)
              print(json.dumps(row,ensure_ascii=False,indent=2,sort_keys=True))
          PY
