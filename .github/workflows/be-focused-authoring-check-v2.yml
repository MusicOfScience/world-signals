name: BE focused authoring check v2

on:
  push:
    branches: [feature/post-bd-opec-outcome-be]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BD ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e54dddbaa0d60a39babc2fa47c1f054954b5c9ac"
          test "$(git merge-base HEAD origin/main)" = "e54dddbaa0d60a39babc2fa47c1f054954b5c9ac"
      - name: Run corrected BE focused gate
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          test -z "$before"
          python scripts/apply_opec_fallback_completion_be.py --check-only
          python -m unittest tests.test_opec_fallback_completion_be -v
          python -m py_compile scripts/apply_opec_fallback_completion_be.py tests/test_opec_fallback_completion_be.py
          after="$(git status --porcelain)"
          test -z "$after"
      - name: Self-remove focused check
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/be-focused-authoring-check-v2.yml
          git commit -m "BE: remove corrected focused authoring check"
          git push origin HEAD:feature/post-bd-opec-outcome-be
