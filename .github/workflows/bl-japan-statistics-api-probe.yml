name: BL Japan statistics API read-only probe

on:
  push:
    branches:
      - feature/post-bk-japan-statistics-api-bl

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BK base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3952ec1f5a6022fec43210103f7a7244442e3201"
          test "$(git merge-base HEAD origin/main)" = "3952ec1f5a6022fec43210103f7a7244442e3201"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records'])) == ('0.41',689)
          assert (s['version'],len(s['sources'])) == ('1.84',246)
          assert (m['version'],len(m['adapters'])) == ('0.11',9)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          PY
      - name: Inspect existing Japan canonical and source scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          rows=[r for r in c['records'] if r.get('series_id')=='WSER-MAC-JP-HHSPEND']
          print('HHSPEND_COUNT',len(rows))
          for r in rows:
              keep={k:r.get(k) for k in ('occurrence_id','series_id','title','start_local','end_local','start_date','end_date','source_timezone','time_precision','date_precision','lifecycle_status','certainty_status','source_id') if k in r}
              print('HHSPEND',json.dumps(keep,ensure_ascii=False,sort_keys=True))
          for sid in ('WSSRC-MAC-024','WSSRC-MAC-029','WSSRC-MAC-014'):
              rec=next((x for x in s['sources'] if x.get('source_id')==sid),None)
              if rec:
                  print('SOURCE',sid,json.dumps(rec,ensure_ascii=False,sort_keys=True))
          PY
      - name: Probe official Statistics Dashboard WebAPI metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          BASE='https://dashboard.e-stat.go.jp/api/1.0/Json/getIndicatorInfo?'
          queries=[
              {'Lang':'JP','StatName':'家計調査'},
              {'Lang':'EN','StatName':'Family Income and Expenditure Survey'},
              {'Lang':'JP','SearchIndicatorWord':'消費支出'},
              {'Lang':'EN','SearchIndicatorWord':'Consumption expenditures'},
          ]
          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)
          for q in queries:
              url=BASE+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-read-only-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  body=resp.read()
                  print('API_STATUS',q,resp.status,'BYTES',len(body),'TYPE',resp.headers.get('content-type'))
              data=json.loads(body)
              hits=[]
              for d in walk(data):
                  text=json.dumps(d,ensure_ascii=False)
                  if any(term in text.lower() for term in ('family income','expenditure','consumption')) or '家計' in text or '消費支出' in text:
                      if d not in hits: hits.append(d)
                  if len(hits)>=20: break
              print('API_HITS',q,len(hits))
              for h in hits[:12]:
                  print('API_HIT',json.dumps(h,ensure_ascii=False,sort_keys=True)[:4000])
          PY
      - name: Probe API policy surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          urls=[
            'https://dashboard.e-stat.go.jp/en/static/api',
            'https://dashboard.e-stat.go.jp/static/api',
            'https://www.e-stat.go.jp/en/terms-of-use',
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-read-only-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  text=resp.read().decode('utf-8','replace')
                  print('POLICY_STATUS',url,resp.status,'BYTES',len(text))
                  low=text.lower()
                  for needle in ('anyone can use','no requirement to register','massive access','short period','利用登録不要','誰でもお使いいただけます','大量のアクセス'):
                      if needle.lower() in low:
                          print('POLICY_MARKER',needle)
          PY
      - name: Prove read-only branch state
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard)
          test -z "$tracked"
          test -z "$untracked"
