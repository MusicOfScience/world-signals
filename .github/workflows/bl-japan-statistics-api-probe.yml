name: BL Japan statistics API read-only probe

on:
  push:
    branches:
      - feature/post-bk-japan-statistics-api-bl

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BK base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3952ec1f5a6022fec43210103f7a7244442e3201"
          test "$(git merge-base HEAD origin/main)" = "3952ec1f5a6022fec43210103f7a7244442e3201"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records'])) == ('0.41',689)
          assert (s['version'],len(s['sources'])) == ('1.84',246)
          assert (m['version'],len(m['adapters'])) == ('0.11',9)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          PY
      - name: Inspect exact Japan scope and source-ID namespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          rows=[r for r in c['records'] if r.get('series_id')=='WSER-MAC-JP-HHSPEND']
          print('HHSPEND_COUNT',len(rows))
          for r in rows:
              print('HHSPEND',r['occurrence_id'],r.get('start_local'),r.get('lifecycle_status'),r.get('source_id'))
          mac=[]
          for row in s['sources']:
              m=re.fullmatch(r'WSSRC-MAC-(\d+)',row.get('source_id',''))
              if m: mac.append((int(m.group(1)),row['source_id'],row.get('institution'),row.get('source_type')))
          for row in sorted(mac)[-12:]: print('MAC_SOURCE',row)
          print('MAX_MAC_SOURCE_NUMBER',max(x[0] for x in mac),'COUNT',len(mac))
          print('SOURCE_SPLIT_REFERENCES')
          for p in Path('data').rglob('*.md'):
              text=p.read_text(errors='replace')
              if 'machine' in text.lower() and 'source' in text.lower() and ('split' in text.lower() or 'separate' in text.lower()):
                  if 'Colombia' in text or 'Socrata' in text:
                      print(p)
          PY
      - name: Probe exact household-spending getData semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          IND='0704010101000010000'
          BASE='https://dashboard.e-stat.go.jp/api/1.0/Json/getData?'
          common={
            'Lang':'EN','IndicatorCode':IND,'Cycle':'1','RegionalRank':'2',
            'IsSeasonalAdjustment':'1','MetaGetFlg':'Y','SectionHeaderFlg':'1'
          }
          queries=[
            dict(common,TimeFrom='20260600',TimeTo='20260800'),
            dict(common,Time='20260700'),
            dict(common,Time='20260800'),
          ]
          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)
          for q in queries:
              url=BASE+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-read-only-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  body=resp.read()
                  print('DATA_STATUS',q.get('Time') or (q.get('TimeFrom'),q.get('TimeTo')),resp.status,'BYTES',len(body),'TYPE',resp.headers.get('content-type'))
              data=json.loads(body)
              print('TOP_KEYS',list(data)[:20])
              candidates=[]
              for d in walk(data):
                  text=json.dumps(d,ensure_ascii=False)
                  if IND in text and any(k in d for k in ('VALUE','value','Time','TIME','@time','time')):
                      candidates.append(d)
                  elif any(str(v) in ('20260600','20260700','20260800') for v in d.values() if not isinstance(v,(dict,list))):
                      candidates.append(d)
                  if len(candidates)>=40: break
              print('DATA_CANDIDATES',len(candidates))
              for d in candidates[:25]: print('DATA_ROW',json.dumps(d,ensure_ascii=False,sort_keys=True)[:3000])
              raw=json.dumps(data,ensure_ascii=False)
              for token in ('20260600','20260700','20260800'):
                  print('TOKEN_PRESENT',token,token in raw)
          PY
      - name: Probe policy and request-discipline markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          urls=[
            'https://dashboard.e-stat.go.jp/en/static/api',
            'https://dashboard.e-stat.go.jp/static/api',
            'https://dashboard.e-stat.go.jp/en/static/sitePolicy',
            'https://dashboard.e-stat.go.jp/static/sitePolicy',
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-read-only-research/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      text=resp.read().decode('utf-8','replace')
                      print('POLICY_STATUS',url,resp.status,'BYTES',len(text))
              except Exception as exc:
                  print('POLICY_ERROR',url,type(exc).__name__,str(exc)); continue
              plain=re.sub(r'<[^>]+>',' ',text)
              plain=re.sub(r'\s+',' ',plain)
              low=plain.lower()
              for needle in ('anyone can use','no requirement to register','massive access','short period','interfere','利用登録不要','誰でもお使いいただけます','大量のアクセス','短時間'):
                  i=low.find(needle.lower())
                  if i>=0: print('POLICY_MARKER',needle,plain[max(0,i-180):i+420])
          PY
      - name: Prove read-only branch state
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard)
          test -z "$tracked"
          test -z "$untracked"
