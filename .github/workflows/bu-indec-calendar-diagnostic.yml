name: BU INDEC offline implementation preflight

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Validate frozen BU plan
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/monitor/INDEC_CPI_CALENDAR_BU_PLAN_v0.1.json').read_text())
          assert p['exact_base_main_sha']=='17e6130267c9d7911d12ac6f685c90228fec9e1e'
          assert p['preconditions']['canonical_registry_version']=='0.41'
          assert p['preconditions']['canonical_record_count']==689
          assert p['preconditions']['source_registry_version']=='1.93'
          assert p['preconditions']['source_count']==251
          assert p['preconditions']['monitor_expectations_version']=='0.18'
          assert p['preconditions']['configured_monitor_adapter_count']==16
          assert p['postconditions']['source_registry_version']=='1.94'
          assert p['postconditions']['source_count']==252
          assert p['postconditions']['monitor_expectations_version']=='0.19'
          assert p['postconditions']['configured_monitor_adapter_count']==17
          assert p['classification_contract']['missing_report']=='GENERATE_SOURCE_MATCH_REVIEW_CANDIDATE_ONLY_NO_EVENT_STATE_INFERENCE'
          assert p['request_contract']['maximum_total_requests_per_run']==5
          assert p['request_contract']['google_requests']==0
          assert p['request_contract']['search_route_requests']==0
          PY
      - name: Run BU parser and comparator tests
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_indec_cpi_calendar_bu
      - name: Compile BU implementation
        run: |
          set -euo pipefail
          python -m py_compile src/world_signals/adapters/indec_calendar.py src/world_signals/indec_cpi_monitor.py tests/test_indec_cpi_calendar_bu.py
      - name: Prove preflight is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
