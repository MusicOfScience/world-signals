name: BU INDEC calendar invocation diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Inspect INDEC calendar invocation contract without calling data routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request

          UA='WORLD-SIGNALS-RESEARCH/1.0'
          urls=[
            'https://www.indec.gob.ar/Scripts/CalendarioFull.js',
            'https://www.indec.gob.ar/Scripts/calendario.js',
          ]
          headers={'User-Agent':UA,'Accept':'application/javascript,text/javascript,*/*;q=0.5'}
          needles=('filtroscalendario','informecalendario','selectcalendar','form','submit','location','action','href','buscar','/dia/','/mes/')
          for url in urls:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(); text=body.decode('utf-8','replace')
                  print('SCRIPT',json.dumps({'url':url,'status':r.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()},sort_keys=True))
                  lines=text.splitlines()
                  selected=[]
                  for i,line in enumerate(lines,1):
                      low=line.lower()
                      if any(n in low for n in needles):
                          lo=max(1,i-2); hi=min(len(lines),i+2)
                          selected.append((lo,hi))
                  merged=[]
                  for lo,hi in sorted(set(selected)):
                      if merged and lo <= merged[-1][1]+1:
                          merged[-1]=(merged[-1][0],max(merged[-1][1],hi))
                      else:
                          merged.append((lo,hi))
                  for lo,hi in merged:
                      print(f'CONTEXT {url} L{lo}-L{hi}')
                      for j in range(lo,hi+1):
                          print(f'{j}: {lines[j-1]}')
                  print('LINE_COUNT',len(lines))
          print('REQUEST_COUNT',len(urls))
          print('DATA_ROUTE_REQUEST_COUNT',0)
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
