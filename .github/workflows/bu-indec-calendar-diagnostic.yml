name: BU INDEC calendar script diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Inspect only the two first-party calendar scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from urllib.parse import urljoin

          UA='WORLD-SIGNALS-RESEARCH/1.0'
          urls=[
            'https://www.indec.gob.ar/Scripts/CalendarioFull.js',
            'https://www.indec.gob.ar/Scripts/calendario.js',
          ]
          headers={'User-Agent':UA,'Accept':'application/javascript,text/javascript,*/*;q=0.5'}
          combined=[]
          for url in urls:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read()
                  text=body.decode('utf-8','replace')
                  combined.append(text)
                  print('SCRIPT',json.dumps({'url':url,'status':r.status,'content_type':r.headers.get_content_type(),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()},sort_keys=True))
                  candidates=[]
                  patterns=[
                    r'''url\s*:\s*["']([^"']+)["']''',
                    r'''fetch\s*\(\s*["']([^"']+)["']''',
                    r'''\.get(?:JSON)?\s*\(\s*["']([^"']+)["']''',
                    r'''\.post\s*\(\s*["']([^"']+)["']''',
                    r'''["']([^"']*(?:Calendario|calendario|Calendar|calendar|Fecha|fecha)[^"']*)["']''',
                  ]
                  for pat in patterns:
                      for m in re.findall(pat,text,re.I|re.S):
                          if len(m) < 300:
                              candidates.append(urljoin(url,m))
                  print('ENDPOINT_HINTS',json.dumps(sorted(set(candidates)),ensure_ascii=False,indent=2))
                  print('AJAX_TOKENS',json.dumps({
                    'ajax':text.lower().count('ajax'),
                    'getjson':text.lower().count('getjson'),
                    'fetch':text.lower().count('fetch('),
                    'xmlhttprequest':text.lower().count('xmlhttprequest'),
                    'ics':text.lower().count('.ics'),
                    'google_calendar':text.lower().count('calendar.google'),
                  },sort_keys=True))
                  # Print compact surrounding snippets for endpoint-bearing lines only.
                  for line in text.splitlines():
                      low=line.lower()
                      if ('url:' in low or '$.get' in low or '$.post' in low or 'ajax' in low or 'calendario-' in low or 'calendar-' in low) and len(line) < 1200:
                          print('LINE',line.strip())
          print('REQUEST_COUNT',len(urls))
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
