name: BU INDEC calendar structure diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Inspect one CPI HTML block from the already-validated first-party month route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          url='https://www.indec.gob.ar/Calendario/FiltrosCalendario/mes/Septiembre-2026/0'
          req=urllib.request.Request(url,headers={
            'User-Agent':'WORLD-SIGNALS-RESEARCH/1.0',
            'Accept':'text/html,*/*;q=0.5',
            'X-Requested-With':'XMLHttpRequest',
            'Referer':'https://www.indec.gob.ar/indec/web/Calendario-Fecha-0',
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(); text=body.decode('utf-8','replace')
              needle='Índice de precios al consumidor (IPC). Cobertura nacional. Agosto de 2026'
              pos=text.find(needle)
              assert pos >= 0, 'CPI title missing from September route'
              lo=max(0,pos-2500); hi=min(len(text),pos+3500)
              print('ROUTE',json.dumps({'status':r.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()},sort_keys=True))
              print('CPI_HTML_CONTEXT_BEGIN')
              print(text[lo:hi])
              print('CPI_HTML_CONTEXT_END')
          print('REQUEST_COUNT',1)
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
