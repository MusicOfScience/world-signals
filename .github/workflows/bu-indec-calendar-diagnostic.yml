name: BU INDEC calendar parameter diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Freeze INDEC month and language parameter contract without calling filter route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, re, urllib.request, json
          UA='WORLD-SIGNALS-RESEARCH/1.0'
          urls=[
            'https://www.indec.gob.ar/Scripts/CalendarioFull.js',
            'https://www.indec.gob.ar/indec/web/Calendario-Fecha-0',
          ]
          headers={'User-Agent':UA,'Accept':'text/html,application/javascript,*/*;q=0.5'}
          for url in urls:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(); text=body.decode('utf-8','replace')
                  print('RESOURCE',json.dumps({'url':url,'status':r.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()},sort_keys=True))
                  if url.endswith('.js'):
                      print('SCRIPT_BEGIN')
                      for i,line in enumerate(text.splitlines(),1): print(f'{i}: {line}')
                      print('SCRIPT_END')
                  else:
                      for i,line in enumerate(text.splitlines(),1):
                          low=line.lower()
                          if any(k in low for k in ('id="idioma"','id=\'idioma\'','cargarcalendario','calendariofull','btn-mes','mescalendario','data-date','data-month')):
                              print(f'HTML {i}: {line.strip()}')
          print('REQUEST_COUNT',2)
          print('FILTER_ROUTE_REQUEST_COUNT',0)
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
