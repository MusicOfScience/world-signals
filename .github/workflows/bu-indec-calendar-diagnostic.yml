name: BU INDEC calendar DOM parameter diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Inspect only INDEC calendar DOM parameters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, urllib.request, json
          url='https://www.indec.gob.ar/indec/web/Calendario-Fecha-0'
          req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-RESEARCH/1.0','Accept':'text/html,*/*;q=0.5'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(); text=body.decode('utf-8','replace'); lines=text.splitlines()
              print('RESOURCE',json.dumps({'url':url,'status':r.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()},sort_keys=True))
              hits=[]
              needles=('idioma','mesanoselect','mesano','calendario-fecha','datoscalendario','zabuto','month','mes')
              for i,line in enumerate(lines,1):
                  low=line.lower()
                  if any(n in low for n in needles): hits.append(i)
              spans=[]
              for i in hits:
                  lo=max(1,i-2); hi=min(len(lines),i+2)
                  if spans and lo <= spans[-1][1]+1: spans[-1]=(spans[-1][0],max(spans[-1][1],hi))
                  else: spans.append((lo,hi))
              for lo,hi in spans:
                  print(f'CONTEXT L{lo}-L{hi}')
                  for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
          print('REQUEST_COUNT',1)
          print('FILTER_ROUTE_REQUEST_COUNT',0)
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
