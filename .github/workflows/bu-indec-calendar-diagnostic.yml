name: BU INDEC repository identity diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Freeze current INDEC Canonical and source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          records=[r for r in c['records'] if r.get('series_id')=='WSER-REG2-AR-CPI' or r.get('source_id')=='WSSRC-REG2-006']
          print('CANONICAL_MATCH_COUNT',len(records))
          for r in records:
              print('CANONICAL',json.dumps(r,ensure_ascii=False,sort_keys=True))
          reg2=[x for x in s['sources'] if str(x.get('source_id','')).startswith('WSSRC-REG2-')]
          print('REG2_SOURCE_IDS',json.dumps([x['source_id'] for x in reg2]))
          for x in reg2:
              if x['source_id'] in {'WSSRC-REG2-006','WSSRC-REG2-008'}:
                  print('SOURCE',json.dumps(x,ensure_ascii=False,sort_keys=True))
          print('CANONICAL_VERSION',c.get('version'),'COUNT',len(c['records']))
          print('SOURCES_VERSION',s.get('version'),'COUNT',len(s['sources']))
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
