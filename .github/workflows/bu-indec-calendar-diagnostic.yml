name: BU INDEC search-term diagnostic

on:
  push:
    branches:
      - feature/post-bt-pressure-audit-bu

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BT ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
          test "$(git merge-base HEAD origin/main)" = "17e6130267c9d7911d12ac6f685c90228fec9e1e"
      - name: Derive CPI search term from INDEC's own autocomplete JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          url='https://www.indec.gob.ar/Scripts/calendario.js'
          req=urllib.request.Request(url,headers={'User-Agent':'WORLD-SIGNALS-RESEARCH/1.0','Accept':'application/javascript,*/*;q=0.5'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(); text=body.decode('utf-8','replace'); lines=text.splitlines()
              print('RESOURCE',json.dumps({'url':url,'status':r.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()},sort_keys=True))
              for i,line in enumerate(lines,1):
                  low=line.lower()
                  if ('índice de precios al consumidor' in low or 'indice de precios al consumidor' in low or 'var arr' in low or 'autocomplete' in low or 'informe' in low and ('[' in line or 'push' in low)):
                      lo=max(1,i-3); hi=min(len(lines),i+3)
                      print(f'CONTEXT L{lo}-L{hi}')
                      for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
              # Extract string literals containing CPI to avoid guessing punctuation.
              cpi=[]
              for q,s in re.findall(r'''(["'])(.*?)\1''',text,re.S):
                  norm=s.lower().replace('í','i')
                  if 'indice de precios al consumidor' in norm:
                      cpi.append(s)
              print('CPI_STRING_LITERALS',json.dumps(cpi,ensure_ascii=False,indent=2))
          print('REQUEST_COUNT',1)
          print('SEARCH_ROUTE_REQUEST_COUNT',0)
          PY
      - name: Prove diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
