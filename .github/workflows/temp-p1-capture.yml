name: TEMP P1 diagnostic capture

on:
  push:
    branches: [source-governance-p1-selection-87]
    paths:
      - '.github/workflows/temp-p1-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-governance-p1-selection-87
      - name: Run read-only diagnostic
        run: python scripts/temp_p1_87_diagnostic.py > P1_87_DIAGNOSTIC_OUTPUT.txt
      - name: Commit diagnostic output to temporary branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add P1_87_DIAGNOSTIC_OUTPUT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'TEMP capture P1 diagnostic output'
          git push origin HEAD:source-governance-p1-selection-87
