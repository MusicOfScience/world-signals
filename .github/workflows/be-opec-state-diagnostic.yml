name: BE OPEC state diagnostic
on:
  push:
    branches: [feature/post-bd-opec-outcome-be]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect governed OPEC state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          def walk(obj, path='root'):
              if isinstance(obj, dict):
                  yield path, obj
                  for k,v in obj.items():
                      yield from walk(v, f'{path}.{k}')
              elif isinstance(obj, list):
                  for i,v in enumerate(obj):
                      yield from walk(v, f'{path}[{i}]')

          files = {
              'canonical':'data/canonical/registry.json',
              'sources':'data/sources/registry.json',
              'changes':'data/changes/ledger.json',
              'analysis':'data/analysis/event_reviews.json',
              'live':'data/live_intelligence/observations.json',
          }
          for label,path in files.items():
              data=load(path)
              print(f'\n=== {label.upper()} TOP ===')
              print(type(data).__name__, list(data)[:30] if isinstance(data,dict) else f'len={len(data)}')
              matches=[]
              for p,d in walk(data):
                  s=json.dumps(d, sort_keys=True)
                  if ('WSSRC-COM-001' in s or 'WSER-COM-OPEC' in s or 'OPEC' in s or '2026-09-06' in s or '6 September 2026' in s):
                      # suppress containers that are too broad
                      if len(s) <= 12000:
                          matches.append((p,d))
              print(f'matches={len(matches)}')
              for p,d in matches[:80]:
                  print(f'--- {p}')
                  print(json.dumps(d, indent=2, sort_keys=True)[:12000])
          PY
      - name: Self-remove diagnostic
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/be-opec-state-diagnostic.yml
          git commit -m "BE: remove temporary OPEC state diagnostic"
          git push origin HEAD:feature/post-bd-opec-outcome-be
