name: TEMP verification closeout A read-only audit

on:
  push:
    branches:
      - verification-closeout-a-transaction
    paths:
      - '.github/workflows/verification-closeout-a-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconcile exact post-state against main
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from collections import Counter
          from pathlib import Path
          from src.world_signals.source_governance_audit import build_source_governance_audit

          def show_json(ref, path):
              raw = subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
              return json.loads(raw)

          before = show_json('origin/main', 'data/sources/registry.json')
          after = json.loads(Path('data/sources/registry.json').read_text())
          canonical = json.loads(Path('data/canonical/registry.json').read_text())
          ledger = json.loads(Path('data/changes/ledger.json').read_text())
          expectations = json.loads(Path('data/monitor/expectations.json').read_text())

          assert str(before['version']) == '1.61' and len(before['sources']) == 224
          assert str(after['version']) == '1.62' and len(after['sources']) == 224
          assert str(canonical['version']) == '0.21' and canonical['record_count'] == 669 and len(canonical['records']) == 669
          assert str(ledger['version']) == '0.10'
          assert str(expectations['version']) == '0.7'
          assert expectations['automatic_canonical_commit'] is False
          assert expectations['google_calendar_write'] is False

          b = {r['source_id']: r for r in before['sources']}
          a = {r['source_id']: r for r in after['sources']}
          selected = sorted(['WSSRC-INT-010','WSSRC-INT-017','WSSRC-INT-026','WSSRC-REG-011','WSSRC-REG2-002','WSSRC-REG6-001','WSSRC-REG6-002'])
          changed = sorted(sid for sid in b if b[sid] != a[sid])
          assert changed == selected, changed
          assert b['WSSRC-INT-010'].get('canonical_dependency_count') == 0
          assert a['WSSRC-INT-010'].get('canonical_dependency_count') == 1
          assert a['WSSRC-REG5-001'] == b['WSSRC-REG5-001']

          counts = Counter(r.get('source_id') for r in canonical['records'] if r.get('source_id'))
          mismatches=[]
          for row in after['sources']:
              if 'canonical_dependency_count' in row:
                  actual = counts.get(row['source_id'], 0)
                  if row['canonical_dependency_count'] != actual:
                      mismatches.append((row['source_id'], row['canonical_dependency_count'], actual))
          assert mismatches == [], mismatches

          audit = build_source_governance_audit(canonical, after, expectations)
          totals = audit['totals']
          assert totals['fully_explicit_governance_source_count'] == 65
          assert totals['source_records_with_one_or_more_missing_governance_fields'] == 159
          assert totals['backfill_research_priority_counts'] == {'P1_CANONICAL_DEPENDENCY': 88, 'P2_REGISTRY_ONLY': 71}
          assert totals['missing_field_counts'] == {
              'automated_monitoring_use': 156,
              'canonical_provenance_use': 156,
              'verification_mode': 159,
          }
          print(json.dumps({
              'status':'PASS',
              'main_source_version':before['version'],
              'branch_source_version':after['version'],
              'source_count':len(after['sources']),
              'canonical_version':canonical['version'],
              'canonical_count':canonical['record_count'],
              'ledger_version':ledger['version'],
              'expectations_version':expectations['version'],
              'changed_source_ids':changed,
              'vietnam_unchanged':True,
              'dependency_helper_mismatches':mismatches,
              'audit_totals':totals,
              'automatic_canonical_commit':expectations['automatic_canonical_commit'],
              'google_calendar_write':expectations['google_calendar_write'],
          }, indent=2, sort_keys=True))
          PY
      - name: Enforce temporary audit diff boundary
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD | sort > /tmp/actual
          printf '%s\n' .github/workflows/verification-closeout-a-audit-temp.yml data/sources/registry.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Python compilation
        run: python -m py_compile scripts/apply_source_governance_verification_closeout_a.py scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py
      - name: Browser JavaScript checks
        shell: bash
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Full site build
        run: python scripts/build_site.py
