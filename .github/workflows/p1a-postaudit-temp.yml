name: TEMP P1-A post-transaction source-governance audit

on:
  push:
    branches: [source-governance-p1a-postaudit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run source-governance audit
        run: python scripts/run_source_governance_audit.py
      - name: Print post-P1-A audit detail
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/source-governance-audit.json').read_text())
          print('VERSIONS', a['canonical_registry_version'], a['source_registry_version'], a['monitor_expectations_version'])
          print('TOTALS', json.dumps(a['totals'], sort_keys=True))
          p1=[r for r in a['backfill_research_queue'] if r['research_priority']=='P1_CANONICAL_DEPENDENCY']
          print('TOP_P1')
          for r in p1[:25]:
              print(json.dumps(r, sort_keys=True))
          PY
      - name: Confirm audit is read-only
        run: |
          git status --short
          test -z "$(git status --short --untracked-files=no)"
