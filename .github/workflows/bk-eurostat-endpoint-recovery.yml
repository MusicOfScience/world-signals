name: BK Eurostat endpoint recovery probe

on:
  push:
    branches:
      - feature/post-bj-eurostat-endpoint-recovery-bk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BJ base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
          test "$(git merge-base HEAD origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
      - name: Test Euro indicator filtered feed against exact tracked identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path

          URL='https://ec.europa.eu/eurostat/o/calendars/eventsIcal?theme=0&category=2'
          req=urllib.request.Request(URL,headers={
              'User-Agent':'WORLD-SIGNALS-research-probe/0.1 (+https://github.com/MusicOfScience/world-signals)',
              'Accept':'text/calendar,*/*;q=0.1',
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(); print('FEED',r.status,r.geturl(),r.headers.get('content-type'),len(body))
          text=body.decode('utf-8-sig','replace')
          raw=text.replace('\r\n','\n').replace('\r','\n').split('\n')
          lines=[]
          for line in raw:
              if line.startswith((' ','\t')) and lines: lines[-1]+=line[1:]
              else: lines.append(line)
          events=[]; cur=None
          for line in lines:
              if line=='BEGIN:VEVENT': cur={}; continue
              if line=='END:VEVENT':
                  if cur is not None: events.append(cur)
                  cur=None; continue
              if cur is None or ':' not in line: continue
              lhs,val=line.split(':',1); key=lhs.split(';',1)[0].upper()
              if key in {'UID','SUMMARY','DTSTART','DESCRIPTION','CATEGORIES'}:
                  cur[key]=val.replace('\\,',',').replace('\\;',';').replace('\\n','\n')
          print('VEVENT_COUNT',len(events))
          assert events

          expected={
            'WSO-MAC-A-0030':('Inflation (HICP)','20260917'),
            'WSO-MAC-A-0031':('Flash estimate inflation euro area','20261002'),
            'WSO-MAC-A-0032':('Unemployment','20261001'),
            'WSO-MAC-A-0033':('GDP main aggregates and employment','20260907'),
            'WSO-MAC-A-0034':('GDP main aggregates and employment - update','20261020'),
            'WSO-MAC-A-0035':('Preliminary flash estimate GDP - EU and euro area','20261030'),
            'WSO-MAC-A-0036':('Flash estimate GDP and employment - EU and euro area','20261113'),
            'WSO-MAC-B-0053':('Retail trade','20260904'),
            'WSO-MAC-B-0054':('International trade in goods','20260915'),
            'WSO-MAC-B-0055':('International trade in goods','20261016'),
            'WSO-MAC-B-0056':('International trade in goods','20261113'),
            'WSO-MAC-B-0057':('International trade in goods','20261216'),
          }
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          canon={r['occurrence_id']:r for r in reg['records'] if r.get('source_id')=='WSSRC-MAC-005'}
          assert set(canon)==set(expected)
          for oid,(summary,date) in expected.items():
              matches=[e for e in events if e.get('SUMMARY')==summary and re.sub(r'[^0-9].*','',e.get('DTSTART',''))[:8]==date]
              print('MATCH',oid,summary,date,'COUNT',len(matches))
              for e in matches:
                  print(' ',json.dumps({k:e.get(k) for k in ('UID','SUMMARY','DTSTART','CATEGORIES','DESCRIPTION')},ensure_ascii=False)[:1500])
              assert len(matches)==1, (oid,len(matches))
          # The subscription feed is date-only; it cannot overwrite richer canonical clocks.
          minute_rows=[r for r in canon.values() if r.get('time_precision')=='MINUTE']
          print('MINUTE_CANONICAL_ROWS',[(r['occurrence_id'],r['start_local'],r['start_utc']) for r in minute_rows])
          assert len(minute_rows)==4
          PY
      - name: Prove no governed mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- \
            data/canonical data/sources data/changes data/coverage/biosecurity_overlay.json \
            data/monitor data/live_intelligence data/analysis
