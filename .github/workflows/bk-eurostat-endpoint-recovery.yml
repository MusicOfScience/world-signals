name: BK Eurostat controlled transaction

on:
  push:
    branches:
      - feature/post-bj-eurostat-endpoint-recovery-bk

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BJ base and pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
          test "$(git merge-base HEAD origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records'])) == ('0.41',689)
          assert (s['version'],len(s['sources'])) == ('1.83',246)
          assert (m['version'],len(m['adapters'])) == ('0.10',8)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          PY
      - name: Snapshot protected layers and exact mutable pre-state
        shell: bash
        run: |
          set -euo pipefail
          cp data/sources/registry.json /tmp/bk-sources-pre.json
          cp data/monitor/expectations.json /tmp/bk-expectations-pre.json
          sha256sum \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/operations_policy.json \
            data/monitor/review_candidate_state_contract.json \
            data/monitor/review_decisions.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json > /tmp/bk-protected.sha
      - name: Reconfirm check-only transform
        run: python scripts/apply_eurostat_monitor_bk.py
      - name: Apply bounded BK transaction
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BK: "1"
        run: python scripts/apply_eurostat_monitor_bk.py --apply
      - name: Prove exact mutation boundary and semantic narrowness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
          }
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed=tracked|untracked
          assert changed == expected, (sorted(changed),sorted(expected))

          before_s=json.loads(Path('/tmp/bk-sources-pre.json').read_text())
          after_s=json.loads(Path('data/sources/registry.json').read_text())
          assert (after_s['version'],len(after_s['sources'])) == ('1.84',246)
          pre_by={x['source_id']:x for x in before_s['sources']}
          post_by={x['source_id']:x for x in after_s['sources']}
          assert set(pre_by)==set(post_by)
          changed_sources=[sid for sid in pre_by if pre_by[sid] != post_by[sid]]
          assert changed_sources == ['WSSRC-MAC-005'], changed_sources
          eurostat=post_by['WSSRC-MAC-005']
          assert eurostat['automated_monitoring_use']=='CLEARED'
          assert eurostat['live_adapter_id']=='EUROSTAT_RELEASE_CALENDAR_ICS'
          assert eurostat['monitoring_activation_status']=='LIVE_READ_ONLY_REVIEW_MONITOR_NO_AUTO_COMMIT'

          before_m=json.loads(Path('/tmp/bk-expectations-pre.json').read_text())
          after_m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (after_m['version'],len(after_m['adapters'])) == ('0.11',9)
          assert after_m['adapters'][:8] == before_m['adapters']
          assert after_m['automatic_canonical_commit'] is False
          assert after_m['google_calendar_write'] is False
          adapter=after_m['adapters'][8]
          assert adapter['adapter_id']=='EUROSTAT_RELEASE_CALENDAR_ICS'
          assert adapter['source_id']=='WSSRC-MAC-005'
          assert adapter['automatic_commit_allowed'] is False
          print('BK mutation boundary and semantic narrowness: PASS')
          PY
          sha256sum -c /tmp/bk-protected.sha
      - name: Validate materialised governed state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_eurostat_monitor_bk tests.test_core_monitor_expansion_o tests.test_opec_official_confirmation_bg tests.test_rba_mpb_adapter -v
          python -m unittest discover -s tests -v
          python -m py_compile \
            src/world_signals/adapters/eurostat_ics.py \
            src/world_signals/eurostat_monitor.py \
            scripts/apply_eurostat_monitor_bk.py \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Exercise materialised Eurostat route live
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from world_signals.adapters import fetch_eurostat_release_calendar
          from world_signals.eurostat_monitor import eurostat_release_calendar_review_candidates
          registry=json.loads(Path('data/canonical/registry.json').read_text())
          expectations=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(x for x in expectations['adapters'] if x['adapter_id']=='EUROSTAT_RELEASE_CALENDAR_ICS')
          items,snap=fetch_eurostat_release_calendar(timeout=30)
          candidates,observations=eurostat_release_calendar_review_candidates(
              registry['records'],items,config,now_utc=datetime(2026,9,8,0,0,tzinfo=timezone.utc)
          )
          types={}
          for row in observations: types[row['type']]=types.get(row['type'],0)+1
          print({'status':snap.status,'items':len(items),'candidates':len(candidates),'observation_types':types})
          assert snap.status==200
          assert len(candidates)==0, candidates
          assert types.get('EUROSTAT_TRACKED_OCCURRENCE_ELAPSED_NOT_PRESENCE_CHECKED')==2
          assert types.get('EUROSTAT_RELEASE_DATE_NO_CHANGE')==10
          PY
      - name: Static build and remove derived output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py
          rm -rf docs
      - name: Final protected-layer check
        run: sha256sum -c /tmp/bk-protected.sha
      - name: Commit transaction and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add \
            data/sources/registry.json \
            data/monitor/expectations.json \
            scripts/run_live_monitor.py \
            scripts/run_adapter_smoke.py \
            src/world_signals/adapters/__init__.py
          git rm .github/workflows/bk-eurostat-endpoint-recovery.yml
          git diff --cached --check
          git commit -m "BK: activate Eurostat read-only release monitor"
          git push origin HEAD:feature/post-bj-eurostat-endpoint-recovery-bk
