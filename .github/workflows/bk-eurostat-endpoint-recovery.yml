name: BK Eurostat endpoint recovery probe

on:
  push:
    branches:
      - feature/post-bj-eurostat-endpoint-recovery-bk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact post-BJ base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
          test "$(git merge-base HEAD origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"

      - name: Inspect only the official ICS generator contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html as html_lib
          import re
          import urllib.request

          URL='https://ec.europa.eu/eurostat/subscribe/ics.format'
          UA='WORLD-SIGNALS-research-probe/0.1 (+https://github.com/MusicOfScience/world-signals)'
          req=urllib.request.Request(URL,headers={'User-Agent':UA,'Accept':'text/html,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read().decode('utf-8','replace')
              print('LANDING',r.status,r.geturl(),r.headers.get('content-type'),len(raw))

          needles=('estat-ics-url-generator','p_p_lifecycle=2','Copy calendar URL','calendarUrl','calendarURL','\.ics')
          for needle in needles:
              print('\n=== NEEDLE',needle,'===')
              matches=list(re.finditer(needle,raw,re.I))
              print('COUNT',len(matches))
              for m in matches[:8]:
                  lo=max(0,m.start()-1800); hi=min(len(raw),m.end()+2600)
                  print(html_lib.unescape(raw[lo:hi]))
                  print('\n--- CONTEXT END ---')

          print('\n=== RESOURCE URLS ===')
          candidates=[]
          for m in re.finditer(r'https?[^\"\'<>\\\s]+p_p_lifecycle(?:=|%3D)2[^\"\'<>\\\s]*',html_lib.unescape(raw),re.I):
              value=m.group(0).replace('&amp;','&')
              if value not in candidates: candidates.append(value)
          for value in candidates[:20]: print(value)
          PY

      - name: Prove no governed mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- \
            data/canonical data/sources data/changes data/coverage/biosecurity_overlay.json \
            data/monitor data/live_intelligence data/analysis
