name: BK Eurostat activation preflight

on:
  push:
    branches:
      - feature/post-bj-eurostat-endpoint-recovery-bk

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BJ base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
          test "$(git merge-base HEAD origin/main)" = "2510ca6aa46f4e172b87ced5f2015488c655be75"
      - name: Snapshot governed pre-state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/monitor/review_candidate_state_contract.json \
            data/monitor/review_decisions.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json > /tmp/bk-governed.sha
      - name: Targeted BK and historical-O descendant tests
        run: python -m unittest tests.test_eurostat_monitor_bk tests.test_core_monitor_expansion_o -v
      - name: Check-only post-state transform
        run: python scripts/apply_eurostat_monitor_bk.py
      - name: Compile simulated runtime patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import scripts.apply_eurostat_monitor_bk as tx
          _,_,live,smoke,adapter_init=tx.build_post_state()
          ast.parse(live, filename='scripts/run_live_monitor.py')
          ast.parse(smoke, filename='scripts/run_adapter_smoke.py')
          ast.parse(adapter_init, filename='src/world_signals/adapters/__init__.py')
          print('simulated runtime patches compile')
          PY
          python -m py_compile \
            src/world_signals/adapters/eurostat_ics.py \
            src/world_signals/eurostat_monitor.py \
            scripts/apply_eurostat_monitor_bk.py \
            tests/test_eurostat_monitor_bk.py
      - name: Live full-feed simulation against proposed nine-route contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import scripts.apply_eurostat_monitor_bk as tx
          from world_signals.adapters.eurostat_ics import fetch_eurostat_release_calendar
          from world_signals.eurostat_monitor import eurostat_release_calendar_review_candidates

          registry=json.loads(Path('data/canonical/registry.json').read_text())
          _,post_expectations,_,_,_=tx.build_post_state()
          config=next(x for x in post_expectations['adapters'] if x['adapter_id']=='EUROSTAT_RELEASE_CALENDAR_ICS')
          items,snap=fetch_eurostat_release_calendar(timeout=30)
          candidates,observations=eurostat_release_calendar_review_candidates(
              registry['records'], items, config, now_utc=datetime(2026,9,8,0,0,tzinfo=timezone.utc)
          )
          by_type={}
          for row in observations: by_type[row['type']]=by_type.get(row['type'],0)+1
          print({
              'status':snap.status,
              'resolved_url':snap.resolved_url,
              'content_type':snap.content_type,
              'item_count':len(items),
              'candidate_count':len(candidates),
              'observation_types':by_type,
          })
          assert snap.status == 200
          assert len(items) > 100
          assert len(candidates) == 0, candidates
          assert by_type.get('EUROSTAT_TRACKED_OCCURRENCE_ELAPSED_NOT_PRESENCE_CHECKED') == 2
          assert by_type.get('EUROSTAT_RELEASE_DATE_NO_CHANGE') == 10
          PY
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Static build on untouched governed state
        run: python scripts/build_site.py
      - name: Prove governed pre-state remained byte-identical
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/bk-governed.sha
