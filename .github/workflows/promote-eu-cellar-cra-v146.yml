name: Promote EU Cellar CRA source v1.46

on:
  push:
    branches: [main]
    paths:
      - 'scripts/promote_eu_cellar_cra_v146.py'
      - '.github/workflows/promote-eu-cellar-cra-v146.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact reviewed migration
        run: python scripts/promote_eu_cellar_cra_v146.py
      - name: Validate registry and monitor contracts
        run: |
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
      - name: Confirm migration scope
        run: |
          git diff -- data/sources/registry.json
          test -z "$(git status --porcelain | grep -v '^ M data/sources/registry.json$' || true)"
      - name: Commit source-registry promotion
        run: |
          git config user.name 'WORLD SIGNALS reviewed migration'
          git config user.email 'actions@users.noreply.github.com'
          git add data/sources/registry.json
          git commit -m 'Promote EU CRA Cellar route to pilot-validated'
          git push origin HEAD:main
