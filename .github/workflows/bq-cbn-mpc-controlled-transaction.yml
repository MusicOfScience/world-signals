name: BQ CBN MPC controlled transaction

on:
  push:
    branches:
      - feature/post-bp-cbn-mpc-monitor-bq

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BP ancestry and BQ pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          test "$(git merge-base HEAD origin/main)" = "65e9ceb07d0c5175db61f9251a730a9bcf563d04"
          python scripts/apply_cbn_mpc_monitor_bq.py
          python -m unittest tests.test_cbn_mpc_monitor_bq -v
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bq-transaction-protected.before
      - name: Apply bounded BQ transaction
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BQ=1 python scripts/apply_cbn_mpc_monitor_bq.py --apply
      - name: Audit exact mutation boundary and CBN source-role contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed=tracked|untracked
          expected={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py'
          }
          assert changed==expected,(changed,expected)
          pre_sources=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'],text=True))
          post_sources=json.loads(Path('data/sources/registry.json').read_text())
          pre_monitor=json.loads(subprocess.check_output(['git','show','HEAD:data/monitor/expectations.json'],text=True))
          post_monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (post_sources['version'],len(post_sources['sources']))==('1.90',248)
          assert (post_monitor['version'],len(post_monitor['adapters']))==('0.15',13)
          before={r['source_id']:r for r in pre_sources['sources']}
          after={r['source_id']:r for r in post_sources['sources']}
          assert [sid for sid in before if before[sid]!=after[sid]]==['WSSRC-CB-014']
          cbn=after['WSSRC-CB-014']
          assert cbn['canonical_dependency_count']==2
          assert cbn['canonical_provenance_use']=='CLEARED_CURATED_FACTUAL_METADATA'
          assert cbn['automated_monitoring_use']=='CLEARED'
          assert cbn['verification_mode']=='AUTOMATED_PILOT'
          assert cbn['automated_retrieval_permission']=='CLEARED_BOUNDED_ROBOTS_CONFORMANT_LOW_RATE_MPC_CALENDAR_PATH'
          assert post_monitor['adapters'][:12]==pre_monitor['adapters']
          route=post_monitor['adapters'][12]
          assert route['adapter_id']=='CBN_MPC_CALENDAR'
          assert route['source_id']=='WSSRC-CB-014'
          assert route['meeting_number_by_occurrence_id']=={'WSO-CBN-MPC-307':307,'WSO-CBN-MPC-308':308}
          assert route['request_budget_per_run']==2
          assert route['decision_publication_time_authority'] is False
          assert route['lifecycle_authority'] is False
          assert route['certainty_authority'] is False
          assert route['automatic_commit_allowed'] is False
          assert post_monitor['automatic_canonical_commit'] is False
          assert post_monitor['google_calendar_write'] is False
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/cbn_mpc.py src/world_signals/cbn_mpc_monitor.py scripts/apply_cbn_mpc_monitor_bq.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Re-audit protected layers and transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bq-transaction-protected.after
          diff -u /tmp/bq-transaction-protected.before /tmp/bq-transaction-protected.after
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) | set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          expected={'data/sources/registry.json','data/monitor/expectations.json','scripts/run_live_monitor.py','scripts/run_adapter_smoke.py','src/world_signals/adapters/__init__.py'}
          assert changed==expected,(changed,expected)
          PY
      - name: Commit exact BQ transaction and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WORLD SIGNALS controlled transaction"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          git rm .github/workflows/bq-cbn-mpc-controlled-transaction.yml
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
            '.github/workflows/bq-cbn-mpc-controlled-transaction.yml'
          }
          assert staged==expected,(staged,expected)
          PY
          git commit -m "BQ: activate CBN MPC read-only schedule monitor"
          git push origin HEAD:feature/post-bp-cbn-mpc-monitor-bq
