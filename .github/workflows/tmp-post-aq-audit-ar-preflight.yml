name: WORLD SIGNALS AR coverage and monitor audit preflight

on:
  push:
    branches:
      - feature/post-aq-pressure-audit-ar
    paths:
      - .github/workflows/tmp-post-aq-audit-ar-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove exact post-72 base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=2c215ce4d3ff70001af4733fce797f166bab2a46
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD

      - name: Prove exploratory workflows are gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/tmp-post-aq-coverage-pressure-ar.yml
          test ! -e .github/workflows/tmp-monitor-coverage-exercise-ar.yml

      - name: Recompute canonical coverage audit and verify AR checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_coverage_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('artifacts/coverage/coverage-audit.json').read_text(encoding='utf-8'))
          assert audit['version']=='0.3', audit['version']
          assert audit['canonical_registry_version']=='0.37'
          assert audit['totals']['occurrence_count']==687
          assert audit['totals']['unique_series_count']==201
          assert audit['totals']['unique_institution_count']==126
          assert audit['totals']['unique_source_count']==159
          assert audit['totals']['monetary_plus_macro_occurrence_count']==443
          assert audit['totals']['monetary_plus_macro_occurrence_share']==0.6448
          assert audit['diagnostic_flags']['regions_with_fewer_than_10_unique_series']==['South Asia']
          assert audit['diagnostic_flags']['regions_with_fewer_than_8_unique_institutions']==['South Asia']
          assert audit['diagnostic_flags']['categories_with_fewer_than_5_unique_series']==['PHYSICAL_CLIMATE_RISK']
          assert audit['calendar_projection_readiness']['source_native_unresolved_occurrence_ids']==['WSO-FIS-NP-BUDGET-2083','WSO-FIS-NP-BUDGET-2084']
          md=Path('artifacts/coverage/coverage-audit.md').read_text(encoding='utf-8')
          assert '# WORLD SIGNALS — coverage and bias audit v0.3' in md
          assert '## Source-governance readiness' in md
          assert '## Calendar-projection readiness' in md
          print('AR_CANONICAL_COVERAGE_CHECKPOINT_OK')
          PY

      - name: Recompute monitor coverage audit and verify AR checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_monitor_coverage_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('artifacts/monitor/monitor-coverage-audit.json').read_text(encoding='utf-8'))
          assert audit['version']=='0.1'
          assert audit['canonical_registry_version']=='0.37'
          assert audit['source_registry_version']=='1.78'
          assert audit['monitor_expectations_version']=='0.9'
          assert audit['totals']=={
              'configured_adapter_count':7,
              'unique_monitor_source_count':6,
              'scoped_occurrence_count':27,
              'scoped_series_count':10,
              'scoped_institution_count':5,
              'scoped_region_count':3,
              'scoped_category_count':5,
          }, audit['totals']
          prompts=audit['diagnostic_prompts']
          assert prompts['canonical_regions_without_configured_monitor_scope']==[
              'Africa','Cross-regional / Global','East Asia','North America','South Asia','Southeast Asia'
          ]
          assert prompts['canonical_categories_without_configured_monitor_scope']==[
              'AGRICULTURE_FOOD','CLIMATE_ENVIRONMENT','CORPORATE_FINANCIAL_MARKET_STRUCTURE',
              'ELECTIONS_GOVERNANCE','ENERGY_COMMODITIES','HEALTH_BIOSECURITY',
              'INTERNATIONAL_INSTITUTIONS','MONETARY_FINANCIAL_POLICY','PHYSICAL_CLIMATE_RISK'
          ]
          assert 'coverage_percentage' not in audit['totals']
          assert audit['methodology']['explicit_occurrence_scope_only_no_series_inference'] is True
          assert audit['methodology']['automatic_adapter_enablement'] is False
          assert audit['methodology']['automatic_canonical_commit'] is False
          print('AR_MONITOR_COVERAGE_CHECKPOINT_OK')
          PY

      - name: Run coverage audit regressions
        run: |
          python -m unittest tests.test_coverage -v
          python -m unittest tests.test_monitor_coverage_audit -v

      - name: Validate canonical registry
        run: python scripts/validate_registry.py

      - name: Validate Analysis layer
        run: python scripts/validate_analysis.py

      - name: Run full repository suite
        run: python -m unittest discover -s tests -v

      - name: Compile repository Python
        run: python -m compileall -q scripts src tests

      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Build static site
        run: python scripts/build_site.py

      - name: Prove production exact-series population remains zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reviews=json.loads(Path('data/analysis/event_reviews.json').read_text(encoding='utf-8'))
          exact=[
              (review.get('analysis_id'), movement.get('movement_id'))
              for review in reviews.get('reviews',[])
              for movement in (review.get('what_moved') or [])
              if movement.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES'
          ]
          assert exact==[], exact
          print('AR_EXACT_TIMESTAMP_SERIES_ROWS=0')
          PY

      - name: Prove protected state is byte-unchanged from post-72 main
        shell: bash
        run: |
          set -euo pipefail
          BASE=2c215ce4d3ff70001af4733fce797f166bab2a46
          git diff --exit-code "$BASE" -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
          echo AR_PROTECTED_STATE_UNCHANGED

      - name: Remove transient audit artifacts and prove clean tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/coverage artifacts/monitor
          test -z "$(git status --porcelain=v1)"
          echo AR_PREFLIGHT_TRACKED_TREE_CLEAN
