name: BE descendant repair check

on:
  push:
    branches: [feature/post-bd-opec-outcome-be]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and focused prestate tests
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e54dddbaa0d60a39babc2fa47c1f054954b5c9ac"
          test "$(git merge-base HEAD origin/main)" = "e54dddbaa0d60a39babc2fa47c1f054954b5c9ac"
          python -m unittest tests.test_barmm_parliamentary_election_bb tests.test_imd_heatwave_outlook_analysis_au tests.test_opec_fallback_completion_be -v
      - name: Materialise ephemeral BE descendant and rerun focused tests
        env:
          WORLD_SIGNALS_APPLY_OPEC_FALLBACK_COMPLETION_BE: YES
        run: |
          set -euo pipefail
          python scripts/apply_opec_fallback_completion_be.py --apply
          python -m unittest tests.test_barmm_parliamentary_election_bb tests.test_imd_heatwave_outlook_analysis_au tests.test_opec_fallback_completion_be -v
      - name: Restore and self-remove
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/be-descendant-repair-check.yml
          git commit -m "BE: remove descendant repair check"
          git push origin HEAD:feature/post-bd-opec-outcome-be
