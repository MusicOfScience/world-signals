name: Temporary missing-domain reconnaissance AC

on:
  push:
    branches:
      - feature/missing-domain-recon-ac

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-57 merge base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "09433d3a6ed0aca957271be49777eab33f08ee72"
      - name: Run missing-domain candidate probe
        run: python scripts/probe_missing_domain_candidates_ac.py
