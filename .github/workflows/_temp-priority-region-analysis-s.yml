name: TEMP priority-region Analysis S reviewed apply

on:
  push:
    branches:
      - feature/priority-region-analysis-s
    paths:
      - .github/workflows/_temp-priority-region-analysis-s.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact reviewed pre-state
        shell: bash
        run: |
          set -euo pipefail
          BASE=a7ba439673fa2c468f2c9c4ef28904fb25c688a7
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
      - name: Re-run fail-closed check-only transaction
        run: python scripts/apply_priority_region_analysis_s.py
      - name: Apply reviewed Analysis S transaction
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_S: YES
        run: python scripts/apply_priority_region_analysis_s.py --apply
      - name: Validate exact reviewed post-state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_priority_region_analysis_s tests.test_analysis_layer tests.test_priority_region_historical_anchors_r -v
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          e=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert (c['version'],len(c['records']))==('0.29',678)
          assert (r['version'],len(r['reviews']))==('0.3',6)
          assert r['canonical_checkpoint']=={'registry_version':'0.29','record_count':678}
          assert (e['version'],len(e['evidence']))==('0.3',14)
          PY
      - name: Assert write boundary and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            data/analysis/PRIORITY_REGION_ANALYSIS_S_TRANSACTION_AUDIT_v0.1.md
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code HEAD -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json
          git rm .github/workflows/_temp-priority-region-analysis-s.yml
          git add \
            data/analysis/PRIORITY_REGION_ANALYSIS_S_TRANSACTION_AUDIT_v0.1.md \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_staged=(
            .github/workflows/_temp-priority-region-analysis-s.yml
            data/analysis/PRIORITY_REGION_ANALYSIS_S_TRANSACTION_AUDIT_v0.1.md
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
          )
          printf '%s\n' "${expected_staged[@]}" | sort > /tmp/expected_staged
          printf '%s\n' "${staged[@]}" | sort > /tmp/actual_staged
          diff -u /tmp/expected_staged /tmp/actual_staged
      - name: Commit reviewed feature-branch transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git commit -m "Apply priority-region Analysis S transaction"
          git push origin HEAD:feature/priority-region-analysis-s
