name: BO RBA MPB materialised activation preflight

on:
  push:
    branches:
      - feature/post-bn-rba-mpb-monitor-activation-bo

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and check-only pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3a6869a054372e5df135067df77fb9bdc772367e"
          test "$(git merge-base HEAD origin/main)" = "3a6869a054372e5df135067df77fb9bdc772367e"
          python scripts/apply_rba_mpb_monitor_bo.py
          python -m unittest tests.test_rba_mpb_adapter tests.test_rba_mpb_monitor_bo -v
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bo-protected.before
      - name: Materialise bounded BO post-state in workspace
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BO=1 python scripts/apply_rba_mpb_monitor_bo.py --apply
      - name: Audit exact governed and runtime mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json',
            'data/monitor/expectations.json',
            'scripts/run_live_monitor.py',
            'scripts/run_adapter_smoke.py',
          }
          assert changed==expected,(changed,expected)
          pre_sources=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'],text=True))
          post_sources=json.loads(Path('data/sources/registry.json').read_text())
          pre_monitor=json.loads(subprocess.check_output(['git','show','HEAD:data/monitor/expectations.json'],text=True))
          post_monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (pre_sources['version'],len(pre_sources['sources']))==('1.87',247)
          assert (post_sources['version'],len(post_sources['sources']))==('1.88',247)
          assert (pre_monitor['version'],len(pre_monitor['adapters']))==('0.12',10)
          assert (post_monitor['version'],len(post_monitor['adapters']))==('0.13',11)
          before={r['source_id']:r for r in pre_sources['sources']}
          after={r['source_id']:r for r in post_sources['sources']}
          assert [sid for sid in before if before[sid]!=after[sid]]==['WSSRC-CB-002']
          assert before['WSSRC-CB-013']==after['WSSRC-CB-013']
          assert post_monitor['adapters'][:10]==pre_monitor['adapters']
          route=post_monitor['adapters'][10]
          assert route['adapter_id']=='RBA_MPB_CALENDAR'
          assert len(route['canonical_occurrence_ids'])==44
          assert route['canonical_source_role_contract']['WS.CB.RBA.MPB_MINUTES']=='WSSRC-CB-013'
          assert route['request_budget_per_run']==3
          assert route['automatic_commit_allowed'] is False
          source=after['WSSRC-CB-002']
          assert source['automated_monitoring_use']=='CLEARED'
          assert source['automated_retrieval_permission']=='CLEARED_BOUNDED_ROBOTS_CONFORMANT_LOW_RATE_SCHEDULE_PATHS'
          assert source['monitoring_activation_status']=='LIVE_READ_ONLY_REVIEW_MONITOR_NO_AUTO_COMMIT'
          assert post_monitor['automatic_canonical_commit'] is False
          assert post_monitor['google_calendar_write'] is False
          PY
      - name: Live-validate robots-first RBA route and review semantics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters.rba_mpb import fetch_rba_board_schedule,fetch_rba_monetary_policy_calendar,validate_rba_calendar_alignment
          from world_signals.rba_mpb_monitor import fetch_rba_robots_policy,rba_schedule_path_disallowed,rba_mpb_schedule_review_candidates
          rules,robots=fetch_rba_robots_policy(timeout=30)
          assert robots.status==200
          assert not rba_schedule_path_disallowed(rules)
          calendar,cs=fetch_rba_monetary_policy_calendar(timeout=30)
          board,bs=fetch_rba_board_schedule(timeout=30)
          assert cs.status==bs.status==200
          validate_rba_calendar_alignment(calendar,board)
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          config=next(r for r in monitor['adapters'] if r['adapter_id']=='RBA_MPB_CALENDAR')
          candidates,observations=rba_mpb_schedule_review_candidates(canonical['records'],calendar,board,config)
          assert candidates==[],candidates
          assert observations
          assert all(o.get('event_state_inference')=='NONE' for o in observations)
          print({'robots_status':robots.status,'calendar_status':cs.status,'board_status':bs.status,'calendar_events':len(calendar.events),'board_windows':len(board),'review_candidates':len(candidates),'observations':len(observations),'schedule_sha256':calendar.schedule_sha256})
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/rba_mpb_monitor.py scripts/apply_rba_mpb_monitor_bo.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore materialisation byte-clean
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bo-protected.after
          diff -u /tmp/bo-protected.before /tmp/bo-protected.after
          git restore -- data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
