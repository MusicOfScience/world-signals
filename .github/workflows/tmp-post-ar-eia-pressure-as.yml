name: WORLD SIGNALS AS EIA WPSR route pressure probe

on:
  push:
    branches:
      - feature/post-ar-pressure-audit-as
    paths:
      - .github/workflows/tmp-post-ar-eia-pressure-as.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-73 base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b25bb452f3def253cf86254e5ad6abdbe8b9f13
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
      - name: Inspect exact EIA source and canonical dependency state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          src=json.loads((root/'data/sources/registry.json').read_text())
          can=json.loads((root/'data/canonical/registry.json').read_text())
          exp=json.loads((root/'data/monitor/expectations.json').read_text())
          rec=next(x for x in src['sources'] if x.get('source_id')=='WSSRC-COM-003')
          occ=[x for x in can['records'] if x.get('source_id')=='WSSRC-COM-003' or x.get('series_id')=='WSER-COM-EIA-WPSR']
          print(json.dumps({
            'source_registry_version':src.get('version'),
            'source_record':rec,
            'canonical_registry_version':can.get('version'),
            'wpsr_occurrence_ids':[x.get('occurrence_id') for x in occ],
            'monitor_expectations_version':exp.get('version'),
            'configured_adapter_ids':[x.get('adapter_id') for x in exp.get('adapters',[])],
          },indent=2,ensure_ascii=False))
          PY
      - name: Exercise official WPSR schedule parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,str(Path('src').resolve()))
          from world_signals.adapters import fetch_eia_wpsr_schedule
          rule,snap=fetch_eia_wpsr_schedule()
          print(json.dumps({'snapshot':snap.as_dict(),'rule':rule.as_dict()},indent=2,ensure_ascii=False))
          if rule.standard_release_day != 'Wednesday':
              raise SystemExit('unexpected EIA WPSR standard release day')
          if rule.standard_release_time_local != '10:30':
              raise SystemExit('unexpected EIA WPSR standard release time')
          if rule.standard_time_semantics != 'AFTER':
              raise SystemExit('EIA WPSR time semantics lost')
          if not any(x['week_ending']=='2026-09-04' and x['alternate_release_date']=='2026-09-10' and x['release_time_local']=='12:00' for x in rule.holiday_exceptions):
              raise SystemExit('2026 Labor Day exception not parsed')
          PY
      - name: Run adapter regressions
        run: python -m unittest tests.test_eia_wpsr_adapter -v
