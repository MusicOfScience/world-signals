name: TEMP provenance repair checkpoint update

on:
  push:
    branches: [provenance-scope-repair-research]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/update_provenance_repair_status_temp.py
      - name: Verify bounded docs-only update and commit
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' PROJECT_STATUS.md data/coverage/PROVENANCE_SCOPE_REPAIR_A_RESEARCH_v0.1.md | sort > /tmp/expected
          echo 'ACTUAL:'
          cat /tmp/actual
          echo 'EXPECTED:'
          cat /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq 'Tier-1 source registry:** v1.60' PROJECT_STATUS.md
          grep -Fq 'P1-H geographically corrective / mixed-rights tranche — COMPLETE' PROJECT_STATUS.md
          grep -Fq 'Provenance Scope Repair A transaction gate' PROJECT_STATUS.md
          grep -Fq 'biosecurity_overlay.json' data/coverage/PROVENANCE_SCOPE_REPAIR_A_RESEARCH_v0.1.md
          git config user.name world-signals-checkpoint
          git config user.email actions@users.noreply.github.com
          git add PROJECT_STATUS.md data/coverage/PROVENANCE_SCOPE_REPAIR_A_RESEARCH_v0.1.md
          git commit -m 'Update checkpoint for provenance-scope repair A'
          git push origin HEAD:provenance-scope-repair-research
