name: Temporary post-AA pressure audit AB

on:
  push:
    branches: [feature/post-aa-pressure-audit-ab]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-56 merge base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "c4b499436db54f6dc3ebbe045cfda2fba7f730dd"
      - name: Run AB read-only probe
        run: python scripts/audit_post_aa_pressure_ab.py
      - name: Run AB tests
        run: python -m unittest tests.test_post_aa_pressure_audit_ab -v
      - name: Generate AB audit artefacts
        run: python scripts/audit_post_aa_pressure_ab.py --write
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: python -m py_compile scripts/audit_post_aa_pressure_ab.py scripts/audit_analysis_sample_y.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Static site build
        run: python scripts/build_site.py
      - name: Prove audit-only mutation boundary
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'data/analysis/POST_AA_PRESSURE_AUDIT_AB_v0.1.json',
              'data/analysis/POST_AA_PRESSURE_AUDIT_AB_v0.1.md',
          }
          lines = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected generated mutation: {sorted(unexpected)}')
          missing = allowed - changed
          if missing:
              raise SystemExit(f'missing generated audit artefact: {sorted(missing)}')
          print('AUDIT_BOUNDARY_OK')
          PY
      - name: Commit generated audit and self-remove workflow
        run: |
          git config user.name world-signals-transaction-bot
          git config user.email world-signals-transaction-bot@users.noreply.github.com
          git add data/analysis/POST_AA_PRESSURE_AUDIT_AB_v0.1.json data/analysis/POST_AA_PRESSURE_AUDIT_AB_v0.1.md
          git rm .github/workflows/_temp-post-aa-pressure-audit-ab.yml
          git commit -m "Generate post-AA pressure audit AB"
          git push origin HEAD:feature/post-aa-pressure-audit-ab
