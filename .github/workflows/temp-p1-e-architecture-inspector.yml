name: TEMP P1 E architecture inspector
on:
  push:
    paths:
      - '.github/workflows/temp-p1-e-architecture-inspector.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect unscheduled semantics and implementation evidence
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          can=json.loads(Path('data/canonical/registry.json').read_text())
          print('=== UNSCHEDULED_TBC HOST/ACTIVATION PATTERNS ===')
          for r in can['records']:
              if r.get('timing_type')=='UNSCHEDULED_TBC':
                  print(json.dumps({k:r.get(k) for k in ['occurrence_id','canonical_name','source_id','activation_mode','certainty_status','time_precision','time_status','time_basis','host_confirmed','host_jurisdiction','host_city','render_policy']},ensure_ascii=False,sort_keys=True))
          print('=== IMPLEMENTATION EVIDENCE ===')
          needles=['MAC-023','REG-008','COM-006','CLIM-002','INT-024','INT-011','INT-028','abs-release-calendar-0.1','regional-a-0.1','inst-a-0.1','inst-b-0.1']
          for n in needles:
              print('NEEDLE',n)
              p=subprocess.run(['grep','-R','-n','--exclude=registry.json','--exclude-dir=.git','--exclude-dir=docs',n,'src','scripts','tests','fixtures','data/monitor'],capture_output=True,text=True)
              print(p.stdout[:6000] if p.stdout else 'NO_MATCH')
          PY
