name: TEMP P1-A project-status sync

on:
  push:
    branches: [source-governance-p1a-postaudit]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch durable recovery checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_STATUS.md')
          s=p.read_text(encoding='utf-8')
          replacements={
            '- **Tier-1 source registry:** v1.52 — **223 sources**.':'- **Tier-1 source registry:** v1.53 — **223 sources**.',
            'therefore public runtime projection correctly labels it stale relative to current v0.20 / v1.52.':'therefore public runtime projection correctly labels it stale relative to current v0.20 / v1.53.',
            '**145 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.':'**139 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.',
            '1. **Observe first genuine post-contract live-monitor run 48+** against source v1.52 / expectations v0.7 and validate retained-review reduction against real evidence; do not manufacture a candidate.':'1. **Observe first genuine post-contract live-monitor run 48+** against source v1.53 / expectations v0.7 and validate retained-review reduction against real evidence; do not manufacture a candidate.',
            '3. **Source-governance P1 tranche design** — choose a small bounded set from the 145 canonical-dependent records using active analytical relevance/dependency, then perform source-specific rights research before any backfill.':'3. **Source-governance P1-B research** — select a small bounded set from the measured 139-record P1 queue using dependency + active analytical horizon + regional/institutional balance; perform direct source-specific rights/provenance research before freezing any backfill plan.'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected status text: {old}')
              s=s.replace(old,new,1)
          marker='Durable record: `data/coverage/SOURCE_GOVERNANCE_P0_BACKFILL_AUDIT_v0.1.md`.\n\n## Held / unresolved nodes'
          if marker not in s:
              raise SystemExit('missing P0 durable-record insertion marker')
          insert='''Durable record: `data/coverage/SOURCE_GOVERNANCE_P0_BACKFILL_AUDIT_v0.1.md`.

### P1-A high-dependency tranche — COMPLETE

P1-A backfilled explicit modern governance for exactly six canonical-dependent sources after direct source-specific research: China NBS (`WSSRC-MAC-007`), India MoSPI (`WSSRC-MAC-017`), U.S. EIA (`WSSRC-COM-003`), FAO (`WSSRC-COM-010`), WHO (`WSSRC-HEALTH-001`) and UNFCCC (`WSSRC-CLIM-001`). Factual-provenance fitness remained separate from automation permission throughout.

Brazil TSE `WSSRC-EL-BR-001` was deliberately excluded: Resolution 23.760 was amended by Resolution 23.771, while the 5 January 2027 presidential inauguration is constitutionally grounded rather than properly evidenced by the electoral-calendar source relationship. No Brazilian canonical date changed.

Read-only preflight run `33841251291` passed. An initial guarded apply run `33841284146` exposed a pre/post lifecycle-test defect and stopped before commit. After the lifecycle tests were repaired separately, guarded apply run `33842268368` passed all protections and committed only `data/sources/registry.json` (`bea051539ac92ada06043e6ddaa9322ae8ff53a7`). PR #3 merged as `6e25a024f964e070821910cac1148f10ca955e5c`.

Independent post-P1-A audit run `33843249249` measured source **v1.53 / 223**:

- **13** fully explicit governance sources;
- **210** sources still missing at least one governance field;
- **0 P0** configured-monitor dependencies;
- **139 P1** canonical dependencies;
- **71 P2** registry-only sources;
- missing `canonical_provenance_use`: **200**;
- missing `automated_monitoring_use`: **200**;
- missing `verification_mode`: **210**.

The next P1 research queue is led by Fed/FOMC and BoJ (44 canonical dependencies each), RBA (33), ECB (22), ONS (19) and SNB (18), but the next bounded tranche must also guard against mechanical U.S./European weighting by considering active horizon and regional/institutional balance. No next-tranche classification is authorised yet.

Durable record: `data/coverage/SOURCE_GOVERNANCE_P1A_BACKFILL_AUDIT_v0.1.md`.

## Held / unresolved nodes'''
          s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify documentation-only diff
        run: |
          test "$(git diff --name-only)" = "PROJECT_STATUS.md"
      - name: Commit status sync
        run: |
          git config user.name "world-signals-status-sync"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Update project status after P1-A governance audit"
          git push origin HEAD:source-governance-p1a-postaudit
