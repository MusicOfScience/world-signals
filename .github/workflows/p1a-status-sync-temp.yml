name: TEMP P1-A project-status sync

on:
  push:
    branches: [source-governance-p1a-postaudit]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch durable recovery checkpoint
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
      - name: Verify documentation-only diff
        run: |
          test "$(git diff --name-only)" = "PROJECT_STATUS.md"
      - name: Commit status sync
        run: |
          git config user.name "world-signals-status-sync"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Update project status after P1-A governance audit"
          git push origin HEAD:source-governance-p1a-postaudit
