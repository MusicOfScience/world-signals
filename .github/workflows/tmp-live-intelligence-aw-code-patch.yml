name: WORLD SIGNALS AW Live Intelligence code patch

on:
  push:
    branches:
      - feature/post-av-pressure-audit-aw
    paths:
      - .github/workflows/tmp-live-intelligence-aw-code-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/post-av-pressure-audit-aw
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove post-77 ancestry
        run: test "$(git merge-base HEAD 4768c73532c4ba4038b30314079b85be64fbee01)" = "4768c73532c4ba4038b30314079b85be64fbee01"
      - name: Apply deterministic AW code patch
        run: |
          python scripts/tmp_patch_live_intelligence_aw.py
          git diff --check
      - name: Compile and exercise pre-state plus simulated target
        run: |
          python -m py_compile src/world_signals/live_intelligence.py scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py tests/test_live_intelligence_foundation_av.py
          python scripts/validate_live_intelligence.py
          python scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py
          python -m unittest tests.test_live_intelligence_foundation_av -v
      - name: Commit patch and self-remove helpers
        env:
          BRANCH: feature/post-av-pressure-audit-aw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world_signals/live_intelligence.py tests/test_live_intelligence_foundation_av.py
          git commit -m "AW: evolve Live Intelligence controlled-population validator"
          git push origin HEAD:$BRANCH
          git rm .github/workflows/tmp-live-intelligence-aw-code-patch.yml scripts/tmp_patch_live_intelligence_aw.py
          git commit -m "AW: remove one-shot code patch helpers"
          git push origin HEAD:$BRANCH
