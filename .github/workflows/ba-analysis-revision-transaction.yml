name: BA Analysis revision transaction

on:
  push:
    branches:
      - feature/post-az-analysis-revision-contract-ba
    paths:
      - .github/workflows/ba-analysis-revision-transaction.yml

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "802ca5b94b6e80a055ac363f48a6c8392f038048"
          test "$(git merge-base HEAD origin/main)" = "802ca5b94b6e80a055ac363f48a6c8392f038048"
          test "$(git diff --name-only 9a55d00131e3f3f184fb71a30bcca4687d4a6b12 HEAD)" = ".github/workflows/ba-analysis-revision-transaction.yml"
      - name: Materialise BA target
        env:
          WORLD_SIGNALS_BA_ALLOW_WRITE: '1'
        run: python scripts/apply_analysis_revision_contract_ba.py --apply
      - name: Validate governed layers
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -q
          python -m py_compile scripts/validate_live_intelligence.py scripts/validate_analysis.py scripts/apply_analysis_revision_contract_ba.py src/world_signals/live_intelligence.py src/world_signals/analysis.py src/world_signals/analysis_revision.py src/world_signals/analysis_revision_projection.py src/world_signals/live_analysis_bridge.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Prove exact mutation boundary
        run: |
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' PROJECT_STATUS.md ROADMAP.md data/analysis/schema.json | sort)"
          git diff --quiet HEAD -- data/canonical/registry.json data/canonical/schema.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/monitor/expectations.json data/monitor/operations_policy.json data/live_intelligence/schema.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json
      - name: Commit BA target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATUS.md ROADMAP.md data/analysis/schema.json
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' PROJECT_STATUS.md ROADMAP.md data/analysis/schema.json | sort)"
          git commit -m 'BA: materialise production-closed Analysis revision foundation'
          git push origin HEAD:feature/post-az-analysis-revision-contract-ba
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/ba-analysis-revision-transaction.yml
          git commit -m 'BA: remove temporary revision transaction workflow'
          git push origin HEAD:feature/post-az-analysis-revision-contract-ba
