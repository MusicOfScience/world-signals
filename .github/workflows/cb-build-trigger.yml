name: CB SARB build trigger

on:
  push:
    branches:
      - feature/post-ca-pressure-audit-cb
    paths:
      - .github/workflows/cb-build-trigger.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Execute CB builder payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/cb-build-sarb-monitor.yml').read_text().splitlines()
          step='      - name: Materialise bounded SARB RSS monitor'
          step_idx=src.index(step)
          start=next(i for i in range(step_idx,len(src)) if src[i].strip()=='set -euo pipefail')
          body=[]
          in_triple=False
          for line in src[start:]:
              stripped=line.lstrip()
              opens=("research='''", "adapter=r'''", "monitor=r'''", "apply_script=r'''", "tests=r'''", "activation=r'''")
              if not in_triple:
                  rendered=line[10:] if line.startswith('          ') else line
                  body.append(rendered)
                  if any(rendered.lstrip().startswith(x) for x in opens):
                      in_triple=True
              else:
                  body.append(line)
                  if line == "'''":
                      in_triple=False
          Path('/tmp/cb-builder.sh').write_text('\n'.join(body)+'\n')
          print('CB_BUILDER_LINES',len(body),'TRIPLE_CLOSED',not in_triple)
          PY
          bash /tmp/cb-builder.sh
