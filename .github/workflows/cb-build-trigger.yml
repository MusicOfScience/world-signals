name: CB SARB poststate preflight

on:
  push:
    branches:
      - feature/post-ca-pressure-audit-cb
    paths:
      - .github/workflows/cb-build-trigger.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact CB poststate and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "1f20c9afbf7d9e295024ce534b3191155d9f674b"
          test "$(git rev-parse origin/main)" = "1f20c9afbf7d9e295024ce534b3191155d9f674b"
          git diff --exit-code origin/main -- data/canonical/registry.json data/change-ledger data/live data/analysis || true
          python scripts/apply_sarb_mpc_rss_monitor_cb.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          e=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('2.01',256)
          assert (e['version'],len(e['adapters']))==('0.26',24)
          assert e['automatic_canonical_commit'] is False
          assert e['google_calendar_write'] is False
          old=[x for x in s['sources'] if x.get('source_id')=='WSSRC-REG-006']
          new=[x for x in s['sources'] if x.get('source_id')=='WSSRC-REG-013']
          route=[x for x in e['adapters'] if x.get('adapter_id')=='SARB_MPC_STATEMENTS_RSS']
          assert len(old)==len(new)==len(route)==1
          assert old[0]['automated_monitoring_use']=='PROHIBITED_OR_RIGHTS_HOLD'
          assert route[0]['canonical_occurrence_ids']==['WSO-REG-A-0009','WSO-REG-A-0010']
          assert route[0]['request_budget_per_run']==1
          for k in ('schedule_authority','clock_authority','lifecycle_authority','certainty_authority','canonical_datetime_mutation_allowed','automatic_item_link_fetch_allowed','automatic_schedule_fetch_allowed','automatic_new_occurrence_creation_allowed','automatic_live_or_analysis_promotion_allowed','automatic_commit_allowed'):
              assert route[0][k] is False, k
          print('CB_GOVERNED_POSTSTATE_PASS')
          PY
      - name: Run ordinary repository validation surface
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_live_intelligence.py scripts/validate_analysis.py scripts/apply_analysis_revision_contract_ba.py scripts/apply_sarb_mpc_rss_monitor_cb.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/live_intelligence.py src/world_signals/analysis.py src/world_signals/analysis_revision.py src/world_signals/analysis_revision_projection.py src/world_signals/live_analysis_bridge.py src/world_signals/adapters/sarb_rss.py src/world_signals/sarb_mpc_monitor.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Production-shaped one-request SARB live check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from world_signals.adapters.sarb_rss import fetch_sarb_publications_rss
          from world_signals.sarb_mpc_monitor import sarb_mpc_rss_review_candidates
          items,snap=fetch_sarb_publications_rss()
          assert snap.status==200
          assert len(items)>0
          e=json.loads(Path('data/monitor/expectations.json').read_text())
          c=json.loads(Path('data/canonical/registry.json').read_text())
          config=next(x for x in e['adapters'] if x.get('adapter_id')=='SARB_MPC_STATEMENTS_RSS')
          candidates,observations=sarb_mpc_rss_review_candidates(c['records'],items,config)
          print('SARB_LIVE_HTTP',snap.status)
          print('SARB_LIVE_ITEMS',len(items))
          print('SARB_LIVE_MPC_ITEMS',sum(1 for x in items if x.mpc_year is not None))
          print('SARB_LIVE_CANDIDATES',len(candidates))
          print('SARB_LIVE_OBSERVATIONS',len(observations))
          print('SARB_REQUEST_COUNT',1)
          print('SARB_FOLLOWUP_COUNT',0)
          print('SARB_AUTOMATIC_COMMIT',False)
          PY
      - name: Verify protected layers and no generated residue
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- data/canonical/registry.json data/live data/analysis
          rm -rf artifacts review_candidates/live site public 2>/dev/null || true
          git status --short
