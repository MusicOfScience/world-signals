name: TEMP P1-G source scope

on:
  push:
    branches: [source-governance-p1g-research]

permissions:
  contents: read

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print canonical dependencies for candidate sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids={
            'WSSRC-MAC-015','WSSRC-MKT-011','WSSRC-FIS-008',
            'WSSRC-COM-012','WSSRC-INT-029','WSSRC-REGJ-001'
          }
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          print('TOP_LEVEL_KEYS', sorted(reg))
          collection=None
          for key, value in reg.items():
              if isinstance(value, list) and value and isinstance(value[0], dict) and any('source_id' in x for x in value[:20]):
                  collection=value
                  print('COLLECTION_KEY', key)
                  break
          if collection is None:
              raise SystemExit('no canonical record collection found')
          rows=[r for r in collection if r.get('source_id') in ids]
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
      - name: Confirm repository remains clean
        run: git diff --exit-code
