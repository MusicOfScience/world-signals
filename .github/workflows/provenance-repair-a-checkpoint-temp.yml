name: TEMP provenance repair A checkpoint

on:
  push:
    branches: [provenance-repair-a-checkpoint]

permissions:
  contents: write

jobs:
  checkpoint:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Update durable project checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_STATUS.md')
          t=p.read_text(encoding='utf-8')
          replacements=[
          ('**Updated:** 2026-09-04  ','**Updated:** 2026-09-05  '),
          ('- **Canonical occurrence registry:** v0.20 — **669 occurrences**.\n- **Tier-1 source registry:** v1.60 — **223 sources**.\n- **Canonical schema:** v0.51.',
           '- **Canonical occurrence registry:** v0.21 — **669 occurrences**.\n- **Tier-1 source registry:** v1.61 — **224 sources**.\n- **Reviewed change ledger:** v0.10.\n- **Canonical schema:** v0.51.'),
          ('The review-state contract activated prospectively after run 47 and has now been exercised on genuine later evidence. Pages workflow-run deployment `33876115556` reduced **8 retained monitor runs** to **0 review items**, with **0 unsuccessful-run evidence gaps** and `horizon_complete=True`; runtime is `AVAILABLE` and aligned with the current site, and retained review state is `AVAILABLE_RETAINED_HORIZON(0)`. The earlier observation gate is therefore CLOSED. Do not manufacture a candidate merely to test non-zero persistence; await natural future evidence.',
           'The review-state contract activated prospectively after run 47 and has now been exercised on genuine later evidence. Pages workflow-run deployment `33876115556` reduced **8 retained monitor runs** to **0 review items**, with **0 unsuccessful-run evidence gaps** and `horizon_complete=True`; runtime is `AVAILABLE_RETAINED_HORIZON(0)` at that retained checkpoint. The earlier observation gate is therefore CLOSED. Do not manufacture a candidate merely to test non-zero persistence; await natural future evidence.\n\n**Checkpoint note after Provenance Scope Repair A:** the latest retained live-monitor observation still predates canonical v0.21 / source v1.61. Merged-main CI and Pages are green, but runtime evidence must be treated as configuration-stale until the next genuine live-monitor run observes the repaired checkpoint. This is not an event-state failure and must not be rewritten as one.'),
          ('Brazil TSE and SNB remained intentionally excluded from P1-H because their defect was source scope/provenance rather than an ordinary missing-governance backfill.\n\n## Held / unresolved nodes',
           'Brazil TSE and SNB remained intentionally excluded from P1-H because their defect was source scope/provenance rather than an ordinary missing-governance backfill. Those holds were subsequently closed by Provenance Scope Repair A.\n\n### Provenance Scope Repair A — COMPLETE\n\nPR #22 merged as `5adb07eb12ccd2fab1a51704d8dd5e9413e2d4be`. Canonical advanced **v0.20 → v0.21 / 669** solely for reviewed provenance semantics; source registry advanced **v1.60 / 223 → v1.61 / 224**; change ledger advanced **v0.9 → v0.10**. Brazil inauguration `WSO-EL-A-0004` remains exactly **2027-01-05** and now uses dedicated constitutional provenance `WSSRC-EL-BR-002`; TSE `WSSRC-EL-BR-001` retains its three genuine electoral-calendar dependencies. SNB `WSSRC-CB-009` now points to the dedicated forward event schedule while all **18** canonical SNB occurrences remain unchanged.\n\nIndependent post-transaction audit run `33886673758` measured **58 fully explicit**, **166 missing-any**, **95 P1** and **71 P2** sources. Automatic canonical commit remains false and Calendar write remains false. Merged-main CI `33886955012` and Pages `33886992355` both succeeded.\n\nDurable audit: `data/coverage/PROVENANCE_SCOPE_REPAIR_A_AUDIT_v0.1.md`.\n\n## Held / unresolved nodes'),
          ('### Source-governance P1/P2 backlog\n\n**97 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research after P1-H. Prioritise small tranches by live analytical relevance, dependency and active horizon; never infer rights from public accessibility, official status, machine readability or successful parsing.\n\nThe two long-standing provenance-scope holds are now researched and frozen as **Provenance Scope Repair A** rather than being rolled into P1-I. Brazil TSE `WSSRC-EL-BR-001` remains the electoral-calendar authority for three genuine dependencies; new `WSSRC-EL-BR-002` is planned for Constitution art. 82 and the unchanged 5 January 2027 inauguration provenance. SNB `WSSRC-CB-009` retains its stable identity but is planned to move to the dedicated forward event schedule, which directly supports all 18 existing assessment/news-conference/summary occurrences. No repair data mutation is included in the research branch.\n\nFrozen guarded post-state: canonical **v0.21 / 669**, source **v1.61 / 224**, change ledger **v0.10**, and the noncanonical biosecurity overlay checkpoint advanced only from canonical v0.20 / 669 to v0.21 / 669. Every canonical date/time and occurrence ID must remain unchanged; the Brazil change is provenance-semantic, not a reschedule.',
           '### Source-governance P1/P2 backlog\n\n**95 P1 canonical-dependent** and **71 P2 registry-only** source records remain after the completed provenance repair. Prioritise bounded research by active horizon, canonical dependency, source-scope integrity, regional breadth, domain diversity and live analytical relevance as separate constraints; never infer rights from public accessibility, official status, machine readability or successful parsing.\n\nBrazil TSE and SNB are no longer held nodes: Provenance Scope Repair A is merged and independently audited. Do not mechanically label the next work P1-I until a fresh selection diagnostic has tested the remaining queue.'),
          ('1. **Provenance Scope Repair A transaction gate** — review/merge the frozen Brazil TSE / Constitution and SNB research/infrastructure, reconcile merged canonical v0.20 / source v1.60, then run the guarded read-only preflight before the four-file reviewed transaction. It may change only `WSO-EL-A-0004` provenance-semantic fields, TSE/SNB source scope, append `WSSRC-EL-BR-002`, append one reviewed ledger entry, and advance only the biosecurity overlay\'s canonical checkpoint pointer.\n2. **Independent post-repair audit** — prove canonical v0.21 / 669, source v1.61 / 224, ledger v0.10, exact 5 January 2027 preservation, unchanged SNB occurrences, updated governance queue metrics, overlay validity, automatic canonical commit false and Calendar write false before considering the repair complete.\n3. **Next P1 selection diagnostic** — only after the provenance repair is merged/audited, reassess the remaining P1 queue by active horizon, dependency, source-scope integrity, regional breadth and domain diversity. Do not mechanically invent a P1-I six-source conveyor belt.\n4. **Biosecurity candidate-node research** — assess marginal analytical value + authoritative timing + rights one institution/system at a time; architecture does not authorise population.\n5. **South Asia provenance resolution** — continue precise authoritative-date/native-calendar work.\n6. Re-run coverage audit after analytically justified canonical additions only.\n7. Continue **Live Intelligence v1** using aligned canonical + monitor + retained-review evidence: WHAT HAPPENED / EXPECTED / SURPRISED / MOVED / CONNECTIONS / NOISE / ALTERNATIVES / SECOND-ORDER; do not infer causality from temporal coincidence.\n8. Keep the **canonical auto-commit gate CLOSED** until genuine prospective reschedule and explicit cancellation evidence satisfy the existing real-world gates; healthy monitoring is not mutation authority.\n9. Continue **Analysis v1** once the live-intelligence evidence contract is stable.',
           '1. **Post-repair live-monitor alignment observation** — wait for the next genuine live-monitor execution against canonical v0.21 / source v1.61 and verify configuration identity, source health, candidate handling and retained-review projection. Do not replay or fabricate evidence merely to clear this observation.\n2. **Next P1 selection diagnostic** — reassess the remaining **95 P1** sources by active horizon, canonical dependency, source-scope integrity, regional breadth, domain diversity and analytical relevance. Do not mechanically invent a P1-I six-source conveyor belt.\n3. **Biosecurity candidate-node research** — assess marginal analytical value + authoritative timing + rights one institution/system at a time; architecture does not authorise population.\n4. **South Asia provenance resolution** — continue precise authoritative-date/native-calendar work.\n5. Re-run coverage audit after analytically justified canonical additions only.\n6. Continue **Live Intelligence v1** only from aligned canonical + monitor + retained-review evidence: WHAT HAPPENED / EXPECTED / SURPRISED / MOVED / CONNECTIONS / NOISE / ALTERNATIVES / SECOND-ORDER; do not infer causality from temporal coincidence.\n7. Keep the **canonical auto-commit gate CLOSED** until genuine prospective reschedule and explicit cancellation evidence satisfy the existing real-world gates; healthy monitoring is not mutation authority.\n8. Continue **Analysis v1** once the live-intelligence evidence contract is stable.')
          ]
          for old,new in replacements:
              if t.count(old)!=1:
                  raise SystemExit(f'checkpoint replacement count {t.count(old)} for: {old[:100]!r}')
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          PY
          git diff -- PROJECT_STATUS.md
          git diff --name-only | grep -Fx 'PROJECT_STATUS.md'
          test "$(git diff --name-only | wc -l)" -eq 1
      - name: Commit checkpoint update
        run: |
          git config user.name world-signals-checkpoint
          git config user.email actions@users.noreply.github.com
          git add PROJECT_STATUS.md
          git commit -m 'Close provenance repair checkpoint and update next gates'
          git push origin HEAD:provenance-repair-a-checkpoint
