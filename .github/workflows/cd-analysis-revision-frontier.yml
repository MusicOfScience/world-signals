name: CD Analysis revision frontier diagnostic

on:
  push:
    branches:
      - feature/post-cc-pressure-audit-cd
    paths:
      - '.github/workflows/cd-analysis-revision-frontier.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print immutable Analysis and Live frontier
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='c186835d9d6b36620177badfff604f309ceb35d4'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          reviews=json.loads(Path('data/analysis/event_reviews.json').read_text())
          live=json.loads(Path('data/live_intelligence/observations.json').read_text())
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          cmap={r.get('occurrence_id'):r for r in canonical['records']}
          revs=[r for r in reviews['reviews'] if r.get('revision_of_analysis_id')]
          live_input_rows=[]
          print('ANALYSIS_VERSION',reviews.get('version'),'COUNT',len(reviews['reviews']),'REVISION_COUNT',len(revs))
          for r in reviews['reviews']:
              li=r.get('live_inputs') or []
              if li: live_input_rows.append(r.get('analysis_id'))
              occ=cmap.get(r.get('canonical_occurrence_id'),{})
              print(json.dumps({
                'analysis_id':r.get('analysis_id'),
                'analysis_as_of_utc':r.get('analysis_as_of_utc'),
                'canonical_occurrence_id':r.get('canonical_occurrence_id'),
                'canonical_series_id':r.get('canonical_series_id'),
                'canonical_category':occ.get('category'),
                'canonical_region':occ.get('region'),
                'canonical_status':occ.get('certainty_status'),
                'scope':r.get('scope'),
                'analytical_conclusion':r.get('analytical_conclusion'),
                'live_inputs':li,
                'revision_of_analysis_id':r.get('revision_of_analysis_id'),
              },ensure_ascii=False,sort_keys=True))
          print('PRODUCTION_LIVE_INPUT_REVIEW_IDS',live_input_rows)
          print('LIVE_VERSION',live.get('version'),'LIVE_COUNT',len(live['observations']))
          for o in live['observations']:
              print('LIVE',json.dumps({
                'observation_id':o.get('observation_id'),
                'type':o.get('observation_type'),
                'headline':o.get('headline'),
                'domain_tags':o.get('domain_tags'),
                'canonical_links':o.get('canonical_links'),
                'story_id':o.get('story_id'),
                'state_update_of_observation_id':o.get('state_update_of_observation_id'),
              },ensure_ascii=False,sort_keys=True))
          PY
      - name: Validate current Analysis and Live layers
        run: |
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
      - name: Prove governed layers unchanged
        run: git diff --exit-code c186835d9d6b36620177badfff604f309ceb35d4..HEAD -- data/canonical data/sources data/monitor data/changes data/live_intelligence data/analysis scripts src tests web
