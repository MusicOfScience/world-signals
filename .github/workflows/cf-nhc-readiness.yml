name: CF NHC pilot readiness

on:
  push:
    branches:
      - feature/post-cd-monitor-pressure-cf
    paths:
      - '.github/workflows/cf-nhc-readiness.yml'
      - 'src/world_signals/adapters/nhc_atlantic_season.py'
      - 'src/world_signals/nhc_atlantic_season_monitor.py'
      - 'tests/test_nhc_atlantic_season_cf.py'
      - 'scripts/run_nhc_readiness_cf.py'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/post-cd-monitor-pressure-cf
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enforce OPEC quarantine
        run: python -m unittest tests.test_opec_quarantine_cf -v
      - name: Run NHC parser and sentinel regressions
        run: python -m unittest tests.test_nhc_atlantic_season_cf -v
      - name: Validate live NHC pilot semantics
        run: python scripts/run_nhc_readiness_cf.py
      - name: Validate repository remains unchanged outside readiness artifact
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0.1.json').read_text())
          assert row['readiness_verdict']=='PILOT_ROUTE_VALIDATED_NO_AUTO_COMMIT'
          assert row['review_candidate_count']==0
          assert row['semantic_baseline_match_count']==2
          assert row['rss_is_schedule_authority'] is False
          assert row['automatic_canonical_commit'] is False
          assert row['opec_quarantine_respected'] is True
          PY
      - name: Commit readiness evidence only
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0.1.json
          test -z "$(git diff --cached --name-only | grep -Ev '^data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0\.1\.json$' || true)"
          if git diff --cached --quiet; then
            echo "No readiness evidence change to commit"
            exit 0
          fi
          git commit -m "CF: persist NHC pilot readiness evidence"
          git push origin HEAD:feature/post-cd-monitor-pressure-cf
