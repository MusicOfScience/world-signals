name: BR JGB RSS controlled transaction

on:
  push:
    branches:
      - feature/post-bq-jgb-monitor-br

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BQ ancestry and BR pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1b021a5edb6b80dfab672f38047377d39dcae497"
          test "$(git merge-base HEAD origin/main)" = "1b021a5edb6b80dfab672f38047377d39dcae497"
          python scripts/apply_japan_mof_jgb_rss_monitor_br.py
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/br-tx-protected.before
      - name: Apply bounded BR transaction
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BR=1 python scripts/apply_japan_mof_jgb_rss_monitor_br.py --apply
      - name: Audit exact mutation boundary and source-role contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed=tracked|untracked
          expected={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py'
          }
          assert changed==expected,(changed,expected)
          pre_sources=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'],text=True))
          post_sources=json.loads(Path('data/sources/registry.json').read_text())
          pre_monitor=json.loads(subprocess.check_output(['git','show','HEAD:data/monitor/expectations.json'],text=True))
          post_monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (post_sources['version'],len(post_sources['sources']))==('1.91',249)
          assert (post_monitor['version'],len(post_monitor['adapters']))==('0.16',14)
          before={x['source_id']:x for x in pre_sources['sources']}
          after={x['source_id']:x for x in post_sources['sources']}
          assert after['WSSRC-FIS-007']==before['WSSRC-FIS-007']
          assert set(after)-set(before)=={'WSSRC-FIS-029'}
          machine=after['WSSRC-FIS-029']
          assert machine['canonical_dependency_count']==0
          assert machine['automated_monitoring_use']=='CLEARED'
          assert machine['automated_retrieval_permission']=='OFFICIAL_RSS_SUBSCRIPTION_INTERFACE_EXPLICIT_READER_AGGREGATOR_USE'
          assert machine['canonical_provenance_use']=='MONITOR_ONLY_PUBLICATION_CHANGE_SENTINEL_NO_CANONICAL_SCHEDULE_AUTHORITY'
          route=post_monitor['adapters'][-1]
          assert post_monitor['adapters'][:-1]==pre_monitor['adapters']
          assert route['adapter_id']=='JAPAN_MOF_JGB_RSS'
          assert route['request_budget_per_run']==1
          assert route['schedule_authority'] is False
          assert route['lifecycle_authority'] is False
          assert route['certainty_authority'] is False
          assert route['rss_publication_time_is_auction_time'] is False
          assert route['automatic_calendar_html_fetch_allowed'] is False
          assert route['automatic_commit_allowed'] is False
          assert post_monitor['automatic_canonical_commit'] is False
          assert post_monitor['google_calendar_write'] is False
          PY
      - name: Validate full repository and static build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/japan_mof_rss.py src/world_signals/japan_mof_jgb_monitor.py scripts/apply_japan_mof_jgb_rss_monitor_br.py scripts/run_live_monitor.py scripts/run_adapter_smoke.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Re-audit protected layers and transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json data/analysis/event_reviews.json data/analysis/evidence_registry.json > /tmp/br-tx-protected.after
          diff -u /tmp/br-tx-protected.before /tmp/br-tx-protected.after
          python - <<'PY'
          import subprocess
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert tracked|untracked=={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py'
          }
          PY
      - name: Commit exact BR transaction and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          git rm .github/workflows/br-jgb-rss-controlled-transaction.yml
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            'data/sources/registry.json','data/monitor/expectations.json',
            'scripts/run_live_monitor.py','scripts/run_adapter_smoke.py',
            'src/world_signals/adapters/__init__.py',
            '.github/workflows/br-jgb-rss-controlled-transaction.yml'
          }
          assert staged==expected,(staged,expected)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          PY
          git commit -m "BR: activate Japan MOF JGB RSS monitor"
          git push origin HEAD:feature/post-bq-jgb-monitor-br
