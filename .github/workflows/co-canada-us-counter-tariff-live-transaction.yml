# Rerun after descendant-safe repair of failed run 34466470104
name: CO Canada counter-tariff Live guarded transaction

on:
  push:
    branches:
      - feature/post-cn-canada-us-trade-live-co
    paths:
      - '.github/workflows/co-canada-us-counter-tariff-live-transaction.yml'

permissions:
  contents: write

jobs:
  transact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CO branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact post-CN base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b2b9e85933dd1c5924af1228f47427d6b38bf967"
          test "$(git merge-base HEAD origin/main)" = "b2b9e85933dd1c5924af1228f47427d6b38bf967"
          echo "PRE_TRANSACTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture protected hashes and existing Live rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          plan = json.loads((root/'data/live_intelligence/CANADA_US_COUNTER_TARIFF_LIVE_CO_PLAN_v0.1.json').read_text())
          hashes = {}
          for raw in plan['protected_paths']:
              path = root / raw
              if not path.is_file():
                  raise SystemExit(f'protected path missing before CO: {raw}')
              hashes[raw] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('/tmp/co_protected.json').write_text(json.dumps(hashes, sort_keys=True))
          obs = json.loads((root/'data/live_intelligence/observations.json').read_text())['observations']
          ev = json.loads((root/'data/live_intelligence/evidence_registry.json').read_text())['evidence']
          Path('/tmp/co_existing_live.json').write_text(json.dumps({'observations': obs, 'evidence': ev}, sort_keys=True, ensure_ascii=False))
          PY

      - name: Simulate reviewed CO target
        run: python scripts/apply_canada_us_counter_tariff_live_co_tmp.py --simulate

      - name: Run focused CN descendant and CO contract tests before write
        run: python -m unittest tests.test_brazil_fuel_policy_live_cn tests.test_canada_us_counter_tariff_live_co -v

      - name: Materialise reviewed CO Live transaction
        env:
          WORLD_SIGNALS_APPLY_CANADA_US_COUNTER_TARIFF_LIVE_CO: REVIEWED_APPLY
        run: python scripts/apply_canada_us_counter_tariff_live_co_tmp.py --apply

      - name: Refresh mechanically derived recovery state
        env:
          WORLD_SIGNALS_WRITE_DERIVED_STATE: YES
        run: python scripts/project_state_snapshot.py --write

      - name: Verify CO materialisation
        run: python scripts/apply_canada_us_counter_tariff_live_co_tmp.py --verify

      - name: Canonical validator
        run: python scripts/validate_registry.py

      - name: Live validator
        run: python scripts/validate_live_intelligence.py

      - name: Analysis validator
        run: python scripts/validate_analysis.py

      - name: Derived-state check
        run: python scripts/project_state_snapshot.py --check

      - name: Complete historical suite
        run: python -m unittest discover -s tests -v

      - name: Python compilation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate_registry.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/project_state_snapshot.py \
            scripts/run_cross_layer_coverage_audit.py \
            scripts/apply_canada_us_counter_tariff_live_co_tmp.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/live_correction_conflict.py \
            src/world_signals/canada_us_counter_tariff_co.py

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Static build
        run: python scripts/build_site.py

      - name: Verify protected layers and existing Live rows unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          before_hashes = json.loads(Path('/tmp/co_protected.json').read_text())
          for raw, expected in before_hashes.items():
              actual = hashlib.sha256((root/raw).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'CO protected path mutated: {raw}')
          before = json.loads(Path('/tmp/co_existing_live.json').read_text())
          after_obs = json.loads((root/'data/live_intelligence/observations.json').read_text())['observations']
          after_ev = json.loads((root/'data/live_intelligence/evidence_registry.json').read_text())['evidence']
          obs_by_id = {row['observation_id']: row for row in after_obs}
          ev_by_id = {row['evidence_id']: row for row in after_ev}
          for row in before['observations']:
              if obs_by_id.get(row['observation_id']) != row:
                  raise SystemExit(f"CO mutated existing Live observation: {row['observation_id']}")
          for row in before['evidence']:
              if ev_by_id.get(row['evidence_id']) != row:
                  raise SystemExit(f"CO mutated existing Live evidence: {row['evidence_id']}")
          if len(after_obs) != len(before['observations']) + 1:
              raise SystemExit('CO did not add exactly one Live observation')
          if len(after_ev) != len(before['evidence']) + 2:
              raise SystemExit('CO did not add exactly two Live evidence rows')
          PY

      - name: Remove temporary apply helper and enforce bounded transaction diff
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_canada_us_counter_tariff_live_co_tmp.py
          python - <<'PY'
          import os, subprocess
          allowed = {
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'data/status/current_state.json',
              'README.md',
              'PROJECT_STATUS.md',
              'ROADMAP.md',
              'scripts/apply_canada_us_counter_tariff_live_co_tmp.py',
          }
          base = os.environ['PRE_TRANSACTION_SHA']
          changed = set(subprocess.check_output(['git','diff','--name-only',base], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'CO unexpected transaction paths: {unexpected}')
          required = {
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'data/status/current_state.json',
              'README.md',
              'PROJECT_STATUS.md',
              'ROADMAP.md',
              'scripts/apply_canada_us_counter_tariff_live_co_tmp.py',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'CO expected transaction paths missing: {missing}')
          PY
          test ! -e scripts/apply_canada_us_counter_tariff_live_co_tmp.py

      - name: Commit reviewed CO materialisation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'world-signals-co-transaction'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'CO: materialise Canada counter-tariff Live specimen'
          git push origin HEAD:feature/post-cn-canada-us-trade-live-co
