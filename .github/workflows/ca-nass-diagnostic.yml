name: CA USDA NASS iCalendar diagnostic

on:
  push:
    branches:
      - feature/post-bz-pressure-audit-ca
    paths:
      - .github/workflows/ca-nass-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Inspect frozen NASS contract and make exactly one iCalendar request
        shell: bash
        run: |
          set -euo pipefail
          BASE=07c558c8811795f0aed40e73bd386cc70344191e
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path

          C=json.loads(Path('data/canonical/registry.json').read_text())
          S=json.loads(Path('data/sources/registry.json').read_text())
          M=json.loads(Path('data/monitor/expectations.json').read_text())
          src=[x for x in S['sources'] if x.get('source_id')=='WSSRC-COM-005']
          assert len(src)==1
          deps=[x for x in C['records'] if x.get('source_id')=='WSSRC-COM-005']
          assert len(deps)==5
          assert not any('NASS' in str(a.get('adapter_id','')).upper() for a in M['adapters'])
          print('SOURCE_OBJECT',json.dumps(src[0],sort_keys=True,ensure_ascii=False))
          print('CANONICAL_DEPENDENCIES',json.dumps(deps,sort_keys=True,ensure_ascii=False))

          url='https://www.nass.usda.gov/Publications/Calendar/2026/NassReleases2026.ics'
          req=urllib.request.Request(url,headers={
              'User-Agent':'WORLD-SIGNALS/0.1 (+https://github.com/MusicOfScience/world-signals)',
              'Accept':'text/calendar,text/plain;q=0.9,*/*;q=0.1',
          })
          request_count=0
          request_count+=1
          with urllib.request.urlopen(req,timeout=30) as r:
              status=r.status
              ctype=r.headers.get('Content-Type','')
              body=r.read()
          assert request_count==1
          assert status==200,status
          assert len(body)>1000,len(body)
          text=body.decode('utf-8-sig')
          assert 'BEGIN:VCALENDAR' in text and 'END:VCALENDAR' in text
          assert 'BEGIN:VEVENT' in text

          # RFC5545 line unfolding.
          raw=text.replace('\r\n','\n').replace('\r','\n').split('\n')
          lines=[]
          for line in raw:
              if line.startswith((' ','\t')) and lines:
                  lines[-1]+=line[1:]
              else:
                  lines.append(line)
          events=[]; cur=None
          for line in lines:
              if line=='BEGIN:VEVENT':
                  assert cur is None
                  cur=[]
              elif line=='END:VEVENT':
                  assert cur is not None
                  fields={}
                  for entry in cur:
                      if ':' not in entry: continue
                      lhs,val=entry.split(':',1)
                      key=lhs.split(';',1)[0].upper()
                      fields.setdefault(key,[]).append({'lhs':lhs,'value':val})
                  events.append(fields); cur=None
              elif cur is not None:
                  cur.append(line)
          assert cur is None
          assert 1 <= len(events) <= 1000,len(events)

          def one(e,key):
              vals=e.get(key,[])
              return vals[0] if len(vals)==1 else None
          compact=[]
          for e in events:
              sm=one(e,'SUMMARY'); dt=one(e,'DTSTART'); de=one(e,'DTEND'); uid=one(e,'UID')
              title=(sm or {}).get('value','')
              if any(k in title.lower() for k in ('crop production','grain stocks')):
                  compact.append({
                      'summary':title,
                      'uid':(uid or {}).get('value'),
                      'dtstart_lhs':(dt or {}).get('lhs'),
                      'dtstart':(dt or {}).get('value'),
                      'dtend_lhs':(de or {}).get('lhs'),
                      'dtend':(de or {}).get('value'),
                      'field_names':sorted(e),
                  })
          print('LIVE_HTTP',json.dumps({'request_count':request_count,'status':status,'content_type':ctype,'body_bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'vevent_count_observed':len(events)},sort_keys=True))
          print('TARGET_EVENTS',json.dumps(compact,sort_keys=True,ensure_ascii=False))
          print('ALL_SUMMARY_COUNTS',json.dumps({s:sum(1 for e in events if (one(e,'SUMMARY') or {}).get('value')==s) for s in sorted({(one(e,'SUMMARY') or {}).get('value','') for e in events}) if s},sort_keys=True,ensure_ascii=False))
          print('NETWORK_REQUESTS_TOTAL',request_count)
          PY
