name: TEMP P1-B governance transaction

on:
  push:
    branches: [source-governance-p1b-transaction]

permissions:
  contents: write

jobs:
  transaction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read-only P1-B preflight
        run: python scripts/apply_source_governance_p1b.py
      - name: Apply guarded P1-B source-governance transaction
        env:
          WORLD_SIGNALS_ALLOW_P1B_GOVERNANCE_APPLY: YES
        run: python scripts/apply_source_governance_p1b.py --apply
      - name: Enforce source-registry-only working diff
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile monitor support scripts
        run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Build derived site
        run: python scripts/build_site.py
      - name: Reconfirm protected diff after validation
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
      - name: Commit source registry transaction
        run: |
          git config user.name "world-signals-p1b-transaction"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources/registry.json
          git commit -m "Apply P1-B source governance backfill"
          git push origin HEAD:source-governance-p1b-transaction
