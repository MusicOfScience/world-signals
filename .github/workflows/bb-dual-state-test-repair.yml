name: BB dual-state test repair

on:
  push:
    branches:
      - feature/post-ba-barmm-election-anchor-bb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact post-BA ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          expected=b8c5372198e3141c4c3f79ace13083877447f71b
          test "$(git rev-parse origin/main)" = "$expected"
          test "$(git merge-base HEAD origin/main)" = "$expected"

      - name: Patch dual-state tests only
        run: |
          python - <<'PY'
          from pathlib import Path

          ba = Path('tests/test_analysis_revision_contract_ba.py')
          text = ba.read_text(encoding='utf-8')
          old = '''    def test_status_helper_preserves_later_descendant_only_with_frozen_ba_invariants(self):
              historical = self.target["status"]
              ba_header = "# CURRENT RECOVERY OVERRIDE — POST-AZ / BA ANALYSIS REVISION FOUNDATION"
              descendant_header = "# CURRENT RECOVERY OVERRIDE — POST-BA / BB SYNTHETIC DESCENDANT"
              self.assertIn(ba_header, historical)
              descendant = historical.replace(ba_header, descendant_header, 1)
              self.assertEqual(apply_ba.target_status(descendant), descendant)

              malformed = descendant.replace(
                  "- production Analysis revisions: **0 / gate CLOSED / public revision metadata projection CLOSED**",
                  "- production Analysis revisions: **1 / gate OPEN**",
                  1,
              )
              with self.assertRaises(SystemExit):
                  apply_ba.target_status(malformed)

          '''
          new = '''    def test_status_helper_preserves_later_descendant_only_with_frozen_ba_invariants(self):
              current = apply_ba.STATUS_PATH.read_text(encoding="utf-8")
              first_header = current.splitlines()[0]
              descendant_header = "# CURRENT RECOVERY OVERRIDE — POST-BA / BB SYNTHETIC DESCENDANT"
              descendant = current.replace(first_header, descendant_header, 1)
              self.assertEqual(apply_ba.target_status(descendant), descendant)

              malformed = descendant.replace(
                  "- production Analysis revisions: **0 / gate CLOSED / public revision metadata projection CLOSED**",
                  "- production Analysis revisions: **1 / gate OPEN**",
                  1,
              )
              with self.assertRaises(SystemExit):
                  apply_ba.target_status(malformed)

          '''
          if old not in text:
              raise SystemExit('BA dual-state test repair target drift')
          ba.write_text(text.replace(old, new, 1), encoding='utf-8')

          bb = Path('tests/test_barmm_parliamentary_election_bb.py')
          text = bb.read_text(encoding='utf-8')
          old = '''    @classmethod
              def setUpClass(cls) -> None:
                  cls.plan = json.loads(apply_bb.PLAN_PATH.read_text(encoding="utf-8"))
                  cls.target = apply_bb.simulate(cls.plan, "2026-09-06T21:30:00+10:00")
                  cls.pre_canonical = apply_bb.load(apply_bb.CANONICAL_PATH)
                  cls.pre_sources = apply_bb.load(apply_bb.SOURCES_PATH)
                  cls.pre_ledger = apply_bb.load(apply_bb.LEDGER_PATH)
                  cls.pre_overlay = apply_bb.load(apply_bb.OVERLAY_PATH)
          '''
          new = '''    @classmethod
              def setUpClass(cls) -> None:
                  cls.plan = json.loads(apply_bb.PLAN_PATH.read_text(encoding="utf-8"))
                  canonical = apply_bb.load(apply_bb.CANONICAL_PATH)
                  sources = apply_bb.load(apply_bb.SOURCES_PATH)
                  ledger = apply_bb.load(apply_bb.LEDGER_PATH)
                  overlay = apply_bb.load(apply_bb.OVERLAY_PATH)

                  if canonical.get("version") == "0.38" and canonical.get("record_count") == 688:
                      cls.target = apply_bb.simulate(cls.plan, "2026-09-06T21:30:00+10:00")
                      cls.pre_canonical = canonical
                      cls.pre_sources = sources
                      cls.pre_ledger = ledger
                      cls.pre_overlay = overlay
                  elif canonical.get("version") == "0.39" and canonical.get("record_count") == 689:
                      cls.target = {
                          "canonical": canonical,
                          "sources": sources,
                          "ledger": ledger,
                          "overlay": overlay,
                          "status": apply_bb.STATUS_PATH.read_text(encoding="utf-8"),
                          "roadmap": apply_bb.ROADMAP_PATH.read_text(encoding="utf-8"),
                      }
                      cls.pre_canonical = {"records": canonical["records"][:-1]}
                      cls.pre_sources = {"sources": sources["sources"][:-1]}
                      cls.pre_ledger = {"changes": ledger["changes"][:-1]}
                      cls.pre_overlay = dict(overlay)
                      cls.pre_overlay["version"] = "0.13"
                      cls.pre_overlay["canonical_checkpoint"] = {
                          "registry_version": "0.38",
                          "record_count": 688,
                      }
                      apply_bb.assert_target(cls.plan, cls.target)
                  else:
                      raise RuntimeError(
                          f"BB tests require exact prestate v0.38/688 or reviewed poststate v0.39/689; got {canonical.get('version')}/{canonical.get('record_count')}"
                      )
          '''
          if old not in text:
              raise SystemExit('BB dual-state setup repair target drift')
          bb.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate repaired tests on exact prestate
        run: |
          set -euo pipefail
          python -m unittest tests.test_analysis_revision_contract_ba tests.test_barmm_parliamentary_election_bb -v
          python scripts/apply_barmm_parliamentary_election_bb.py --check-only

      - name: Materialise BB ephemerally and validate poststate tests
        env:
          WORLD_SIGNALS_BB_ALLOW_WRITE: '1'
        run: |
          set -euo pipefail
          python scripts/apply_barmm_parliamentary_election_bb.py --apply
          python -m unittest tests.test_analysis_revision_contract_ba tests.test_barmm_parliamentary_election_bb -v

      - name: Prove replay remains blocked
        env:
          WORLD_SIGNALS_BB_ALLOW_WRITE: '1'
        run: |
          set -euo pipefail
          if python scripts/apply_barmm_parliamentary_election_bb.py --apply > /tmp/replay.out 2>&1; then
            cat /tmp/replay.out
            echo 'BB replay unexpectedly succeeded'
            exit 1
          fi
          grep -q 'BB Canonical version drift' /tmp/replay.out

      - name: Restore ephemeral governed files
        if: always()
        run: |
          git checkout -- PROJECT_STATUS.md ROADMAP.md data/canonical/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json data/sources/registry.json || true
          rm -rf docs

      - name: Commit only test repairs and self-remove
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_analysis_revision_contract_ba.py tests/test_barmm_parliamentary_election_bb.py
          git diff --cached --name-only | sort > /tmp/actual
          printf '%s\n' tests/test_analysis_revision_contract_ba.py tests/test_barmm_parliamentary_election_bb.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "BB: make BA and BB tests descendant-safe"
          git rm .github/workflows/bb-dual-state-test-repair.yml
          git commit -m "BB: remove temporary dual-state test repair"
          git push origin HEAD:feature/post-ba-barmm-election-anchor-bb
