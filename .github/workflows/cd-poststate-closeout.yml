name: CD poststate closeout

on:
  push:
    branches:
      - feature/post-cc-pressure-audit-cd
    paths:
      - '.github/workflows/cd-poststate-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Assert materialised CD poststate
        run: |
          test "$(git rev-parse origin/main)" = "c186835d9d6b36620177badfff604f309ceb35d4"
          git merge-base --is-ancestor a954f29262144b7ccb29db35cad89808e9e4d4b7 HEAD
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'src')
          from world_signals.analysis_revision import production_analysis_revision_count
          from world_signals.live_analysis_bridge import production_live_input_count
          load=lambda p: json.loads(Path(p).read_text())
          c=load('data/canonical/registry.json'); s=load('data/sources/registry.json'); m=load('data/monitor/expectations.json')
          ls=load('data/live_intelligence/schema.json'); lo=load('data/live_intelligence/observations.json'); le=load('data/live_intelligence/evidence_registry.json')
          a=load('data/analysis/schema.json'); r=load('data/analysis/event_reviews.json'); e=load('data/analysis/evidence_registry.json')
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('2.02',257)
          assert (m['version'],len(m['adapters']))==('0.27',25)
          assert m['automatic_canonical_commit'] is False and m['google_calendar_write'] is False
          assert (ls['version'],len(lo['observations']),len(le['evidence']))==('0.6',6,9)
          assert a['version']=='0.8' and (r['version'],len(r['reviews']))==('0.18',22) and (e['version'],len(e['evidence']))==('0.18',97)
          assert production_analysis_revision_count(r)==1 and production_live_input_count(r)==1
          p=a['analysis_revision_policy']
          assert p['maximum_production_analysis_revisions']==1 and p['maximum_children_per_revision_parent']==1
          assert p['public_revision_metadata_projection_allowed'] is False
          assert p['automatic_latest_analysis_selection_allowed'] is False
          assert p['public_revision_head_collapse_allowed'] is False
          print('CD_POSTSTATE_EXACT_PASS')
          PY

      - name: Re-prove immutable parent population and public boundary
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'src')
          from world_signals.analysis_revision import REVISION_FIELDS
          from world_signals.analysis_revision_projection import public_analysis_projection_with_revision_contract
          base='c186835d9d6b36620177badfff604f309ceb35d4'
          old_r=json.loads(subprocess.check_output(['git','show',f'{base}:data/analysis/event_reviews.json']))
          new_r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          old_by={x['analysis_id']:x for x in old_r['reviews']}; new_by={x['analysis_id']:x for x in new_r['reviews']}
          assert len(old_by)==21 and set(new_by)-set(old_by)=={'WSAN-BWC-WG8-2026-002'}
          assert all(new_by[k]==v for k,v in old_by.items())
          old_e=json.loads(subprocess.check_output(['git','show',f'{base}:data/analysis/evidence_registry.json']))
          new_e=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          old_ev={x['evidence_id']:x for x in old_e['evidence']}; new_ev={x['evidence_id']:x for x in new_e['evidence']}
          assert len(old_ev)==95
          assert set(new_ev)-set(old_ev)=={'WSEV-BWC-WG9-UN-INDICO-20260817','WSEV-BWC-WG9-SHIB-REV7-20260827'}
          assert all(new_ev[k]==v for k,v in old_ev.items())
          schema=json.loads(Path('data/analysis/schema.json').read_text()); canonical=json.loads(Path('data/canonical/registry.json').read_text())
          projection=public_analysis_projection_with_revision_contract(schema,new_e,new_r,canonical)
          by_id={x['analysis_id']:x for x in projection['reviews']}
          assert 'WSAN-BWC-WG8-2026-001' in by_id and 'WSAN-BWC-WG8-2026-002' in by_id
          assert all(f not in by_id['WSAN-BWC-WG8-2026-002'] for f in REVISION_FIELDS)
          md=projection['metadata']
          assert md['public_revision_metadata_projection_allowed'] is False
          assert md['automatic_latest_analysis_selection_allowed'] is False
          assert md['derived_revision_head_projection_allowed'] is False
          print('CD_IMMUTABILITY_AND_PUBLIC_BOUNDARY_PASS')
          PY

      - name: Ordinary full repository validation
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q scripts src tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py

      - name: Protected-layer diff audit
        run: |
          base=c186835d9d6b36620177badfff604f309ceb35d4
          git diff --exit-code "$base"..HEAD -- data/canonical data/sources data/monitor data/changes data/live_intelligence
          python - <<'PY'
          import subprocess
          base='c186835d9d6b36620177badfff604f309ceb35d4'
          out=subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines()
          forbidden=[p for p in out if p.startswith(('data/canonical/','data/sources/','data/monitor/','data/changes/','data/live_intelligence/'))]
          assert not forbidden, forbidden
          print({'changed_file_count_before_cleanup':len(out),'protected_layer_changes':forbidden})
          PY

      - name: Record audit and remove all temporary CD workflows
        env:
          MATERIALISATION_RUN_ID: '34326983574'
          MATERIALISATION_JOB_ID: '102386403830'
          FIRST_CLOSEOUT_RUN_ID: '34332089238'
        run: |
          cat > data/analysis/BWC_WG8_FIRST_ANALYSIS_REVISION_CD_TRANSACTION_AUDIT_v0.1.md <<EOF
          # WORLD SIGNALS — CD first controlled Analysis revision transaction audit v0.1

          ## Boundary
          - Tranche: CD
          - Exact merged base: \`c186835d9d6b36620177badfff604f309ceb35d4\` (post-CC / PR #111)
          - Guarded materialisation commit: \`a954f29262144b7ccb29db35cad89808e9e4d4b7\`
          - Successful materialisation run/job: \`${MATERIALISATION_RUN_ID}\` / \`${MATERIALISATION_JOB_ID}\`
          - First closeout run: \`${FIRST_CLOSEOUT_RUN_ID}\` (semantic checks passed; broad Markdown whitespace check failed before cleanup)
          - Successful closeout run: \`${GITHUB_RUN_ID}\`

          ## Architectural decision
          Post-CC pressure recomputation showed Monitor was no longer the thinnest layer: 25 configured routes covered 215 Canonical occurrences across all nine regions, while Analysis had 21 reviewed snapshots and zero production revision descendants. CD therefore exercised the existing controlled revision contract rather than quota-filling another monitor category.

          ## Production revision
          \`WSAN-BWC-WG8-2026-002\` is a \`NEW_EVIDENCE\` child of \`WSAN-BWC-WG8-2026-001\`, bound to the same Canonical occurrence \`WSO-BWC-WG-2026-S08\`. Newly admitted ninth-session BWC evidence changes the second-order process assessment from \`PLAUSIBLE_WATCH_ITEM\` to \`OBSERVED\` institutional follow-through. It does not establish final substantive consensus, market movement, or event causality.

          New Analysis-only evidence:
          - \`WSEV-BWC-WG9-UN-INDICO-20260817\` — primary official ninth-session evidence;
          - \`WSEV-BWC-WG9-SHIB-REV7-20260827\` — institutional catalogue evidence used only for document-process observation, not PDF-body inference.
          Neither has Canonical provenance effect.

          ## Governed post-state
          - Canonical \`v0.41 / 689\` unchanged
          - Sources \`v2.02 / 257\` unchanged
          - Monitor \`v0.27 / 25\` unchanged; automatic Canonical commit OFF; Google Calendar write OFF
          - Live Intelligence \`v0.6 / 6 observations / 9 evidence\` unchanged
          - Analysis schema \`0.7 → 0.8\`
          - Analysis reviews \`0.17 / 21 → 0.18 / 22\`
          - Analysis evidence \`0.17 / 95 → 0.18 / 97\`
          - Production Analysis revisions \`0 → 1\`
          - Production Live→Analysis inputs remains exactly \`1\`
          - Revision ceiling: one production revision, one child per parent; public lineage metadata OFF; automatic latest-head selection OFF; public revision-head collapse OFF.

          ## Immutability and projection proof
          Closeout proved all 21 pre-existing review objects and all 95 pre-existing Analysis evidence objects are unchanged from the exact merged base. Only one review and two Analysis evidence objects were appended. Canonical, Sources, Monitor, Changes and Live Intelligence are unchanged. Public projection preserves both analytical snapshots while stripping revision-lineage metadata and deriving no latest head.

          ## Preserved failure history
          The first guarded materialisation attempt exposed six historical tests that had incorrectly treated Analysis \`0.17 / 21\` as a permanent ceiling; commit was gated off. Those tests were repaired only for descendant safety. A later guarded run \`34326705152\` exposed one CD-only test replaying the deliberately one-shot simulator after in-job materialisation; commit was again gated off. The final repair compares protected files to the exact post-CC base instead of replaying the transaction. Successful run \`${MATERIALISATION_RUN_ID}\` then passed the exact pre/post-state gates, full suite, protected-layer audit and commit gate.

          First closeout run \`${FIRST_CLOSEOUT_RUN_ID}\` passed exact post-state, immutability, public-boundary and full repository validation, then stopped because \`git diff --check\` treated intentional two-space Markdown hard breaks in the permanent research note as trailing-whitespace errors. No audit or cleanup commit occurred. The closeout harness was narrowed to semantic protected-path checks; the research document was not altered to satisfy the harness.

          ## Validation
          Successful materialisation and closeout each validated Canonical 689, Live Intelligence 0.6 / 6 / 9, Analysis 22 / 97, the Live→Analysis bridge and revision contract, 1,206 unit tests with 68 skips and no failures, Python compilation, JavaScript syntax and the static site build.

          Google Calendar remains an output/interface layer only. No automatic Canonical mutation, automatic Analysis-head selection, or auto-merge capability was enabled.
          EOF

          rm -f .github/workflows/cd-*.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'cd-*' -print -quit)"
          git diff --check

      - name: Commit closeout only after all gates pass
        run: |
          git config user.name 'WORLD SIGNALS automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows data/analysis/BWC_WG8_FIRST_ANALYSIS_REVISION_CD_TRANSACTION_AUDIT_v0.1.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'CD: record poststate audit and remove temporary workflows'
          git push origin HEAD:feature/post-cc-pressure-audit-cd
          echo CD_POSTSTATE_CLOSEOUT_COMMITTED
