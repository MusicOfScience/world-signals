name: BX NBS RSS one-request structure diagnostic

on:
  push:
    branches:
      - feature/post-bw-pressure-audit-bx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact post-BW ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE=29b71bea42610992ad073b1583be64ced7e5de81
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test -z "$(git status --porcelain)"
      - name: Fetch exactly one NBS RSS response and diagnose item-fragment structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEED='https://www.stats.gov.cn/english/PressRelease/rss.xml'
          UA='WORLD-SIGNALS-read-only-research/0.1 (+one-request NBS RSS structure diagnostic)'
          req=urllib.request.Request(FEED,headers={
              'User-Agent':UA,
              'Accept':'application/rss+xml, application/xml, text/xml;q=1.0,*/*;q=0.1'
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read()
              meta={
                  'requested_url':FEED,'final_url':r.geturl(),'status':r.status,
                  'content_type':r.headers.get('Content-Type'),'bytes':len(body),
                  'sha256':hashlib.sha256(body).hexdigest(),
              }

          text=body.decode('utf-8','replace')
          lines=text.splitlines()
          item_open=len(re.findall(r'<item(?:\s[^>]*)?>',text,re.I))
          item_close=len(re.findall(r'</item\s*>',text,re.I))
          channel_open=len(re.findall(r'<channel(?:\s[^>]*)?>',text,re.I))
          channel_close=len(re.findall(r'</channel\s*>',text,re.I))
          rss_open=len(re.findall(r'<rss(?:\s[^>]*)?>',text,re.I))
          rss_close=len(re.findall(r'</rss\s*>',text,re.I))

          full_parse_error=None
          try:
              ET.fromstring(body)
          except Exception as exc:
              full_parse_error=repr(exc)

          frag_re=re.compile(r'<item(?:\s[^>]*)?>.*?</item\s*>',re.I|re.S)
          frags=list(frag_re.finditer(text))
          parsed=[]
          failures=[]
          child_contracts={}
          for idx,m in enumerate(frags):
              frag=m.group(0)
              try:
                  node=ET.fromstring(frag)
                  row={}
                  children=[]
                  for ch in list(node):
                      tag=ch.tag.split('}',1)[-1] if isinstance(ch.tag,str) else str(ch.tag)
                      children.append(tag)
                      if tag in ('title','link','pubDate','guid','description'):
                          row[tag]=(ch.text or '').strip() if ch.text else None
                  contract=tuple(children)
                  child_contracts[contract]=child_contracts.get(contract,0)+1
                  row['fragment_index']=idx
                  row['start_offset']=m.start()
                  row['end_offset']=m.end()
                  parsed.append(row)
              except Exception as exc:
                  failures.append({
                      'fragment_index':idx,'start_offset':m.start(),'end_offset':m.end(),
                      'error':repr(exc),'sha256':hashlib.sha256(frag.encode()).hexdigest(),
                      'prefix':re.sub(r'\s+',' ',frag[:180]),
                  })

          # Capture small sanitized context around the line identified by the strict parser.
          context=[]
          for lineno in range(max(1,6514-8),min(len(lines),6514+8)+1):
              val=lines[lineno-1]
              val=re.sub(r'\s+',' ',val)[:500]
              context.append({'line':lineno,'text':val})

          # Keep samples bounded. Ordering is source order only; no event inference.
          result={
              'tranche':'BX','feed_meta':meta,'full_parse_error':full_parse_error,
              'root_counts':{'rss_open':rss_open,'rss_close':rss_close,'channel_open':channel_open,'channel_close':channel_close},
              'item_counts':{'open':item_open,'close':item_close,'complete_regex_fragments':len(frags),'fragment_parse_success':len(parsed),'fragment_parse_failure':len(failures)},
              'child_contracts':[{'children':list(k),'count':v} for k,v in sorted(child_contracts.items(), key=lambda kv:(-kv[1],kv[0]))],
              'strict_error_context':context,
              'fragment_failures':failures[:20],
              'first_parsed_items':parsed[:12],
              'last_parsed_items':parsed[-12:],
          }
          Path('/tmp/bx-nbs-rss-structure.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')

          print('FEED_META',json.dumps(meta,sort_keys=True))
          print('FULL_PARSE_ERROR',full_parse_error)
          print('ROOT_COUNTS',json.dumps(result['root_counts'],sort_keys=True))
          print('ITEM_COUNTS',json.dumps(result['item_counts'],sort_keys=True))
          print('CHILD_CONTRACTS',json.dumps(result['child_contracts'][:12],ensure_ascii=False))
          print('STRICT_ERROR_CONTEXT',json.dumps(context,ensure_ascii=False))
          print('FRAGMENT_FAILURES',json.dumps(failures[:10],ensure_ascii=False))
          print('FIRST_ITEMS',json.dumps(parsed[:8],ensure_ascii=False))
          print('LAST_ITEMS',json.dumps(parsed[-8:],ensure_ascii=False))
          PY
          test -z "$(git status --porcelain)"
      - name: Upload structure evidence
        uses: actions/upload-artifact@v4
        with:
          name: bx-nbs-rss-structure-diagnostic
          path: /tmp/bx-nbs-rss-structure.json
          retention-days: 1
      - name: Prove repository remained byte-clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse origin/main)" = "29b71bea42610992ad073b1583be64ced7e5de81"
