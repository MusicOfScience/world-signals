name: WORLD SIGNALS AX current-state documentation refresh

on:
  push:
    branches:
      - feature/post-aw-pressure-audit-ax
    paths:
      - .github/workflows/tmp-live-intelligence-ax-docs-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact AX production state and apply documentation patch
        run: |
          python scripts/validate_live_intelligence.py
          python scripts/tmp_refresh_ax_current_docs.py
          git diff --check
      - name: Validate docs against executable state
        run: |
          grep -q 'Live Intelligence: \*\*v0.3 — 3 reviewed internal observations / 4 primary-official evidence rows' README.md
          grep -q 'Live Intelligence: \*\*v0.3 / 3 reviewed internal observations / 4 primary-official evidence rows' PROJECT_STATUS.md
          grep -q 'Live Intelligence `v0.3 / 3 internal observations / 4 evidence`' ARCHITECTURE.md
          grep -q 'state evolution is not revision' ROADMAP.md
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
      - name: Commit documentation and self-remove helpers
        run: |
          rm .github/workflows/tmp-live-intelligence-ax-docs-refresh.yml
          rm scripts/tmp_refresh_ax_current_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md ARCHITECTURE.md ROADMAP.md .github/workflows/tmp-live-intelligence-ax-docs-refresh.yml scripts/tmp_refresh_ax_current_docs.py
          git commit -m "AX: refresh current Live Intelligence documentation"
          git push
