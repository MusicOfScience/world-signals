name: TEMP analysis Q full validation
# validation attempt 2

on:
  push:
    branches:
      - feature/analysis-diversity-stress-test-q
    paths:
      - .github/workflows/_temp-analysis-q-introspect.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove protected upstream state is byte-identical to post-45 main
        shell: bash
        run: |
          set -euo pipefail
          BASE=444d0345446ce3852bca90f488ae187581163ace
          protected=(
            data/canonical/registry.json
            data/canonical/schema.json
            data/sources/registry.json
            data/monitor/expectations.json
            data/monitor/operations_policy.json
            data/changes/ledger.json
            data/coverage/biosecurity_overlay.json
          )
          for path in "${protected[@]}"; do
            git diff --exit-code "$BASE" HEAD -- "$path"
          done
      - name: Validate registry and analytical contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python surfaces
        run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/validate_analysis.py src/world_signals/analysis.py
      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Build static site and assert Q projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py
          test -f docs/data/analysis.json
          grep -q 'bundled source: web/analysis.js' docs/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/data/analysis.json').read_text())
          assert data['metadata']['schema_version']=='0.2'
          assert data['metadata']['review_dataset_version']=='0.2'
          assert data['metadata']['evidence_registry_version']=='0.2'
          assert data['metadata']['review_count']==2
          assert data['metadata']['canonical_mutation_allowed'] is False
          assert data['metadata']['google_calendar_write'] is False
          assert data['metadata']['population_readiness_is_descriptive_not_population_authority'] is True
          by_id={r['analysis_id']:r for r in data['reviews']}
          assert set(by_id)=={'WSAN-AU-GDP-2026Q2-001','WSAN-NZ-OCR-20260902-001'}
          nz=by_id['WSAN-NZ-OCR-20260902-001']
          assert nz['canonical_occurrence_id']=='WSO-8df73c7804d45880'
          assert nz['canonical']['event_type']=='DECISION'
          assert nz['canonical']['lifecycle_status']=='COMPLETED'
          assert nz['what_appears_connected']['causal_status']=='OBSERVED_ASSOCIATION'
          assert nz['second_order_effects']['status']=='NOT_ESTABLISHED'
          assert all(m['movement_representation']=='CHANGE_AND_ENDPOINT' for m in nz['what_moved'])
          assert all(m['before_value'] is None for m in nz['what_moved'])
          ready=data['readiness']
          assert ready['reviewed_occurrence_count']==2
          assert ready['reviewed_event_type_diversity']==2
          assert ready['reviewed_by_event_type']['DATA_RELEASE']==1
          assert ready['reviewed_by_event_type']['DECISION']==1
          assert ready['elapsed_date_never_implies_completion'] is True
          assert ready['missing_historical_anchor_never_authorizes_synthetic_occurrence'] is True
          print(json.dumps(ready, indent=2, sort_keys=True))
          PY
