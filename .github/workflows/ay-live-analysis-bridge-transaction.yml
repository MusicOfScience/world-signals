name: AY Live-to-Analysis bridge transaction

on:
  push:
    branches: [feature/post-ax-live-analysis-bridge-ay]

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact ancestry and reviewed prestate
        shell: bash
        run: |
          set -euo pipefail
          BASE=0a7608ab56116d0f65ffd1492a3da87bcbf35f47
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python scripts/apply_live_analysis_bridge_ay.py --check-only
          python scripts/apply_ak_descendant_repair_ay.py --check-only
      - name: Apply reviewed AY target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_live_analysis_bridge_ay.py --apply
          python scripts/apply_ak_descendant_repair_ay.py --apply
      - name: Run exhaustive repository validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/apply_live_analysis_bridge_ay.py \
            scripts/apply_ak_descendant_repair_ay.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/live_analysis_bridge.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Prove governed target state and protected immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          ROOT=Path('.')
          sys.path.insert(0, str(ROOT/'src'))
          from world_signals.live_analysis_bridge import production_live_input_count
          def load(p): return json.loads((ROOT/p).read_text())
          schema=load('data/analysis/schema.json')
          reviews=load('data/analysis/event_reviews.json')
          evidence=load('data/analysis/evidence_registry.json')
          live=load('data/live_intelligence/observations.json')
          live_ev=load('data/live_intelligence/evidence_registry.json')
          canonical=load('data/canonical/registry.json')
          assert schema['version']=='0.5'
          policy=schema['live_input_policy']
          assert policy['mode']=='FOUNDATION_ONLY_NO_PRODUCTION_LINKS'
          assert policy['production_live_inputs_allowed'] is False
          assert policy['public_live_input_projection_allowed'] is False
          assert len(reviews['reviews'])==20 and reviews['version']=='0.16'
          assert len(evidence['evidence'])==91 and evidence['version']=='0.16'
          assert len(live['observations'])==3
          assert len(live_ev['evidence'])==4
          assert canonical['version']=='0.38' and len(canonical['records'])==688
          assert production_live_input_count(reviews)==0
          exact=sum(1 for r in reviews['reviews'] for m in (r.get('what_moved') or []) if m.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES')
          assert exact==0
          PY
          for p in \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json; do
              test "$(git show HEAD:"$p" | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$p" | cut -d' ' -f1)"
          done
      - name: Write transaction audit
        shell: bash
        run: |
          set -euo pipefail
          PRE_TX_HEAD=$(git rev-parse HEAD)
          cat > data/analysis/LIVE_ANALYSIS_BRIDGE_AY_TRANSACTION_AUDIT_v0.1.md <<'EOF'
          # WORLD SIGNALS — Live Intelligence → Analysis bridge AY transaction audit v0.1

          **Reference date:** 2026-09-06  
          **Exact base main:** `0a7608ab56116d0f65ffd1492a3da87bcbf35f47`  
          **Transaction-start branch head:** `__PRE_TX_HEAD__`  
          **Transaction workflow run:** `__RUN_ID__`

          ## Decision

          AY establishes the prospective Live Intelligence → Analysis input grammar while keeping production linkage closed. It does not add a Live observation, Analysis review, Analysis evidence row, Canonical occurrence, source, monitor adapter or market series.

          ## Preflight history

          - Initial read-only preflight run `34021514723` failed closed only after ephemeral Analysis schema v0.5 exposed a stale AK live-descendant ceiling assertion.
          - `EXACT_MARKET_MEASUREMENT_CONTRACT_AK_PLAN_v0.1.json` already records the same project rule: freeze the historical contract checkpoint, not legitimate later descendants.
          - The narrow repair preserves AK's exact historical v0.3 → v0.4 transform path and every exact-market invariant; it merely exercises AK against unmodified live schemas v0.4 or later instead of treating v0.4 as a permanent maximum.
          - Repaired read-only preflight run `34021715088` passed exact ancestry, untouched-descendant validation, ephemeral AY materialisation, the full suite, Python compilation, browser JavaScript checks, static build, exact mutation-boundary proof, protected-data proof, restoration and workflow self-removal.

          ## Materialised target

          - Analysis schema: `v0.5`.
          - Analysis reviews: `v0.16 / 20` unchanged.
          - Analysis evidence: `v0.16 / 91` unchanged.
          - Live Intelligence: schema `v0.3 / 3 observations / 4 evidence` unchanged.
          - Canonical Registry: `v0.38 / 688` unchanged.
          - production `live_inputs`: exactly `0`.
          - production `EXACT_TIMESTAMP_SERIES`: exactly `0`.
          - public Live-input projection: closed.
          - automatic story expansion / latest-state selection: prohibited.

          ## Bridge invariants validated

          1. Selection is by immutable Live `observation_id`, not `story_id`, `latest` or automatic story expansion.
          2. Live inputs are distinct from Analysis evidence; Live evidence is not transitively migrated.
          3. Analysis may not mutate or revise upstream Live observations through the relationship.
          4. Analysis as-of time may not predate the selected Live observation's WORLD SIGNALS observation time.
          5. One Live observation may support multiple analyses.
          6. Evolving stories remain snapshot-specific; history requires explicit observation IDs.
          7. Production population and public projection remain closed pending a later pressure audit.

          ## Exact transaction mutation boundary

          Existing files materialised by the controlled transaction:

          - `.github/workflows/ci.yml`
          - `PROJECT_STATUS.md`
          - `ROADMAP.md`
          - `data/analysis/schema.json`
          - `scripts/build_site.py`
          - `scripts/validate_analysis.py`
          - `tests/test_exact_market_measurement_contract_ak.py`

          This transaction audit is the only new permanent file created by the transaction itself. AY planning, bridge implementation, deterministic helpers and regressions were already committed on the tranche branch before the controlled write.

          ## Protected datasets

          SHA-256 equality against the transaction-start branch state was proved for Canonical registry/schema, Source Registry, Change Ledger, monitor expectations/operations policy, all Live Intelligence governed data/schema, and Analysis reviews/evidence. No protected governed dataset changed.

          ## Validation

          The controlled target passed the registry, Live Intelligence and Analysis validators; full repository unittest discovery; Python compilation; standing browser JavaScript checks; static-site build; exact target-state assertions; the exact-series zero invariant; the zero-production-Live-input invariant; and protected-dataset hash equality.

          The temporary transaction workflow removes itself after committing the reviewed target. Ordinary pull-request CI remains a separate post-transaction validation gate. Manual merge remains required.
          EOF
          sed -i "s/__PRE_TX_HEAD__/$PRE_TX_HEAD/" data/analysis/LIVE_ANALYSIS_BRIDGE_AY_TRANSACTION_AUDIT_v0.1.md
          sed -i "s/__RUN_ID__/$GITHUB_RUN_ID/" data/analysis/LIVE_ANALYSIS_BRIDGE_AY_TRANSACTION_AUDIT_v0.1.md
      - name: Prove exact staged mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/workflows/ci.yml \
            PROJECT_STATUS.md \
            ROADMAP.md \
            data/analysis/schema.json \
            scripts/build_site.py \
            scripts/validate_analysis.py \
            tests/test_exact_market_measurement_contract_ak.py \
            data/analysis/LIVE_ANALYSIS_BRIDGE_AY_TRANSACTION_AUDIT_v0.1.md
          cat > /tmp/expected <<'EOF'
          .github/workflows/ci.yml
          PROJECT_STATUS.md
          ROADMAP.md
          data/analysis/LIVE_ANALYSIS_BRIDGE_AY_TRANSACTION_AUDIT_v0.1.md
          data/analysis/schema.json
          scripts/build_site.py
          scripts/validate_analysis.py
          tests/test_exact_market_measurement_contract_ak.py
          EOF
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test -z "$(git status --porcelain | grep '^??' || true)"
      - name: Commit reviewed target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AY: establish production-closed Live-to-Analysis bridge"
      - name: Self-remove transaction workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ay-live-analysis-bridge-transaction.yml
          git commit -m "AY: remove temporary bridge transaction workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
