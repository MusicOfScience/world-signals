name: WORLD SIGNALS AW Live Intelligence Nepal preflight v2

on:
  push:
    branches:
      - feature/post-av-pressure-audit-aw
    paths:
      - .github/workflows/tmp-live-intelligence-aw-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-77 ancestry and workflow hygiene
        run: |
          BASE=4768c73532c4ba4038b30314079b85be64fbee01
          test "$(git merge-base HEAD $BASE)" = "$BASE"
          test "$(find .github/workflows -maxdepth 1 -type f -name 'tmp-*' | wc -l)" -eq 1
          test ! -e scripts/tmp_patch_live_intelligence_aw.py
          test ! -e scripts/tmp_patch_av_descendant_aw.py
          git diff --check $BASE..HEAD
      - name: Prove protected upstream and Live production data unchanged before transaction
        run: |
          BASE=4768c73532c4ba4038b30314079b85be64fbee01
          for path in \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            data/live_intelligence/schema.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json; do
              git diff --exit-code $BASE..HEAD -- "$path"
          done
      - name: Validate untouched production pre-state
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
      - name: Prove guarded write fails closed without explicit environment gate
        run: |
          if python scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py --write > /tmp/aw-blocked.txt 2>&1; then
            cat /tmp/aw-blocked.txt
            exit 1
          fi
          grep -q 'WORLD_SIGNALS_APPLY_LIVE_INTELLIGENCE_AW=1' /tmp/aw-blocked.txt
          git diff --exit-code
      - name: Run read-only AW target simulation
        run: python scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py
      - name: Run AV descendant and AW specimen regressions on pre-state
        run: |
          python -m unittest tests.test_live_intelligence_foundation_av -v
          python -m unittest tests.test_nepal_rasuwa_flood_live_intelligence_aw -v
      - name: Run full repository suite on untouched pre-state
        run: python -m unittest discover -s tests -v
      - name: Compile Python and check browser JavaScript
        run: |
          python -m py_compile scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py scripts/validate_live_intelligence.py src/world_signals/live_intelligence.py scripts/build_site.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
      - name: Materialize target locally and validate v0.2
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/apply_nepal_rasuwa_flood_live_intelligence_aw.py')
          spec=importlib.util.spec_from_file_location('aw',p)
          aw=importlib.util.module_from_spec(spec); spec.loader.exec_module(aw)
          plan=aw.load(aw.PLAN_PATH); payload=aw.load(aw.PAYLOAD_PATH)
          schema, observations, evidence=aw.transform(plan,payload)
          aw.write(aw.LIVE_SCHEMA_PATH,schema)
          aw.write(aw.LIVE_OBSERVATIONS_PATH,observations)
          aw.write(aw.LIVE_EVIDENCE_PATH,evidence)
          PY
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest tests.test_live_intelligence_foundation_av -v
          python -m unittest tests.test_nepal_rasuwa_flood_live_intelligence_aw -v
          python -m unittest discover -s tests -v
      - name: Build ephemeral target and prove private curated-store projection
        run: |
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('docs/data/live_intelligence.json').read_text())
          meta=live['metadata']
          assert meta['projection_type']=='LIVE_INTELLIGENCE_CURATED_STORE_NOT_RUNTIME_FEED', meta
          assert meta['schema_version']=='0.2', meta
          assert meta['population_state']=='CONTROLLED_SINGLE_SPECIMEN', meta
          assert meta['population_mode']=='CONTROLLED_SINGLE_SPECIMEN', meta
          assert meta['internal_observation_count']==1, meta
          assert meta['internal_evidence_count']==2, meta
          assert meta['public_observation_count']==0, meta
          assert meta['canonical_registry_version_at_build']=='0.38', meta
          assert meta['canonical_record_count_at_build']==688, meta
          assert meta['runtime_feed_claim'] is False, meta
          assert live['observations']==[], live
          summary=json.loads(Path('docs/data/source_summary.json').read_text())
          assert summary['live_intelligence_schema_version']=='0.2', summary
          assert summary['live_intelligence_population_state']=='CONTROLLED_SINGLE_SPECIMEN', summary
          assert summary['live_intelligence_internal_observation_count']==1, summary
          assert summary['live_intelligence_public_observation_count']==0, summary
          assert summary['analysis_review_count']==20, summary
          print('AW ephemeral target build proof PASS')
          PY
      - name: Restore pre-state and prove read-only cleanliness
        run: |
          git checkout -- data/live_intelligence/schema.json data/live_intelligence/observations.json data/live_intelligence/evidence_registry.json
          git diff --exit-code
          git status --porcelain --untracked-files=no
