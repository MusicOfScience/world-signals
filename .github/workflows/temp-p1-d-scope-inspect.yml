name: TEMP P1 D scope inspect
on:
  push:
    paths:
      - '.github/workflows/temp-p1-d-scope-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print selected source records and dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids=['WSSRC-RISK-002','WSSRC-COM-009','WSSRC-COM-008','WSSRC-INT-013','WSSRC-HEALTH-002','WSSRC-TRD-002','WSSRC-REG2-003','WSSRC-EL-VIC-001','WSSRC-TECH-002']
          src=json.loads(Path('data/sources/registry.json').read_text())
          can=json.loads(Path('data/canonical/registry.json').read_text())
          sm={r['source_id']:r for r in src['sources']}
          for sid in ids:
              print('SOURCE',sid)
              print(json.dumps(sm.get(sid),ensure_ascii=False,sort_keys=True))
              for r in can['records']:
                  if r.get('source_id')==sid:
                      print('DEP',json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
