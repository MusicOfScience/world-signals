name: BY NZ election read-only RSS discovery

on:
  push:
    branches:
      - feature/post-bx-pressure-audit-by
    paths:
      - .github/workflows/by-nz-election-rss-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and inspect repository contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=a3bca03f36eb5af9036017aad926f75f6762267f
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          sid='WSSRC-EL-NZ-001'
          sources=json.loads(Path('data/sources/registry.json').read_text())
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          src=[s for s in sources['sources'] if s.get('source_id')==sid]
          assert len(src)==1
          rows=[r for r in canonical['records'] if r.get('source_id')==sid]
          assert len(rows)==6
          out={
              'baseline':BASE if False else 'a3bca03f36eb5af9036017aad926f75f6762267f',
              'source':src[0],
              'canonical_occurrences':sorted(rows,key=lambda r:(r.get('start_local') or '',r.get('occurrence_id') or '')),
              'existing_routes_for_source':[a for a in monitor['adapters'] if a.get('source_id')==sid or a.get('canonical_schedule_source_id')==sid],
              'governed_baseline':{
                  'canonical':[canonical['version'],len(canonical['records'])],
                  'sources':[sources['version'],len(sources['sources'])],
                  'monitor':[monitor['version'],len(monitor['adapters'])],
                  'automatic_canonical_commit':monitor['automatic_canonical_commit'],
                  'google_calendar_write':monitor['google_calendar_write'],
              }
          }
          Path(os.environ['RUNNER_TEMP'],'by-nz-election-contract.json').write_text(json.dumps(out,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          PY
      - name: Execute exactly two first-party discovery requests
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/by-nz-election"
          mkdir -p "$TMP"
          UA='WORLD-SIGNALS/0.1 (+read-only Electoral Commission NZ source review)'
          curl --silent --show-error --max-redirs 0 -A "$UA" -D "$TMP/robots.headers" -o "$TMP/robots.body" -w '%{http_code}|%{content_type}|%{url_effective}\n' 'https://elections.nz/robots.txt' > "$TMP/robots.meta"
          curl --silent --show-error --max-redirs 0 -A "$UA" -D "$TMP/media.headers" -o "$TMP/media.body" -w '%{http_code}|%{content_type}|%{url_effective}\n' 'https://elections.nz/media-and-news' > "$TMP/media.meta"
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.robotparser import RobotFileParser

          root=Path(os.environ['RUNNER_TEMP'])/'by-nz-election'
          def meta(name):
              raw=(root/f'{name}.meta').read_text(errors='replace').strip(); p=raw.split('|',2)
              return {'raw':raw,'status':int(p[0]),'content_type':p[1],'effective_url':p[2]}
          rb=(root/'robots.body').read_bytes(); mb=(root/'media.body').read_bytes()
          rm=meta('robots'); mm=meta('media')
          text=mb.decode('utf-8','replace')
          candidates=[]
          patterns=[
              r'<link[^>]+(?:type=["\']application/(?:rss|atom)\+xml["\']|rel=["\'][^"\']*alternate[^"\']*["\'])[^>]+href=["\']([^"\']+)["\']',
              r'<a[^>]+href=["\']([^"\']*(?:rss|feed)[^"\']*)["\'][^>]*>',
              r'href=["\']([^"\']+)["\'][^>]+type=["\']application/(?:rss|atom)\+xml["\']',
          ]
          for pat in patterns:
              for hit in re.findall(pat,text,flags=re.I):
                  u=urljoin('https://elections.nz/media-and-news',hit)
                  if u not in candidates: candidates.append(u)
          # Also record literal URL-like strings containing rss/feed from first-party HTML without fetching them.
          for hit in re.findall(r'https?://[^"\'<>\s]+',text):
              if 'elections.nz' in hit and any(k in hit.lower() for k in ('rss','feed')) and hit not in candidates:
                  candidates.append(hit)

          robots_state='UNRESOLVED'
          robots_allows_media=None
          if rm['status']==200:
              rt=rb.decode('utf-8','replace')
              if re.search(r'(?im)^\s*user-agent\s*:',rt):
                  rp=RobotFileParser(); rp.parse(rt.splitlines())
                  robots_allows_media=rp.can_fetch('*','https://elections.nz/media-and-news')
                  robots_state='VALID_POLICY_ALLOW_MEDIA' if robots_allows_media else 'VALID_POLICY_DISALLOW_MEDIA'
              else:
                  robots_state='HTTP_200_NON_ROBOTS_BODY'
          result={
              'request_count':2,
              'followup_request_count':0,
              'robots':{**rm,'bytes':len(rb),'sha256':hashlib.sha256(rb).hexdigest(),'state':robots_state,'allows_media_path':robots_allows_media,'prefix':rb[:300].decode('utf-8','replace')},
              'media':{**mm,'bytes':len(mb),'sha256':hashlib.sha256(mb).hexdigest(),'has_media_news_heading':'Media & news' in text,'rss_or_feed_candidates':candidates[:20],'rss_candidate_count':len(candidates),'prefix':mb[:400].decode('utf-8','replace')},
              'permission_inference':{'robots_is_not_reuse_licence':True,'public_html_is_not_automation_grant':True,'rss_if_advertised_requires_separate_endpoint_validation':True},
              'repository_mutation':False,
          }
          Path(os.environ['RUNNER_TEMP'],'by-nz-election-rss-discovery.json').write_text(json.dumps(result,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Prove repository remains read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: by-nz-election-rss-discovery
          path: |
            ${{ runner.temp }}/by-nz-election-contract.json
            ${{ runner.temp }}/by-nz-election-rss-discovery.json
          if-no-files-found: error
          retention-days: 1
