name: Diagnose WORLD SIGNALS biosecurity taxonomy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/biosecurity-taxonomy-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Inspect canonical health and adjacent institutional holdings
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          registry=json.load(open('data/canonical/registry.json',encoding='utf-8'))
          records=registry['records']
          health=[r for r in records if r.get('category')=='HEALTH_BIOSECURITY']
          print('CANONICAL',registry.get('version'),len(records))
          print('HEALTH_BIOSECURITY',len(health),'occurrences')
          by_series=defaultdict(list)
          for record in health:
              by_series[record.get('series_id')].append(record)
          for series_id,items in sorted(by_series.items()):
              sample=items[0]
              print('SERIES',series_id,'|',sample.get('institution'),'|',sample.get('subcategory'),'|',sample.get('event_type'),'|',len(items))
              print('  fields',{
                  'health_process_type':sample.get('health_process_type'),
                  'health_security_relevance':sample.get('health_security_relevance'),
                  'governance_aliases':sample.get('governance_aliases'),
                  'pandemic_agreement_component':sample.get('pandemic_agreement_component'),
                  'health_emergency_routing':sample.get('health_emergency_routing'),
              })
          print('CATEGORIES',sorted({r.get('category') for r in records if r.get('category')}))
          needles=('World Organisation for Animal Health','WOAH','International Plant Protection Convention','Commission on Phytosanitary Measures','Biological Weapons Convention','UNODA','Africa CDC','One Health')
          for record in records:
              hay=' '.join(str(record.get(k) or '') for k in ('canonical_name','institution','notes','subcategory'))
              if any(needle.lower() in hay.lower() for needle in needles):
                  print('ADJACENT',record.get('occurrence_id'),'|',record.get('series_id'),'|',record.get('category'),'|',record.get('institution'),'|',record.get('canonical_name'))
          PY
