name: BX one-shot source ID collision correction

on:
  push:
    branches:
      - feature/post-bw-pressure-audit-bx
    paths:
      - .github/workflows/bx-source-id-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact post-BW ancestry and collision facts
        shell: bash
        run: |
          set -euo pipefail
          BASE=29b71bea42610992ad073b1583be64ced7e5de81
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/sources/registry.json').read_text())
          old=[x for x in data['sources'] if x.get('source_id')=='WSSRC-MAC-026']
          new=[x for x in data['sources'] if x.get('source_id')=='WSSRC-MAC-031']
          assert len(old)==1 and old[0].get('institution')=='Bank of Japan', old
          assert new==[], new
          PY

      - name: Correct BX machine source identity in ordinary files only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths=[
              Path('data/monitor/CHINA_NBS_NATIVE_RSS_BX_PLAN_v0.1.json'),
              Path('data/monitor/CHINA_NBS_NATIVE_RSS_BX_RESEARCH_v0.1.md'),
              Path('src/world_signals/nbs_release_monitor.py'),
              Path('tests/test_nbs_native_rss_bx.py'),
              Path('scripts/apply_china_nbs_native_rss_monitor_bx.py'),
              Path('tests/test_nbs_native_rss_activation_bx.py'),
          ]
          total=0
          for path in paths:
              text=path.read_text()
              count=text.count('WSSRC-MAC-026')
              if count:
                  path.write_text(text.replace('WSSRC-MAC-026','WSSRC-MAC-031'))
                  total+=count
                  print(path, count)
          assert total >= 7, total
          for path in paths:
              assert 'WSSRC-MAC-026' not in path.read_text(), path
          PY

      - name: Audit correction boundary, commit and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
              'data/monitor/CHINA_NBS_NATIVE_RSS_BX_PLAN_v0.1.json',
              'data/monitor/CHINA_NBS_NATIVE_RSS_BX_RESEARCH_v0.1.md',
              'src/world_signals/nbs_release_monitor.py',
              'tests/test_nbs_native_rss_bx.py',
              'scripts/apply_china_nbs_native_rss_monitor_bx.py',
              'tests/test_nbs_native_rss_activation_bx.py',
          }
          lines=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          names={line[3:] for line in lines}
          assert names==expected,(sorted(names),sorted(expected))
          PY
          git add data/monitor/CHINA_NBS_NATIVE_RSS_BX_PLAN_v0.1.json \
                  data/monitor/CHINA_NBS_NATIVE_RSS_BX_RESEARCH_v0.1.md \
                  src/world_signals/nbs_release_monitor.py \
                  tests/test_nbs_native_rss_bx.py \
                  scripts/apply_china_nbs_native_rss_monitor_bx.py \
                  tests/test_nbs_native_rss_activation_bx.py
          test -z "$(git diff --name-only)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "29b71bea42610992ad073b1583be64ced7e5de81"
          git config user.name "world-signals-bot"
          git config user.email "world-signals-bot@users.noreply.github.com"
          git commit -m "BX: correct NBS monitor source identity collision"
          git push origin HEAD:feature/post-bw-pressure-audit-bx
