name: TEMP P1-H selection diagnostic

on:
  push:
    branches:
      - source-governance-p1h-research

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run P1-H selection diagnostic
        run: python scripts/source_governance_p1h_diagnostic_temp.py
