name: WORLD SIGNALS AS EIA WPSR monitor preflight

on:
  push:
    branches:
      - feature/post-ar-pressure-audit-as
    paths:
      - .github/workflows/tmp-eia-wpsr-as-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-73 base and clean diff
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b25bb452f3def253cf86254e5ad6abdbe8b9f13
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
      - name: Simulate controlled AS transaction
        run: python scripts/apply_eia_wpsr_monitor_as.py --check
      - name: Exercise live EIA schedule endpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path('src').resolve()))
          from world_signals.adapters import fetch_eia_wpsr_schedule
          rule,snap=fetch_eia_wpsr_schedule()
          assert snap.status == 200
          assert rule.schedule_sha256 == '8f972e877fdd56dd836f6a0cc7bc0abea73c21bfd01dd8bbc3b784ea7eacec87'
          assert rule.standard_time_semantics == 'AFTER'
          assert any(x['alternate_release_date']=='2026-09-10' and x['release_time_local']=='12:00' for x in rule.holiday_exceptions)
          print('EIA_AS_LIVE_BASELINE_OK')
          PY
      - name: Run AS adapter and monitor regressions
        run: python -m unittest tests.test_eia_wpsr_adapter tests.test_eia_wpsr_monitor tests.test_monitor_coverage_audit -v
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis layer
        run: python scripts/validate_analysis.py
      - name: Run full repository suite
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q src scripts tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Build static site
        run: python scripts/build_site.py
      - name: Prove production exact-series remains zero
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ev=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          rows=[x for x in ev.get('evidence',[]) if x.get('evidence_type')=='EXACT_TIMESTAMP_SERIES']
          assert rows == [], rows
          print('EXACT_TIMESTAMP_SERIES=0')
          PY
      - name: Prove preflight is read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts review_candidates/live site _site public
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
