name: TEMP P1-H governance transaction

on:
  push:
    branches:
      - source-governance-p1h-transaction

permissions:
  contents: write

jobs:
  transaction:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Guarded read-only preflight
        run: python scripts/apply_source_governance_p1h.py
      - name: Apply exact P1-H source-governance transaction
        env:
          WORLD_SIGNALS_ALLOW_P1H_GOVERNANCE_APPLY: YES
        run: python scripts/apply_source_governance_p1h.py --apply
      - name: Enforce registry-only diff
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
      - name: Validate canonical/source registry
        run: python scripts/validate_registry.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python monitor/governance code
        run: python -m py_compile scripts/apply_source_governance_p1h.py scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py scripts/run_live_monitor.py src/world_signals/source_governance_audit.py
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Build static site
        run: python scripts/build_site.py
      - name: Reconfirm registry-only diff
        run: |
          test "$(git diff --name-only)" = "data/sources/registry.json"
      - name: Commit registry transaction
        run: |
          git config user.name world-signals-transaction
          git config user.email actions@users.noreply.github.com
          git add data/sources/registry.json
          test "$(git diff --cached --name-only)" = "data/sources/registry.json"
          git commit -m 'Apply P1-H source-governance backfill'
          git push origin HEAD:source-governance-p1h-transaction
