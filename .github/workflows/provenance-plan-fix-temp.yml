name: TEMP provenance plan fix

on:
  push:
    branches: [provenance-scope-repair-research]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/fix_provenance_plan_temp.py
      - run: |
          test "$(git diff --name-only)" = "data/coverage/PROVENANCE_SCOPE_REPAIR_A_PLAN_v0.1.json"
          git config user.name world-signals-checkpoint
          git config user.email actions@users.noreply.github.com
          git add data/coverage/PROVENANCE_SCOPE_REPAIR_A_PLAN_v0.1.json
          git commit -m 'Fix provenance repair precondition field mapping'
          git push origin HEAD:provenance-scope-repair-research
