name: Apply WORLD SIGNALS Regional Correction J once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-regional-correction-j.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-signals-regional-correction-j-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Re-run fail-closed in-memory preflight
        run: PYTHONPATH=. python scripts/apply_regional_correction_j.py
      - name: Apply reviewed migration locally
        run: PYTHONPATH=. python scripts/apply_regional_correction_j.py --apply
      - name: Validate migrated canonical registry
        run: python scripts/validate_registry.py
      - name: Run coverage regression tests
        run: python -m unittest tests.test_coverage -v
      - name: Assert exact post-migration state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          assert reg['version']=='0.18', reg['version']
          assert reg['record_count']==662, reg['record_count']
          assert len(reg['records'])==662, len(reg['records'])
          assert src['version']=='1.49', src['version']
          new=[r for r in reg['records'] if r.get('occurrence_id','').startswith('WSO-REG-J-')]
          assert len(new)==13, len(new)
          assert len({r['series_id'] for r in new})==6
          assert len([s for s in src['sources'] if s.get('source_id','').startswith('WSSRC-REGJ-')])==5
          rbi=next(s for s in src['sources'] if s.get('source_id')=='WSSRC-CB-011')
          assert rbi.get('canonical_dependency_count')==2, rbi.get('canonical_dependency_count')
          print('Regional Correction J exact-state assertions: PASS')
          PY
      - name: Reject unintended file changes
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/canonical/registry.json data/sources/registry.json | sort)"
          test "$changed" = "$expected" || { echo "Unexpected changed files:"; printf '%s\n' "$changed"; exit 1; }
      - name: Commit reviewed registry transaction
        shell: bash
        run: |
          git config user.name 'WORLD SIGNALS reviewed migration'
          git config user.email '58031940+MusicOfScience@users.noreply.github.com'
          git add data/canonical/registry.json data/sources/registry.json
          git commit -m 'Apply Regional Correction J monetary-policy coverage'
          git push
