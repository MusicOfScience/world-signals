name: CN Brazil fuel-policy Live guarded transaction

on:
  push:
    branches:
      - feature/post-cm-brazil-fuel-policy-live-cn
    paths:
      - '.github/workflows/cn-brazil-fuel-policy-live-transaction.yml'

permissions:
  contents: write

jobs:
  transact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CN branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact post-CM base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9386114de527b117987058cb1b9cd98066dab8e4"
          test "$(git merge-base HEAD origin/main)" = "9386114de527b117987058cb1b9cd98066dab8e4"
          echo "PRE_TRANSACTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture protected hashes and existing Live rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          plan = json.loads((root/'data/live_intelligence/BRAZIL_FUEL_POLICY_LIVE_CN_PLAN_v0.1.json').read_text())
          hashes = {}
          for raw in plan['protected_paths']:
              path = root / raw
              if not path.is_file():
                  raise SystemExit(f'protected path missing before CN: {raw}')
              hashes[raw] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('/tmp/cn_protected.json').write_text(json.dumps(hashes, sort_keys=True))
          obs = json.loads((root/'data/live_intelligence/observations.json').read_text())['observations']
          ev = json.loads((root/'data/live_intelligence/evidence_registry.json').read_text())['evidence']
          Path('/tmp/cn_existing_live.json').write_text(json.dumps({'observations': obs, 'evidence': ev}, sort_keys=True, ensure_ascii=False))
          PY

      - name: Simulate reviewed CN target
        run: python scripts/apply_brazil_fuel_policy_live_cn_tmp.py --simulate

      - name: Run focused CN contract tests before write
        run: python -m unittest discover -s tests -p 'test_brazil_fuel_policy_live_cn.py' -v

      - name: Materialise reviewed CN Live transaction
        env:
          WORLD_SIGNALS_APPLY_BRAZIL_FUEL_POLICY_LIVE_CN: REVIEWED_APPLY
        run: python scripts/apply_brazil_fuel_policy_live_cn_tmp.py --apply

      - name: Refresh mechanically derived recovery state
        env:
          WORLD_SIGNALS_WRITE_DERIVED_STATE: YES
        run: python scripts/project_state_snapshot.py --write

      - name: Verify CN materialisation
        run: python scripts/apply_brazil_fuel_policy_live_cn_tmp.py --verify

      - name: Canonical validator
        run: python scripts/validate_registry.py

      - name: Live validator
        run: python scripts/validate_live_intelligence.py

      - name: Analysis validator
        run: python scripts/validate_analysis.py

      - name: Derived-state check
        run: python scripts/project_state_snapshot.py --check

      - name: Complete historical suite
        run: python -m unittest discover -s tests -v

      - name: Python compilation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate_registry.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/project_state_snapshot.py \
            scripts/run_cross_layer_coverage_audit.py \
            scripts/apply_brazil_fuel_policy_live_cn_tmp.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/live_correction_conflict.py \
            src/world_signals/brazil_fuel_policy_cn.py

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Static build
        run: python scripts/build_site.py

      - name: Verify protected layers and existing Live rows unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          before_hashes = json.loads(Path('/tmp/cn_protected.json').read_text())
          for raw, expected in before_hashes.items():
              actual = hashlib.sha256((root/raw).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'CN protected path mutated: {raw}')
          before = json.loads(Path('/tmp/cn_existing_live.json').read_text())
          after_obs = json.loads((root/'data/live_intelligence/observations.json').read_text())['observations']
          after_ev = json.loads((root/'data/live_intelligence/evidence_registry.json').read_text())['evidence']
          obs_by_id = {row['observation_id']: row for row in after_obs}
          ev_by_id = {row['evidence_id']: row for row in after_ev}
          for row in before['observations']:
              if obs_by_id.get(row['observation_id']) != row:
                  raise SystemExit(f"CN mutated existing Live observation: {row['observation_id']}")
          for row in before['evidence']:
              if ev_by_id.get(row['evidence_id']) != row:
                  raise SystemExit(f"CN mutated existing Live evidence: {row['evidence_id']}")
          if len(after_obs) != len(before['observations']) + 1:
              raise SystemExit('CN did not add exactly one Live observation')
          if len(after_ev) != len(before['evidence']) + 1:
              raise SystemExit('CN did not add exactly one Live evidence row')
          PY

      - name: Remove temporary write machinery and enforce bounded diff
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_brazil_fuel_policy_live_cn_tmp.py
          rm .github/workflows/cn-brazil-fuel-policy-live-transaction.yml
          python - <<'PY'
          import os, subprocess
          allowed = {
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'data/status/current_state.json',
              'README.md',
              'PROJECT_STATUS.md',
              'ROADMAP.md',
              'scripts/apply_brazil_fuel_policy_live_cn_tmp.py',
              '.github/workflows/cn-brazil-fuel-policy-live-transaction.yml',
          }
          base = os.environ['PRE_TRANSACTION_SHA']
          changed = set(subprocess.check_output(['git','diff','--name-only',base], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'CN unexpected transaction paths: {unexpected}')
          required = {
              'data/live_intelligence/schema.json',
              'data/live_intelligence/observations.json',
              'data/live_intelligence/evidence_registry.json',
              'data/status/current_state.json',
              'README.md',
              'PROJECT_STATUS.md',
              'ROADMAP.md',
              'scripts/apply_brazil_fuel_policy_live_cn_tmp.py',
              '.github/workflows/cn-brazil-fuel-policy-live-transaction.yml',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'CN expected transaction paths missing: {missing}')
          PY
          test ! -e scripts/apply_brazil_fuel_policy_live_cn_tmp.py
          test ! -e .github/workflows/cn-brazil-fuel-policy-live-transaction.yml

      - name: Commit reviewed CN materialisation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'world-signals-cn-transaction'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'CN: materialise Brazil fuel-policy Live specimen'
          git push origin HEAD:feature/post-cm-brazil-fuel-policy-live-cn
