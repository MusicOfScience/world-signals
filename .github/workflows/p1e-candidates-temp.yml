name: TEMP P1-E candidate records

on:
  push:
    branches: [source-governance-p1e-research]

permissions:
  contents: read

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print candidate source records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids={
            'WSSRC-CB-004','WSSRC-CB-005','WSSRC-MAC-025',
            'WSSRC-MAC-011','WSSRC-MAC-012','WSSRC-MAC-013','WSSRC-MAC-021','WSSRC-MAC-022','WSSRC-MAC-023',
            'WSSRC-CLIM-003','WSSRC-REGJ-001','WSSRC-REGJ-005','WSSRC-EL-VIC-001','WSSRC-FIS-004'
          }
          reg=json.loads(Path('data/sources/registry.json').read_text())
          rows={r['source_id']:r for r in reg['sources'] if r.get('source_id') in ids}
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
      - name: Confirm repository remains clean
        run: git diff --exit-code
