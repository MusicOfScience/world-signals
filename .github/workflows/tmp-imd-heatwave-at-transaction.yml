name: WORLD SIGNALS AT IMD outlook controlled transaction

on:
  push:
    branches:
      - feature/post-as-pressure-audit-at
    paths:
      - .github/workflows/tmp-imd-heatwave-at-transaction.yml

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-74 base and clean transaction setup
        shell: bash
        run: |
          set -euo pipefail
          BASE=92bf6cba7506483dd861680924879b1ded0f4ddc
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          test ! -e .github/workflows/tmp-imd-heatwave-at-preflight.yml
      - name: Re-prove AT read-only candidate before write
        run: python scripts/apply_imd_heatwave_outlook_at.py --check
      - name: Run AT regressions against exact prestate
        run: python -m unittest tests.test_imd_heatwave_outlook_at -v
      - name: Controlled AT state write
        env:
          WORLD_SIGNALS_APPLY_IMD_OUTLOOK_AT: '1'
        run: python scripts/apply_imd_heatwave_outlook_at.py --write
      - name: Prove exact runtime mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            data/canonical/registry.json
            data/coverage/IMD_HEATWAVE_OUTLOOK_AT_TRANSACTION_AUDIT_v0.1.md
            data/sources/registry.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
      - name: Validate post-AT Canonical and Analysis layers
        shell: bash
        run: |
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
      - name: Recompute and verify post-AT coverage
        shell: bash
        run: |
          python scripts/run_coverage_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/coverage/coverage-audit.json').read_text())
          assert x['canonical_registry_version']=='0.38'
          t=x['totals']
          assert t['occurrence_count']==688, t
          assert t['unique_series_count']==202, t
          assert t['unique_institution_count']==127, t
          assert t['unique_source_count']==160, t
          assert t['monetary_plus_macro_occurrence_count']==443, t
          sa=next(r for r in x['by_region'] if r['region']=='South Asia')
          assert sa['occurrence_count']==29, sa
          assert sa['unique_series_count']==9, sa
          assert sa['unique_institution_count']==7, sa
          assert sa['unique_source_count']==7, sa
          assert sa['unique_category_count']==4, sa
          risk=next(r for r in x['by_category'] if r['category']=='PHYSICAL_CLIMATE_RISK')
          assert risk['occurrence_count']==7, risk
          assert risk['unique_series_count']==4, risk
          assert risk['unique_institution_count']==4, risk
          assert risk['unique_source_count']==4, risk
          flags=x['diagnostic_flags']
          assert 'South Asia' in flags['regions_with_fewer_than_10_unique_series']
          assert 'South Asia' in flags['regions_with_fewer_than_8_unique_institutions']
          assert 'PHYSICAL_CLIMATE_RISK' in flags['categories_with_fewer_than_5_unique_series']
          print('AT_POST_COVERAGE_OK')
          PY
      - name: Run AT regressions against written descendant state
        run: python -m unittest tests.test_imd_heatwave_outlook_at -v
      - name: Run full repository suite
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q src scripts tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Build static site and verify AT public object boundary
        shell: bash
        run: |
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          candidates=[Path('site/data/events.json'),Path('_site/data/events.json'),Path('public/data/events.json')]
          paths=[p for p in candidates if p.exists()]
          if paths:
              data=json.loads(paths[0].read_text())
              rows=data if isinstance(data,list) else data.get('records',data.get('events',[]))
              row=next(r for r in rows if r.get('occurrence_id')=='WSO-RISK-A-0002')
              assert row['start_local']=='2026-03-31'
              assert row['source_timezone']=='Asia/Kolkata'
              assert row.get('start_utc') is None
              assert row['event_type']=='PHYSICAL_RISK_OUTLOOK_RELEASE'
              assert row['signal_object_class']=='SCHEDULED_INFORMATION_CATALYST'
              assert row['lifecycle_status']=='COMPLETED'
          print('AT_PUBLIC_BOUNDARY_OK')
          PY
      - name: Prove exact-series zero and protected base layers unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=92bf6cba7506483dd861680924879b1ded0f4ddc
          python - <<'PY'
          import json
          from pathlib import Path
          ev=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert [x for x in ev.get('evidence',[]) if x.get('evidence_type')=='EXACT_TIMESTAMP_SERIES']==[]
          print('EXACT_TIMESTAMP_SERIES=0')
          PY
          for p in \
            data/canonical/schema.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json; do
            test -z "$(git diff "$BASE" -- "$p")"
          done
      - name: Clean generated artifacts and re-prove transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts review_candidates/live site _site public
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//' | sort)
          expected=(
            data/canonical/registry.json
            data/coverage/IMD_HEATWAVE_OUTLOOK_AT_TRANSACTION_AUDIT_v0.1.md
            data/sources/registry.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
      - name: Commit controlled state and self-remove transaction workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add data/canonical/registry.json data/sources/registry.json data/coverage/IMD_HEATWAVE_OUTLOOK_AT_TRANSACTION_AUDIT_v0.1.md
          git commit -m "AT: add IMD heatwave outlook catalyst"
          git push origin HEAD:feature/post-as-pressure-audit-at
          git rm .github/workflows/tmp-imd-heatwave-at-transaction.yml
          git commit -m "AT: remove controlled transaction workflow"
          git push origin HEAD:feature/post-as-pressure-audit-at
