name: BW Japan CPI materialised test capture

on:
  push:
    branches:
      - feature/post-bv-pressure-audit-bw

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and materialise BW
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BW: '1'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git merge-base HEAD origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          python scripts/apply_japan_cpi_monitor_bw.py --apply >/tmp/bw-apply.json
      - name: Capture full test result without truncation
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/bw-unittest.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > /tmp/bw-unittest.status
          tail -n 180 /tmp/bw-unittest.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bw-japan-cpi-materialised-test-output
          path: |
            /tmp/bw-unittest.log
            /tmp/bw-unittest.status
          if-no-files-found: error
          retention-days: 1
      - name: Enforce captured test result
        shell: bash
        run: |
          test "$(cat /tmp/bw-unittest.status)" = "0"
      - name: Restore and prove clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          git clean -fd artifacts review_candidates site >/dev/null 2>&1 || true
          test -z "$(git status --porcelain)"
