name: BV FAO release-calendar read-only diagnostic

on:
  push:
    branches:
      - feature/post-bu-pressure-audit-bv
    paths:
      - '.github/workflows/bv-fao-calendar-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact BV base and inspect bounded FAO schedule endpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          test "$(git merge-base HEAD origin/main)" = "525d44f0e83c58efd6308900740c5677d962a9f4"
          python - <<'PY'
          import hashlib, html, json, re, urllib.error, urllib.request, urllib.robotparser
          from html.parser import HTMLParser
          from pathlib import Path

          UA='WORLD-SIGNALS/0.1 (+read-only institutional schedule verification)'
          ROBOTS='https://www.fao.org/robots.txt'
          SCHEDULE='https://www.fao.org/statistics/data-releases/upcoming-data-releases/'

          def fetch(url, accept):
              req=urllib.request.Request(url,headers={
                  'User-Agent':UA,
                  'Accept':accept,
                  'Accept-Language':'en',
                  'Cache-Control':'no-cache',
              })
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,dict(r.headers),r.read(),r.geturl()
              except urllib.error.HTTPError as e:
                  return e.code,dict(e.headers),e.read(),e.geturl()

          rs,rh,rb,rf=fetch(ROBOTS,'text/plain,*/*;q=0.1')
          rct=(rh.get('Content-Type') or '').lower()
          rtext=rb.decode('utf-8','replace')
          print('ROBOTS_STATUS',rs)
          print('ROBOTS_FINAL_URL',rf)
          print('ROBOTS_CONTENT_TYPE',rct)
          print('ROBOTS_BYTES',len(rb))
          print('ROBOTS_SHA256',hashlib.sha256(rb).hexdigest())
          assert rs==200
          assert 'text/plain' in rct or rtext.lstrip().lower().startswith(('user-agent:','sitemap:'))
          assert '<html' not in rtext[:500].lower()
          assert re.search(r'(?im)^\s*user-agent\s*:',rtext)
          rp=urllib.robotparser.RobotFileParser()
          rp.set_url(ROBOTS)
          rp.parse(rtext.splitlines())
          allowed=rp.can_fetch(UA,SCHEDULE)
          print('ROBOTS_SCHEDULE_ALLOWED',allowed)
          assert allowed

          ss,sh,sb,sf=fetch(SCHEDULE,'text/html,application/xhtml+xml;q=0.9,*/*;q=0.1')
          sct=(sh.get('Content-Type') or '').lower()
          raw=sb.decode('utf-8','replace')
          print('SCHEDULE_STATUS',ss)
          print('SCHEDULE_FINAL_URL',sf)
          print('SCHEDULE_CONTENT_TYPE',sct)
          print('SCHEDULE_BYTES',len(sb))
          print('SCHEDULE_SHA256',hashlib.sha256(sb).hexdigest())
          assert ss==200
          assert len(sb)>10000
          assert '<html' in raw[:5000].lower() or '<!doctype html' in raw[:5000].lower()
          assert 'request rejected' not in raw[:5000].lower()

          class Text(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,d):
                  d=html.unescape(d)
                  if d.strip(): self.parts.append(re.sub(r'\s+',' ',d.strip()))
          p=Text(); p.feed(raw)
          text='\n'.join(p.parts)
          assert '2026 Calendar of Data Releases' in text

          configured={
              'WSO-COM-A-0042':('October 2026','FAO Food Price Index and Commodity Price Indices','2 October','2026-10-02'),
              'WSO-COM-A-0043':('October 2026','AMIS Market Monitor','2 October','2026-10-02'),
              'WSO-COM-A-0044':('November 2026','FAO Food Price Index and Commodity Price Indices','6 November','2026-11-06'),
              'WSO-COM-A-0045':('November 2026','AMIS Market Monitor','6 November','2026-11-06'),
              'WSO-COM-A-0046':('December 2026','FAO Food Price Index and Commodity Price Indices','4 December','2026-12-04'),
              'WSO-COM-A-0047':('December 2026','AMIS Market Monitor','4 December','2026-12-04'),
          }

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          by_id={r['occurrence_id']:r for r in canonical['records']}
          findings=[]
          for oid,(month,label,date_label,expected_date) in configured.items():
              row=by_id[oid]
              canonical_date=str(row.get('start_local') or '')[:10]
              assert canonical_date==expected_date,(oid,canonical_date,expected_date)
              # Restrict matching to the corresponding month section so repeated labels cannot cross-match.
              month_start=text.find(month)
              assert month_start>=0,(oid,month)
              later=[text.find(m,month_start+1) for m in ('November 2026','December 2026') if text.find(m,month_start+1)>=0]
              month_end=min(later) if later else len(text)
              section=text[month_start:month_end]
              assert label in section,(oid,label)
              line=next((x for x in section.splitlines() if label in x), '')
              # HTML text extraction may split the visible parenthesised date into an adjacent node.
              idx=section.find(label)
              context=section[idx:idx+180]
              assert date_label in context,(oid,date_label,context)
              findings.append({
                  'occurrence_id':oid,
                  'canonical_date':canonical_date,
                  'official_calendar_date':expected_date,
                  'match':True,
                  'clock_precision_exposed':False,
              })

          print('FINDINGS',json.dumps(findings,sort_keys=True))
          print('REQUEST_COUNT',2)
          print('ROBOTS_REQUEST_COUNT',1)
          print('SCHEDULE_REQUEST_COUNT',1)
          print('FOLLOWUP_REQUEST_COUNT',0)
          print('AUTOMATIC_CANONICAL_MUTATION',False)
          PY
      - name: Prove diagnostic is repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
