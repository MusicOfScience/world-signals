name: CB SARB contract diagnostic

on:
  push:
    branches:
      - feature/post-ca-pressure-audit-cb

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Inspect canonical and source contract and live SARB RSS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          base='1f20c9afbf7d9e295024ce534b3191155d9f674b'
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          exp=json.loads(Path('data/monitor/expectations.json').read_text())
          print('BASE_EXPECTED', base)
          print('CANONICAL', reg.get('version'), reg.get('record_count'), len(reg.get('records',[])))
          print('SOURCES', src.get('version'), src.get('source_count') or src.get('record_count'), len(src.get('sources',[])))
          print('MONITOR', exp.get('version'), len(exp.get('adapters',[])), exp.get('automatic_canonical_commit'), exp.get('google_calendar_write'))
          print('PROPOSED_SOURCE_ID_FREE', not any(s.get('source_id')=='WSSRC-REG-013' for s in src.get('sources',[])))
          print('EXISTING_SARB_MONITOR_SOURCE', [s.get('source_id') for s in src.get('sources',[]) if 'resbank.co.za/bin/sarb/solr/publications/rss' in str(s.get('authoritative_url',''))])
          print('EXISTING_SARB_ROUTES', [a.get('adapter_id') for a in exp.get('adapters',[]) if a.get('source_id') in {'WSSRC-REG-006','WSSRC-REG-013'} or 'SARB' in str(a.get('adapter_id',''))])

          sarb_sources=[s for s in src.get('sources',[]) if s.get('source_id')=='WSSRC-REG-006' or 'South African Reserve Bank' in str(s.get('institution',''))]
          print('SARB_SOURCE_COUNT',len(sarb_sources))
          for s in sarb_sources:
              keep={k:s.get(k) for k in ['source_id','institution','authoritative_url','source_type','source_timezone','canonical_dependency_count','canonical_provenance_use','automated_monitoring_use','verification_mode','automated_retrieval_permission','monitoring_readiness_status','monitoring_activation_status','licence_review_status','ingestion_permission','redistribution_permission','rights_evidence_url']}
              print('SARB_SOURCE',json.dumps(keep,ensure_ascii=False,sort_keys=True))

          sarb_records=[r for r in reg.get('records',[]) if r.get('source_id')=='WSSRC-REG-006' or r.get('institution')=='South African Reserve Bank']
          print('SARB_CANONICAL_COUNT',len(sarb_records))
          fields=['occurrence_id','series_id','canonical_name','event_type','lifecycle_status','certainty_status','timing_type','start_local','end_local','source_timezone','start_utc','end_utc','time_precision','time_basis','publication_datetime','source_id','region','jurisdiction']
          for r in sarb_records:
              print('SARB_CANONICAL',json.dumps({k:r.get(k) for k in fields},ensure_ascii=False,sort_keys=True))

          rss='https://www.resbank.co.za/bin/sarb/solr/publications/rss'
          req=urllib.request.Request(rss,headers={'User-Agent':'WORLD-SIGNALS-read-only-research/1.0','Accept':'application/rss+xml, application/xml;q=0.9, text/xml;q=0.8, */*;q=0.1'})
          with urllib.request.urlopen(req,timeout=30) as resp:
              body=resp.read()
              print('RSS_STATUS',resp.status)
              print('RSS_CONTENT_TYPE',resp.headers.get('Content-Type'))
              print('RSS_RESOLVED_URL',resp.geturl())
          print('RSS_BYTES',len(body))
          print('RSS_SHA256',hashlib.sha256(body).hexdigest())
          root=ET.fromstring(body)
          print('RSS_ROOT',root.tag)
          items=root.findall('.//item')
          print('RSS_ITEM_COUNT',len(items))
          for i,item in enumerate(items[:25]):
              vals={c.tag.split('}')[-1]:(c.text or '').strip() for c in list(item)}
              print('RSS_ITEM',i,json.dumps({k:vals.get(k) for k in ['title','link','pubDate','category','guid']},ensure_ascii=False,sort_keys=True)[:3000])
          print('RSS_CHILD_CONTRACTS',sorted({tuple(c.tag.split('}')[-1] for c in list(item)) for item in items}))
          PY
          test "$(git status --porcelain)" = ""
          echo REPOSITORY_BYTE_CLEAN=YES
