name: WORLD SIGNALS AT IMD outlook preflight

on:
  push:
    branches:
      - feature/post-as-pressure-audit-at
    paths:
      - .github/workflows/tmp-imd-heatwave-at-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-74 base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=92bf6cba7506483dd861680924879b1ded0f4ddc
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
      - name: Prove IMD source remains outside live monitor configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/monitor/expectations.json').read_text())
          assert all(a.get('source_id') != 'WSSRC-RISK-005' for a in x.get('adapters', []))
          assert x['version'] == '0.10'
          assert len(x['adapters']) == 8
          print('AT_IMD_NOT_LIVE_POLLED_OK')
          PY
      - name: Read-only AT candidate simulation after repository import-path proof
        run: python scripts/apply_imd_heatwave_outlook_at.py --check
      - name: Targeted AT regressions
        run: python -m unittest tests.test_imd_heatwave_outlook_at -v
      - name: Validate current governed layers
        shell: bash
        run: |
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
      - name: Run full repository suite
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q src scripts tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Build static site
        run: python scripts/build_site.py
      - name: Prove source tree unchanged by read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts review_candidates/live site _site public
          test -z "$(git status --porcelain=v1)"
          echo AT_PREFLIGHT_CLEAN_TREE_OK
