name: BX native NBS RSS one-request diagnostic

on:
  push:
    branches:
      - feature/post-bw-pressure-audit-bx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact post-BW ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE=29b71bea42610992ad073b1583be64ced7e5de81
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test -z "$(git status --porcelain)"
      - name: Fetch exactly one native NBS Latest Releases RSS response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEED='https://www.stats.gov.cn/sj/zxfb/rss.xml'
          UA='WORLD-SIGNALS-read-only-research/0.1 (+one-request native NBS RSS diagnostic)'
          req=urllib.request.Request(FEED,headers={'User-Agent':UA,'Accept':'application/rss+xml, application/xml, text/xml;q=1.0,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read()
              meta={'requested_url':FEED,'final_url':r.geturl(),'status':r.status,'content_type':r.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}

          text=body.decode('utf-8','replace')
          strict_ok=True
          strict_error=None
          root=None
          try:
              root=ET.fromstring(body)
          except Exception as exc:
              strict_ok=False
              strict_error=repr(exc)

          opens=len(re.findall(r'<item(?:\s[^>]*)?>',text,re.I))
          closes=len(re.findall(r'</item\s*>',text,re.I))
          frags=re.findall(r'<item(?:\s[^>]*)?>.*?</item\s*>',text,re.I|re.S)
          parsed=[]; failures=[]; contracts={}
          for idx,frag in enumerate(frags):
              try:
                  node=ET.fromstring(frag)
                  children=[ch.tag.split('}',1)[-1] for ch in list(node)]
                  contracts[tuple(children)]=contracts.get(tuple(children),0)+1
                  row={'fragment_index':idx}
                  for ch in list(node):
                      tag=ch.tag.split('}',1)[-1]
                      if tag in ('title','channel','link','source','pubTime','pubDate','guid'):
                          row[tag]=(ch.text or '').strip() if ch.text else None
                  parsed.append(row)
              except Exception as exc:
                  failures.append({'fragment_index':idx,'error':repr(exc)})

          # Native keyword screen is diagnostic only; no production classifier is implied yet.
          keywords={
              'CPI':['居民消费价格','居民消费价格指数'],
              'PPI':['工业生产者出厂价格','工业生产者价格'],
              'PMI':['采购经理指数'],
              'NEP':['国民经济运行','国民经济'],
              'IP':['规模以上工业','工业生产'],
              'ENERGY':['能源生产'],
              'FAI':['固定资产投资'],
              'REALESTATE':['房地产开发投资','房地产开发'],
              'RETAIL':['社会消费品零售总额'],
          }
          matches={}
          for key,ks in keywords.items():
              vals=[]
              for row in parsed:
                  t=row.get('title') or ''
                  if any(k in t for k in ks): vals.append(row)
              matches[key]=vals[:24]

          result={
              'tranche':'BX','feed_meta':meta,'strict_document_parse_ok':strict_ok,'strict_document_parse_error':strict_error,
              'item_counts':{'open':opens,'close':closes,'complete_fragments':len(frags),'fragment_parse_success':len(parsed),'fragment_parse_failure':len(failures)},
              'child_contracts':[{'children':list(k),'count':v} for k,v in sorted(contracts.items(),key=lambda kv:(-kv[1],kv[0]))],
              'first_items':parsed[:40],'keyword_matches':matches,'fragment_failures':failures[:20],
          }
          Path('/tmp/bx-nbs-cn-rss.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print('FEED_META',json.dumps(meta,sort_keys=True))
          print('STRICT_DOCUMENT_PARSE_OK',strict_ok,strict_error)
          print('ITEM_COUNTS',json.dumps(result['item_counts'],sort_keys=True))
          print('CHILD_CONTRACTS',json.dumps(result['child_contracts'][:10],ensure_ascii=False))
          print('FIRST_ITEMS',json.dumps(parsed[:32],ensure_ascii=False))
          for key in ('CPI','PPI','PMI','NEP','IP','ENERGY','FAI','REALESTATE','RETAIL'):
              print('SERIES',key,json.dumps(matches[key][:12],ensure_ascii=False))
          print('FRAGMENT_FAILURES',json.dumps(failures[:10],ensure_ascii=False))
          PY
          test -z "$(git status --porcelain)"
      - name: Upload native RSS evidence
        uses: actions/upload-artifact@v4
        with:
          name: bx-nbs-cn-rss-diagnostic
          path: /tmp/bx-nbs-cn-rss.json
          retention-days: 1
      - name: Prove repository remained byte-clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse origin/main)" = "29b71bea42610992ad073b1583be64ced7e5de81"
