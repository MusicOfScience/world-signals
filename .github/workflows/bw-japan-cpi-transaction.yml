name: BW Japan CPI controlled activation transaction

on:
  push:
    branches:
      - feature/post-bv-pressure-audit-bw

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BV base, ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git merge-base HEAD origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test -z "$(git status --porcelain)"
          test "$(git branch --show-current)" = "feature/post-bv-pressure-audit-bw"
      - name: Assert exact temporary BW workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'bw-*.yml' -printf '%f\n' | sort > /tmp/bw-workflows.actual
          cat > /tmp/bw-workflows.expected <<'EOF'
          bw-japan-cpi-contract-inspection.yml
          bw-japan-cpi-endpoint-diagnostic.yml
          bw-japan-cpi-live-preflight.yml
          bw-japan-cpi-materialised-preflight.yml
          bw-japan-cpi-registered-endpoint-check.yml
          bw-japan-cpi-test-capture.yml
          bw-japan-cpi-transaction.yml
          bw-post-bv-pressure-audit.yml
          EOF
          diff -u /tmp/bw-workflows.expected /tmp/bw-workflows.actual
      - name: Freeze protected layers and exact pre-transaction source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          protected=[Path('data/canonical/registry.json'),Path('data/changes/ledger.json'),Path('data/biosecurity'),Path('data/live'),Path('data/live_intelligence'),Path('data/analysis')]
          def digest(path):
              h=hashlib.sha256()
              if path.is_file(): h.update(path.read_bytes())
              else:
                  for p in sorted(x for x in path.rglob('*') if x.is_file()):
                      h.update(str(p.relative_to(path)).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          Path('/tmp/bw-protected-before.json').write_text(json.dumps({str(p):digest(p) for p in protected},sort_keys=True))
          sources=json.loads(Path('data/sources/registry.json').read_text())
          source=[s for s in sources['sources'] if s.get('source_id')=='WSSRC-MAC-014']
          assert len(source)==1
          Path('/tmp/bw-source-before.json').write_text(json.dumps(source[0],sort_keys=True,ensure_ascii=False))
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          ids={f'WSO-MAC-A-{n:04d}' for n in range(50,57)}
          rows=[r for r in canonical['records'] if r.get('occurrence_id') in ids]
          assert len(rows)==7
          Path('/tmp/bw-canonical-scope-before.json').write_text(json.dumps(sorted(rows,key=lambda x:x['occurrence_id']),sort_keys=True,ensure_ascii=False))
          PY
      - name: Run guarded check-only helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_japan_cpi_monitor_bw.py | tee /tmp/bw-check.json
          test -z "$(git status --porcelain)"
      - name: Apply exact five-file governed/runtime transaction
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_BW: '1'
        run: |
          set -euo pipefail
          python scripts/apply_japan_cpi_monitor_bw.py --apply | tee /tmp/bw-apply.json
          cat > /tmp/bw-five.expected <<'EOF'
          data/monitor/expectations.json
          data/sources/registry.json
          scripts/run_adapter_smoke.py
          scripts/run_live_monitor.py
          src/world_signals/adapters/__init__.py
          EOF
          git diff --name-only | sort > /tmp/bw-five.actual
          diff -u /tmp/bw-five.expected /tmp/bw-five.actual
      - name: Assert exact governed BW post-state and immutable source rights/provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          before=json.loads(Path('/tmp/bw-source-before.json').read_text())
          assert (canonical['version'],len(canonical['records']))==('0.41',689)
          assert (sources['version'],len(sources['sources']))==('1.96',252)
          assert (monitor['version'],len(monitor['adapters']))==('0.21',19)
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False
          src=[s for s in sources['sources'] if s.get('source_id')=='WSSRC-MAC-014']
          assert len(src)==1
          src=src[0]
          immutable=['source_id','institution','jurisdiction','domain','endpoint_role','authoritative_url','source_type','information_supplied','source_timezone','timezone_scope','canonical_dependency_count','canonical_provenance_use','licence_constraints','ingestion_permission','licence_review_status','redistribution_permission','rights_evidence_url','rights_summary','rights_review_scope','rights_reviewed_at','rights_review_note','governance_backfill_basis','governance_backfill_reviewed_at','notes','parser_type']
          for key in immutable:
              assert src.get(key)==before.get(key),(key,before.get(key),src.get(key))
          assert src['automated_monitoring_use']=='CLEARED_BOUNDED_RELEASE_SCHEDULE'
          assert src['automated_retrieval_permission']=='BOUNDED_OFFICIAL_HTML_SCHEDULE_ROBOTS_COMPATIBLE'
          assert src['monitoring_readiness_status']=='LIVE_VALIDATED_NO_AUTO_COMMIT'
          assert src['monitoring_activation_status']=='LIVE_READ_ONLY_DATE_CHANGE_SENTINEL_NO_AUTO_COMMIT'
          assert src['verification_mode']=='AUTOMATED_PILOT'
          assert src['runtime_health_state']=='READ_ONLY_DIAGNOSTIC_PASS_2026_09_09'
          assert src['live_adapter_id']=='JAPAN_CPI_RELEASE_SCHEDULE'
          assert src['parser_version']=='jp-stat-cpi-0.2'
          assert src['notes']['time_rule_url']=='https://www.stat.go.jp/english/data/cpi/1585.htm'
          assert len(src['monitor_endpoints'])==2
          assert src['monitor_endpoints'][0]['url']=='https://www.stat.go.jp/english/data/cpi/1582.htm'
          assert src['monitor_endpoints'][1]['url']=='https://www.stat.go.jp/robots.txt'
          routes=[r for r in monitor['adapters'] if r.get('adapter_id')=='JAPAN_CPI_RELEASE_SCHEDULE']
          assert len(routes)==1
          route=routes[0]
          expected_ids={f'WSO-MAC-A-{n:04d}' for n in range(50,57)}
          assert route['source_id']=='WSSRC-MAC-014'
          assert route['canonical_schedule_source_id']=='WSSRC-MAC-014'
          assert route['same_source_identity_for_canonical_and_monitor'] is True
          assert set(route['canonical_occurrence_ids'])==expected_ids
          assert route['request_budget_per_run']==2
          assert route['robots_requests_per_run']==1
          assert route['schedule_requests_per_run']==1
          assert route['followup_requests_per_run']==0
          for key in ['schedule_mutation_authority','clock_authority','lifecycle_authority','certainty_authority','canonical_clock_mutation_allowed','automatic_tokyo_cpi_followup_allowed','automatic_estat_api_followup_allowed','automatic_data_release_followup_allowed','automatic_pdf_fetch_allowed','automatic_news_followup_allowed','automatic_search_route_discovery_allowed','automatic_commit_allowed']:
              assert route[key] is False,(key,route[key])
          now_scope=[r for r in canonical['records'] if r.get('occurrence_id') in expected_ids]
          frozen=json.loads(Path('/tmp/bw-canonical-scope-before.json').read_text())
          assert sorted(now_scope,key=lambda x:x['occurrence_id'])==frozen
          PY
      - name: Run complete governed validation gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Prove protected layers byte-identical after apply and build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          before=json.loads(Path('/tmp/bw-protected-before.json').read_text())
          def digest(path):
              h=hashlib.sha256()
              if path.is_file(): h.update(path.read_bytes())
              else:
                  for p in sorted(x for x in path.rglob('*') if x.is_file()):
                      h.update(str(p.relative_to(path)).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          after={key:digest(Path(key)) for key in before}
          assert after==before,(before,after)
          print(json.dumps(after,indent=2,sort_keys=True))
          PY
      - name: Remove generated outputs and every temporary BW workflow including this transaction
        shell: bash
        run: |
          set -euo pipefail
          git clean -fd artifacts review_candidates site >/dev/null 2>&1 || true
          find .github/workflows -maxdepth 1 -type f -name 'bw-*.yml' -printf '%f\n' | sort > /tmp/bw-workflows.pre-remove
          diff -u /tmp/bw-workflows.expected /tmp/bw-workflows.pre-remove
          git rm .github/workflows/bw-*.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'bw-*.yml' -print -quit)"
      - name: Stage and audit exact transaction file set
        shell: bash
        run: |
          set -euo pipefail
          git add data/sources/registry.json data/monitor/expectations.json scripts/run_live_monitor.py scripts/run_adapter_smoke.py src/world_signals/adapters/__init__.py
          cat > /tmp/bw-staged.expected <<'EOF'
          .github/workflows/bw-japan-cpi-contract-inspection.yml
          .github/workflows/bw-japan-cpi-endpoint-diagnostic.yml
          .github/workflows/bw-japan-cpi-live-preflight.yml
          .github/workflows/bw-japan-cpi-materialised-preflight.yml
          .github/workflows/bw-japan-cpi-registered-endpoint-check.yml
          .github/workflows/bw-japan-cpi-test-capture.yml
          .github/workflows/bw-japan-cpi-transaction.yml
          .github/workflows/bw-post-bv-pressure-audit.yml
          data/monitor/expectations.json
          data/sources/registry.json
          scripts/run_adapter_smoke.py
          scripts/run_live_monitor.py
          src/world_signals/adapters/__init__.py
          EOF
          git diff --cached --name-only | sort > /tmp/bw-staged.actual
          diff -u /tmp/bw-staged.expected /tmp/bw-staged.actual
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Reconfirm exact main and ancestry immediately before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git merge-base HEAD origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
      - name: Commit and push governed BW activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WORLD SIGNALS transaction'
          git config user.email 'world-signals@users.noreply.github.com'
          git commit -m 'BW: activate Japan CPI release-schedule monitor'
          git push origin HEAD:feature/post-bv-pressure-audit-bw
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Post-push local final audit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'bw-*.yml' -print -quit)"
          git fetch origin main feature/post-bv-pressure-audit-bw
          test "$(git rev-parse origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
          test "$(git rev-parse origin/feature/post-bv-pressure-audit-bw)" = "$FINAL_HEAD"
          test "$(git merge-base "$FINAL_HEAD" origin/main)" = "b277939bc6c540d0986f298a832c7d63a29a2d19"
