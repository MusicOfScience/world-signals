name: CH state-truth preflight

on:
  push:
    branches:
      - feature/post-cg-state-truth-ch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/post-cg-state-truth-ch
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact repaired main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "f3415e7c748957fadec4d1665b032167fd067a03"
          test "$(git merge-base HEAD origin/main)" = "f3415e7c748957fadec4d1665b032167fd067a03"
      - name: Validate governed and derived state
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/project_state_snapshot.py --check
          python -m unittest tests.test_project_state_snapshot_ch -v
          python -m unittest tests.test_opec_quarantine_cf -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile and build
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py src/world_signals/*.py src/world_signals/adapters/*.py tests/*.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Prove protected layers and bounded diff
        run: |
          set -euo pipefail
          protected=(
            data/canonical/registry.json
            data/canonical/schema.json
            data/sources/registry.json
            data/changes/ledger.json
            data/coverage/biosecurity_overlay.json
            data/monitor/expectations.json
            data/monitor/operations_policy.json
            data/live_intelligence/schema.json
            data/live_intelligence/observations.json
            data/live_intelligence/evidence_registry.json
            data/analysis/schema.json
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
            OPEC_QUARANTINE.md
            tests/test_opec_quarantine_cf.py
          )
          for path in "${protected[@]}"; do
            test "$(git rev-parse origin/main:$path)" = "$(git rev-parse HEAD:$path)" || {
              echo "protected path changed: $path" >&2
              exit 1
            }
          done
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/ci.yml',
              '.github/workflows/ch-state-truth-preflight.yml',
              'README.md',
              'PROJECT_STATUS.md',
              'ROADMAP.md',
              'data/status/current_state.json',
              'data/status/POST_CG_STATE_TRUTH_CH_AUDIT_v0.1.md',
              'scripts/project_state_snapshot.py',
              'scripts/apply_analysis_revision_contract_ba.py',
              'scripts/apply_japan_fies_live_analysis_az.py',
              'tests/test_project_state_snapshot_ch.py',
              'tests/test_vietnam_myanmar_live_bd.py',
              'tests/test_un_correct_map_live_bf.py',
              'tests/test_opec_official_confirmation_bg.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'CH unexpected paths: {sorted(changed ^ allowed)}; actual={sorted(changed)}')
          PY
          rm -rf site docs artifacts
          test ! -e site
          test ! -e docs
          test ! -e artifacts
