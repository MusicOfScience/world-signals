name: CI NHC activation transaction

on:
  push:
    branches:
      - feature/post-ch-nhc-monitor-activation-ci
    paths:
      - '.github/workflows/ci-nhc-activation-transaction.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-signals-ci-nhc-activation
  cancel-in-progress: false

jobs:
  transact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/post-ch-nhc-monitor-activation-ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Assert exact merged CH base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "c4f359c2c70f023c32990f20234aaf154dced152"
          test "$(git merge-base HEAD origin/main)" = "c4f359c2c70f023c32990f20234aaf154dced152"

      - name: Fresh live NHC endpoint robots and rights preflight
        shell: bash
        run: |
          set -euo pipefail
          cp data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0.1.json /tmp/nhc-readiness-before.json
          python scripts/run_nhc_readiness_cf.py > /tmp/nhc-ci-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          x=json.loads(Path('data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0.1.json').read_text())
          assert x['readiness_verdict']=='PILOT_ROUTE_VALIDATED_NO_AUTO_COMMIT'
          assert (x['definition']['start_month_day'],x['definition']['end_month_day'])==('06-01','11-30')
          assert x['review_candidate_count']==0
          assert all(x['robots_path_access'].values())
          assert x['climatology_snapshot']['status']==200
          assert x['atlantic_outlook_rss_snapshot']['status']==200
          req=Request('https://www.weather.gov/disclaimer/',headers={'User-Agent':'WORLD-SIGNALS/0.2 (+https://github.com/MusicOfScience/world-signals)'})
          with urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace').lower()
              status=r.status
          assert status==200 and 'public domain' in body
          assert 'appropriate use' in body or 'appropriate-use' in body
          print('CI_NHC_LIVE_PREFLIGHT_PASS')
          PY
          cp /tmp/nhc-readiness-before.json data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0.1.json

      - name: Prepare narrow descendant repairs
        run: python scripts/repair_monitor_descendants_ci_tmp.py

      - name: Validate descendant repairs on exact prestate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_barmm_pre_election_live_cg -v
          python -m unittest tests.test_bwc_wg8_first_analysis_revision_cd -v
          python -m unittest tests.test_hmt_t1_content_api_activation_cc -v
          python -m unittest tests.test_opec_official_confirmation_bg -v
          python -m unittest tests.test_project_state_snapshot_ch -v

      - name: Simulate and run focused activation regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_nhc_atlantic_season_monitor_ci.py --check
          python -m unittest tests.test_nhc_atlantic_season_cf -v
          python -m unittest tests.test_nhc_atlantic_season_activation_ci -v
          python -m unittest tests.test_opec_quarantine_cf -v

      - name: Materialise bounded route and refresh derived state
        shell: bash
        env:
          WORLD_SIGNALS_APPLY_MONITOR_CI: 'YES'
          WORLD_SIGNALS_WRITE_DERIVED_STATE: 'YES'
        run: |
          set -euo pipefail
          python scripts/apply_nhc_atlantic_season_monitor_ci.py --apply
          python scripts/project_state_snapshot.py --write

      - name: Validate full repository
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/project_state_snapshot.py --check
          python -m unittest tests.test_nhc_atlantic_season_cf -v
          python -m unittest tests.test_nhc_atlantic_season_activation_ci -v
          python -m unittest tests.test_opec_quarantine_cf -v
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py src/world_signals/*.py src/world_signals/adapters/*.py tests/*.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py

      - name: Exercise registered NHC runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_live_monitor.py > /tmp/ci-live-monitor-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/live-monitor.json').read_text())
          h=[x for x in r['source_health'] if x.get('adapter_id')=='NHC_ATLANTIC_SEASON']
          assert len(h)==1 and h[0]['state']=='HEALTHY', h
          assert h[0]['request_budget_per_run']==2
          assert h[0]['rss_has_season_date_authority'] is False
          assert r['canonical_unchanged'] is True
          assert r['source_health_summary']['all_expected_adapters_observed'] is True
          print('CI_NHC_RUNTIME_PASS')
          PY

      - name: Audit protected layers and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs site artifacts review_candidates/live
          cp /tmp/nhc-readiness-before.json data/monitor/NHC_ATLANTIC_SEASON_CF_READINESS_v0.1.json
          protected=(
            data/canonical/registry.json
            data/canonical/schema.json
            data/changes/ledger.json
            data/coverage/biosecurity_overlay.json
            data/monitor/operations_policy.json
            data/live_intelligence/schema.json
            data/live_intelligence/observations.json
            data/live_intelligence/evidence_registry.json
            data/analysis/schema.json
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
            OPEC_QUARANTINE.md
            tests/test_opec_quarantine_cf.py
          )
          for path in "${protected[@]}"; do
            test "$(git rev-parse origin/main:$path)" = "$(git hash-object "$path")" || {
              echo "protected path changed: $path" >&2
              exit 1
            }
          done
          python - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/ci-nhc-activation-transaction.yml',
            'README.md','PROJECT_STATUS.md','ROADMAP.md',
            'data/monitor/POST_CH_PRESSURE_AUDIT_CI_v0.1.md',
            'data/monitor/NHC_ATLANTIC_SEASON_CI_PLAN_v0.1.json',
            'data/monitor/expectations.json','data/sources/registry.json','data/status/current_state.json',
            'scripts/apply_nhc_atlantic_season_monitor_ci.py','scripts/run_live_monitor.py',
            'scripts/repair_monitor_descendants_ci_tmp.py','tests/test_nhc_atlantic_season_activation_ci.py',
            'scripts/apply_barmm_pre_election_live_cg.py','tests/test_bwc_wg8_first_analysis_revision_cd.py',
            'tests/test_hmt_t1_content_api_activation_cc.py','tests/test_opec_official_confirmation_bg.py',
            'tests/test_project_state_snapshot_ch.py'
          }
          committed=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          working=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          actual=committed|working|untracked
          if actual!=allowed:
              raise SystemExit(f'CI unexpected paths: {sorted(actual ^ allowed)}; actual={sorted(actual)}')
          print('CI_BOUNDED_DIFF_PASS')
          PY

      - name: Write transaction audit and commit materialised state
        shell: bash
        run: |
          set -euo pipefail
          cat > data/monitor/NHC_ATLANTIC_SEASON_CI_TRANSACTION_AUDIT_v0.1.md <<EOF
          # WORLD SIGNALS — NHC Atlantic-season CI transaction audit v0.1

          - exact merged CH base: \`c4f359c2c70f023c32990f20234aaf154dced152\`
          - successful transaction run: \`${GITHUB_RUN_ID}\`
          - executed at UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          - run \`34407375556\`: import-path harness failure before network or write gate; no governed mutation.
          - run \`34407481825\`: live preflight and simulation passed; unittest import-path failure before write gate; no governed mutation.
          - run \`34407564966\`: live preflight, focused tests and ephemeral activation passed; full suite exposed six frozen historical descendant assertions; runner discarded before commit.
          - run \`34407905276\`: temporary workflow parse/dispatch failure; no job and no mutation.
          - descendant repairs preserve historical CG/CD/CC/BG/CH checkpoints while permitting reviewed Source/Monitor descendants; NHC registration is valid only with its exact bounded route and closed authority gates.
          - fresh NHC climatology/RSS/robots and NWS rights/appropriate-use recheck: **PASS**
          - Source Registry: \`v2.02 / 257\` → \`v2.03 / 257\`
          - Monitor expectations: \`v0.27 / 25\` → \`v0.28 / 26\`
          - Monitor coverage: 24 → 25 unique sources; 215 → 217 scoped occurrences; 47 → 48 series; 11 → 12 categories.
          - exact NHC scope: \`WSO-COM-A-0049\`, \`WSO-COM-A-0050\`; semantic baseline \`06-01 → 11-30\`.
          - RSS is source-health corroboration only; actual scheduler cadence is daily; request budget is two first-party requests per run.
          - Canonical / Change Ledger / Monitor operations policy / Live / Analysis mutation: **NONE**.
          - automatic Canonical commit / Google Calendar write / automatic Live-Analysis promotion: **OFF**.
          - OPEC CE quarantine: **RESPECTED**.
          - registered runtime observed NHC and preserved Canonical hash.
          EOF
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add \
            README.md PROJECT_STATUS.md ROADMAP.md \
            data/sources/registry.json data/monitor/expectations.json data/status/current_state.json \
            scripts/run_live_monitor.py data/monitor/NHC_ATLANTIC_SEASON_CI_TRANSACTION_AUDIT_v0.1.md \
            scripts/apply_barmm_pre_election_live_cg.py \
            tests/test_bwc_wg8_first_analysis_revision_cd.py \
            tests/test_hmt_t1_content_api_activation_cc.py \
            tests/test_opec_official_confirmation_bg.py \
            tests/test_project_state_snapshot_ch.py
          git diff --cached --quiet && { echo 'No materialised CI changes to commit' >&2; exit 1; }
          git commit -m "CI: materialise bounded NHC season monitor"
          git push origin HEAD:feature/post-ch-nhc-monitor-activation-ci
