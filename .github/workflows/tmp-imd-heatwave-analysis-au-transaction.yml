name: WORLD SIGNALS AU IMD outlook Analysis controlled transaction

on:
  push:
    branches:
      - feature/post-at-pressure-audit-au
    paths:
      - .github/workflows/tmp-imd-heatwave-analysis-au-transaction.yml

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-75 base and clean transaction setup
        shell: bash
        run: |
          set -euo pipefail
          BASE=03a8f87f17570c2520edadf78237ed07d946107a
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          test ! -e .github/workflows/tmp-au-descendant-repair.yml
          test ! -e .github/workflows/tmp-au-whitespace-cleanup.yml
          test ! -e .github/workflows/tmp-imd-heatwave-analysis-au-preflight.yml
      - name: Re-prove AU read-only candidate before write
        run: python scripts/apply_imd_heatwave_outlook_analysis_au.py --check
      - name: Run AU and AQ regressions against exact prestate
        run: |
          python -m unittest \
            tests.test_imd_heatwave_outlook_analysis_au \
            tests.test_eu_russia_sanctions_analysis_aq -v
      - name: Controlled AU Analysis write
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_AU: '1'
        run: python scripts/apply_imd_heatwave_outlook_analysis_au.py --write
      - name: Prove exact runtime mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            data/analysis/IMD_HEATWAVE_OUTLOOK_ANALYSIS_AU_TRANSACTION_AUDIT_v0.1.md
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
      - name: Validate written Canonical and Analysis layers
        run: |
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
      - name: Prove exact written AU state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.world_signals.analysis import analysis_population_readiness
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          schema=json.loads(Path('data/analysis/schema.json').read_text())
          reviews=json.loads(Path('data/analysis/event_reviews.json').read_text())
          evidence=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          assert canonical['version']=='0.38' and len(canonical['records'])==688
          assert reviews['version']=='0.16' and len(reviews['reviews'])==20
          assert reviews['canonical_checkpoint']=={'registry_version':'0.38','record_count':688}
          assert evidence['version']=='0.16' and len(evidence['evidence'])==91
          r=analysis_population_readiness(schema,reviews,canonical)
          assert r['eligible_completed_occurrence_count']==21, r
          assert r['reviewed_occurrence_count']==20, r
          assert r['reviewed_event_type_diversity']==18, r
          assert r['reviewed_by_event_type']['PHYSICAL_RISK_OUTLOOK_RELEASE']==1, r
          reviewed=set(r['reviewed_occurrence_ids'])
          remaining=sorted(x['occurrence_id'] for x in canonical['records'] if x.get('lifecycle_status')=='COMPLETED' and x['occurrence_id'] not in reviewed)
          assert remaining==['WSO-MAC-B-0041'], remaining
          exact=sum(1 for review in reviews['reviews'] for m in (review.get('what_moved') or []) if m.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES')
          assert exact==0
          print('AU_WRITTEN_STATE_OK')
          PY
      - name: Run AU and AQ regressions against written descendant state
        run: |
          python -m unittest \
            tests.test_imd_heatwave_outlook_analysis_au \
            tests.test_eu_russia_sanctions_analysis_aq -v
      - name: Run full repository suite on written state
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q src scripts tests
      - name: Check browser JavaScript
        shell: bash
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Build static site
        run: python scripts/build_site.py
      - name: Prove protected layers unchanged and exact-series zero
        shell: bash
        run: |
          set -euo pipefail
          BASE=03a8f87f17570c2520edadf78237ed07d946107a
          for p in \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json; do
            test -z "$(git diff "$BASE" -- "$p")"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          reviews=json.loads(Path('data/analysis/event_reviews.json').read_text())
          exact=sum(1 for review in reviews['reviews'] for m in (review.get('what_moved') or []) if m.get('measurement_precision')=='EXACT_TIMESTAMP_SERIES')
          assert exact==0
          print('EXACT_TIMESTAMP_SERIES=0')
          PY
      - name: Clean generated artifacts and re-prove transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts review_candidates/live site _site public
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//' | sort)
          expected=(
            data/analysis/IMD_HEATWAVE_OUTLOOK_ANALYSIS_AU_TRANSACTION_AUDIT_v0.1.md
            data/analysis/event_reviews.json
            data/analysis/evidence_registry.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
      - name: Commit controlled state and self-remove transaction workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add data/analysis/event_reviews.json data/analysis/evidence_registry.json data/analysis/IMD_HEATWAVE_OUTLOOK_ANALYSIS_AU_TRANSACTION_AUDIT_v0.1.md
          git commit -m "AU: add IMD heatwave outlook Analysis specimen"
          git push origin HEAD:feature/post-at-pressure-audit-au
          git rm .github/workflows/tmp-imd-heatwave-analysis-au-transaction.yml
          git commit -m "AU: remove controlled Analysis transaction workflow"
          git push origin HEAD:feature/post-at-pressure-audit-au
