name: TEMP P1-F status refresh

on:
  push:
    branches: [source-governance-p1f-research]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh project checkpoint after P1-E
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('PROJECT_STATUS.md')
          s=p.read_text(encoding='utf-8')
          replacements={
            '**Tier-1 source registry:** v1.56 — **223 sources**.':'**Tier-1 source registry:** v1.57 — **223 sources**.',
            'stale relative to current v0.20 / v1.56.':'stale relative to current v0.20 / v1.57.',
            '**121 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.':'**115 P1 canonical-dependent** and **71 P2 registry-only** source records still need bounded, evidence-specific governance research.',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'status anchor not found: {old}')
              s=s.replace(old,new,1)
          pattern=re.compile(
              r'P1-E research is frozen for ECB monetary-policy publications, Bank of England MPC dates, Japan Customs/MOF trade statistics, ABS CPI, Convention on Biological Diversity COP and Central Bank of Egypt — \*\*43 canonical dependencies\*\*\. BoE and CBD remain rights-held/manual; Japan Customs and ABS retain automated-pilot verification without inferring production polling permission\.\n\n'
              r'Brazil TSE and Swiss National Bank remain excluded for provenance-scope repair\. SNB\'s registered decisions/history URL still does not directly support the forward assessment schedule; Brazil\'s `2027-01-05` inauguration remains constitutionally grounded rather than an electoral-calendar date\.\n\n'
              r'Durable P1-D audit: `data/coverage/SOURCE_GOVERNANCE_P1D_BACKFILL_AUDIT_v0\.1\.md`\.\n'
              r'P1-E research/plan: `data/coverage/SOURCE_GOVERNANCE_P1E_RESEARCH_v0\.1\.md` and `data/coverage/SOURCE_GOVERNANCE_P1E_BACKFILL_PLAN_v0\.1\.json`\.'
          )
          new='''### P1-E mixed-rights / cross-domain tranche — COMPLETE\n\nP1-E backfilled ECB monetary-policy publications, Bank of England MPC dates, Japan Customs/MOF trade statistics, ABS CPI, Convention on Biological Diversity COP and Central Bank of Egypt — **43 canonical dependencies**. Source registry advanced **v1.56 → v1.57 / 223**; canonical remains **v0.20 / 669** and monitor expectations **v0.7**.\n\nGuarded transaction run `33868568393` passed preflight, exact one-file enforcement, registry validation, full unit suite, Python compilation, browser JavaScript checks and site build. PR #13 merged as `bd348a18d0b67d2b973ec7b61d0e8ede2e35cb9d`. Independent post-P1-E audit run `33869947061` measured:\n\n- **37** fully explicit governance sources;\n- **186** sources still missing at least one governance field;\n- **0 P0** configured-monitor dependencies;\n- **115 P1** canonical dependencies;\n- **71 P2** registry-only sources;\n- missing `canonical_provenance_use`: **176**;\n- missing `automated_monitoring_use`: **176**;\n- missing `verification_mode`: **186**.\n\nP1-F research is frozen for Statistics Bureau of Japan CPI, ABS Labour Force, CME E-mini S&P 500 expiry rules, IEA Oil Market Report schedule, ChinaMoney/NIFC LPR rules and Nigeria INEC — **29 canonical dependencies**. Japan CPI and ABS retain bounded automated-pilot verification; CME, IEA OMR and ChinaMoney are explicit rights-held/manual negative controls; INEC remains manual-authoritative because its detailed revision endpoint is operationally fragile.\n\nBrazil TSE and Swiss National Bank remain excluded for provenance-scope repair. SNB's registered decisions/history URL still does not directly support the forward assessment schedule; Brazil's `2027-01-05` inauguration remains constitutionally grounded rather than an electoral-calendar date.\n\nDurable P1-E audit: `data/coverage/SOURCE_GOVERNANCE_P1E_BACKFILL_AUDIT_v0.1.md`.\nP1-F research/plan: `data/coverage/SOURCE_GOVERNANCE_P1F_RESEARCH_v0.1.md` and `data/coverage/SOURCE_GOVERNANCE_P1F_BACKFILL_PLAN_v0.1.json`.'''
          s,count=pattern.subn(new,s,count=1)
          if count != 1:
              raise SystemExit(f'P1-E block replacement count {count}')
          old_next='**Source-governance P1-E transaction gate** — review/merge the frozen P1-E infrastructure, reconcile merged source v1.56 and run the guarded read-only preflight before any registry-only v1.57 transaction; Brazil TSE and SNB remain excluded pending source-scope repair.'
          new_next='**Source-governance P1-F transaction gate** — review/merge the frozen P1-F infrastructure, reconcile merged source v1.57 and run the guarded read-only preflight before any registry-only v1.58 transaction; Brazil TSE and SNB remain excluded pending source-scope repair.'
          if old_next not in s:
              raise SystemExit('next-work P1-E anchor not found')
          s=s.replace(old_next,new_next,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify status-only diff
        run: test "$(git diff --name-only)" = "PROJECT_STATUS.md"
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit status refresh
        run: |
          git config user.name "world-signals-status"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Refresh checkpoint after P1-E"
          git push origin HEAD:source-governance-p1f-research
