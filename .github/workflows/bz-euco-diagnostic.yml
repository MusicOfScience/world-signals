name: BZ European Council calendar diagnostic

on:
  push:
    branches:
      - feature/post-by-pressure-audit-bz
    paths:
      - .github/workflows/bz-euco-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact base and capture advertised Consilium RSS contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ccb20539c10d0965de84efa298ba75634c19249
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python - <<'PY'
          import hashlib,json,re,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          SOURCE_ID='WSSRC-INT-003'
          FEED='https://www.consilium.europa.eu/en/rss/meetings.ashx?cat=euco'
          UA='WORLD-SIGNALS-read-only-monitor/0.1'
          expected={
              '147805':('WSO-INT-B-0102','European Council','2026-10-15','2026-10-16'),
              '147983':('WSO-INT-B-0103','Informal meeting of heads of state or government','2026-11-13',None),
              '147844':('WSO-INT-B-0104','European Council','2026-12-17','2026-12-18'),
          }
          C=json.loads(Path('data/canonical/registry.json').read_text())
          deps=[r for r in C['records'] if r.get('source_id')==SOURCE_ID]
          assert len(deps)==3

          req=urllib.request.Request(FEED,headers={'User-Agent':UA,'Accept':'application/rss+xml,application/xml,text/xml,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=25) as resp:
              body=resp.read()
              meta={'url':FEED,'status':resp.status,'content_type':resp.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'final_url':resp.geturl()}
          assert meta['status']==200 and len(body)>500
          assert 'xml' in (meta['content_type'] or '').lower()
          root=ET.fromstring(body); assert root.tag.rsplit('}',1)[-1].lower()=='rss'
          channels=root.findall('channel'); assert len(channels)==1
          channel=channels[0]
          items=channel.findall('item'); assert 1<=len(items)<=200
          print('FETCH',json.dumps(meta,sort_keys=True))
          print('CHANNEL_CHILD_TAGS',json.dumps([x.tag.rsplit('}',1)[-1] for x in list(channel)]))
          print('ITEM_TAG_SEQUENCES',json.dumps(sorted({tuple(x.tag.rsplit('}',1)[-1] for x in list(item)) for item in items})))
          print('CHANNEL_IDENTITY',json.dumps({'title':(channel.findtext('title') or '').strip(),'link':(channel.findtext('link') or '').strip(),'description':(channel.findtext('description') or '').strip(),'item_count':len(items)},sort_keys=True))

          seen={}
          for item in items:
              guid=(item.findtext('guid') or '').strip()
              title=(item.findtext('title') or '').strip()
              link=(item.findtext('link') or '').strip()
              if guid in expected:
                  assert guid not in seen
                  p=urlparse(link)
                  assert p.scheme=='https' and p.hostname=='www.consilium.europa.eu' and not p.query and not p.fragment
                  m=re.fullmatch(r'/en/meetings/european-council/(\d{4})/(\d{2})/(\d{2})(?:-(\d{2}))?/',p.path)
                  assert m,link
                  year,month,start_day,end_day=m.groups()
                  start=f'{year}-{month}-{start_day}'
                  end=None if end_day is None else f'{year}-{month}-{end_day}'
                  oid,expected_title,expected_start,expected_end=expected[guid]
                  assert title==expected_title
                  assert (start,end)==(expected_start,expected_end)
                  seen[guid]={'occurrence_id':oid,'title':title,'link':link,'start_local':start,'end_local':end,'description':(item.findtext('description') or '').strip(),'pubDate':(item.findtext('pubDate') or '').strip()}
          assert set(seen)==set(expected)
          print('CONFIGURED_IDENTITIES',json.dumps(seen,sort_keys=True,ensure_ascii=False))
          print('GOVERNANCE',json.dumps({'network_requests':1,'direct_calendar_html_requests':0,'item_followups':0,'configured_guid_count':3,'feed_count_is_bounded_not_frozen':True,'date_source':'OFFICIAL_ITEM_LINK_PATH_ONLY','pubDate_is_event_time':False,'description_is_event_time':False,'canonical_mutation':False},sort_keys=True))
          PY
