name: Diagnose WORLD SIGNALS Correction K identities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-correction-k-identities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Print occupied commodity identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/canonical/registry.json').read_text())
          src=json.loads(Path('data/sources/registry.json').read_text())
          print('CANONICAL',reg['version'],reg['record_count'])
          print('SOURCE',src['version'])
          print('\nCOM occurrence ids >= 0028:')
          for r in reg['records']:
              oid=str(r.get('occurrence_id') or '')
              if oid.startswith('WSO-COM-A-'):
                  try: n=int(oid.rsplit('-',1)[1])
                  except ValueError: continue
                  if n>=28:
                      print(oid,'|',r.get('series_id'),'|',r.get('source_id'),'|',r.get('institution'),'|',r.get('canonical_name'))
          print('\nCOM source ids >= 010:')
          for s in src['sources']:
              sid=str(s.get('source_id') or '')
              if sid.startswith('WSSRC-COM-'):
                  try: n=int(sid.rsplit('-',1)[1])
                  except ValueError: continue
                  if n>=10:
                      print(sid,'|',s.get('institution'),'|',s.get('canonical_dependency_count'),'|',s.get('authoritative_url'))
          print('\nCandidate institution text matches:')
          needles=('jodi','joint organisations data initiative','joint organizations data initiative','gas exporting countries forum','international copper study group')
          for s in src['sources']:
              hay=' '.join(str(s.get(k) or '') for k in ('institution','endpoint_role','information_supplied','notes')).casefold()
              if any(n in hay for n in needles): print('SOURCE_MATCH',s.get('source_id'),'|',s.get('institution'))
          for r in reg['records']:
              hay=' '.join(str(r.get(k) or '') for k in ('institution','canonical_name','series_id')).casefold()
              if any(n in hay for n in needles): print('EVENT_MATCH',r.get('occurrence_id'),'|',r.get('series_id'),'|',r.get('institution'),'|',r.get('canonical_name'))
          PY
