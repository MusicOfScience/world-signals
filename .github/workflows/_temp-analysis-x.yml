name: Temporary formal standards analysis X transaction

on:
  push:
    branches:
      - feature/formal-standards-analysis-x
    paths:
      - 'data/analysis/FORMAL_STANDARDS_ANALYSIS_X_*'
      - 'scripts/apply_formal_standards_analysis_x.py'
      - 'tests/test_formal_standards_analysis_x.py'
      - 'tests/test_nonmarket_institutional_analysis_w.py'
      - '.github/workflows/_temp-analysis-x.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact post-52 base
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "1e0a4f51c3c1d860cc463f3abfbd8b3580bd36d5"
      - name: Fail-closed X check
        run: python scripts/apply_formal_standards_analysis_x.py
      - name: X-specific tests
        run: python -m unittest tests.test_formal_standards_analysis_x -v
      - name: Reviewed X apply
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_X: REVIEWED_APPLY
        run: python scripts/apply_formal_standards_analysis_x.py --apply
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Validate Analysis
        run: python scripts/validate_analysis.py
      - name: Full repository tests
        run: python -m unittest discover -s tests -v
      - name: Python compile
        run: python -m py_compile scripts/*.py src/world_signals/*.py
      - name: Browser JavaScript checks
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Static site build
        run: python scripts/build_site.py
      - name: Prove protected upstream and schema untouched
        run: |
          git diff --exit-code origin/main -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json
      - name: Commit reviewed transaction and self-remove workflow
        run: |
          git config user.name "world-signals-transaction-bot"
          git config user.email "world-signals-transaction-bot@users.noreply.github.com"
          git add data/analysis/event_reviews.json data/analysis/evidence_registry.json data/analysis/FORMAL_STANDARDS_ANALYSIS_X_TRANSACTION_AUDIT_v0.1.md
          git rm .github/workflows/_temp-analysis-x.yml
          git commit -m "Apply formal standards analysis X transaction"
          git push origin HEAD:feature/formal-standards-analysis-x
