name: Deploy WORLD SIGNALS web UX

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Monitor WORLD SIGNALS live sources"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/validate_registry.py
      - run: node --check web/app.js
      - run: node --check web/history.js
      - run: node --check web/operations.js
      - run: node --check web/biosecurity.js
      - run: node --check web/coverage.js
      - name: Build browser-safe latest monitor snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/fetch_latest_monitor_snapshot.py
      - name: Build retained review-candidate state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/fetch_retained_review_state.py
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
