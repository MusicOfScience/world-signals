name: BD commit validated descendant repair
on:
  push:
    branches: [feature/post-bc-vietnam-live-bd]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and revalidate repair on both states
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "667d0fbcc92f937b0cb609d619b664a2a97e8165"
          test "$(git merge-base HEAD origin/main)" = "667d0fbcc92f937b0cb609d619b664a2a97e8165"
          python scripts/bd_bc_descendant_patch_final.py
          python scripts/validate_checkpoint_contracts.py
          python -m unittest tests.test_analysis_revision_contract_ba tests.test_japan_fies_live_analysis_az tests.test_checkpoint_contract_bc tests.test_vietnam_myanmar_live_bd -v
          git diff --exit-code HEAD -- data PROJECT_STATUS.md ROADMAP.md
          python scripts/apply_vietnam_myanmar_live_bd.py --apply
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/validate_checkpoint_contracts.py
          python -m unittest tests.test_analysis_revision_contract_ba tests.test_japan_fies_live_analysis_az tests.test_checkpoint_contract_bc tests.test_vietnam_myanmar_live_bd -v
          git reset --hard HEAD
          python scripts/bd_bc_descendant_patch_final.py
      - name: Commit permanent repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/apply_analysis_revision_contract_ba.py scripts/apply_japan_fies_live_analysis_az.py tests/test_analysis_revision_contract_ba.py tests/test_japan_fies_live_analysis_az.py tests/test_checkpoint_contract_bc.py
          git commit -m "BD: make BA and AZ checkpoint tests descendant-safe"
      - name: Cleanup temporary files
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f scripts/bd_bc_descendant_patch_final.py .github/workflows/bd-descendant-repair-final.yml
          git commit -m "BD: remove temporary descendant repair files"
          git push origin HEAD:feature/post-bc-vietnam-live-bd
