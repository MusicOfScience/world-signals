name: TEMP mixed-signal correction M transaction

on:
  push:
    branches: [feature/mixed-signal-correction-m]
    paths:
      - data/coverage/MIXED_SIGNAL_CORRECTION_M_STAGE.trigger

permissions:
  contents: write

jobs:
  transaction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(tr -d '\r\n ' < data/coverage/MIXED_SIGNAL_CORRECTION_M_STAGE.trigger)"
          if [[ "$STAGE" != "SIMULATE" && "$STAGE" != "APPLY" ]]; then
            echo "invalid stage: $STAGE" >&2
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
      - name: Fail-closed in-memory simulation
        run: python scripts/apply_mixed_signal_correction_m.py
      - name: Validate pre-state or simulated lineage
        run: |
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/apply_mixed_signal_correction_m.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          python scripts/build_site.py
      - name: Apply reviewed transaction
        if: steps.stage.outputs.stage == 'APPLY'
        env:
          WORLD_SIGNALS_APPLY_MIXED_SIGNAL_M: YES
        run: python scripts/apply_mixed_signal_correction_m.py --apply
      - name: Validate exact post-state
        if: steps.stage.outputs.stage == 'APPLY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/horizon.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          python scripts/build_site.py
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort)
          printf 'generated transaction diff:\n%s\n' "${changed[*]}"
          expected=(
            data/canonical/registry.json
            data/coverage/MIXED_SIGNAL_CORRECTION_M_TRANSACTION_AUDIT_v0.1.md
            data/coverage/biosecurity_overlay.json
            data/sources/registry.json
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "unexpected generated transaction boundary" >&2
            exit 1
          fi
      - name: Commit reviewed post-state and remove temporary transaction workflow
        if: steps.stage.outputs.stage == 'APPLY'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-mixed-signal-correction-m.yml
          rm data/coverage/MIXED_SIGNAL_CORRECTION_M_STAGE.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply mixed-signal correction M [skip ci]"
          git push origin HEAD:feature/mixed-signal-correction-m
