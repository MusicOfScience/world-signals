name: TEMP fix BoM helper assertions
on:
  push:
    paths:
      - '.github/workflows/temp-fix-bom-window-assertions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p1-balanced-governance-c-prep
      - name: Align durable helper with exact BoM canonical range fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_p1_balanced_governance_c.py')
          text=p.read_text()
          pairs=[
            ('"WSO-COM-A-0051": {"date_earliest": "2026-11-01", "date_latest": "2027-04-30"}', '"WSO-COM-A-0051": {"start_local": "2026-11-01", "end_local": "2027-04-30"}'),
            ('"WSO-COM-A-0052": {"date_earliest": "2027-11-01", "date_latest": "2028-04-30"}', '"WSO-COM-A-0052": {"start_local": "2027-11-01", "end_local": "2028-04-30"}'),
          ]
          for old,new in pairs:
              if text.count(old)!=1:
                  raise SystemExit(f'expected exactly one helper match for {old!r}, got {text.count(old)}')
              text=text.replace(old,new)
          p.write_text(text)
          PY
          git diff --check
      - name: Commit helper correction only
        run: |
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add scripts/apply_p1_balanced_governance_c.py
          test "$(git diff --cached --name-only)" = "scripts/apply_p1_balanced_governance_c.py"
          git commit -m 'Align BoM governance guard with canonical range fields'
          git push origin HEAD:p1-balanced-governance-c-prep
