name: BY NZ election read-only RSS endpoint diagnostic

on:
  push:
    branches:
      - feature/post-bx-pressure-audit-by
    paths:
      - .github/workflows/by-nz-election-rss-endpoint.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BX ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=a3bca03f36eb5af9036017aad926f75f6762267f
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
      - name: Execute bounded robots plus advertised RSS requests
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/by-nz-rss"
          mkdir -p "$TMP"
          UA='WORLD-SIGNALS/0.1 (+read-only Electoral Commission NZ RSS review)'
          curl --silent --show-error --max-redirs 0 -A "$UA" -D "$TMP/robots.headers" -o "$TMP/robots.body" -w '%{http_code}|%{content_type}|%{url_effective}\n' 'https://elections.nz/robots.txt' > "$TMP/robots.meta"
          sleep 2
          curl --silent --show-error --max-redirs 0 -A "$UA" -H 'Accept: application/rss+xml,application/xml;q=0.9,text/xml;q=0.8,*/*;q=0.1' -D "$TMP/rss.headers" -o "$TMP/rss.body" -w '%{http_code}|%{content_type}|%{url_effective}\n' 'https://elections.nz/media-and-news/rss' > "$TMP/rss.meta"
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re
          from pathlib import Path
          from urllib.robotparser import RobotFileParser
          import xml.etree.ElementTree as ET

          root=Path(os.environ['RUNNER_TEMP'])/'by-nz-rss'
          def meta(name):
              raw=(root/f'{name}.meta').read_text(errors='replace').strip(); p=raw.split('|',2)
              return {'raw':raw,'status':int(p[0]),'content_type':p[1],'effective_url':p[2]}
          rm=meta('robots'); xm=meta('rss')
          rb=(root/'robots.body').read_bytes(); xb=(root/'rss.body').read_bytes()
          rt=rb.decode('utf-8','replace')
          rp=RobotFileParser(); rp.parse(rt.splitlines())
          allows=rp.can_fetch('*','https://elections.nz/media-and-news/rss')
          tree=ET.fromstring(xb)
          channel=tree.find('channel')
          assert channel is not None
          items=channel.findall('item')
          def val(item,tag):
              node=item.find(tag)
              return '' if node is None or node.text is None else ' '.join(node.text.split())
          rows=[]
          field_contracts={}
          for item in items:
              fields=tuple(child.tag for child in list(item))
              field_contracts[str(fields)]=field_contracts.get(str(fields),0)+1
              row={k:val(item,k) for k in ('title','link','description','pubDate','guid')}
              rows.append(row)
          terms=('2026','General Election','election day','writ','dissolution','official results','Parliament','advance voting','nominations')
          relevant=[]
          for row in rows:
              hay=' '.join((row['title'],row['description']))
              matched=[t for t in terms if t.lower() in hay.lower()]
              if matched:
                  relevant.append({**row,'matched_terms':matched})
          result={
              'baseline':'a3bca03f36eb5af9036017aad926f75f6762267f',
              'request_count':2,
              'followup_request_count':0,
              'crawl_delay_respected_seconds':2,
              'robots':{
                  **rm,'bytes':len(rb),'sha256':hashlib.sha256(rb).hexdigest(),
                  'allows_rss':allows,
                  'declared_crawl_delay':rp.crawl_delay('*'),
              },
              'rss':{
                  **xm,'bytes':len(xb),'sha256':hashlib.sha256(xb).hexdigest(),
                  'root_tag':tree.tag,
                  'channel_title':val(channel,'title'),
                  'channel_link':val(channel,'link'),
                  'channel_description':val(channel,'description'),
                  'item_count':len(items),
                  'field_contracts':field_contracts,
                  'relevant_item_count':len(relevant),
                  'relevant_items':relevant[:40],
                  'first_items':rows[:10],
              },
              'semantic_contract_probe':{
                  'feed_is_publication_stream_not_timetable':True,
                  'absence_has_no_event_state_meaning':True,
                  'rss_pubdate_is_not_canonical_event_time':True,
                  'item_link_followup_allowed':False,
                  'automatic_canonical_mutation_allowed':False,
              },
              'repository_mutation':False,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'by-nz-election-rss-endpoint.json'
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          print(out.read_text())
          # Acceptance gate limited to endpoint health/structure, not semantic promotion.
          assert rm['status']==200
          assert xm['status']==200
          assert allows is True
          assert len(items)>0
          assert tree.tag.lower()=='rss'
          assert len(field_contracts)<=3
          PY
      - name: Prove repository remains read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: by-nz-election-rss-endpoint
          path: ${{ runner.temp }}/by-nz-election-rss-endpoint.json
          if-no-files-found: error
          retention-days: 1
