name: BX NBS RSS read-only contract diagnostic

on:
  push:
    branches:
      - feature/post-bw-pressure-audit-bx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact post-BW ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE=29b71bea42610992ad073b1583be64ced7e5de81
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test -z "$(git status --porcelain)"
      - name: Inspect exact Canonical/source contract and perform two bounded official requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SID='WSSRC-MAC-007'
          DOC='https://www.stats.gov.cn/wzgl/rss/202305/t20230519_1939842.html'
          FEED='https://www.stats.gov.cn/english/PressRelease/rss.xml'
          UA='WORLD-SIGNALS-read-only-research/0.1 (+bounded official RSS diagnostic)'

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          occs=canonical.get('occurrences') or canonical.get('records') or canonical.get('events')
          srcs=sources.get('sources') or sources.get('records')
          src=next(s for s in srcs if s.get('source_id')==SID)

          def refs(o):
              out=set()
              for k in ('source_id','canonical_source_id','primary_source_id'):
                  if o.get(k): out.add(str(o[k]))
              for k in ('source_ids','canonical_source_ids'):
                  if isinstance(o.get(k),list): out.update(str(x) for x in o[k])
              p=o.get('provenance')
              if isinstance(p,dict):
                  for k in ('source_id','primary_source_id'):
                      if p.get(k): out.add(str(p[k]))
                  if isinstance(p.get('source_ids'),list): out.update(str(x) for x in p[k])
              return out

          matched=[o for o in occs if SID in refs(o)]
          print('SOURCE', json.dumps(src,ensure_ascii=False,sort_keys=True))
          print('CANONICAL_DEPENDENCIES',len(matched))
          for o in sorted(matched,key=lambda x:str(x.get('start_local') or x.get('start_date') or x.get('start_utc') or '')):
              keep={k:o.get(k) for k in (
                  'occurrence_id','series_id','event_name','name','title','event_type','event_subtype',
                  'reference_period','start_local','start_utc','end_local','source_timezone','time_precision',
                  'timing_type','lifecycle_state','lifecycle','certainty','status','region','source_id','source_ids'
              ) if k in o}
              print('OCC',json.dumps(keep,ensure_ascii=False,sort_keys=True))

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/rss+xml, application/xml, text/xml, text/html;q=0.8,*/*;q=0.1'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read()
                  return {'requested_url':url,'final_url':r.geturl(),'status':r.status,'content_type':r.headers.get('Content-Type'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()},b

          doc_meta,doc_body=get(DOC)
          feed_meta,feed_body=get(FEED)
          print('DOC_META',json.dumps(doc_meta,sort_keys=True))
          text=doc_body.decode('utf-8','replace')
          print('DOC_ASSERT_AUTO_LANGUAGE', bool(re.search(r'RSS',text,re.I)) and bool(re.search(r'automat|自动|自動',text,re.I)))
          print('FEED_META',json.dumps(feed_meta,sort_keys=True))

          root=ET.fromstring(feed_body)
          channel=root.find('channel') if root.tag.lower().endswith('rss') else root
          items=channel.findall('item') if channel is not None else []
          print('FEED_ITEM_COUNT',len(items))
          rows=[]
          for item in items:
              row={}
              for tag in ('title','link','pubDate','description','guid'):
                  el=item.find(tag)
                  row[tag]=(el.text or '').strip() if el is not None and el.text else None
              rows.append(row)
              print('ITEM',json.dumps(row,ensure_ascii=False,sort_keys=True))
          Path('/tmp/bx-nbs-rss-diagnostic.json').write_text(json.dumps({
              'source_id':SID,'canonical_dependency_count':len(matched),'doc':doc_meta,'feed':feed_meta,'items':rows
          },indent=2,ensure_ascii=False)+'\n')
          PY
          test -z "$(git status --porcelain)"
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: bx-nbs-rss-contract-diagnostic
          path: /tmp/bx-nbs-rss-diagnostic.json
          retention-days: 1
      - name: Prove repository remained byte-clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse origin/main)" = "29b71bea42610992ad073b1583be64ced7e5de81"
