name: BD full two-state preflight v4

on:
  push:
    branches:
      - feature/post-bc-vietnam-live-bd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact post-BC ancestry and clean branch state
        run: |
          set -euo pipefail
          git fetch origin main
          base=667d0fbcc92f937b0cb609d619b664a2a97e8165
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"
          test -z "$(git status --porcelain)"
          test "$(find .github/workflows -maxdepth 1 -type f -name 'bd-*' | wc -l)" -eq 1

      - name: Read-only BD simulation on untouched descendant
        run: |
          set -euo pipefail
          python scripts/apply_vietnam_myanmar_live_bd.py --check-only
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/validate_checkpoint_contracts.py

      - name: Full untouched descendant CI surface
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/validate_checkpoint_contracts.py \
            scripts/apply_analysis_revision_contract_ba.py \
            scripts/apply_japan_fies_live_analysis_az.py \
            scripts/apply_barmm_parliamentary_election_bb.py \
            scripts/apply_vietnam_myanmar_live_bd.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/analysis_revision.py \
            src/world_signals/analysis_revision_projection.py \
            src/world_signals/live_analysis_bridge.py \
            src/world_signals/checkpoint_contract.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"

      - name: Snapshot protected paths and materialise ephemeral BD
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          plan=json.loads(Path('data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_PLAN_v0.1.json').read_text())
          before={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in plan['protected_paths']}
          Path('/tmp/bd-protected-before.json').write_text(json.dumps(before, sort_keys=True))
          PY
          python scripts/apply_vietnam_myanmar_live_bd.py --apply

      - name: Prove exact BD mutation boundary and target state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          plan=json.loads(Path('data/live_intelligence/VIETNAM_MYANMAR_LIVE_BD_PLAN_v0.1.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          expected=set(plan['authorised_governed_writes'])
          assert changed == expected, (sorted(changed), sorted(expected))
          schema=json.loads(Path('data/live_intelligence/schema.json').read_text())
          observations=json.loads(Path('data/live_intelligence/observations.json').read_text())
          evidence=json.loads(Path('data/live_intelligence/evidence_registry.json').read_text())
          target=plan['target_state']
          assert schema['version']==target['live_schema_version']=='0.5'
          assert len(observations['observations'])==target['live_observation_count']==5
          assert len(evidence['evidence'])==target['live_evidence_count']==7
          assert observations['population_state']==target['population_state']=='CONTROLLED_GEOPOLITICAL_SPECIMEN'
          row=next(x for x in observations['observations'] if x['observation_id']==plan['selection']['observation_id'])
          assert row['canonical_links']==[]
          assert row['event_time']=={'precision':'CIVIL_DATE','event_date':'2026-09-05'}
          assert row['revision_of_observation_id'] is None
          assert row['automatic_canonical_commit'] is False
          assert row['google_calendar_write'] is False
          policy=schema['population_policy']
          assert policy['maximum_observation_count']==5
          assert policy['maximum_evidence_count']==7
          assert policy['automatic_ingestion_allowed'] is False
          assert policy['public_observation_projection_allowed'] is False
          print('BD exact mutation boundary and target state: PASS')
          PY
          python scripts/apply_vietnam_myanmar_live_bd.py --check-only
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python scripts/validate_checkpoint_contracts.py

      - name: Full ephemeral BD descendant CI surface
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/fetch_latest_monitor_snapshot.py \
            scripts/fetch_retained_review_state.py \
            scripts/validate_live_intelligence.py \
            scripts/validate_analysis.py \
            scripts/validate_checkpoint_contracts.py \
            scripts/apply_analysis_revision_contract_ba.py \
            scripts/apply_japan_fies_live_analysis_az.py \
            scripts/apply_barmm_parliamentary_election_bb.py \
            scripts/apply_vietnam_myanmar_live_bd.py \
            src/world_signals/live_intelligence.py \
            src/world_signals/analysis.py \
            src/world_signals/analysis_revision.py \
            src/world_signals/analysis_revision_projection.py \
            src/world_signals/live_analysis_bridge.py \
            src/world_signals/checkpoint_contract.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py

      - name: Prove protected paths byte-identical after ephemeral BD and build
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before=json.loads(Path('/tmp/bd-protected-before.json').read_text())
          after={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in before}
          if before != after:
              drift={p:(before[p],after[p]) for p in before if before[p]!=after[p]}
              raise SystemExit(f'BD protected path drift: {drift}')
          print('BD protected paths byte-identical: PASS')
          PY

      - name: Restore runner and self-remove temporary preflight
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/bd-full-preflight-v4.yml
          git commit -m "BD: remove temporary full preflight v4"
          git push origin HEAD:feature/post-bc-vietnam-live-bd
