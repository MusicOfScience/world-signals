name: BH final committed-branch validation
on:
  push:
    branches: [feature/post-bg-pressure-audit-bh-opec-primary]
permissions:
  contents: write
jobs:
  final-validation:
    if: "github.event.head_commit.message == 'BH: run final committed-branch validation'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact post-BG ancestry and committed BH state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "eb0845c791133bb8262692c8ebe38ab362dfeff1"
          test "$(git merge-base HEAD origin/main)" = "eb0845c791133bb8262692c8ebe38ab362dfeff1"
          python scripts/apply_opec_primary_provenance_bh.py --check-only
      - name: Validate governed layers and full suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/apply_opec_primary_provenance_bh.py tests/test_opec_primary_provenance_bh.py tests/test_opec_official_confirmation_bg.py tests/test_opec_fallback_completion_be.py
      - name: Validate JavaScript and static build
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Audit final committed branch boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          sources=json.loads(Path('data/sources/registry.json').read_text())
          ledger=json.loads(Path('data/changes/ledger.json').read_text())
          overlay=json.loads(Path('data/coverage/biosecurity_overlay.json').read_text())
          live_obs=json.loads(Path('data/live_intelligence/observations.json').read_text())
          live_ev=json.loads(Path('data/live_intelligence/evidence_registry.json').read_text())
          analysis_reviews=json.loads(Path('data/analysis/event_reviews.json').read_text())
          analysis_ev=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())

          assert canonical['version']=='0.42' and len(canonical['records'])==689
          assert sources['version']=='1.83' and len(sources['sources'])==246
          assert ledger['version']=='0.28' and len(ledger['changes'])==63
          assert overlay['version']=='0.17' and overlay['canonical_checkpoint']=={'registry_version':'0.42','record_count':689}
          assert monitor['version']=='0.10' and len(monitor['adapters'])==8
          assert len(live_obs['observations'])==6 and len(live_ev['evidence'])==9
          assert len(analysis_reviews['reviews'])==21 and len(analysis_ev['evidence'])==95

          row=[x for x in canonical['records'] if x['occurrence_id']=='WSO-COM-A-0001'][0]
          assert row['series_id']=='WSER-COM-OPEC-VOL'
          assert row['source_id']=='WSSRC-COM-001'
          assert row['lifecycle_status']=='COMPLETED' and row['certainty_status']=='CONFIRMED'
          assert row['start_local']=='2026-09-06' and row['start_utc'] is None and row['source_timezone'] is None
          assert row['timing_type']=='CIVIL_DATE' and row['time_precision']=='DAY'
          assert row['last_successful_assertion_id']=='WSA-9272b44a5e3a7008'

          reuters=[x for x in row.get('related_documents',[]) if x.get('source_id')=='WSSRC-COM-015']
          spa=[x for x in row.get('related_documents',[]) if x.get('source_id')=='WSSRC-COM-016']
          primary=[x for x in row.get('related_documents',[]) if x.get('source_id')=='WSSRC-COM-001' and x.get('role')=='COMPETENT_OPEC_PRIMARY_COMPLETION_CONFIRMATION']
          assert len(reuters)==1 and len(spa)==1 and len(primary)==1
          assert spa[0]['primary_opec_provenance_state']=='REQUIRED_WHEN_RETRIEVABLE'
          assert primary[0]['primary_opec_provenance_state']=='SATISFIED_BY_COMPETENT_OPEC_PRIMARY'
          assert primary[0]['source_locator']=='https://www.opec.org/pr-detail/613-6-september-2026.html'
          assert not [x for x in canonical['records'] if x.get('series_id')=='WSER-COM-OPEC-VOL' and str(x.get('start_local','')).startswith('2026-10-04')]

          change=[x for x in ledger['changes'] if x.get('change_id')=='WSCHANGE-6398a6e94527256c67']
          assert len(change)==1 and change[0]['change_type']=='SOURCE_PROVENANCE_PRIMARY_RECOVERY'
          assert change[0]['automatic_canonical_commit'] is False
          assert change[0]['google_calendar_write'] is False

          assert subprocess.run(['git','diff','--quiet','origin/main','--','data/sources/registry.json']).returncode==0
          expected={
            'PROJECT_STATUS.md','ROADMAP.md','data/canonical/registry.json','data/changes/ledger.json',
            'data/coverage/OPEC_PRIMARY_PROVENANCE_BH_PLAN_v0.1.json','data/coverage/POST_BG_PRESSURE_AUDIT_BH_v0.1.md',
            'data/coverage/biosecurity_overlay.json','scripts/apply_opec_primary_provenance_bh.py',
            'tests/test_opec_official_confirmation_bg.py','tests/test_opec_primary_provenance_bh.py',
            '.github/workflows/bh-final-branch-validation.yml'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          print('BH final committed-branch audit: PASS')
          PY
      - name: Self-remove final validation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then :; else git reset --hard HEAD; git clean -fd; fi
          rm -f .github/workflows/bh-final-branch-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/bh-final-branch-validation.yml
          if ! git diff --cached --quiet; then
            git commit -m 'BH: remove temporary final validation workflow'
            git push origin HEAD:feature/post-bg-pressure-audit-bh-opec-primary
          fi
