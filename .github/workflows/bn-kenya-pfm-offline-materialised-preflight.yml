name: BN Kenya PFM offline materialised preflight

on:
  push:
    branches:
      - feature/post-bm-kenya-pfm-readiness-bn

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ancestry and pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9b79c93cde36a2e261a134b1259e02ca18096210"
          test "$(git merge-base HEAD origin/main)" = "9b79c93cde36a2e261a134b1259e02ca18096210"
          python scripts/apply_kenya_pfm_readiness_bn.py
          python -m unittest tests.test_kenya_law_adapter tests.test_kenya_pfm_readiness_bn -v
      - name: Freeze protected-layer checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/monitor/expectations.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bn-protected.before
      - name: Materialise revised variable-runtime source truth in workspace
        shell: bash
        run: |
          set -euo pipefail
          WORLD_SIGNALS_APPLY_MONITOR_BN=1 python scripts/apply_kenya_pfm_readiness_bn.py --apply
      - name: Audit exact source mutation and revised post-state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == {'data/sources/registry.json'}, changed
          pre=json.loads(subprocess.check_output(['git','show','HEAD:data/sources/registry.json'], text=True))
          post=json.loads(Path('data/sources/registry.json').read_text())
          assert (pre['version'],len(pre['sources'])) == ('1.86',247)
          assert (post['version'],len(post['sources'])) == ('1.87',247)
          pre_by={x['source_id']:x for x in pre['sources']}
          post_by={x['source_id']:x for x in post['sources']}
          assert set(pre_by)==set(post_by)
          changed_sources=[sid for sid in pre_by if pre_by[sid] != post_by[sid]]
          assert changed_sources == ['WSSRC-REG6-001'], changed_sources
          src=post_by['WSSRC-REG6-001']
          assert src['runtime_health_state']=='VARIABLE_GITHUB_ACTIONS_403_200_403_2026_09_08'
          assert src['monitoring_readiness_status']=='PILOT_ADAPTER_LIVE_VALIDATED_VARIABLE_RUNTIME_PERMISSION_HOLD'
          assert src['monitoring_activation_status']=='ENDPOINT_PERMISSION_HOLD_NO_PRODUCTION_ROUTE'
          assert src['verification_mode']=='AUTOMATED_PILOT'
          assert src['automated_monitoring_use']=='ENDPOINT_REVIEW_REQUIRED'
          assert src['automated_retrieval_permission']=='ENDPOINT_OPERATIONAL_REVIEW_REQUIRED'
          ev=src['live_validation_evidence']
          assert ev['historical_github_actions_current_route_status_2026_09_03']==403
          assert ev['successful_probe_baseline_2025_11_04_http_status']==200
          assert ev['successful_probe_current_unversioned_http_status']==200
          assert ev['subsequent_transaction_baseline_2025_11_04_http_status']==403
          assert ev['subsequent_transaction_current_route_status']=='NOT_REQUESTED_AFTER_BASELINE_FAILURE'
          assert ev['successful_probe_baseline_rule_sha256']==ev['successful_probe_current_rule_sha256']=='3121afc21199d121650558d896055e91ab24a6ff01c62a27dfc797baeaaab50c'
          canonical=json.loads(Path('data/canonical/registry.json').read_text())
          deps=[x for x in canonical['records'] if x.get('source_id')=='WSSRC-REG6-001' or 'WSSRC-REG6-001' in (x.get('source_ids') or [])]
          assert len(deps)==1
          assert deps[0]['occurrence_id']=='WSO-REG-I-0001'
          assert deps[0]['series_id']=='WSER-REG6-KE-BPS'
          assert deps[0]['category']=='FISCAL_SOVEREIGN_FINANCE'
          assert deps[0]['region']=='Africa'
          assert deps[0]['time_precision']=='DAY'
          assert deps[0]['lifecycle_status']=='PLANNED'
          monitor=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (monitor['version'],len(monitor['adapters'])) == ('0.12',10)
          assert not any(x.get('source_id')=='WSSRC-REG6-001' for x in monitor['adapters'])
          assert monitor['automatic_canonical_commit'] is False
          assert monitor['google_calendar_write'] is False
          PY
      - name: Validate full repository and static build without new Kenya requests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m py_compile src/world_signals/adapters/kenya_law.py scripts/apply_kenya_pfm_readiness_bn.py
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
          rm -rf docs
      - name: Verify protected layers and restore source byte-clean
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/canonical/registry.json \
            data/monitor/expectations.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/live_intelligence/observations.json \
            data/live_intelligence/evidence_registry.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            > /tmp/bn-protected.after
          diff -u /tmp/bn-protected.before /tmp/bn-protected.after
          git restore -- data/sources/registry.json
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
