name: CC guarded HMT T+1 materialisation

on:
  push:
    branches:
      - feature/post-cb-pressure-audit-cc
    paths:
      - '.github/workflows/cc-materialize-hmt-t1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assert exact pre-state and ancestry
        run: |
          git merge-base --is-ancestor 67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('2.01',256)
          assert (m['version'],len(m['adapters']))==('0.26',24)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          assert not any(x.get('source_id')=='WSSRC-MKT-014' for x in s['sources'])
          assert not any(x.get('adapter_id')=='HMT_T1_CONTENT_API' for x in m['adapters'])
          PY
      - name: Correct transaction-script Python literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_hmt_t1_content_api_monitor_cc.py')
          text=p.read_text()
          old='"backup_source": null,'
          new='"backup_source": None,'
          assert text.count(old)==1
          p.write_text(text.replace(old,new,1))
          PY
          python -m py_compile scripts/apply_hmt_t1_content_api_monitor_cc.py
      - name: Materialise guarded CC transaction
        run: python scripts/apply_hmt_t1_content_api_monitor_cc.py
      - name: Ordinary repository validation surface
        run: |
          python scripts/validate_registry.py
          python scripts/validate_live_intelligence.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python -m compileall -q scripts src tests
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js
          python scripts/build_site.py
      - name: Assert exact governed post-state and protected layers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          s=json.loads(Path('data/sources/registry.json').read_text())
          m=json.loads(Path('data/monitor/expectations.json').read_text())
          assert (c['version'],len(c['records']))==('0.41',689)
          assert (s['version'],len(s['sources']))==('2.02',257)
          assert (m['version'],len(m['adapters']))==('0.27',25)
          assert m['automatic_canonical_commit'] is False
          assert m['google_calendar_write'] is False
          assert len([x for x in s['sources'] if x.get('source_id')=='WSSRC-MKT-014'])==1
          assert len([x for x in m['adapters'] if x.get('adapter_id')=='HMT_T1_CONTENT_API'])==1
          print({'canonical':[c['version'],len(c['records'])],'sources':[s['version'],len(s['sources'])],'monitor':[m['version'],len(m['adapters'])]})
          PY
          git diff --exit-code 67de150ac1175c59ccfa3a844c1dcecd1dc2b4ed..HEAD -- data/canonical/registry.json data/changes/ledger.json data/live_intelligence data/analysis
          git diff --exit-code -- data/canonical/registry.json data/changes/ledger.json data/live_intelligence data/analysis
      - name: Show materialised diff
        run: git status --short && git diff --stat
      - name: Commit guarded materialisation
        run: |
          git config user.name 'WORLD SIGNALS automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/sources/registry.json data/monitor/expectations.json scripts/apply_hmt_t1_content_api_monitor_cc.py scripts/run_adapter_smoke.py scripts/run_live_monitor.py
          git diff --cached --check
          git commit -m 'CC: materialize HMT T+1 dependency sentinel'
          git push origin HEAD:feature/post-cb-pressure-audit-cc
