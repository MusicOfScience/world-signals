          path.write_text(block + text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit override and self-remove workflow
        env:
          BRANCH: feature/post-au-pressure-audit-av
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "AV: prepend current recovery override"
          git push origin HEAD:$BRANCH
          git rm .github/workflows/tmp-av-project-status-refresh.yml
