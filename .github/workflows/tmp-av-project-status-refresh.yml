name: WORLD SIGNALS AV project-status current override

on:
  push:
    branches:
      - feature/post-au-pressure-audit-av
    paths:
      - .github/workflows/tmp-av-project-status-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/post-au-pressure-audit-av
          fetch-depth: 0
      - name: Prove exact post-76 ancestry
        run: test "$(git merge-base HEAD a487eaecd6c08e9692a42ce6ffed2dea1e455879)" = "a487eaecd6c08e9692a42ce6ffed2dea1e455879"
      - name: Prepend current AV recovery override
        run: |
          python scripts/tmp_prepend_project_status_av.py
          git diff --check
      - name: Commit override and self-remove one-shot helpers
        env:
          BRANCH: feature/post-au-pressure-audit-av
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "AV: prepend current recovery override"
          git push origin HEAD:$BRANCH
          git rm .github/workflows/tmp-av-project-status-refresh.yml scripts/tmp_prepend_project_status_av.py
          git commit -m "AV: remove project-status refresh helpers"
          git push origin HEAD:$BRANCH
