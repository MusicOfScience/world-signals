    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/post-au-pressure-audit-av
          fetch-depth: 0
      - name: Prove exact post-76 ancestry
        run: |
          test "$(git merge-base HEAD a487eaecd6c08e9692a42ce6ffed2dea1e455879)" = "a487eaecd6c08e9692a42ce6ffed2dea1e455879"
      - name: Prepend current AV recovery override
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('PROJECT_STATUS.md')
          text = path.read_text(encoding='utf-8')
          marker = '# CURRENT RECOVERY OVERRIDE — POST-AU / AV FOUNDATION'
          if marker in text:
              raise SystemExit('current AV override already present')
          block = '''# CURRENT RECOVERY OVERRIDE — POST-AU / AV FOUNDATION

