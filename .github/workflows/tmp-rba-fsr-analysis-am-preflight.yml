name: WORLD SIGNALS AM RBA FSR analysis preflight

on:
  push:
    branches:
      - feature/post-al-pressure-audit-am
    paths:
      - .github/workflows/tmp-rba-fsr-analysis-am-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove exact post-AL base and live main
        shell: bash
        run: |
          set -euo pipefail
          BASE=fd8b69b5edf95a1c7d14c1e236e1a2e8891c74f9
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -z "$(git status --porcelain=v1)"

      - name: Read-only AM simulation
        run: python scripts/apply_rba_financial_stability_analysis_am.py --check

      - name: Run AM regressions
        run: python -m unittest tests.test_rba_financial_stability_analysis_am -v

      - name: Validate current canonical registry
        run: python scripts/validate_registry.py

      - name: Validate current Analysis layer
        run: python scripts/validate_analysis.py

      - name: Run full repository suite
        run: python -m unittest discover -s tests -v

      - name: Compile repository Python
        run: python -m compileall -q scripts src tests

      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/horizon.js
          node --check web/native-calendar.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
          node --check web/analysis.js

      - name: Build static site
        run: python scripts/build_site.py

      - name: Prove read-only preflight produced no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
