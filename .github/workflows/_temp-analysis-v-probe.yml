name: TEMP apply cross-domain Analysis V

on:
  push:
    branches:
      - feature/cross-domain-analysis-v
    paths:
      - .github/workflows/_temp-analysis-v-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prove exact main and frozen pre-state
        run: |
          set -euo pipefail
          BASE=1bfa947d1fbd86e945349991778944094a78e5ed
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json
          python scripts/apply_cross_domain_analysis_v.py
      - name: Apply reviewed V transaction
        env:
          WORLD_SIGNALS_APPLY_ANALYSIS_V: YES
        run: python scripts/apply_cross_domain_analysis_v.py --apply
      - name: Validate exact post-state
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/validate_analysis.py
          python -m unittest discover -s tests -v
          python scripts/build_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/canonical/registry.json').read_text())
          r=json.loads(Path('data/analysis/event_reviews.json').read_text())
          e=json.loads(Path('data/analysis/evidence_registry.json').read_text())
          a=json.loads(Path('docs/data/analysis.json').read_text())
          assert (c['version'],len(c['records']))==('0.30',681)
          assert (r['version'],len(r['reviews']))==('0.5',11)
          assert r['canonical_checkpoint']=={'registry_version':'0.30','record_count':681}
          assert (e['version'],len(e['evidence']))==('0.5',29)
          assert a['readiness']['eligible_completed_occurrence_count']==12
          assert a['readiness']['reviewed_occurrence_count']==11
          assert a['readiness']['reviewed_event_type_diversity']==10
          assert a['readiness']['broad_population_state']=='READY_FOR_CONTROLLED_EXPANSION'
          assert 'WSO-ddb70f8ff05a58fb' not in set(a['readiness']['reviewed_occurrence_ids'])
          PY
          git diff --exit-code HEAD -- \
            data/canonical/registry.json \
            data/canonical/schema.json \
            data/sources/registry.json \
            data/changes/ledger.json \
            data/coverage/biosecurity_overlay.json \
            data/monitor/expectations.json \
            data/monitor/operations_policy.json \
            data/analysis/schema.json
      - name: Commit reviewed Analysis-only transaction
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add \
            data/analysis/event_reviews.json \
            data/analysis/evidence_registry.json \
            data/analysis/CROSS_DOMAIN_ANALYSIS_V_TRANSACTION_AUDIT_v0.1.md
          git diff --cached --quiet && { echo 'No reviewed V transaction changes staged'; exit 1; }
          git commit -m "Apply reviewed Cross-domain Analysis V transaction"
          git push origin HEAD:feature/cross-domain-analysis-v
