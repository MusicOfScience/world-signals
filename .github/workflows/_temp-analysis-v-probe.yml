name: TEMP repair Analysis V lineage

on:
  push:
    branches:
      - feature/cross-domain-analysis-v
    paths:
      - .github/workflows/_temp-analysis-v-probe.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Repair descendant assumptions narrowly
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once(
            'tests/test_analysis_layer.py',
            '''    def test_second_order_none_is_explicit_for_all_current_samples(self):\n        self.assertTrue(all(row["second_order_effects"]["status"] == "NOT_ESTABLISHED" for row in self.reviews["reviews"]))\n''',
            '''    def test_foundation_second_order_none_survives_descendant_population(self):\n        by_analysis = {row["analysis_id"]: row for row in self.reviews["reviews"]}\n        for analysis_id in ("WSAN-AU-GDP-2026Q2-001", "WSAN-NZ-OCR-20260902-001"):\n            self.assertIn(analysis_id, by_analysis)\n            self.assertEqual(by_analysis[analysis_id]["second_order_effects"]["status"], "NOT_ESTABLISHED")\n'''
          )

          replace_once(
            'tests/test_cross_domain_historical_anchors_u.py',
            '''    def test_u_expands_analytical_choice_without_touching_analysis(self):\n        post_registry, *_rest, report = self.simulated_or_live_post()\n        readiness = report.get("readiness") or analysis_population_readiness(\n            self.analysis_schema, self.analysis_reviews, post_registry\n        )\n        self.assertGreaterEqual(readiness["eligible_completed_occurrence_count"], 12)\n        self.assertGreaterEqual(readiness["reviewed_occurrence_count"], 8)\n        self.assertGreaterEqual(readiness["reviewed_event_type_diversity"], 7)\n        self.assertEqual(readiness["broad_population_state"], "READY_FOR_CONTROLLED_EXPANSION")\n        reviewed = set(readiness["reviewed_occurrence_ids"])\n        for occurrence_id in (\n            "WSO-BWC-WG-2026-S08",\n            "WSO-WOAH-GS-093",\n            "WSO-FIS-NP-BUDGET-2083",\n            "WSO-ddb70f8ff05a58fb",\n        ):\n            self.assertNotIn(occurrence_id, reviewed)\n        self.assertEqual((self.analysis_reviews["version"], len(self.analysis_reviews["reviews"])), ("0.4", 8))\n        self.assertEqual((self.analysis_evidence["version"], len(self.analysis_evidence["evidence"])), ("0.4", 21))\n''',
            '''    def test_u_expands_analytical_choice_without_mutating_analysis_at_u_transaction(self):\n        post_registry, *_rest, report = self.simulated_or_live_post()\n        readiness = report.get("readiness") or analysis_population_readiness(\n            self.analysis_schema, self.analysis_reviews, post_registry\n        )\n        self.assertGreaterEqual(readiness["eligible_completed_occurrence_count"], 12)\n        self.assertGreaterEqual(readiness["reviewed_occurrence_count"], 8)\n        self.assertGreaterEqual(readiness["reviewed_event_type_diversity"], 7)\n        self.assertEqual(readiness["broad_population_state"], "READY_FOR_CONTROLLED_EXPANSION")\n        self.assertFalse(self.plan["guardrails"]["analysis_mutation"])\n        u_ids = {"WSO-BWC-WG-2026-S08", "WSO-WOAH-GS-093", "WSO-FIS-NP-BUDGET-2083"}\n        self.assertTrue(u_ids <= {row["occurrence_id"] for row in post_registry["records"]})\n        if self.analysis_reviews["version"] == "0.4" and len(self.analysis_reviews["reviews"]) == 8:\n            reviewed = set(readiness["reviewed_occurrence_ids"])\n            for occurrence_id in u_ids | {"WSO-ddb70f8ff05a58fb"}:\n                self.assertNotIn(occurrence_id, reviewed)\n            self.assertEqual((self.analysis_evidence["version"], len(self.analysis_evidence["evidence"])), ("0.4", 21))\n        else:\n            self.assertGreaterEqual(tuple(int(part) for part in self.analysis_reviews["version"].split(".")), (0, 4))\n            self.assertGreaterEqual(len(self.analysis_reviews["reviews"]), 8)\n            self.assertGreaterEqual(tuple(int(part) for part in self.analysis_evidence["version"].split(".")), (0, 4))\n            self.assertGreaterEqual(len(self.analysis_evidence["evidence"]), 21)\n'''
          )
          PY
      - name: Verify repaired tests against current pre-state
        run: |
          python -m py_compile tests/test_analysis_layer.py tests/test_cross_domain_historical_anchors_u.py
          python -m unittest tests.test_analysis_layer tests.test_cross_domain_historical_anchors_u tests.test_cross_domain_analysis_v -v
      - name: Commit descendant-safe lineage repairs
        run: |
          set -euo pipefail
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add tests/test_analysis_layer.py tests/test_cross_domain_historical_anchors_u.py
          git diff --cached --quiet && { echo 'No lineage changes staged'; exit 1; }
          git commit -m "Keep Analysis and U regression tests descendant-safe"
          git push origin HEAD:feature/cross-domain-analysis-v
