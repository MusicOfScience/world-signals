name: TEMP provenance repair A transaction

on:
  push:
    branches: [provenance-scope-repair-a-transaction]

permissions:
  contents: write

jobs:
  transaction:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Guarded read-only preflight
        run: python scripts/apply_provenance_scope_repair_a.py
      - name: Guarded four-file apply
        env:
          WORLD_SIGNALS_ALLOW_PROVENANCE_REPAIR_A_APPLY: YES
        run: python scripts/apply_provenance_scope_repair_a.py --apply
      - name: Enforce exact transaction surface
        run: |
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' data/canonical/registry.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Validate canonical registry
        run: python scripts/validate_registry.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile monitor projection helpers
        run: python -m py_compile scripts/fetch_latest_monitor_snapshot.py scripts/fetch_retained_review_state.py
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --check web/history.js
          node --check web/operations.js
          node --check web/biosecurity.js
      - name: Build public site
        run: python scripts/build_site.py
      - name: Commit exact reviewed transaction
        run: |
          git config user.name world-signals-checkpoint
          git config user.email actions@users.noreply.github.com
          git add data/canonical/registry.json data/sources/registry.json data/changes/ledger.json data/coverage/biosecurity_overlay.json
          git diff --cached --name-only | sort > /tmp/staged
          diff -u /tmp/expected /tmp/staged
          git commit -m 'Apply provenance-scope repair A'
          git push origin HEAD:provenance-scope-repair-a-transaction
