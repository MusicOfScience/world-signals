name: TEMP P1-H status update

on:
  push:
    branches:
      - source-governance-p1h-research

permissions:
  contents: write

jobs:
  status:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply status update
        run: python scripts/update_p1h_status_temp.py
      - name: Verify and commit status only
        run: |
          test "$(git diff --name-only)" = "PROJECT_STATUS.md"
          grep -q 'P1-H selection/research is now frozen' PROJECT_STATUS.md
          grep -q 'Source-governance P1-H transaction gate' PROJECT_STATUS.md
          git config user.name world-signals-checkpoint
          git config user.email actions@users.noreply.github.com
          git add PROJECT_STATUS.md
          test "$(git diff --cached --name-only)" = "PROJECT_STATUS.md"
          git commit -m 'Update checkpoint for frozen P1-H research'
          git push origin HEAD:source-governance-p1h-research
