name: Promote annual CBAM source v1.48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-cbam-annual-v148.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded promotion
        run: python scripts/promote_cbam_annual_v148.py
      - name: Verify write scope
        run: |
          changed="$(git status --short | awk '{print $2}')"
          test "$changed" = "data/sources/registry.json" || {
            echo "Unexpected changed files:"
            git status --short
            exit 1
          }
      - name: Validate registry and tests
        run: |
          python scripts/validate_registry.py
          python -m unittest tests.test_adapters tests.test_live_monitor tests.test_legal_monitor -v
          python scripts/build_site.py
      - name: Commit source-registry promotion
        run: |
          git config user.name "WORLD SIGNALS automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources/registry.json
          git commit -m "Promote annual CBAM source to pilot-validated v1.48"
          git push
