name: TEMP fix Chile plan baseline
on:
  push:
    paths:
      - '.github/workflows/temp-fix-chile-plan-baseline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p1-balanced-governance-c-prep
      - name: Align frozen Chile precondition with stable registry URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data/coverage/P1_BALANCED_GOVERNANCE_C_PLAN_v0.1.json')
          t=p.read_text()
          old='https://www.bcentral.cl/en/news-and-publications/press/monetary-and-financial-policy-calendar'
          new='https://www.bcentral.cl/en/web/banco-central/news-and-publications/press/monetary-and-financial-policy-calendar'
          if t.count(old) != 1:
              raise SystemExit(f'expected one short Chile URL in plan, found {t.count(old)}')
          p.write_text(t.replace(old,new))
          PY
          git diff --check
      - name: Commit plan correction only
        run: |
          git config user.name 'world-signals-bot'
          git config user.email 'world-signals-bot@users.noreply.github.com'
          git add data/coverage/P1_BALANCED_GOVERNANCE_C_PLAN_v0.1.json
          test "$(git diff --cached --name-only)" = "data/coverage/P1_BALANCED_GOVERNANCE_C_PLAN_v0.1.json"
          git commit -m 'Align Chile governance plan with stable registry URL'
          git push origin HEAD:p1-balanced-governance-c-prep
